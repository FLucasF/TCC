version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "7070:7070"
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/pousada"
      DB_USER: "pousada"
      DB_PASSWORD: "pousada"
      PORT: "7070"
    depends_on:
      - postgres

volumes:
  postgres_data:
