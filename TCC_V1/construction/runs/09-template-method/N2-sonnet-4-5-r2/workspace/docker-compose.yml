services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "7070:7070"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 7070
    depends_on:
      postgres:
        condition: service_healthy
