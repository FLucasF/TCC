version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: mare-alta-db
    environment:
      POSTGRES_DB: mare_alta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mare-alta-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mare_alta
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 7070
    ports:
      - "7070:7070"
    depends_on:
      - postgres

volumes:
  postgres-data:
