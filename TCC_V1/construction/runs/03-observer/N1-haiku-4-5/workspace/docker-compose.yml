version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "7070:7070"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: pousada
      DB_PASSWORD: pousada_password
      PORT: 7070
    depends_on:
      postgres:
        condition: service_healthy
