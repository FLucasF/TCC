services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: pousada
      DB_PASSWORD: pousada123
      PORT: 7070
    ports:
      - "7070:7070"

volumes:
  postgres_data:
