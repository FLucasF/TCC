version: '3.8'
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada123
      POSTGRES_DB: reservas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reservas_db
      DB_USER: pousada
      DB_PASSWORD: pousada123
      PORT: 7070
    ports:
      - "7070:7070"
    depends_on:
      - postgres

volumes:
  postgres_data:
