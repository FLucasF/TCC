version: '3.8'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: marealta
      POSTGRES_USER: marealta
      POSTGRES_PASSWORD: marealta123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marealta"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
