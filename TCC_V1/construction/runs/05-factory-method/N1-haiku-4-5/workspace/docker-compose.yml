version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: pousada
      DB_PASSWORD: senha123
      PORT: 7070
    ports:
      - "7070:7070"
    depends_on:
      - postgres
    command: java -jar /app/pousada-mare-alta-1.0.0.jar

volumes:
  postgres_data:
