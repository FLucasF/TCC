version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: pousada-db
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pousada:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pousada-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 7070
    ports:
      - "7070:7070"

volumes:
  postgres_data:
