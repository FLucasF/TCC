version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: pousada_mare_alta_db
    environment:
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada123
      POSTGRES_DB: pousada_mare_alta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
