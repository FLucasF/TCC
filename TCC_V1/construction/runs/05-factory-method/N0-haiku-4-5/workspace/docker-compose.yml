version: '3.8'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: pousada
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: postgres
      DB_PASSWORD: senha123
      PORT: 7070
    ports:
      - "7070:7070"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
