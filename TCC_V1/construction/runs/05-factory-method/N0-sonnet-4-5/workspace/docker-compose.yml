version: '3.8'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: marealte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "7070:7070"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marealte
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 7070
    depends_on:
      - postgres

volumes:
  postgres-data:
