version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: marealta-db
    environment:
      POSTGRES_USER: marealta
      POSTGRES_PASSWORD: marealta123
      POSTGRES_DB: marealta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marealta"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marealta-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marealta
      DB_USER: marealta
      DB_PASSWORD: marealta123
      PORT: 7070
    ports:
      - "7070:7070"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
