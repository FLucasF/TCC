version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: marealta-postgres
    environment:
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: marealta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: openjdk:21-slim
    container_name: marealta-api
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "7070:7070"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marealta
      DB_USER: pousada
      DB_PASSWORD: senha123
      PORT: 7070
    command: java -jar target/mare-alta-1.0.0.jar
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
