version: '3.8'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: reservas
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reservas
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 7070
    ports:
      - "7070:7070"
    depends_on:
      - postgres

volumes:
  postgres_data:
