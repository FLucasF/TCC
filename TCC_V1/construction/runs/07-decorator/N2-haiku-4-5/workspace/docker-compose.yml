version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada
      POSTGRES_PASSWORD: pousada123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: pousada
      DB_PASSWORD: pousada123
      PORT: 7070
      HOTEL_TEST_MODE: "false"
    ports:
      - "7070:7070"
    depends_on:
      postgres:
        condition: service_healthy
    command: java -jar /app/target/reservation-system.jar

volumes:
  postgres_data:
