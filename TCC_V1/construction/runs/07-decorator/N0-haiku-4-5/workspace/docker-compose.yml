version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: pousada-postgres
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pousada-network

  # Opcional: pgAdmin para gerenciar o banco visualmente
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pousada-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pousada.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pousada-network

volumes:
  postgres-data:

networks:
  pousada-network:
    driver: bridge
