services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "7070:7070"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pousada
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 7070
      # HOTEL_TEST_MODE: "true"
    depends_on:
      - postgres

volumes:
  postgres_data:
