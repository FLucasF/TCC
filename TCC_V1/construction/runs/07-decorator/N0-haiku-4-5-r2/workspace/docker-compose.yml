version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: pousada-db
    environment:
      POSTGRES_DB: pousada
      POSTGRES_USER: pousada_user
      POSTGRES_PASSWORD: pousada_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousada_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
