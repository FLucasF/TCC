# The checks for the Python tools of TCC_V1 (stdlib only; mypy and ruff are development tools).
#   python -m mypy        types, strict
#   python -m ruff check  style and pitfalls, including a file opened without encoding="utf-8"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["infra", "construction/infra", "maintenance/infra", "evaluation/quality", "evaluation/oo_metrics.py"]
warn_unreachable = true
# the two run_one_scenario.py are told apart by their folders; infra/ holds what both import (run_database)
explicit_package_bases = true
mypy_path = "infra"

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["infra/**/*.py", "construction/infra/**/*.py", "maintenance/infra/**/*.py", "evaluation/quality/**/*.py", "evaluation/oo_metrics.py"]

[tool.ruff.lint]
# E/F/W: the basics; B: likely bugs; UP: modern syntax; SIM: simpler code; PTH: pathlib;
# PLW1514: open()/read_text()/write_text() without an explicit encoding (cp1252 on Windows)
select = ["E", "F", "W", "B", "UP", "SIM", "PTH", "PLW1514"]
preview = true

[tool.ruff.lint.per-file-ignores]
# the shell command that runs inside the container is one long line on purpose
"*/infra/scripts/run_one_scenario.py" = ["E501"]
