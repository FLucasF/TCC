  - id: p1-cond-fabrica
    languages: [java]
    severity: INFO
    message: condicao que nomeia um caso so para escolher o objeto (fabrica)
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern-either:
          - pattern-inside: if (...) return $V;
          - pattern-inside: if (...) { return $V; }
          - pattern-inside: if (...) $Y = $V;
          - pattern-inside: if (...) { $Y = $V; }
      - metavariable-regex: { metavariable: $V, regex: '^(new\s+(?!(BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)\b)[A-Z]\w*\s*\(.*|([A-Za-z_]\w*\.)*(ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY|ECONOMY|EXPRESS|STORE_PICKUP|IN_STORE_PICKUP|PICKUP|MOTORCYCLE|COURIER)|(this\.)?(?![A-Z0-9_]+\b)(?!\w*(?i:pct|percent|taxa|credito|desconto|valor|aliquota|fator|rate|frete|juros|bonus|cashback|brinde|parcela|limite))\w*(?i:Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)\w*|\w*(Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)\w*::new)$' }
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $X == $C
                  - pattern: $C == $X
                  - pattern: $X != $C
                  - pattern: $C != $X
                  - pattern: $C.equals($X)
                  - pattern: $X.equals($C)
                  - pattern: $X.equalsIgnoreCase($C)
                  - pattern: $C.equalsIgnoreCase($X)
                  - pattern: Objects.equals($X, $C)
