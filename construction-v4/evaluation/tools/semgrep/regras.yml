    patterns:
      - pattern-either:
          - pattern-inside: if (...) throw $E;
          - pattern-inside: if (...) { ... throw $E; ... }
      - pattern: $X instanceof $K
      - metavariable-regex: { metavariable: $K, regex: ".*(Bronze|Prata|Ouro|Silver|Gold)" }
  - id: p4-switch-label
    languages: [regex]
    severity: INFO
    message: rotulo de switch que nomeia um caso (inclusive pattern matching, Java 21)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+(?:"?(?:\w+\.)?(?:BRONZE|PRATA|OURO|SILVER|GOLD)"?\s*(?:,|->|:)|\w*(?:Bronze|Prata|Ouro|Silver|Gold)\w*\s*(?:\(|\s+\w+\s*(?:->|:|when\b)))'
  - id: p4-switch-fabrica
    languages: [regex]
    severity: INFO
    message: rotulo de switch que so devolve um objeto (fabrica ou traducao para a constante)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:BRONZE|PRATA|OURO|SILVER|GOLD)"?\s*(?:->|:)\s*(?:return\s+)?(?:new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)\b)[A-Z]\w*\s*\(|(?:\w+\.)?(?:BRONZE|PRATA|OURO|SILVER|GOLD)\s*;|(?:this\.)?(?![A-Z0-9_]+\b)(?!\w*(?i:pct|percent|taxa|credito|desconto|valor|aliquota|fator|rate|frete|juros|bonus|cashback|brinde|parcela|limite))\w*(?i:Bronze|Prata|Ouro|Silver|Gold)\w*\s*;|\w*(?:Bronze|Prata|Ouro|Silver|Gold)\w*::new)'
  - id: p4-conjunto
    languages: [regex]
    severity: INFO
    message: conjunto ou lista que cita casos (o classificador conta so os que nao citam todos)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:EnumSet|Set|List)\.of\s*\([^()]*\b(?:BRONZE|PRATA|OURO|SILVER|GOLD)\b[^()]*\)'
  - id: p4-nome
    languages: [regex]
    severity: INFO
    message: o nome de um caso aparece no codigo (alarme - sem nenhum, o agente usou outros nomes)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:BRONZE|PRATA|OURO|SILVER|GOLD)\b|\b\w*(?:Bronze|Prata|Ouro|Silver|Gold)\w*\b'

  - id: p5-nome
    languages: [regex]
    severity: INFO
    message: o nome de uma regiao aparece no codigo (alarme)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\b|\b\w*(?:Sudeste|Sul|CentroOeste|Norte|Nordeste|Southeast|South|Midwest|CenterWest|North|Northeast)\w*\b'
  - id: p5-enum-corpo
    languages: [regex]
    severity: INFO
    message: constante de regiao com corpo proprio
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?m)^\s*(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\s*(?:\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\))?\s*\{'
  - id: p5-enum-dados
    languages: [regex]
    severity: INFO
    message: constante de regiao que so carrega valores
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?m)^\s*(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\s*\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\)\s*[,;]'
  - id: p5-classe-regiao
    languages: [regex]
    severity: INFO
