    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:class|record)\s+\w*(?:Sudeste|Sul|CentroOeste|Norte|Nordeste|Southeast|South|Midwest|CenterWest|North|Northeast)\w*[^{]*\b(?:implements|extends)\b'
  - id: p5-mapa
    languages: [regex]
    severity: INFO
    message: mapa de regiao para valor
    paths: { include: ["**/src/main/**/*.java"] }
    # o \s* fica DENTRO da verificacao: fora, ele devolve o espaco e a verificacao passa
    # a olhar " new Seguro()", que nao comeca por "new" (defeito da versao 1)
    pattern-regex: '(?:Map\.(?:of|entry)\s*\(\s*|\bentry\s*\(\s*|\bput\s*\(\s*)"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"?\s*,(?!\s*(?:new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)\b)[A-Z]\w*\s*\(|(?:\([^()]*\)|\w+)\s*->|[\w.]+::\w+))'
  - id: p5-mapa-funcao
    languages: [regex]
    severity: INFO
    message: mapa de regiao para uma funcao ou classe anonima (uma por regiao)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?:"(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"|\w+\.(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\b)\s*,\s*(?:\([^()]*\)|\w+)\s*->|(?:"(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"|\w+\.(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\b)\s*,\s*[\w.]+::\w+|(?:"(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"|\w+\.(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\b)\s*,\s*new\s+[A-Z]\w*\s*\([^()]*\)\s*\{'
  - id: p5-config
    languages: [regex]
    severity: INFO
    message: taxa por regiao num arquivo de configuracao (dado)
    paths: { include: ["**/src/main/resources/**"] }
    pattern-regex: '(?im)^\s*[\w.\[\]-]*\b(?:sudeste|sul|centro[-_]?oeste|norte|nordeste|southeast|south|midwest|cent(?:er|ral)[-_]?west|north|northeast)\b\s*[:=]\s*[0-9]'
  - id: p5-objeto
    languages: [java]
    severity: INFO
    message: objeto por regiao (o classificador ve se e uma classe so ou uma por regiao)
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern-either:
          - pattern: new $T($R, ...)
          - pattern: Map.of(..., $R, new $T(...), ...)
          - pattern: Map.entry($R, new $T(...))
          - pattern: entry($R, new $T(...))
          - pattern: $M.put($R, new $T(...))
          - pattern: $TT $R = new $T(...);
      - metavariable-regex: { metavariable: $R, regex: '^"?([A-Za-z_]\w*\.)*(SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"?$' }
      - metavariable-regex: { metavariable: $T, regex: '^(?!(BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)$)\w+$' }
