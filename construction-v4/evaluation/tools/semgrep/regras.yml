    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"?\s*(?:,|->|:)|"(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"\s*\.equals|\.equals(?:IgnoreCase)?\(\s*"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"?\s*\)|[=!]=\s*(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\b'
  - id: p5-switch-fabrica
    languages: [regex]
    severity: INFO
    message: switch de regiao que devolve objeto
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"?\s*(?:->|:)\s*(?:return\s+)?new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)\b)[A-Z]\w*\s*\('
  - id: p5-traducao
    languages: [regex]
    severity: INFO
    message: switch ou if que so traduz o texto para a constante da regiao
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?:\bcase\s+"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"?\s*(?:->|:)|\.equals(?:IgnoreCase)?\(\s*"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)"?\s*\)\s*\)\s*\{?)\s*(?:return\s+)?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE|SOUTHEAST|SOUTH|MIDWEST|CENTER_WEST|CENTRAL_WEST|NORTH|NORTHEAST)\s*;'
