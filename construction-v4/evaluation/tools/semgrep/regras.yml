  - id: p1-instanceof
    languages: [java]
    severity: INFO
    message: instanceof de uma classe de caso (fora do equals)
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern: $X instanceof $K
      - metavariable-regex: { metavariable: $K, regex: ".*(Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)" }
      - pattern-not-inside: |
          boolean equals(Object $O) { ... }
  - id: p1-instanceof-recusa
    languages: [java]
    severity: INFO
    message: instanceof de uma classe de caso dentro de um if que recusa (o classificador conta como recusa)
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern-either:
          - pattern-inside: if (...) throw $E;
          - pattern-inside: if (...) { ... throw $E; ... }
      - pattern: $X instanceof $K
      - metavariable-regex: { metavariable: $K, regex: ".*(Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)" }
  - id: p1-switch-label
    languages: [regex]
    severity: INFO
    message: rotulo de switch que nomeia um caso (inclusive pattern matching, Java 21)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+(?:"?(?:\w+\.)?(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY|ECONOMY|EXPRESS|STORE_PICKUP|IN_STORE_PICKUP|PICKUP|MOTORCYCLE|COURIER)"?\s*(?:,|->|:)|\w*(?:Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)\w*\s*(?:\(|\s+\w+\s*(?:->|:|when\b)))'
  - id: p1-switch-fabrica
    languages: [regex]
    severity: INFO
    message: rotulo de switch que so devolve um objeto (fabrica ou traducao para a constante)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY|ECONOMY|EXPRESS|STORE_PICKUP|IN_STORE_PICKUP|PICKUP|MOTORCYCLE|COURIER)"?\s*(?:->|:)\s*(?:return\s+)?(?:new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)\b)[A-Z]\w*\s*\(|(?:\w+\.)?(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY|ECONOMY|EXPRESS|STORE_PICKUP|IN_STORE_PICKUP|PICKUP|MOTORCYCLE|COURIER)\s*;|(?:this\.)?(?![A-Z0-9_]+\b)(?!\w*(?i:pct|percent|taxa|credito|desconto|valor|aliquota|fator|rate|frete|juros|bonus|cashback|brinde|parcela|limite))\w*(?i:Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)\w*\s*;|\w*(?:Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)\w*::new)'
  - id: p1-conjunto
    languages: [regex]
    severity: INFO
    message: conjunto ou lista que cita casos (o classificador conta so os que nao citam todos)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:EnumSet|Set|List)\.of\s*\([^()]*\b(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY|ECONOMY|EXPRESS|STORE_PICKUP|IN_STORE_PICKUP|PICKUP|MOTORCYCLE|COURIER)\b[^()]*\)'
  - id: p1-nome
    languages: [regex]
    severity: INFO
    message: o nome de um caso aparece no codigo (alarme - sem nenhum, o agente usou outros nomes)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY|ECONOMY|EXPRESS|STORE_PICKUP|IN_STORE_PICKUP|PICKUP|MOTORCYCLE|COURIER)\b|\b\w*(?:Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier)\w*\b'

