# GERADO por gerar-regras.mjs. Nao edite a mao: mude o gerador e gere de novo.
rules:
  - id: p1-cond-calc
    languages: [java]
    severity: INFO
    message: condicao que nomeia um caso (o classificador tira as de recusa e as de fabrica)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $X == $C
                  - pattern: $C == $X
                  - pattern: $X != $C
                  - pattern: $C != $X
                  - pattern: $C.equals($X)
                  - pattern: $X.equals($C)
                  - pattern: $X.equalsIgnoreCase($C)
                  - pattern: $C.equalsIgnoreCase($X)
                  - pattern: Objects.equals($X, $C)
                  - pattern: Objects.equals($C, $X)
                  - pattern: $X.compareTo($C)
                  - pattern: $C.compareTo($X)
              - metavariable-regex:
                  metavariable: $C
                  regex: '^"?([A-Za-z_]\w*\.)*(ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY|ECONOMY|EXPRESS|STORE_PICKUP|IN_STORE_PICKUP|PICKUP|MOTORCYCLE|COURIER)"?(\.\w+\(\))?$'
          - pattern: $X.equals("ECONOMICA")
          - pattern: '"ECONOMICA".equals($X)'
          - pattern: $X.equalsIgnoreCase("ECONOMICA")
          - pattern: Objects.equals($X, "ECONOMICA")
          - pattern: Objects.equals("ECONOMICA", $X)
          - pattern: $X.equals("EXPRESSA")
          - pattern: '"EXPRESSA".equals($X)'
          - pattern: $X.equalsIgnoreCase("EXPRESSA")
          - pattern: Objects.equals($X, "EXPRESSA")
          - pattern: Objects.equals("EXPRESSA", $X)
          - pattern: $X.equals("RETIRADA_LOJA")
          - pattern: '"RETIRADA_LOJA".equals($X)'
          - pattern: $X.equalsIgnoreCase("RETIRADA_LOJA")
          - pattern: Objects.equals($X, "RETIRADA_LOJA")
          - pattern: Objects.equals("RETIRADA_LOJA", $X)
          - pattern: $X.equals("MOTOBOY")
          - pattern: '"MOTOBOY".equals($X)'
          - pattern: $X.equalsIgnoreCase("MOTOBOY")
          - pattern: Objects.equals($X, "MOTOBOY")
          - pattern: Objects.equals("MOTOBOY", $X)
          - pattern: $X.equals("ECONOMY")
          - pattern: '"ECONOMY".equals($X)'
          - pattern: $X.equalsIgnoreCase("ECONOMY")
          - pattern: Objects.equals($X, "ECONOMY")
          - pattern: Objects.equals("ECONOMY", $X)
          - pattern: $X.equals("EXPRESS")
          - pattern: '"EXPRESS".equals($X)'
          - pattern: $X.equalsIgnoreCase("EXPRESS")
          - pattern: Objects.equals($X, "EXPRESS")
          - pattern: Objects.equals("EXPRESS", $X)
          - pattern: $X.equals("STORE_PICKUP")
          - pattern: '"STORE_PICKUP".equals($X)'
          - pattern: $X.equalsIgnoreCase("STORE_PICKUP")
          - pattern: Objects.equals($X, "STORE_PICKUP")
          - pattern: Objects.equals("STORE_PICKUP", $X)
          - pattern: $X.equals("IN_STORE_PICKUP")
          - pattern: '"IN_STORE_PICKUP".equals($X)'
          - pattern: $X.equalsIgnoreCase("IN_STORE_PICKUP")
          - pattern: Objects.equals($X, "IN_STORE_PICKUP")
          - pattern: Objects.equals("IN_STORE_PICKUP", $X)
          - pattern: $X.equals("PICKUP")
          - pattern: '"PICKUP".equals($X)'
          - pattern: $X.equalsIgnoreCase("PICKUP")
          - pattern: Objects.equals($X, "PICKUP")
          - pattern: Objects.equals("PICKUP", $X)
          - pattern: $X.equals("MOTORCYCLE")
          - pattern: '"MOTORCYCLE".equals($X)'
          - pattern: $X.equalsIgnoreCase("MOTORCYCLE")
          - pattern: Objects.equals($X, "MOTORCYCLE")
          - pattern: Objects.equals("MOTORCYCLE", $X)
          - pattern: $X.equals("COURIER")
          - pattern: '"COURIER".equals($X)'
          - pattern: $X.equalsIgnoreCase("COURIER")
          - pattern: Objects.equals($X, "COURIER")
          - pattern: Objects.equals("COURIER", $X)
