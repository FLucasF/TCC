  - id: p7-cond
    languages: [java]
    severity: INFO
    message: a condition that names an order status
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $X == $C
                  - pattern: $C == $X
                  - pattern: $X != $C
                  - pattern: $C != $X
                  - pattern: $C.equals($X)
                  - pattern: $X.equals($C)
                  - pattern: $X.equalsIgnoreCase($C)
                  - pattern: $C.equalsIgnoreCase($X)
                  - pattern: Objects.equals($X, $C)
                  - pattern: Objects.equals($C, $X)
                  - pattern: $X.compareTo($C)
                  - pattern: $C.compareTo($X)
              - metavariable-regex:
                  metavariable: $C
                  regex: '^"?([A-Za-z_]\w*\.)*(AWAITING_PAYMENT|PAID|SHIPPED|DELIVERED|CANCELLED|PENDING_PAYMENT|CANCELED|AGUARDANDO_PAGAMENTO|PAGO|ENVIADO|ENTREGUE|CANCELADO)"?(\.\w+\(\))?$'
          - pattern: $X.equals("AWAITING_PAYMENT")
          - pattern: '"AWAITING_PAYMENT".equals($X)'
          - pattern: $X.equalsIgnoreCase("AWAITING_PAYMENT")
          - pattern: Objects.equals($X, "AWAITING_PAYMENT")
          - pattern: Objects.equals("AWAITING_PAYMENT", $X)
          - pattern: $X.equals("PAID")
          - pattern: '"PAID".equals($X)'
          - pattern: $X.equalsIgnoreCase("PAID")
          - pattern: Objects.equals($X, "PAID")
          - pattern: Objects.equals("PAID", $X)
          - pattern: $X.equals("SHIPPED")
          - pattern: '"SHIPPED".equals($X)'
          - pattern: $X.equalsIgnoreCase("SHIPPED")
          - pattern: Objects.equals($X, "SHIPPED")
          - pattern: Objects.equals("SHIPPED", $X)
          - pattern: $X.equals("DELIVERED")
          - pattern: '"DELIVERED".equals($X)'
          - pattern: $X.equalsIgnoreCase("DELIVERED")
          - pattern: Objects.equals($X, "DELIVERED")
          - pattern: Objects.equals("DELIVERED", $X)
          - pattern: $X.equals("CANCELLED")
          - pattern: '"CANCELLED".equals($X)'
          - pattern: $X.equalsIgnoreCase("CANCELLED")
          - pattern: Objects.equals($X, "CANCELLED")
          - pattern: Objects.equals("CANCELLED", $X)
          - pattern: $X.equals("PENDING_PAYMENT")
          - pattern: '"PENDING_PAYMENT".equals($X)'
          - pattern: $X.equalsIgnoreCase("PENDING_PAYMENT")
          - pattern: Objects.equals($X, "PENDING_PAYMENT")
          - pattern: Objects.equals("PENDING_PAYMENT", $X)
          - pattern: $X.equals("CANCELED")
          - pattern: '"CANCELED".equals($X)'
          - pattern: $X.equalsIgnoreCase("CANCELED")
          - pattern: Objects.equals($X, "CANCELED")
          - pattern: Objects.equals("CANCELED", $X)
          - pattern: $X.equals("AGUARDANDO_PAGAMENTO")
          - pattern: '"AGUARDANDO_PAGAMENTO".equals($X)'
          - pattern: $X.equalsIgnoreCase("AGUARDANDO_PAGAMENTO")
          - pattern: Objects.equals($X, "AGUARDANDO_PAGAMENTO")
          - pattern: Objects.equals("AGUARDANDO_PAGAMENTO", $X)
          - pattern: $X.equals("PAGO")
          - pattern: '"PAGO".equals($X)'
          - pattern: $X.equalsIgnoreCase("PAGO")
          - pattern: Objects.equals($X, "PAGO")
          - pattern: Objects.equals("PAGO", $X)
          - pattern: $X.equals("ENVIADO")
          - pattern: '"ENVIADO".equals($X)'
          - pattern: $X.equalsIgnoreCase("ENVIADO")
          - pattern: Objects.equals($X, "ENVIADO")
          - pattern: Objects.equals("ENVIADO", $X)
          - pattern: $X.equals("ENTREGUE")
          - pattern: '"ENTREGUE".equals($X)'
          - pattern: $X.equalsIgnoreCase("ENTREGUE")
          - pattern: Objects.equals($X, "ENTREGUE")
          - pattern: Objects.equals("ENTREGUE", $X)
          - pattern: $X.equals("CANCELADO")
          - pattern: '"CANCELADO".equals($X)'
          - pattern: $X.equalsIgnoreCase("CANCELADO")
          - pattern: Objects.equals($X, "CANCELADO")
          - pattern: Objects.equals("CANCELADO", $X)
  - id: p7-switch-label
    languages: [regex]
    severity: INFO
