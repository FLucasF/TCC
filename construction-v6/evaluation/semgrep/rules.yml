    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:EnumSet|Set|List)\.of\s*\([^()]*\b(?:AWAITING_PAYMENT|PAID|SHIPPED|DELIVERED|CANCELLED|PENDING_PAYMENT|CANCELED|AGUARDANDO_PAGAMENTO|PAGO|ENVIADO|ENTREGUE|CANCELADO)\b[^()]*\)'
  - id: p7-name
    languages: [regex]
    severity: INFO
    message: an order status's name appears in the code (alarm)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:AWAITING_PAYMENT|PAID|SHIPPED|DELIVERED|CANCELLED|PENDING_PAYMENT|CANCELED|AGUARDANDO_PAGAMENTO|PAGO|ENVIADO|ENTREGUE|CANCELADO)\b'

  - id: f-component
    languages: [regex]
    severity: INFO
    message: a strategy class created by the Spring container
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '@(?:Component|Service)\b[^{;]*?\bclass\s+\w*(?:Economy|Express|Pickup|Courier|Economica|Expressa|Retirada|Motoboy|Motorcycle|Welcome|Minus50|FreeShipping|Freeshipping|Buy3|Take3|BemVindo|Bemvindo|Menos50|FreteGratis|Fretegratis|Leve3|Pix|CreditCard|Card|BankSlip|Billet|Cartao|Boleto|Bronze|Silver|Gold|Prata|Ouro)\w*'
