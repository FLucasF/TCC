    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?:\bcase\s+"?(?:\w+\.)?(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*(?:->|:)|\.equals(?:IgnoreCase)?\(\s*"?(?:\w+\.)?(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*\)\s*\)\s*\{?)\s*(?:return\s+)?(?:\w+\.)?(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\s*;'

