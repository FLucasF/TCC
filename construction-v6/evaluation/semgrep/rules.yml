          - pattern: Objects.equals("BRONZE", $X)
          - pattern: $X.equals("SILVER")
          - pattern: '"SILVER".equals($X)'
          - pattern: $X.equalsIgnoreCase("SILVER")
          - pattern: Objects.equals($X, "SILVER")
          - pattern: Objects.equals("SILVER", $X)
          - pattern: $X.equals("GOLD")
          - pattern: '"GOLD".equals($X)'
          - pattern: $X.equalsIgnoreCase("GOLD")
          - pattern: Objects.equals($X, "GOLD")
          - pattern: Objects.equals("GOLD", $X)
          - pattern: $X.equals("PRATA")
          - pattern: '"PRATA".equals($X)'
          - pattern: $X.equalsIgnoreCase("PRATA")
          - pattern: Objects.equals($X, "PRATA")
          - pattern: Objects.equals("PRATA", $X)
          - pattern: $X.equals("OURO")
          - pattern: '"OURO".equals($X)'
          - pattern: $X.equalsIgnoreCase("OURO")
          - pattern: Objects.equals($X, "OURO")
          - pattern: Objects.equals("OURO", $X)
  - id: p4-instanceof
    languages: [java]
    severity: INFO
    message: instanceof of a case class (outside equals)
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern: $X instanceof $K
      - metavariable-regex: { metavariable: $K, regex: ".*(Bronze|Silver|Gold|Prata|Ouro)" }
      - pattern-not-inside: |
          boolean equals(Object $O) { ... }
  - id: p4-instanceof-refusal
    languages: [java]
    severity: INFO
    message: instanceof of a case class inside an if that refuses (the classifier counts it as a refusal)
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern-either:
          - pattern-inside: if (...) throw $E;
          - pattern-inside: if (...) { ... throw $E; ... }
      - pattern: $X instanceof $K
      - metavariable-regex: { metavariable: $K, regex: ".*(Bronze|Silver|Gold|Prata|Ouro)" }
  - id: p4-switch-label
    languages: [regex]
    severity: INFO
    message: a switch label that names a case (including pattern matching, Java 21)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+(?:"?(?:\w+\.)?(?:BRONZE|SILVER|GOLD|PRATA|OURO)"?\s*(?:,|->|:)|\w*(?:Bronze|Silver|Gold|Prata|Ouro)\w*\s*(?:\(|\s+\w+\s*(?:->|:|when\b)))'
  - id: p4-switch-factory
    languages: [regex]
    severity: INFO
    message: a switch label that only returns an object (a factory, or a translation to the constant)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:BRONZE|SILVER|GOLD|PRATA|OURO)"?\s*(?:->|:)\s*(?:return\s+)?(?:new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)\b)[A-Z]\w*\s*\(|(?:\w+\.)?(?:BRONZE|SILVER|GOLD|PRATA|OURO)\s*;|(?:this\.)?(?![A-Z0-9_]+\b)(?!\w*(?i:pct|percent|rate|taxa|credit|credito|discount|desconto|value|valor|fee|aliquota|factor|fator|shipping|frete|interest|juros|bonus|cashback|gift|brinde|installment|parcela|limit|limite))\w*(?i:Bronze|Silver|Gold|Prata|Ouro)\w*\s*;|\w*(?:Bronze|Silver|Gold|Prata|Ouro)\w*::new)'
  - id: p4-set
    languages: [regex]
    severity: INFO
    message: a set or list that cites cases (the classifier counts only those that do not cite them all)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:EnumSet|Set|List)\.of\s*\([^()]*\b(?:BRONZE|SILVER|GOLD|PRATA|OURO)\b[^()]*\)'
  - id: p4-name
    languages: [regex]
    severity: INFO
    message: a case's name appears in the code (alarm - with none, the agent used other names)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:BRONZE|SILVER|GOLD|PRATA|OURO)\b|\b\w*(?:Bronze|Silver|Gold|Prata|Ouro)\w*\b'

  - id: p5-name
    languages: [regex]
    severity: INFO
    message: a region's name appears in the code (alarm)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\b|\b\w*(?:Southeast|South|Midwest|CenterWest|North|Northeast|Sudeste|Sul|CentroOeste|Norte|Nordeste)\w*\b'
  - id: p5-enum-body
    languages: [regex]
    severity: INFO
    message: a region constant with its own body
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?m)^\s*(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\s*(?:\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\))?\s*\{'
  - id: p5-enum-data
    languages: [regex]
    severity: INFO
    message: a region constant that only carries values
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?m)^\s*(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\s*\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\)\s*[,;]'
  - id: p5-region-class
    languages: [regex]
    severity: INFO
    message: a class per region
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:class|record)\s+\w*(?:Southeast|South|Midwest|CenterWest|North|Northeast|Sudeste|Sul|CentroOeste|Norte|Nordeste)\w*[^{]*\b(?:implements|extends)\b'
  - id: p5-map
    languages: [regex]
    severity: INFO
    message: a map from region to value
    paths: { include: ["**/src/main/**/*.java"] }
    # the \s* stays INSIDE the lookahead: outside, it gives the space back and the lookahead looks at
    # " new Insurance()", which does not start with "new" (a V5 defect)
    pattern-regex: '(?:Map\.(?:of|entry)\s*\(\s*|\bentry\s*\(\s*|\bput\s*\(\s*)"?(?:\w+\.)?(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*,(?!\s*(?:new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)\b)[A-Z]\w*\s*\(|(?:\([^()]*\)|\w+)\s*->|[\w.]+::\w+))'
  - id: p5-map-function
    languages: [regex]
    severity: INFO
    message: a map from region to a function or an anonymous class (one per region)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?:"(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"|\w+\.(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\b)\s*,\s*(?:\([^()]*\)|\w+)\s*->|(?:"(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"|\w+\.(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\b)\s*,\s*[\w.]+::\w+|(?:"(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"|\w+\.(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\b)\s*,\s*new\s+[A-Z]\w*\s*\([^()]*\)\s*\{'
  - id: p5-config
    languages: [regex]
    severity: INFO
    message: a value per region in a configuration file (data)
    paths: { include: ["**/src/main/resources/**"] }
    pattern-regex: '(?im)^\s*[\w.\[\]-]*\b(?:southeast|south|midwest|cent(?:er|ral)[-_]?west|north|northeast|sudeste|sul|centro[-_]?oeste|norte|nordeste)\b\s*[:=]\s*[0-9]'
  - id: p5-object
    languages: [java]
    severity: INFO
    message: an object per region (the classifier tells one class for all from one class per region)
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern-either:
          - pattern: new $T($R, ...)
          - pattern: Map.of(..., $R, new $T(...), ...)
          - pattern: Map.entry($R, new $T(...))
          - pattern: entry($R, new $T(...))
          - pattern: $M.put($R, new $T(...))
          - pattern: $TT $R = new $T(...);
      - metavariable-regex: { metavariable: $R, regex: '^"?([A-Za-z_]\w*\.)*(SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?$' }
      - metavariable-regex: { metavariable: $T, regex: '^(?!(BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object)$)\w+$' }
  - id: p5-switch-label
    languages: [regex]
    severity: INFO
    message: a switch label or a condition that names a region
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*(?:,|->|:)|"(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"\s*\.equals|\.equals(?:IgnoreCase)?\(\s*"?(?:\w+\.)?(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*\)|[=!]=\s*(?:\w+\.)?(?:SOUTHEAST|SOUTH|MIDWEST|NORTH|NORTHEAST|CENTER_WEST|CENTRAL_WEST|SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\b'
  - id: p5-switch-factory
    languages: [regex]
    severity: INFO
