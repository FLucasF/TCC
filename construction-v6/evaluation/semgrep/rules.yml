    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:AWAITING_PAYMENT|PAID|SHIPPED|DELIVERED|CANCELLED|PENDING_PAYMENT|CANCELED|AGUARDANDO_PAGAMENTO|PAGO|ENVIADO|ENTREGUE|CANCELADO)"?\s*(?:,|->|:)'
