    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:class|record)\s+(\w*(?:Economy|Express|Pickup|Courier|Economica|Expressa|Retirada|Motoboy|Motorcycle|Welcome|Minus50|FreeShipping|Freeshipping|Buy3|Take3|BemVindo|Bemvindo|Menos50|FreteGratis|Fretegratis|Leve3|Pix|CreditCard|Card|BankSlip|Billet|Cartao|Boleto|Bronze|Silver|Gold|Prata|Ouro)\w*)[^{]*\b(?:implements|extends)\b'
  - id: f-enum-body
    languages: [regex]
    severity: INFO
    message: a case constant with its own body (the strategy is an enum constant)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?m)^\s*(?:ECONOMY|EXPRESS|STORE_PICKUP|COURIER|ECONOMICA|EXPRESSA|RETIRADA_LOJA|IN_STORE_PICKUP|PICKUP|MOTOBOY|MOTORCYCLE|WELCOME10|MINUS50|FREESHIPPING|BUY3PAY2|BEMVINDO10|MENOS50|FIFTY_OFF|FREE_SHIPPING|FRETEGRATIS|BUY3_PAY2|TAKE3PAY2|LEVE3PAGUE2|PIX|CREDIT_CARD|BANK_SLIP|CARD|CREDITCARD|CARTAO|BANKSLIP|BILLET|BOLETO|BRONZE|SILVER|GOLD|PRATA|OURO)\s*(?:\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\))?\s*\{'
  - id: f-factory-class
    languages: [regex]
    severity: INFO
    message: a class named factory or builder
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:class|interface|record)\s+\w*(?:Factory|Builder|Fabrica|Construtor)\w*'
