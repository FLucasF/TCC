spring.application.name=shop-orders-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shop_orders}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL12Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

translog.url=${TRANSLOG_URL:http://localhost:9999}
