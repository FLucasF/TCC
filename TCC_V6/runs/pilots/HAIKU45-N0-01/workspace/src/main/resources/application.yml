spring:
  application:
    name: loja-pedidos

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loja_pedidos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

translog:
  url: ${TRANSLOG_URL:http://localhost:9999}
  timeout-ms: 2000

logging:
  level:
    root: INFO
    com.loja.pedidos: DEBUG
