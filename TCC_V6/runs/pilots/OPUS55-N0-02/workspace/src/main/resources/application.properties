spring.application.name=pedidos

# Banco de dados (PostgreSQL). Endereço, usuário e senha chegam por variáveis de ambiente.
DB_USER=
DB_PASSWORD=

# Cria as tabelas (se ainda não existirem) e o catálogo inicial ao subir.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Transportadora TransLog
translog.url=${TRANSLOG_URL:}
translog.tempo-limite=2s
