<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semgrep por dentro</title>
<style>
:root {
  --bg: #f6f5f1; --bg2: #ffffff; --bg3: #efede6; --fg: #1d1f24; --muted: #646a73; --line: #dcd9cf;
  --accent: #2f5bd3; --accent-fg: #ffffff;
  --ok: #1d8a4e; --ok-bg: #d8f1e2; --bad: #c0392b; --bad-bg: #fbe0dc;
  --cand: #2f5bd3; --cand-bg: #dde6fb; --reg-bg: #ece3fb; --reg: #7b4bd1;
  --cur-bg: #fff3c4; --cur: #c99a00; --hit-bg: #ffe08a;
  --code-bg: #fbfaf7; --kw: #8a3ab9; --str: #1f7a3d; --com: #8a8f98; --num: #b5531a; --key: #2f5bd3;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;
    --accent: #7ea2ff; --accent-fg: #0f1115;
    --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;
    --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;
    --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;
    --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;
  --accent: #7ea2ff; --accent-fg: #0f1115;
  --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;
  --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;
  --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;
  --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; font-size: .9em; }
p code, li code, td code, .txt code { background: var(--bg3); padding: .05em .3em; border-radius: 4px; }
a { color: var(--accent); }
header.topo { padding: 18px 16px 6px; max-width: 1500px; margin: 0 auto; }
header.topo h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -.01em; }
header.topo p { margin: 0; color: var(--muted); font-size: 14px; }
nav.abas { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.abas .faixa { display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; max-width: 1500px; margin: 0 auto; scrollbar-width: thin; }
nav.abas button { flex: none; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
nav.abas button:hover { border-color: var(--accent); }
nav.abas button.ativa { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
main { max-width: 1500px; margin: 0 auto; padding: 14px 16px 60px; }
section.aba { display: none; }
section.aba.ativa { display: block; }
h2 { font-size: 19px; margin: 6px 0 8px; }
h3 { font-size: 15.5px; margin: 14px 0 6px; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 900px; }
.painel { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.grade2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.grade-lab { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1000px) { .grade2, .grade-lab { grid-template-columns: minmax(0, 1fr); } }
.pilha > * + * { margin-top: 12px; }
.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rotulo .dir { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* controles do passo a passo */
.controles { position: sticky; top: 49px; z-index: 10; display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 12px; box-shadow: var(--shadow); }
.controles button { border: 1px solid var(--line); background: var(--bg3); color: var(--fg); border-radius: 8px; min-width: 36px; height: 34px; font: inherit; cursor: pointer; }
.controles button:hover:not(:disabled) { border-color: var(--accent); }
.controles button:disabled { opacity: .4; cursor: default; }
.controles button.prox { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); padding: 0 14px; font-weight: 600; }
.controles .info { flex: 1; min-width: 0; }
.controles .info .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controles .info .n { font-size: 12px; color: var(--muted); }
.controles .barra { height: 3px; background: var(--bg3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.controles .barra i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.controles .dica { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 700px) { .controles .dica { display: none; } }

/* codigo */
.codigo { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.55; overflow: auto; max-height: 62vh; }
.codigo.baixo { max-height: 40vh; }
.codigo .cab { position: sticky; top: 0; z-index: 2; background: var(--bg3); border-bottom: 1px solid var(--line); padding: 4px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.codigo .cab b { color: var(--fg); font-weight: 600; }
.codigo .corpo { min-width: max-content; padding: 4px 0; }
.ln { display: flex; position: relative; padding-right: 12px; }
.ln .num { flex: none; width: 3.4em; text-align: right; padding-right: .9em; color: var(--muted); user-select: none; opacity: .7; }
.ln .src { white-space: pre; flex: none; }
.ln .nota { flex: none; margin-left: 14px; font-family: system-ui, sans-serif; font-size: 11.5px; padding: 0 7px; border-radius: 999px; align-self: center; white-space: nowrap; }
.ln .nota.ok { background: var(--ok-bg); color: var(--ok); }
.ln .nota.fora { background: var(--bad-bg); color: var(--bad); }
.ln .nota.cand { background: var(--cand-bg); color: var(--cand); }
.ln .nota.reg { background: var(--reg-bg); color: var(--reg); }
.ln.atual { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }
.ln.regiao { background: var(--reg-bg); box-shadow: inset 3px 0 0 var(--reg); }
.ln.erro { background: var(--bad-bg); box-shadow: inset 3px 0 0 var(--bad); }
.ln.apagada .src { opacity: .45; }
.ln.feita .num { color: var(--ok); opacity: 1; }
.s-kw { color: var(--kw); } .s-str { color: var(--str); } .s-com { color: var(--com); font-style: italic; } .s-num { color: var(--num); } .s-key { color: var(--key); }
.m-cand { background: var(--cand-bg); outline: 1px solid var(--cand); border-radius: 2px; }
.m-ok { background: var(--ok-bg); outline: 1px solid var(--ok); border-radius: 2px; }
.m-fora { background: var(--bad-bg); text-decoration: line-through; text-decoration-color: var(--bad); border-radius: 2px; }
.m-hit { background: var(--hit-bg); border-radius: 2px; }
.m-hitsel { background: var(--hit-bg); outline: 2px solid var(--cur); border-radius: 2px; }
.m-erro { text-decoration: underline wavy var(--bad); }

/* explicacao */
.passo-t { font-size: 17px; font-weight: 650; margin: 0 0 6px; }
.txt p { margin: 0 0 9px; }
.txt ul, .txt ol { margin: 0 0 9px; padding-left: 20px; }
.txt li { margin: 2px 0; }
.caixa { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); margin-top: 10px; }
.caixa.aconteceu { border-left: 4px solid var(--cur); }
.caixa.aconteceu .rotulo { color: var(--cur); }
.caixa.aviso { border-left: 4px solid var(--bad); }
.caixa.certo { border-left: 4px solid var(--ok); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.t td.mono, table.t td code { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12px; word-break: break-all; }
.sim { color: var(--ok); font-weight: 700; } .nao { color: var(--bad); font-weight: 700; }
.tabela-rolagem { max-height: 340px; overflow: auto; }
.estado td:first-child { white-space: nowrap; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--bg3); color: var(--muted); border: 1px solid var(--line); }
.pill.java { color: var(--kw); } .pill.texto { color: var(--str); }
input[type=text], textarea, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
textarea { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.5; min-height: 180px; resize: vertical; }
button.b { border: 1px solid var(--line); background: var(--bg3); color: var(--fg); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
button.b:hover { border-color: var(--accent); }
button.b.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.quiz { border: 1px dashed var(--accent); border-radius: 10px; padding: 9px 11px; margin-top: 10px; background: var(--bg); }
.quiz .q { font-weight: 600; margin-bottom: 6px; }
.quiz .r { margin-top: 8px; display: none; }
.quiz.respondida .r { display: block; }
.quiz button.certa { background: var(--ok-bg); border-color: var(--ok); }
.quiz button.errada { background: var(--bad-bg); border-color: var(--bad); }
.lista-regras { display: flex; flex-direction: column; gap: 3px; max-height: 75vh; overflow: auto; }
.lista-regras .grupo { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 2px; }
.lista-regras button { text-align: left; border: 1px solid transparent; background: none; color: var(--fg); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.lista-regras button:hover { background: var(--bg3); }
.lista-regras button.ativa { background: var(--cand-bg); border-color: var(--cand); }
@media (max-width: 1000px) { .lista-regras { flex-direction: row; flex-wrap: wrap; max-height: none; } .lista-regras .grupo { width: 100%; } }
.arvore { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; }
.arvore div { white-space: pre; padding: 0 6px; border-radius: 4px; }
.arvore .foco { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }
.arvore .ign { color: var(--muted); text-decoration: line-through; }
.arvore .cop { color: var(--ok); font-weight: 600; }
.arvore .fora { color: var(--bad); }
.arvore .proj { background: var(--ok-bg); }
.tag { display: inline-block; font-family: system-ui, sans-serif; font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 6px; background: var(--bg3); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.fora { background: var(--bad-bg); color: var(--bad); } .tag.cand { background: var(--cand-bg); color: var(--cand); } .tag.reg { background: var(--reg-bg); color: var(--reg); }
.fita { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 300px; overflow: auto; }
.fita .codigo-k { color: var(--fg); } .fita .texto-k { color: var(--str); background: rgba(31,122,61,.08); }
.fita .com-k { color: var(--bad); text-decoration: line-through; background: var(--bad-bg); }
.fita .atual-k { outline: 2px solid var(--cur); border-radius: 3px; }
.fita .depois { opacity: .45; }
.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.no { border: 1px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: var(--fg); box-shadow: var(--shadow); }
.no:hover { border-color: var(--accent); }
.no b { display: block; font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }
.no span { font-size: 13px; color: var(--muted); }
.no.etapa1 { border-top: 4px solid var(--cand); } .no.etapa2 { border-top: 4px solid var(--reg); } .no.prep { border-top: 4px solid var(--cur); }
.seta { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }
.trilha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.trilha .x { background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
.ped { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; word-break: break-all; }
tr.cab-ramo td { color: var(--muted); font-style: italic; font-size: 12px; background: var(--bg3); }
tr.nao-part td { opacity: .5; }
.cadeado { font-size: 42px; line-height: 1; }
details.r { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg2); margin: 8px 0; }
details.r summary { cursor: pointer; font-weight: 600; }
details.r[open] summary { margin-bottom: 6px; }
.verif { font-size: 13px; }
.verif li { margin: 3px 0; }
.mini { font-size: 12.5px; color: var(--muted); }
kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg2); }
.tema { position: absolute; top: 16px; right: 16px; }
header.topo { position: relative; }

</style>
</head>
<body>
<header class="topo">
  <h1>Semgrep por dentro</h1>
  <p>O instrumento do V5, linha por linha: o que cada linha roda, o que verifica e o que acha. Para estudo, com código inventado.</p>
  <button class="b tema" type="button">tema</button>
</header>
<nav class="abas" aria-label="abas"><div class="faixa"></div></nav>
<main></main>
<script>
window.DADOS = {"fontes":{"pontos":"// Os pontos do gabarito do Strategy e os nomes dos casos de cada um. Usado pelo\n// gerador das regras e pelo classificador, para os dois nunca divergirem.\n// Os nomes sao os mesmos nos enunciados do V3 e do V4.\n//\n// \"casos\": como o caso aparece escrito no enunciado (o texto que o site manda).\n// \"sinonimos\": o mesmo caso com outro nome no codigo, em ingles (09/10): um agente\n// pode escrever enum Tier { BRONZE, SILVER, GOLD } e traduzir o texto do site; sem os\n// sinonimos, um remendo \"tier == GOLD\" passaria em silencio como \"isolado\".\n// \"classes\": pedacos de nome de classe ou de variavel que indicam o caso (NivelOuro,\n// EntregaMotoboy, PagamentoPix): servem para o instanceof, o switch com pattern\n// matching (case Ouro o ->) e a fabrica que devolve um objeto (case \"OURO\" -> ouro;).\n// REGIOES, REGIOES_SINONIMOS e REGIOES_CLASSE: o mesmo para o P5 (o seguro por regiao).\n\nexport const PONTOS = [\n  { id: \"p1\", casos: [\"ECONOMICA\", \"EXPRESSA\", \"RETIRADA_LOJA\", \"MOTOBOY\"],\n    sinonimos: { ECONOMY: \"ECONOMICA\", EXPRESS: \"EXPRESSA\", STORE_PICKUP: \"RETIRADA_LOJA\", IN_STORE_PICKUP: \"RETIRADA_LOJA\", PICKUP: \"RETIRADA_LOJA\", MOTORCYCLE: \"MOTOBOY\", COURIER: \"MOTOBOY\" },\n    classes: \"Economica|Expressa|Retirada|Motoboy|Economy|Express|Pickup|Motorcycle|Courier\" },\n  { id: \"p2\", casos: [\"BEMVINDO10\", \"MENOS50\", \"FRETEGRATIS\", \"LEVE3PAGUE2\"],\n    sinonimos: { WELCOME10: \"BEMVINDO10\", MINUS50: \"MENOS50\", FIFTY_OFF: \"MENOS50\", FREE_SHIPPING: \"FRETEGRATIS\", FREESHIPPING: \"FRETEGRATIS\", BUY3PAY2: \"LEVE3PAGUE2\", TAKE3PAY2: \"LEVE3PAGUE2\" },\n    classes: \"BemVindo|Bemvindo|Menos50|FreteGratis|Fretegratis|Leve3|Welcome|Minus50|Buy3|Take3\" },\n  { id: \"p3\", casos: [\"PIX\", \"CARTAO\", \"BOLETO\"],\n    sinonimos: { CARD: \"CARTAO\", CREDIT_CARD: \"CARTAO\", CREDITCARD: \"CARTAO\", BANK_SLIP: \"BOLETO\", BANKSLIP: \"BOLETO\", BILLET: \"BOLETO\" },\n    classes: \"Pix|Cartao|Boleto|Card|BankSlip|Billet\" },\n  { id: \"p4\", casos: [\"BRONZE\", \"PRATA\", \"OURO\"],\n    sinonimos: { SILVER: \"PRATA\", GOLD: \"OURO\" },\n    classes: \"Bronze|Prata|Ouro|Silver|Gold\" },\n];\n\nexport const REGIOES = [\"SUDESTE\", \"SUL\", \"CENTRO_OESTE\", \"NORTE\", \"NORDESTE\"];\nexport const REGIOES_SINONIMOS = { SOUTHEAST: \"SUDESTE\", SOUTH: \"SUL\", MIDWEST: \"CENTRO_OESTE\", CENTER_WEST: \"CENTRO_OESTE\", CENTRAL_WEST: \"CENTRO_OESTE\", NORTH: \"NORTE\", NORTHEAST: \"NORDESTE\" };\nexport const REGIOES_CLASSE = \"Sudeste|Sul|CentroOeste|Norte|Nordeste|Southeast|South|Midwest|CenterWest|North|Northeast\";\n\n// Todos os nomes de um ponto (os do enunciado e os sinonimos), e o caso de cada nome.\nexport const nomes = (p) => [...p.casos, ...Object.keys(p.sinonimos ?? {})];\nexport const casoDe = (p, nome) => p.sinonimos?.[nome] ?? nome;\nexport const NOMES_REGIOES = [...REGIOES, ...Object.keys(REGIOES_SINONIMOS)];\n","gerador":"// Gera regras.yml, as regras do Semgrep que leem o desenho de cada pacote.\n//\n// Uso:  node evaluation/tools/semgrep/gerar-regras.mjs > evaluation/tools/semgrep/regras.yml\n//\n// Os pontos positivos (P1 a P4) recebem as mesmas regras, mudando so os nomes dos casos;\n// o controle negativo (P5) tem regras proprias. Os nomes vem do gabarito do Strategy e\n// sao os mesmos nos enunciados do V3 e do V4. Deterministico: o mesmo pacote da sempre o\n// mesmo resultado. Nao usa IA.\n//\n// Versao 2 (09/10, depois da revisao com o corpus adversarial, ver README): comparacoes\n// nos dois sentidos, Objects.equals, constantes com outro nome (pela propagacao de\n// constantes do Semgrep), sufixos como .name(); switch com pattern matching (Java 21);\n// fabrica por if; validacao que recusa sem throw; conjuntos que nomeiam parte dos casos;\n// instanceof fora do equals(); no P5, objetos por regiao (a classe e capturada, e o\n// classificador separa \"uma classe so\" de \"uma classe por regiao\"), funcoes por regiao,\n// constantes static final, entry() e if com x.equals(\"NORTE\"). O Semgrep roda numa copia\n// sem comentarios (detect.sh), e por isso as regras de texto nao leem comentario.\n//\n// COMO LER. Cada regra procura UMA forma de escrever e marca a linha. Ha dois tipos:\n// \"languages: [java]\" (o Semgrep entende o codigo: um if, uma comparacao, um new) e\n// \"languages: [regex]\" (busca de texto, para o que o parser nao ve bem, como o case\n// com pattern matching). Por ponto positivo (P1 a P4):\n//   cond-calc       uma comparacao que nomeia um caso (nivel == OURO, \"OURO\".equals(x));\n//   cond-validacao  a mesma, dentro de um if que recusa com throw;\n//   cond-recusa     a mesma, dentro de um if que devolve um erro (sem throw);\n//   cond-fabrica    a mesma, dentro de um if que so devolve ou guarda um objeto;\n//   instanceof      instanceof de uma classe de caso, fora do equals();\n//   switch-label    um \"case OURO\" ou \"case Ouro o\" (rotulo que nomeia o caso);\n//   switch-fabrica  o rotulo que so devolve um objeto (fabrica);\n//   conjunto        EnumSet/Set/List.of com casos (so conta se nao citar todos);\n//   nome            o alarme: o nome do caso aparece em algum lugar?\n// No P5: enum-corpo, enum-dados, classe-regiao, mapa, mapa-funcao, objeto (com a\n// classe capturada), config, switch-label, switch-fabrica e traducao.\n// A decisao (o que e espalhado, o que e consulta...) NAO esta aqui: esta no\n// classificar.mjs. Aqui so se marca o que existe.\n\nimport { PONTOS as BASE, NOMES_REGIOES, REGIOES_CLASSE, nomes } from \"./pontos.mjs\";\n\n// Cada ponto com todos os nomes dos casos (os do enunciado e os sinonimos em ingles).\nconst PONTOS = BASE.map((p) => ({ ...p, lista: nomes(p), casos: nomes(p).join(\"|\") }));\nconst REGIOES = NOMES_REGIOES.join(\"|\");\n// Tipos de valor: \"new BigDecimal(...)\" e um numero, nao um objeto de estrategia.\nconst VALOR = \"BigDecimal|BigInteger|Double|Integer|Long|Float|String|Object\";\nconst OBJETO = String.raw`new\\s+(?!(?:${VALOR})\\b)[A-Z]\\w*\\s*\\(`;\n// Argumentos com ate tres niveis de parenteses: NORTE(BigDecimal.valueOf(25).divide(BigDecimal.valueOf(1000)))\nconst ARGS = String.raw`\\((?:[^()]|\\((?:[^()]|\\((?:[^()]|\\([^()]*\\))*\\))*\\))*\\)`;\nconst SO_MAIN = `paths: { include: [\"**/src/main/**/*.java\"] }`;\n\n// O caso, como texto ou constante, com prefixo (NivelClube.OURO) e um sufixo sem\n// argumento (.name(), .getCodigo()).\nconst casoRegex = (c) => `^\"?([A-Za-z_]\\\\w*\\\\.)*(${c})\"?(\\\\.\\\\w+\\\\(\\\\))?$`;\n\n// As comparacoes que nomeiam um caso. O literal escrito na regra tambem acha uma\n// constante de outro nome com o mesmo valor (VIP = \"OURO\"), pela propagacao do Semgrep.\nconst comparacoes = ({ casos, lista }) => `\n          - patterns:\n              - pattern-either:\n                  - pattern: $X == $C\n                  - pattern: $C == $X\n                  - pattern: $X != $C\n                  - pattern: $C != $X\n                  - pattern: $C.equals($X)\n                  - pattern: $X.equals($C)\n                  - pattern: $X.equalsIgnoreCase($C)\n                  - pattern: $C.equalsIgnoreCase($X)\n                  - pattern: Objects.equals($X, $C)\n                  - pattern: Objects.equals($C, $X)\n                  - pattern: $X.compareTo($C)\n                  - pattern: $C.compareTo($X)\n              - metavariable-regex:\n                  metavariable: $C\n                  regex: '${casoRegex(casos)}'${lista.map((c) => `\n          - pattern: $X.equals(\"${c}\")\n          - pattern: '\"${c}\".equals($X)'\n          - pattern: $X.equalsIgnoreCase(\"${c}\")\n          - pattern: Objects.equals($X, \"${c}\")\n          - pattern: Objects.equals(\"${c}\", $X)`).join(\"\")}`;\n\n// Um if que recusa: throw, ou um return de erro (sem throw). \"return false\" NAO e\n// recusa: e o brinde feito por um if (exemplo do guia).\n// O metavariable-regex do Semgrep casa a partir do comeco do texto (re.match): o \".*\"\n// deixa o erro aparecer em qualquer lugar do retorno (Optional.of(new Erro(...))).\nconst RECUSA = String.raw`(?i).*(erro|error|badrequest|bad_request|recus|invalid|indispon|unprocessable|status\\(\\s*4\\d\\d|HttpStatus\\.(BAD|UNPROC|CONFLICT))`;\n\n// Uma variavel com o nome do caso (ouro, nivelOuro) e um objeto ja criado, e devolve-la\n// e escolher (fabrica). Mas nao se o nome e de numero (creditoOuro, PERCENTUAL_OURO):\n// ai o switch ou if esta fazendo a conta. Constante em maiusculas tambem nao conta.\nconst NOME_DE_NUMERO = \"pct|percent|taxa|credito|desconto|valor|aliquota|fator|rate|frete|juros|bonus|cashback|brinde|parcela|limite\";\nconst objetoComNome = (classes) => `(?![A-Z0-9_]+\\\\b)(?!\\\\w*(?i:${NOME_DE_NUMERO}))\\\\w*(?i:${classes})\\\\w*`;\n// Um if que so escolhe o objeto (fabrica): devolve ou guarda um objeto novo, a\n// constante do caso, ou um objeto com o nome do caso.\nconst fabricaRegex = (p) => `^(new\\\\s+(?!(${VALOR})\\\\b)[A-Z]\\\\w*\\\\s*\\\\(.*|([A-Za-z_]\\\\w*\\\\.)*(${p.casos})|(this\\\\.)?${objetoComNome(p.classes)}|\\\\w*(${p.classes})\\\\w*::new)$`;\n\nconst positivo = (p) => {\n  const { id, casos, classes } = p;\n  return `\n  - id: ${id}-cond-calc\n    languages: [java]\n    severity: INFO\n    message: condicao que nomeia um caso (o classificador tira as de recusa e as de fabrica)\n    ${SO_MAIN}\n    pattern-either:${comparacoes(p)}\n  - id: ${id}-cond-validacao\n    languages: [java]\n    severity: INFO\n    message: condicao que nomeia um caso so para recusar\n    ${SO_MAIN}\n    patterns:\n      - pattern-either:\n          - pattern-inside: if (...) throw $E;\n          - pattern-inside: if (...) { ... throw $E; ... }\n      - pattern-either:${comparacoes(p)}\n  - id: ${id}-cond-recusa\n    languages: [java]\n    severity: INFO\n    message: condicao que nomeia um caso so para recusar, devolvendo um erro (sem throw)\n    ${SO_MAIN}\n    patterns:\n      - pattern-either:\n          - pattern-inside: if (...) return $R;\n          - pattern-inside: if (...) { ... return $R; }\n      - metavariable-regex: { metavariable: $R, regex: '${RECUSA}' }\n      - pattern-either:${comparacoes(p)}\n  - id: ${id}-cond-fabrica\n    languages: [java]\n    severity: INFO\n    message: condicao que nomeia um caso so para escolher o objeto (fabrica)\n    ${SO_MAIN}\n    patterns:\n      - pattern-either:\n          - pattern-inside: if (...) return $V;\n          - pattern-inside: if (...) { return $V; }\n          - pattern-inside: if (...) $Y = $V;\n          - pattern-inside: if (...) { $Y = $V; }\n      - metavariable-regex: { metavariable: $V, regex: '${fabricaRegex(p)}' }\n      - pattern-either:${comparacoes(p)}\n  - id: ${id}-instanceof\n    languages: [java]\n    severity: INFO\n    message: instanceof de uma classe de caso (fora do equals)\n    ${SO_MAIN}\n    patterns:\n      - pattern: $X instanceof $K\n      - metavariable-regex: { metavariable: $K, regex: \".*(${classes})\" }\n      - pattern-not-inside: |\n          boolean equals(Object $O) { ... }\n  - id: ${id}-instanceof-recusa\n    languages: [java]\n    severity: INFO\n    message: instanceof de uma classe de caso dentro de um if que recusa (o classificador conta como recusa)\n    ${SO_MAIN}\n    patterns:\n      - pattern-either:\n          - pattern-inside: if (...) throw $E;\n          - pattern-inside: if (...) { ... throw $E; ... }\n      - pattern: $X instanceof $K\n      - metavariable-regex: { metavariable: $K, regex: \".*(${classes})\" }\n  - id: ${id}-switch-label\n    languages: [regex]\n    severity: INFO\n    message: rotulo de switch que nomeia um caso (inclusive pattern matching, Java 21)\n    ${SO_MAIN}\n    pattern-regex: '\\\\bcase\\\\s+(?:\"?(?:\\\\w+\\\\.)?(?:${casos})\"?\\\\s*(?:,|->|:)|\\\\w*(?:${classes})\\\\w*\\\\s*(?:\\\\(|\\\\s+\\\\w+\\\\s*(?:->|:|when\\\\b)))'\n  - id: ${id}-switch-fabrica\n    languages: [regex]\n    severity: INFO\n    message: rotulo de switch que so devolve um objeto (fabrica ou traducao para a constante)\n    ${SO_MAIN}\n    pattern-regex: '\\\\bcase\\\\s+\"?(?:\\\\w+\\\\.)?(?:${casos})\"?\\\\s*(?:->|:)\\\\s*(?:return\\\\s+)?(?:${OBJETO}|(?:\\\\w+\\\\.)?(?:${casos})\\\\s*;|(?:this\\\\.)?${objetoComNome(classes)}\\\\s*;|\\\\w*(?:${classes})\\\\w*::new)'\n  - id: ${id}-conjunto\n    languages: [regex]\n    severity: INFO\n    message: conjunto ou lista que cita casos (o classificador conta so os que nao citam todos)\n    ${SO_MAIN}\n    pattern-regex: '\\\\b(?:EnumSet|Set|List)\\\\.of\\\\s*\\\\([^()]*\\\\b(?:${casos})\\\\b[^()]*\\\\)'\n  - id: ${id}-nome\n    languages: [regex]\n    severity: INFO\n    message: o nome de um caso aparece no codigo (alarme - sem nenhum, o agente usou outros nomes)\n    ${SO_MAIN}\n    pattern-regex: '\\\\b(?:${casos})\\\\b|\\\\b\\\\w*(?:${classes})\\\\w*\\\\b'\n`;\n};\n\nconst REG = `\"?(?:\\\\w+\\\\.)?(?:${REGIOES})\"?`;\n// A chave de um mapa: entre aspas (\"NORTE\") ou qualificada (Regiao.NORTE). O nome solto\n// fica de fora porque e assim que aparece num \"case SUDESTE, SUL ->\", que nao e mapa\n// (defeito achado na regressao de 09/10: o \"SUL ->\" parecia uma funcao).\nconst CHAVE = `(?:\"(?:${REGIOES})\"|\\\\w+\\\\.(?:${REGIOES})\\\\b)`;\nconst regiaoRegex = `^\"?([A-Za-z_]\\\\w*\\\\.)*(${REGIOES})\"?$`;\nconst negativo = `\n  - id: p5-nome\n    languages: [regex]\n    severity: INFO\n    message: o nome de uma regiao aparece no codigo (alarme)\n    ${SO_MAIN}\n    pattern-regex: '\\\\b(?:${REGIOES})\\\\b|\\\\b\\\\w*(?:${REGIOES_CLASSE})\\\\w*\\\\b'\n  - id: p5-enum-corpo\n    languages: [regex]\n    severity: INFO\n    message: constante de regiao com corpo proprio\n    ${SO_MAIN}\n    pattern-regex: '(?m)^\\\\s*(?:${REGIOES})\\\\s*(?:${ARGS})?\\\\s*\\\\{'\n  - id: p5-enum-dados\n    languages: [regex]\n    severity: INFO\n    message: constante de regiao que so carrega valores\n    ${SO_MAIN}\n    pattern-regex: '(?m)^\\\\s*(?:${REGIOES})\\\\s*${ARGS}\\\\s*[,;]'\n  - id: p5-classe-regiao\n    languages: [regex]\n    severity: INFO\n    message: classe por regiao\n    ${SO_MAIN}\n    pattern-regex: '\\\\b(?:class|record)\\\\s+\\\\w*(?:${REGIOES_CLASSE})\\\\w*[^{]*\\\\b(?:implements|extends)\\\\b'\n  - id: p5-mapa\n    languages: [regex]\n    severity: INFO\n    message: mapa de regiao para valor\n    ${SO_MAIN}\n    # o \\\\s* fica DENTRO da verificacao: fora, ele devolve o espaco e a verificacao passa\n    # a olhar \" new Seguro()\", que nao comeca por \"new\" (defeito da versao 1)\n    pattern-regex: '(?:Map\\\\.(?:of|entry)\\\\s*\\\\(\\\\s*|\\\\bentry\\\\s*\\\\(\\\\s*|\\\\bput\\\\s*\\\\(\\\\s*)${REG}\\\\s*,(?!\\\\s*(?:${OBJETO}|(?:\\\\([^()]*\\\\)|\\\\w+)\\\\s*->|[\\\\w.]+::\\\\w+))'\n  - id: p5-mapa-funcao\n    languages: [regex]\n    severity: INFO\n    message: mapa de regiao para uma funcao ou classe anonima (uma por regiao)\n    ${SO_MAIN}\n    pattern-regex: '${CHAVE}\\\\s*,\\\\s*(?:\\\\([^()]*\\\\)|\\\\w+)\\\\s*->|${CHAVE}\\\\s*,\\\\s*[\\\\w.]+::\\\\w+|${CHAVE}\\\\s*,\\\\s*new\\\\s+[A-Z]\\\\w*\\\\s*\\\\([^()]*\\\\)\\\\s*\\\\{'\n  - id: p5-config\n    languages: [regex]\n    severity: INFO\n    message: taxa por regiao num arquivo de configuracao (dado)\n    paths: { include: [\"**/src/main/resources/**\"] }\n    pattern-regex: '(?im)^\\\\s*[\\\\w.\\\\[\\\\]-]*\\\\b(?:sudeste|sul|centro[-_]?oeste|norte|nordeste|southeast|south|midwest|cent(?:er|ral)[-_]?west|north|northeast)\\\\b\\\\s*[:=]\\\\s*[0-9]'\n  - id: p5-objeto\n    languages: [java]\n    severity: INFO\n    message: objeto por regiao (o classificador ve se e uma classe so ou uma por regiao)\n    ${SO_MAIN}\n    patterns:\n      - pattern-either:\n          - pattern: new $T($R, ...)\n          - pattern: Map.of(..., $R, new $T(...), ...)\n          - pattern: Map.entry($R, new $T(...))\n          - pattern: entry($R, new $T(...))\n          - pattern: $M.put($R, new $T(...))\n          - pattern: $TT $R = new $T(...);\n      - metavariable-regex: { metavariable: $R, regex: '${regiaoRegex}' }\n      - metavariable-regex: { metavariable: $T, regex: '^(?!(${VALOR})$)\\\\w+$' }\n  - id: p5-switch-label\n    languages: [regex]\n    severity: INFO\n    message: rotulo de switch ou condicao que nomeia uma regiao\n    ${SO_MAIN}\n    pattern-regex: '\\\\bcase\\\\s+${REG}\\\\s*(?:,|->|:)|\"(?:${REGIOES})\"\\\\s*\\\\.equals|\\\\.equals(?:IgnoreCase)?\\\\(\\\\s*${REG}\\\\s*\\\\)|[=!]=\\\\s*(?:\\\\w+\\\\.)?(?:${REGIOES})\\\\b'\n  - id: p5-switch-fabrica\n    languages: [regex]\n    severity: INFO\n    message: switch de regiao que devolve objeto\n    ${SO_MAIN}\n    pattern-regex: '\\\\bcase\\\\s+${REG}\\\\s*(?:->|:)\\\\s*(?:return\\\\s+)?${OBJETO}'\n  - id: p5-traducao\n    languages: [regex]\n    severity: INFO\n    message: switch ou if que so traduz o texto para a constante da regiao\n    ${SO_MAIN}\n    pattern-regex: '(?:\\\\bcase\\\\s+${REG}\\\\s*(?:->|:)|\\\\.equals(?:IgnoreCase)?\\\\(\\\\s*${REG}\\\\s*\\\\)\\\\s*\\\\)\\\\s*\\\\{?)\\\\s*(?:return\\\\s+)?(?:\\\\w+\\\\.)?(?:${REGIOES})\\\\s*;'\n`;\n\nprocess.stdout.write(\n  \"# GERADO por gerar-regras.mjs. Nao edite a mao: mude o gerador e gere de novo.\\n\" +\n  \"rules:\" + PONTOS.map(positivo).join(\"\") + negativo,\n);\n","detect":"#!/usr/bin/env bash\n# Le o desenho de cada pacote com o Semgrep e responde as perguntas da regua\n# enxuta (P1 a P4: localizacao e selecao; P5: forma e proporcao).\n#\n# Uso (Git Bash, da raiz do TCC_V3):\n#   evaluation/tools/semgrep/detect.sh <raiz-dos-pacotes> <saida.csv>\n#   evaluation/tools/semgrep/detect.sh evaluation/strategy/packages analysis/semgrep-EXT.csv\n#\n# <raiz-dos-pacotes> tem uma subpasta por pacote, cada uma com src/main/java.\n# Deterministico e sem IA: o mesmo pacote da sempre a mesma resposta. Recusa\n# rodar se as regras nao forem as geradas pelo gerar-regras.mjs atual, ou se a\n# saida ja existir (um resultado nunca e refeito por cima de outro).\n#\n# COMO LER. Os arquivos desta pasta, na ordem em que entram:\n#   pontos.mjs        os nomes dos casos de cada ponto (OURO, NORTE...), a unica lista;\n#   gerar-regras.mjs  escreve o regras.yml a partir dela (nunca se edita o .yml a mao);\n#   copia-limpa.mjs   faz a copia sem comentarios que o Semgrep le;\n#   regras.yml        o que o Semgrep procura: cada regra marca uma LINHA de codigo\n#                     (ex.: \"um if que nomeia OURO\", \"um case NORTE ->\");\n#   classificar.mjs   le as linhas marcadas e responde as perguntas da regua por pacote.\n# Este script so encadeia: confere as regras, faz a copia limpa, roda o Semgrep num\n# container travado por hash, classifica e grava o CSV com os hashes no cabecalho.\n# Cada linha do CSV tem as respostas, a evidencia (a primeira linha que contou de cada\n# regra) e os avisos (trechos que o Semgrep nao conseguiu ler).\n\nset -uo pipefail\nmorrer() { printf '\\033[31mERRO: %s\\033[0m\\n' \"$*\" >&2; exit 1; }\n\n[ $# -eq 2 ] || morrer \"uso: $0 <raiz-dos-pacotes> <saida.csv>\"\nPACOTES=\"$1\"; SAIDA=\"$2\"\n[ -d \"$PACOTES\" ] || morrer \"pasta nao encontrada: $PACOTES\"\n[ -e \"$SAIDA\" ] && morrer \"$SAIDA ja existe\"\n\nAQUI=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")\" && pwd -P)\"\n# A versao travada. Trocar a imagem e um instrumento novo.\nIMAGEM=\"semgrep/semgrep@sha256:30e6afa99ebd8e7b4115d4904898108eb4bf77025819e9263f09cf14e6f6e549\"\n\nTMP=\"$(mktemp -d)\"\ntrap 'rm -rf \"$TMP\"' EXIT\n# Sem MSYS_NO_PATHCONV, o Git Bash troca \"/pacotes\" por \"C:/Program Files/Git/pacotes\";\n# com ele, os outros caminhos vao convertidos a mao (cygpath -m), quando houver cygpath.\nwin() { cygpath -m \"$1\" 2>/dev/null || echo \"$1\"; }\n\n# As regras em uso tem de ser exatamente as que o gerador produz. O gerador falhar e\n# outro erro: com MSYS_NO_PATHCONV=1 no terminal, o node recebia /j/... e nao achava o\n# arquivo, e a mensagem dizia \"regras diferentes\" (ensaio de 10/10).\nnode \"$(win \"$AQUI/gerar-regras.mjs\")\" > \"$TMP/regras-geradas.yml\" || morrer \"o gerar-regras.mjs falhou\"\ncmp -s \"$TMP/regras-geradas.yml\" \"$AQUI/regras.yml\" \\\n    || morrer \"regras.yml difere do gerar-regras.mjs: gere de novo antes de rodar\"\nABS_PACOTES=\"$(cd \"$PACOTES\" && pwd -P)\"\n\n# O Semgrep le uma copia sem comentarios, com as linhas no mesmo lugar (09/10): as\n# regras de texto nao enxergam comentario, e o arquivo:linha continua o do original.\nLIMPA=\"$TMP/limpa\"\nnode \"$(win \"$AQUI/copia-limpa.mjs\")\" \"$(win \"$ABS_PACOTES\")\" \"$(win \"$LIMPA\")\" || morrer \"a copia sem comentarios falhou\"\n\nMSYS_NO_PATHCONV=1 docker run --rm \\\n    --mount \"type=bind,source=$(cygpath -w \"$LIMPA\" 2>/dev/null || echo \"$LIMPA\"),target=/pacotes,readonly\" \\\n    --mount \"type=bind,source=$(cygpath -w \"$AQUI\" 2>/dev/null || echo \"$AQUI\"),target=/regras,readonly\" \\\n    \"$IMAGEM\" semgrep --config /regras/regras.yml --json --metrics=off --quiet --no-git-ignore /pacotes \\\n    > \"$TMP/saida.json\" || morrer \"o Semgrep falhou\"\n\nMSYS_NO_PATHCONV=1 node \"$(win \"$AQUI/classificar.mjs\")\" \"$(win \"$TMP/saida.json\")\" \"$(win \"$LIMPA\")\" /pacotes \\\n    > \"$TMP/saida.csv\" || morrer \"classificacao falhou\"\nmkdir -p \"$(dirname \"$SAIDA\")\"\n{\n    echo \"# regras $(sha256sum \"$AQUI/regras.yml\" | cut -c1-16)  classificador $(sha256sum \"$AQUI/classificar.mjs\" | cut -c1-16)  limpeza $(sha256sum \"$AQUI/../sem-comentarios.mjs\" | cut -c1-16)  imagem ${IMAGEM##*:}\"\n    cat \"$TMP/saida.csv\"\n} > \"$SAIDA\"\necho \"$(($(wc -l < \"$SAIDA\") - 2)) pacotes -> $SAIDA\"\n","copia":"// Copia os .java, .properties e .yml de src/main de cada pacote para <destino>, sem comentarios e com as\n// linhas no mesmo lugar (o mesmo removedor da copia cega do Lucas). O Semgrep le esta\n// copia: as regras de texto deixam de ver comentario, e o arquivo:linha bate com o\n// original. Chamado pelo detect.sh (09/10).\n//\n// O projeto de cada pacote e o do pom.xml mais raso (fora de target/ e .git/), a mesma\n// regra do build (run-one.sh), da suite (executor.sh) e das metricas (metrics.sh): o\n// Semgrep le exatamente o codigo que foi compilado e testado, mesmo com o projeto numa\n// subpasta (<pacote>/checkout/pom.xml) ou com um rascunho do agente em outra pasta. So\n// aceitar <pacote>/src/main deixou 4 pacotes do V4 sem nenhum arquivo (ensaio de 10/10).\n// Num projeto multimodulo (o pom da raiz so lista <module>), vale o src/main de cada\n// modulo listado, e nao uma pasta que o pom nao cita (um rascunho com pom proprio).\n// Sem pom.xml, vale o src/main mais raso. Os caminhos continuam relativos ao pacote\n// (checkout/src/main/...), os mesmos da copia cega.\n//\n// Uso:  node copia-limpa.mjs <raiz-dos-pacotes> <destino-vazio>\n\nimport { readdirSync, readFileSync, mkdirSync, existsSync } from \"node:fs\";\nimport { join, relative, dirname } from \"node:path\";\nimport { copiaSemComentarios } from \"../sem-comentarios.mjs\";\n\nconst [raiz, destino] = process.argv.slice(2);\nif (!raiz || !destino) { console.error(\"uso: node copia-limpa.mjs <raiz> <destino>\"); process.exit(2); }\nif (existsSync(destino) && readdirSync(destino).length) { console.error(`${destino} nao esta vazio`); process.exit(2); }\n\nconst IGNORADAS = new Set([\"target\", \".git\"]);\nconst posix = (p) => p.replace(/\\\\/g, \"/\");\n\n// Todas as pastas do pacote com pom.xml, e todas as src/main, com a profundidade.\nfunction procura(dir, prof, achados) {\n  for (const e of readdirSync(dir, { withFileTypes: true })) {\n    if (!e.isDirectory()) { if (e.name === \"pom.xml\") achados.poms.push({ prof, dir }); continue; }\n    if (IGNORADAS.has(e.name)) continue;\n    const p = join(dir, e.name);\n    if (e.name === \"main\" && posix(dir).endsWith(\"/src\")) achados.mains.push({ prof, dir: p });\n    procura(p, prof + 1, achados);\n  }\n  return achados;\n}\n// O mais raso; empate de profundidade desempata pelo caminho (como o sort do build).\nconst maisRaso = (lista) => lista.slice().sort((a, b) => a.prof - b.prof || (posix(a.dir) < posix(b.dir) ? -1 : 1));\n\n// O src/main do projeto de um pom e o de cada <module> que ele lista (recursivo).\nfunction mainsDoProjeto(dir, vistos = new Set()) {\n  if (vistos.has(dir)) return [];\n  vistos.add(dir);\n  const pom = readFileSync(join(dir, \"pom.xml\"), \"utf8\").replace(/<!--[\\s\\S]*?-->/g, \"\");\n  const out = existsSync(join(dir, \"src\", \"main\")) ? [join(dir, \"src\", \"main\")] : [];\n  for (const [, m] of pom.matchAll(/<module>\\s*([^<]+?)\\s*<\\/module>/g))\n    if (existsSync(join(dir, m, \"pom.xml\"))) out.push(...mainsDoProjeto(join(dir, m), vistos));\n  return out;\n}\n\nlet n = 0;\nconst varre = (dir, pacote) => {\n  for (const e of readdirSync(dir, { withFileTypes: true })) {\n    const p = join(dir, e.name);\n    if (e.isDirectory()) { if (!IGNORADAS.has(e.name)) varre(p, pacote); continue; }\n    if (!/\\.(java|properties|ya?ml)$/.test(e.name)) continue;\n    const rel = posix(relative(join(raiz, pacote), p));\n    const alvo = join(destino, pacote, rel);\n    mkdirSync(dirname(alvo), { recursive: true });\n    copiaSemComentarios(p, alvo, rel);\n    n++;\n  }\n};\n\nconst pacotes = readdirSync(raiz, { withFileTypes: true }).filter((d) => d.isDirectory()).map((d) => d.name);\nfor (const pac of pacotes) {\n  mkdirSync(join(destino, pac), { recursive: true });\n  const { poms, mains } = procura(join(raiz, pac), 0, { poms: [], mains: [] });\n  const rel = (d) => posix(relative(join(raiz, pac), d)) || \".\";\n  let lidos = [];\n  if (poms.length) {\n    const [pom, segundo] = maisRaso(poms);\n    if (segundo && segundo.prof === pom.prof)\n      console.error(`AVISO ${pac}: dois pom.xml na mesma profundidade; vale ${rel(pom.dir)}`);\n    lidos = mainsDoProjeto(pom.dir);\n    if (lidos.length > 1) console.error(`AVISO ${pac}: multimodulo; valem ${lidos.map(rel).join(\", \")}`);\n  } else if (mains.length) {\n    lidos = [maisRaso(mains)[0].dir];\n    console.error(`AVISO ${pac}: sem pom.xml; vale ${rel(lidos[0])}`);\n  }\n  for (const m of lidos) varre(m, pac);\n  if (!lidos.length) console.error(`AVISO ${pac}: nenhum src/main (o classificador marca sem-codigo)`);\n}\nconsole.error(`${pacotes.length} pacotes, ${n} arquivos sem comentarios`);\n","semcom":"// Tira os comentarios de um arquivo sem mudar o numero de linhas. Usado pela copia cega\n// que o Lucas le (anonymize.mjs --sem-comentarios) e pela copia que o Semgrep le\n// (semgrep/detect.sh): as duas leem o mesmo codigo, e o arquivo:linha bate com o original.\n// Saiu do anonymize.mjs em 09/10, sem mudar uma linha da logica.\n\nimport { readFileSync, writeFileSync, copyFileSync } from \"node:fs\";\n\n// Tira os comentarios de um .java sem mexer em texto entre aspas, e sem mudar o numero\n// de linhas: cada quebra de linha dentro de um comentario fica onde estava.\nexport function semComentariosJava(fonte) {\n  let saida = \"\", i = 0;\n  const n = fonte.length;\n  while (i < n) {\n    const c = fonte[i], d = fonte[i + 1];\n    if (c === '\"' && fonte.startsWith('\"\"\"', i)) {            // bloco de texto\n      const fim = fonte.indexOf('\"\"\"', i + 3);\n      const ate = fim < 0 ? n : fim + 3;\n      saida += fonte.slice(i, ate); i = ate;\n    } else if (c === '\"' || c === \"'\") {                      // texto ou caractere\n      let j = i + 1;\n      while (j < n && fonte[j] !== c && fonte[j] !== \"\\n\") j += fonte[j] === \"\\\\\" ? 2 : 1;\n      saida += fonte.slice(i, j + 1); i = j + 1;\n    } else if (c === \"/\" && d === \"/\") {                      // comentario de linha\n      while (i < n && fonte[i] !== \"\\n\") i++;\n    } else if (c === \"/\" && d === \"*\") {                      // comentario de bloco\n      const fim = fonte.indexOf(\"*/\", i + 2);\n      const ate = fim < 0 ? n : fim + 2;\n      saida += fonte.slice(i, ate).replace(/[^\\n]/g, \"\"); i = ate;\n    } else { saida += c; i++; }\n  }\n  return saida.replace(/[ \\t]+$/gm, \"\");\n}\nexport const semComentariosXml = (t) => t.replace(/<!--[\\s\\S]*?-->/g, (m) => m.replace(/[^\\n]/g, \"\")).replace(/[ \\t]+$/gm, \"\");\nexport const semComentariosLinha = (t) => t.replace(/^[ \\t]*[#!].*$/gm, \"\");\n\nexport function copiaSemComentarios(origem, alvo, relativo) {\n  const ext = relativo.toLowerCase().split(\".\").pop();\n  const limpar = ext === \"java\" ? semComentariosJava\n    : ext === \"xml\" ? semComentariosXml\n    : [\"properties\", \"yml\", \"yaml\"].includes(ext) ? semComentariosLinha\n    : null;\n  if (!limpar) return copyFileSync(origem, alvo);\n  writeFileSync(alvo, limpar(readFileSync(origem, \"utf8\")));\n}\n"},"lab":{"real":[{"r":"p4-nome","f":"Condicoes.java","l1":7,"c1":40,"l2":7,"c2":44,"mv":{}},{"r":"p4-cond-calc","f":"Condicoes.java","l1":12,"c1":13,"l2":12,"c2":47,"mv":{"$C":"NivelClube.GOLD","$X":"cliente.nivel()"}},{"r":"p4-nome","f":"Condicoes.java","l1":12,"c1":43,"l2":12,"c2":47,"mv":{}},{"r":"p4-cond-calc","f":"Condicoes.java","l1":15,"c1":13,"l2":15,"c2":54,"mv":{"$C":"\"PRATA\"","$X":"cliente.codigo()"}},{"r":"p4-nome","f":"Condicoes.java","l1":15,"c1":47,"l2":15,"c2":52,"mv":{}},{"r":"p4-cond-calc","f":"Condicoes.java","l1":18,"c1":13,"l2":18,"c2":41,"mv":{"$X":"cliente.codigo()"}},{"r":"p4-cond-calc","f":"Condicoes.java","l1":28,"c1":13,"l2":28,"c2":36,"mv":{"$C":"\"BRONZE\"","$X":"codigo"}},{"r":"p4-cond-validacao","f":"Condicoes.java","l1":28,"c1":13,"l2":28,"c2":36,"mv":{"$C":"\"BRONZE\"","$E":"new IllegalArgumentException(\"PEDIDO_INVALIDO\")","$X":"codigo"}},{"r":"p4-nome","f":"Condicoes.java","l1":28,"c1":14,"l2":28,"c2":20,"mv":{}},{"r":"p4-cond-calc","f":"Condicoes.java","l1":34,"c1":13,"l2":34,"c2":44,"mv":{"$C":"\"OURO\"","$X":"codigo"}},{"r":"p4-cond-recusa","f":"Condicoes.java","l1":34,"c1":13,"l2":34,"c2":44,"mv":{"$C":"\"OURO\"","$R":"ResponseEntity.badRequest().build()","$X":"codigo"}},{"r":"p4-nome","f":"Condicoes.java","l1":34,"c1":38,"l2":34,"c2":42,"mv":{}},{"r":"p4-cond-calc","f":"Condicoes.java","l1":39,"c1":13,"l2":39,"c2":35,"mv":{"$C":"\"PRATA\"","$X":"codigo"}},{"r":"p4-cond-fabrica","f":"Condicoes.java","l1":39,"c1":13 /G.java":"class X {}\n",".git/x/src/main/java/Lixo.java":"class X {}\n","target/src/main/java/Gerado.java":"class X {}\n"},"lidos":["src/main/java/G.java"],"avisos":[]},{"nome":"recursos","arq":{"pom.xml":"<project><modelVersion>4.0.0<\/modelVersion><\/project>","src/main/resources/application.properties":"a=1\n","src/main/resources/application.yml":"a: 1\n","src/main/resources/notas.md":"x","src/main/java/H.java":"class X {}\n"},"lidos":["src/main/java/H.java","src/main/resources/application.properties","src/main/resources/application.yml"],"avisos":[]}],"hashes":{"regras":"4cf151b183fd67a1","classificador":"8cae11295d7ed3ba","limpeza":"975b41f7720ac8d1"},"tamRegras":75156,"fnvRegras":"95700bb3","juiz":{"fonte":"// Le o JSON do Semgrep (uma subpasta = um pacote) e responde as perguntas da\n// regua enxuta: localizacao e selecao nos pontos positivos (P1 a P4), forma e\n// proporcao no controle negativo (P5).\n//\n// Uso:  node evaluation/tools/semgrep/classificar.mjs <saida-do-semgrep.json> <raiz-dos-pacotes> [raiz-no-json]\n// Saida: CSV no stdout, uma linha por pacote (subpasta direta da raiz).\n// [raiz-no-json] e como a raiz aparece nos caminhos do JSON, quando o Semgrep\n// rodou num container (ex.: /pacotes); por padrao, a propria raiz.\n//\n// Versao 2 (09/10, revisao com o corpus adversarial, ver README). Erro do Semgrep num\n// arquivo nao para mais o lote: vai para a coluna \"avisos\" do pacote. Um trecho que ele\n// nao conseguiu ler (PartialParsing, ex.: um recurso novo do Java) deixa as respostas e\n// avisa; qualquer outro erro deixa o pacote todo \"indeterminado\".\n//\n// COMO LER. O Semgrep devolve uma lista de LINHAS marcadas, cada uma com o nome da\n// regra (ex.: \"p4-cond-calc\" na linha 58 do CheckoutService.java). Este script agrupa\n// as linhas por pacote e por regra, e decide, ponto a ponto:\n//\n//   P1 a P4 (positivo()): primeiro TIRA o que a regua manda nao contar: as condicoes de\n//   recusa (cond-validacao e cond-recusa) e as de fabrica (cond-fabrica) saem da conta;\n//   o \"registro\" (a classe Ouro dizendo que atende \"OURO\") sai; as listas de validos\n//   (um bloco que cita todos os casos so para conferir) saem. Depois decide:\n//     - localizacao: sobrou alguma linha que nomeia um caso fora da casa dele (conta,\n//       instanceof, rotulo de switch, conjunto parcial ou recusa)? espalhado. Senao, isolado.\n//     - selecao: sobrou alguma que nomeia E calcula? condicional-no-calculo. Senao,\n//       houve fabrica? condicional-unica. Senao, consulta.\n//     - alarme: se o pacote inteiro nao cita nenhum nome do ponto, o agente usou outros\n//       nomes (GOLD), e a resposta e \"indeterminado\", nunca um \"isolado\" falso.\n//\n//   P5 (negativo()): olha a forma (enum com dados, enum com corpo, classes, mapa,\n//   switch) e a proporcao: estrutura (uma classe, um corpo ou uma funcao por regiao),\n//   condicional (um switch/if que devolve o numero) ou dados (enum, mapa, tabela,\n//   configuracao). Objetos criados por regiao: uma classe so para todas e dado; uma\n//   classe por regiao e estrutura.\n//\n// A \"evidencia\" de cada pacote mostra so o que CONTOU, com a primeira linha de cada\n// regra: e o que o Lucas confere quando discorda do Semgrep.\n\nimport { readFileSync, readdirSync } from \"node:fs\";\nimport { join } from \"node:path\";\nimport { PONTOS, REGIOES_CLASSE, nomes, casoDe } from \"./pontos.mjs\";\n\nconst [jsonPath, raiz, raizNoJson = raiz] = process.argv.slice(2);\nif (!jsonPath || !raiz) {\n  console.error(\"uso: node classificar.mjs <saida.json> <raiz-dos-pacotes> [raiz-no-json]\");\n  process.exit(2);\n}\nconst out = JSON.parse(readFileSync(jsonPath, \"utf8\"));\n\n// O caminho de cada achado comeca pela pasta do pacote, relativa a raiz.\nconst prefixo = raizNoJson.replace(/\\\\/g, \"/\").replace(/\\/?$/, \"/\");\nconst pacoteDe = (p) => p.replace(/\\\\/g, \"/\").replace(prefixo, \"\").split(\"/\")[0];\nconst curto = (p) => p.replace(/\\\\/g, \"/\").replace(/^.*\\/java\\//, \"\");\n\nconst achados = {};\nconst textos = {};    // \"pacote|arquivo:linha\" -> texto da linha\nconst classesP5 = {}; // pacote -> Map(classe -> [onde]) dos objetos por regiao\nfor (const r of out.results) {\n  const pac = pacoteDe(r.path);\n  const regra = r.check_id.split(\".\").pop();\n  const onde = `${curto(r.path)}:${r.start.line}`;\n  ((achados[pac] ??= {})[regra] ??= []).push(onde);\n  textos[`${pac}|${onde}`] = r.extra?.lines ?? \"\";\n  if (regra === \"p5-objeto\") {\n    const t = r.extra?.metavars?.$T?.abstract_content;\n    if (t) { const m = (classesP5[pac] ??= new Map()); m.set(t, [...(m.get(t) ?? []), onde]); }\n  }\n}\n\n// Erros do Semgrep, por pacote.\nconst avisos = {}, quebrados = new Set();\nfor (const e of out.errors ?? []) {\n  const tipo = Array.isArray(e.type) ? e.type[0] : e.type;\n  const caminho = e.path ?? \"\";\n  const pac = caminho ? pacoteDe(caminho) : \"(lote)\";\n  const linha = e.spans?.[0]?.start?.line ?? \"?\";\n  (avisos[pac] ??= []).push(`${tipo} ${curto(caminho)}:${linha}`);\n  if (tipo !== \"PartialParsing\") quebrados.add(pac);\n}\nif (avisos[\"(lote)\"]) {\n  console.error(`o Semgrep relatou erro sem arquivo: ${avisos[\"(lote)\"].join(\"; \")}`);\n  process.exit(1);\n}\n\nconst lista = (h, id) => h[id] ?? [];\nconst conta = (h, id) => lista(h, id).length;\nconst texto = (pac, onde) => textos[`${pac}|${onde}`] ?? \"\";\n// Cita TODOS os casos do ponto: cada caso por qualquer um dos nomes dele (OURO ou GOLD).\nconst temNome = (t, n) => new RegExp(`\\\\b${n}\\\\b`).test(t);\nconst citaTodos = (t, ponto) => ponto.casos.every((c) => nomes(ponto).filter((n) => casoDe(ponto, n) === c).some((n) => temNome(t, n)));\n\n// Regua 2.1: o nome \"numa lista de validos\" nao conta. Uma lista de validos e um bloco\n// de achados em linhas seguidas que cita TODOS os casos do ponto e passa no teste do\n// tipo (comparacoes ligadas por && ou ||; ou rotulos de switch sem conta).\nfunction semListasDeValidos(pac, achadosDoPonto, ponto, eLista) {\n  const porArquivo = {};\n  for (const onde of achadosDoPonto) {\n    const [arquivo, linha] = [onde.slice(0, onde.lastIndexOf(\":\")), Number(onde.slice(onde.lastIndexOf(\":\") + 1))];\n    (porArquivo[arquivo] ??= []).push({ onde, linha });\n  }\n  const fora = new Set();\n  for (const itens of Object.values(porArquivo)) {\n    itens.sort((a, b) => a.linha - b.linha);\n    let bloco = [];\n    const fecha = () => {\n      const t = [...new Set(bloco.map((i) => texto(pac, i.onde)))].join(\"\\n\");\n      if (citaTodos(t, ponto) && eLista(t)) bloco.forEach((i) => fora.add(i.onde));\n      bloco = [];\n    };\n    for (const i of itens) {\n      if (bloco.length && i.linha - bloco[bloco.length - 1].linha > 1) fecha();\n      bloco.push(i);\n    }\n    fecha();\n  }\n  return achadosDoPonto.filter((o) => !fora.has(o));\n}\n// Comparacoes: ligadas por && ou ||, sem else, sem ternario, sem lambda.\nconst listaDeComparacoes = (t) => /&&|\\|\\|/.test(t) && !/\\belse\\b|\\?|->/.test(t);\n// Rotulos: \"case A, B, C -> {}\" ou \"case A: case B: case C: break;\", sem nada calculado.\nconst listaDeRotulos = (t) => t.split(\"\\n\").every((l) =>\n  /^\\s*(?:case\\s+[^:>-]+(?:->\\s*\\{\\s*\\}?|:)\\s*)+(?:break\\s*;\\s*)?$/.test(l));\n\n// O registro: a unidade do caso diz se atende o codigo (\"return \"OURO\".equals(c);\" dentro\n// de Ouro.java ou NivelOuro.java). E o nome usado como chave, dentro da propria casa.\nfunction eRegistro(pac, onde, ponto) {\n  const t = texto(pac, onde).trim();\n  // a linha e o return de uma comparacao so (o metodo pode estar todo na mesma linha)\n  if (!/(?:^|[{;]\\s*)return\\s+[^;&|?{}]*(?:equals|==)[^;&|?{}]*;\\s*\\}?$/.test(t)) return false;\n  const arquivo = onde.slice(onde.lastIndexOf(\"/\") + 1);\n  return nomes(ponto).some((n) => temNome(t, n)) && ponto.classes.split(\"|\").some((k) => arquivo.includes(k));\n}\n\nfunction positivo(pac, h, ponto) {\n  const { id: p } = ponto;\n  // Recusar: com throw (cond-validacao) ou devolvendo um erro (cond-recusa).\n  const recusas = [...new Set([...lista(h, `${p}-cond-validacao`), ...lista(h, `${p}-cond-recusa`)])];\n  const naoConta = new Set([...recusas, ...lista(h, `${p}-cond-fabrica`)]);\n  const condCalc = semListasDeValidos(pac, lista(h, `${p}-cond-calc`), ponto, listaDeComparacoes)\n    .filter((o) => !naoConta.has(o) && !eRegistro(pac, o, ponto));\n  const condValidacao = semListasDeValidos(pac, recusas, ponto, listaDeComparacoes);\n  const fabrica = [...new Set([...lista(h, `${p}-switch-fabrica`), ...lista(h, `${p}-cond-fabrica`)])];\n  const rotulos = semListasDeValidos(pac, lista(h, `${p}-switch-label`).filter((l) => !fabrica.includes(l)), ponto, listaDeRotulos);\n  const conjuntos = lista(h, `${p}-conjunto`).filter((o) => !citaTodos(texto(pac, o), ponto));\n  // instanceof dentro de um if que recusa e recusa, nao conta (defeito achado na regressao de 09/10).\n  const instRecusa = new Set(lista(h, `${p}-instanceof-recusa`));\n  h[`${p}-instanceof`] = lista(h, `${p}-instanceof`).filter((o) => !instRecusa.has(o));\n  h[`${p}-instanceof-recusa`] = [...instRecusa];\n  // A evidencia mostra o que foi CONTADO.\n  h[`${p}-cond-calc`] = condCalc;\n  h[`${p}-cond-validacao`] = condValidacao;\n  h[`${p}-switch-label`] = rotulos;\n  h[`${p}-conjunto`] = conjuntos;\n  h[`${p}-fabrica`] = fabrica;\n  delete h[`${p}-switch-fabrica`]; delete h[`${p}-cond-fabrica`]; delete h[`${p}-cond-recusa`];\n  const calculo = condCalc.length + conta(h, `${p}-instanceof`) + rotulos.length + conjuntos.length;\n  const validacao = condValidacao.length + instRecusa.size;\n  // Alarme: nenhum nome de caso no pacote inteiro quer dizer que o agente chamou os\n  // casos de outro jeito (ex.: TIER_A, nem o enunciado nem o ingles); as regras nao os\n  // veriam, e \"isolado\" seria falso.\n  if (conta(h, `${p}-nome`) === 0) return [\"indeterminado\", \"indeterminado\"];\n  const localizacao = calculo + validacao > 0 ? \"espalhado\" : \"isolado\";\n  const selecao = calculo > 0 ? \"condicional-no-calculo\" : fabrica.length > 0 ? \"condicional-unica\" : \"consulta\";\n  return [localizacao, selecao];\n}\n\nfunction negativo(pac, h) {\n  // O mesmo alarme; as taxas num arquivo de configuracao tambem contam como nome.\n  if (conta(h, \"p5-nome\") + conta(h, \"p5-config\") === 0) return [\"outro\", \"indeterminado\"];\n  // Objetos por regiao: uma classe so (um objeto de valor, uma tabela) e dado; uma\n  // classe por regiao (ou com o nome da regiao) e estrutura.\n  const classes = classesP5[pac] ?? new Map();\n  const comNome = [...classes.keys()].some((c) => new RegExp(REGIOES_CLASSE).test(c));\n  const objEstrutura = classes.size >= 2 || comNome;\n  const objDados = classes.size === 1 && !comNome;\n  const objNoMapa = [...classes.values()].flat().some((o) => /Map\\.|\\bput\\s*\\(|\\bentry\\s*\\(/.test(texto(pac, o)));\n  const traducao = new Set(lista(h, \"p5-traducao\"));\n  const rotulos = lista(h, \"p5-switch-label\").filter((o) => !traducao.has(o));\n  h[\"p5-switch-label\"] = rotulos;\n  h[\"p5-objeto\"] = [...classes.entries()].map(([c, ls]) => `${c}@${ls[0]}`);\n  const estrutura = conta(h, \"p5-enum-corpo\") + conta(h, \"p5-classe-regiao\")\n    + conta(h, \"p5-switch-fabrica\") + conta(h, \"p5-mapa-funcao\") + (objEstrutura ? 1 : 0);\n  const condicional = rotulos.length - conta(h, \"p5-switch-fabrica\");\n  const forma = conta(h, \"p5-enum-corpo\") ? \"enum-abstrato\"\n    : conta(h, \"p5-classe-regiao\") ? \"classes\"\n    : conta(h, \"p5-mapa\") + conta(h, \"p5-mapa-funcao\") + (objNoMapa ? 1 : 0) ? \"mapa\"\n    : condicional + conta(h, \"p5-switch-fabrica\") > 0 ? \"switch\"\n    : conta(h, \"p5-enum-dados\") ? \"enum-dados\"\n    : \"outro\";\n  const proporcao = estrutura > 0 ? \"estrutura\"\n    : condicional > 0 ? \"condicional\"\n    : conta(h, \"p5-enum-dados\") + conta(h, \"p5-mapa\") + conta(h, \"p5-config\") + (objDados ? 1 : 0) ? \"dados\"\n    : \"indeterminado\";\n  return [forma, proporcao];\n}\n\nconst paco \");\n\n\n    public BigDecimal frete(Cliente cliente, BigDecimal base) {\n        if (cliente.nivel() == NivelClube.GOLD) {\n            return BigDecimal.ZERO;\n        }\n        if (Objects.equals(cliente.codigo(), \"PRATA\")) {\n            return base.multiply(new BigDecimal(\"0.5\"));\n        }\n        if (cliente.codigo().equals(VIP)) {\n            return base.multiply(PERCENTUAL_OURO);\n        }\n        if (cliente.pontos() > 1000) {\n            return base.subtract(BigDecimal.ONE);\n        }\n        return base;\n    }\n\n    public void validar(String codigo, BigDecimal subtotal) {\n        if (\"BRONZE\".equals(codigo) && subtotal.signum() == 0) {\n            throw new IllegalArgumentException(\"PEDIDO_INVALIDO\");\n        }\n    }\n\n    public Object recusar(String codigo) {\n        if (codigo.equalsIgnoreCase(\"OURO\")) return ResponseEntity.badRequest().build();\n        return ResponseEntity.ok().build();\n    }\n\n    public Nivel escolher(String codigo) {\n        if (codigo.equals(\"PRATA\")) return new Prata();\n        return new Bronze();\n    }\n}\n","Conjuntos.java":"package com.loja.lab;\n\nimport java.util.EnumSet;\nimport java.util.Set;\n\npublic class Conjuntos {\n    static final Set<String> VALIDOS = Set.of(\"BRONZE\", \"PRATA\", \"OURO\");\n    static final EnumSet<NivelClube> COM_BRINDE = EnumSet.of(NivelClube.PRATA, NivelClube.OURO);\n    static final Set<String> MOEDAS = Set.of(\"BRL\", \"USD\");\n}\n","Ouro.java":"package com.loja.lab;\n\nimport java.math.BigDecimal;\n\npublic class Ouro implements Nivel {\n    public BigDecimal desconto(BigDecimal valor) {\n        return valor.multiply(new BigDecimal(\"0.10\"));\n    }\n\n    @Override\n    public boolean equals(Object outro) {\n        return outro instanceof Ouro;\n    }\n}\n","Regiao.java":"package com.loja.lab;\n\nimport java.math.BigDecimal;\n\npublic enum Regiao {\n    SUDESTE(new BigDecimal(\"0.010\")),\n    SUL(new BigDecimal(\"0.012\")),\n    NORTE(new BigDec function carregaGerador(src, mod) {

// ---------- o regras.yml em blocos ----------
function blocos(yml) {
  const linhas = yml.split("\n"), out = {};
  let atual = null;
  linhas.forEach((l, i) => {
    const m = l.match(/^  - id: (\S+)/);
    if (m) { atual = { id: m[1], inicio: i + 1, linhas: [] }; out[m[1]] = atual; }
    if (atual) atual.linhas.push(l);
  });
  for (const b of Object.values(out)) {
    while (b.linhas.length && b.linhas[b.linhas.length - 1].trim() === "") b.linhas.pop();
    b.texto = b.linhas.join("\n");
    const pr = b.texto.match(/\n    pattern-regex: '((?:[^']|'')*)'/);
    b.regex = pr ? pr[1].replace(/''/g, "'") : null;
    b.lang = /languages: \[regex\]/.test(b.texto) ? "regex" : "java";
    const inc = b.texto.match(/include: \["([^"]+)"\]/);
    b.include = inc ? inc[1] : null;
  }
  return out;
}

// ---------- regex do Semgrep (PCRE) para o JavaScript ----------
// So o que as regras usam: flags no comeco ((?m), (?i), (?im)) e (?i:...) com palavras.
function paraJS(src, flagsExtra = "") {
  let flags = flagsExtra;
  const lead = src.match(/^\(\?([imsx]+)\)/);
  if (lead) { flags += lead[1]; src = src.slice(lead[0].length); }
  src = src.replace(/\(\?i:([A-Za-z0-9_|]+)\)/g, (_, c) =>
    "(?:" + c.replace(/[A-Za-z]/g, (l) => `[${l.toLowerCase()}${l.toUpperCase()}]`) + ")");
  if (/\(\?[a-z]/.test(src)) throw new Error("flag nao convertida: " + src);
  return new RegExp(src, [...new Set(flags)].join(""));
}

// metavariable-regex: casa a partir do comeco do texto (como o re.match do Python)

  const re = paraJS(regexSrc, "y");
  re.lastIndex = 0;
  const m = re.exec(valor);
  return m ? m[0] : null;

// junta os pedacos de volta no texto original da regra
function montaOriginal(pedacos) {
  const um = (p) => p.flag ? `(?${p.flag})` : p.re !== undefined ? p.re
    : p.alt ? "(?:" + p.alt.map(seq).join("|") + ")" : p.topo.map(seq).join("|");
  const seq = (lista) => lista.map(um).join("");
  return seq(pedacos);
}

// a mesma regex, com cada pedaco num grupo nomeado: mostra o que cada pedaco casou
function montaNomeado(pedacos) {
  let n = 0, flags = "";
  const linhas = [];
  const um = (p, nivel, ramo) => {
    if (p.flag) { flags += p.flag; linhas.push({ g: null, txt: p.txt, re: `(?${p.flag})`, nivel, ramo, flag: true }); return ""; }
    if (p.topo) return p.topo.map((s, i) => { linhas.push({ g: null, txt: `alternativa ${i + 1} de ${p.topo.length}`, re: "", nivel, ramo: i + 1, cab: true }); return seq(s, nivel + 1, i + 1); }).join("|");
    const g = "g" + n++;
    if (p.alt) {
      linhas.push({ g, txt: p.txt, re: montaOriginal([p]), nivel, ramo, grupo: true });
      const dentro = p.alt.map((s, i) => { linhas.push({ g: null, txt: `ramo ${i + 1} de ${p.alt.length}`, re: "", nivel: nivel + 1, ramo: i + 1, cab: true }); return seq(s, nivel + 2, i + 1); }).join("|");
      return `(?<${g}>(?:${dentro}))`;
    }
    linhas.push({ g, txt: p.txt, re: p.re, nivel, ramo });
    return `(?<${g}>${p.re})`;
  };
  const seq = (lista, nivel, ramo) => lista.map((p) => um(p, nivel, ramo)).join("");
  const src = seq(pedacos, 0, 0);
  return { src, flags, linhas };
}

// o caminho (relativo ao pacote) passa no "paths: include" da regra?
function passaPaths(include, caminho) {
  const c = "/" + caminho.replace(/\\/g, "/").replace(/^\/+/, "");
  if (include === "**/src/main/**/*.java") return c.includes("/src/main/") && c.endsWith(".java");
  if (include === "**/src/main/resources/**") return c.includes("/src/main/resources/");
  throw new Error("include desconhecido: " + include);
}

// roda uma regra de texto num arquivo (o texto ja limpo), como o Semgrep: todos os achados
function rodaRegex(bloco, pedacos, texto) {
  const usarPedacos = pedacos && montaOriginal(pedacos) === bloco.regex;
  const nom = usarPedacos ? montaNomeado(pedacos) : null;
  const re = usarPedacos ? paraJS((nom.flags ? `(?${nom.flags})` : "") + nom.src, "g") : paraJS(bloco.regex, "g");
  const out = [];
  let m;
  while ((m = re.exec(texto))) {
    if (m[0] === "") { re.lastIndex++; continue; }
    const antes = texto.slice(0, m.index).split("\n");
    const l1 = antes.length, c1 = antes[antes.length - 1].length + 1;
    const dentro = m[0].split("\n");
    const l2 = l1 + dentro.length - 1, c2 = (dentro.length === 1 ? c1 : 1) + dentro[dentro.length - 1].length;
    out.push({ l1, c1, l2, c2, txt: m[0], grupos: m.groups || {} });
  }
  return { achados: out, linhas: nom ? nom.linhas : null, fiel: usarPedacos };
}

// ---------- o removedor de comentarios, passo a passo ----------
// Espelha semComentariosJava (sem-comentarios.mjs) e anota a linha do arquivo de cada passo.
function passosSemComentarios(fonte) {
  const passos = [];
  let saida = "", i = 0;
  const n = fonte.length;
  const especial = (k) => fonte[k] === '"' || fonte[k] === "'" || (fonte[k] === "/" && (fonte[k + 1] === "/" || fonte[k + 1] === "*"));
  while (i < n) {
    const c = fonte[i], d = fonte[i + 1];
    if (c === '"' && fonte.startsWith('"""', i)) {
      const fim = fonte.indexOf('"""', i + 3);
      const ate = fim < 0 ? n : fim + 3;
      passos.push({ linha: 15, tipo: "bloco", de: i, ate, fica: fonte.slice(i, ate) });
      saida += fonte.slice(i, ate); i = ate;
    } else if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && fonte[j] !== c && fonte[j] !== "\n") j += fonte[j] === "\\" ? 2 : 1;
      passos.push({ linha: 19, tipo: c === '"' ? "texto" : "caractere", de: i, ate: Math.min(j + 1, n), fica: fonte.slice(i, j + 1) });
      saida += fonte.slice(i, j + 1); i = j + 1;
    } else if (c === "/" && d === "/") {
      const de = i;
      while (i < n && fonte[i] !== "\n") i++;
      passos.push({ linha: 23, tipo: "linha", de, ate: i, fica: "" });
    } else if (c === "/" && d === "*") {
      const fim = fonte.indexOf("*/", i + 2);
      const ate = fim < 0 ? n : fim + 2;
      const fica = fonte.slice(i, ate).replace(/[^\n]/g, "");
      passos.push({ linha: 25, tipo: "blocoComentario", de: i, ate, fica });
      saida += fica; i = ate;
    } else {
      const de = i;
      do { saida += fonte[i]; i++; } while (i < n && !especial(i));
      passos.push({ linha: 29, tipo: "codigo", de, ate: i, fica: fonte.slice(de, i) });
    }
    passos[passos.length - 1].saida = saida;
  }
  const final = saida.replace(/[ \t]+$/gm, "");
  passos.push({ linha: 31, tipo: "fim", de: n, ate: n, fica: "", saida: final, antes: saida });
  return { passos, saida: final };
}

// ---------- a copia limpa, simulada num pacote de mentira ----------
// Espelha copia-limpa.mjs (procura, maisRaso, mainsDoProjeto, varre) e anota a linha de cada passo.
function simulaCopiaLimpa(arquivos, pac) {
  const IGNORADAS = new Set(["target", ".git"]);
  const ev = [];
  const est = { poms: [], mains: [], lidos: [], copiados: [], fora: [], avisos: [], n: 0, visitadas: [], ignoradas: [], projeto: null };
  const snap = () => JSON.parse(JSON.stringify(est));
  const passo = (linha, txt, foco) => ev.push({ linha, txt, foco: foco ?? null, estado: snap() });
  const caminhos = Object.keys(arquivos);
  const dirs = new Set([""]);
  for (const c of caminhos) { const p = c.split("/"); for (let k = 1; k < p.length; k++) dirs.add(p.slice(0, k).join("/")); }
  const junta = (a, b) => (a ? a + "/" + b : b);
  const entradas = (dir) => {
    const nomes = new Set();
    for (const x of [...caminhos, ...dirs]) {
      if (x === dir || !x) continue;
      const pre = dir ? dir + "/" : "";
      if (x.startsWith(pre)) nomes.add(x.slice(pre.length).split("/")[0]);
    }
    return [...nomes].sort().map((nome) => ({ nome, dir: dirs.has(junta(dir, nome)) }));
  };
  const existe = (p) => dirs.has(p) || p in arquivos;
  const mostra = (d) => (d === "" ? "." : d);
  const ord = (l) => l.slice().sort((a, b) => a.prof - b.prof || (a.dir < b.dir ? -1 : 1));

  passo(22, `pega os dois argumentos: a raiz dos pacotes e o destino (a pasta vazia da copia)`);
  passo(24, `o destino está vazio: pode seguir (se não estivesse, parava aqui)`);
  passo(26, `as pastas que NUNCA entram: target (o que o build gerou) e .git`);
  passo(68, `lista as pastas da raiz: cada uma é um pacote. Aqui, só uma: ${pac}`);
  passo(69, `começa o pacote ${pac}`);
  passo(70, `cria a pasta ${pac} no destino (mesmo que nada seja copiado)`);
  passo(71, `chama procura(): varre o pacote inteiro atrás de pom.xml e de src/main`);

  const procura = (dir, prof) => {
    est.visitadas.push(dir);
    const ents = entradas(dir);
    passo(31, `procura("${mostra(dir)}", profundidade ${prof}): olha ${ents.length ? ents.map((e) => e.nome + (e.dir ? "/" : "")).join(", ") : "(vazia)"}`, dir);
    for (const e of ents) {
      const p = junta(dir, e.nome);
      if (!e.dir) {
        if (e.nome === "pom.xml") { est.poms.push({ prof, dir: mostra(dir) }); passo(32, `achou um pom.xml em "${mostra(dir)}" (profundidade ${prof}): guarda`, p); }
        continue;
      }
      if (IGNORADAS.has(e.nome)) { est.ignoradas.push(p); passo(33, `"${p}" é ${e.nome}: pula sem olhar dentro`, p); continue; }
      if (e.nome === "main" && ("/" + dir).endsWith("/src")) { est.mains.push({ prof, dir: p }); passo(35, `achou um src/main: "${p}" (profundidade ${prof}): guarda`, p); }
      procura(p, prof + 1);
    }
  };
  procura("", 0);
  passo(71, `fim da procura: ${est.poms.length} pom.xml e ${est.mains.length} src/main achados`);

  const mainsDoProjeto = (dir, vistos = new Set()) => {
    if (vistos.has(dir)) return [];
    vistos.add(dir);
    const pom = arquivos[junta(dir, "pom.xml")].replace(/<!--[\s\S]*?-->/g, "");
    passo(47, `lê o ${junta(dir, "pom.xml")} e tira os comentários do XML (um <module> comentado não vale)`, junta(dir, "pom.xml"));
    const sm = junta(dir, "src/main");
    const out = existe(sm) ? [sm] : [];
    passo(48, existe(sm) ? `"${sm}" existe: entra na lista` : `"${mostra(dir)}" não tem src/main próprio`, existe(sm) ? sm : dir);
    const mods = [...pom.matchAll(/<module>\s*([^<]+?)\s*<\/module>/g)].map((m) => m[1]);
    passo(49, mods.length ? `o pom lista os módulos: ${mods.join(", ")}` : `o pom não lista nenhum <module>`);
    for (const m of mods) {
      const tem = junta(junta(dir, m), "pom.xml") in arquivos;
      passo(50, tem ? `o módulo "${m}" tem pom.xml: pega o src/main dele (recursivo)` : `o módulo "${m}" não tem pom.xml: fica de fora`, junta(dir, m));
      if (tem) out.push(...mainsDoProjeto(junta(dir, m), vistos));
    }
    return out;
  };

  let lidos = [];
  if (est.poms.length) {
    const ordenados = ord(est.poms);
    const [pom, segundo] = ordenados;
    est.projeto = pom.dir;
    passo(75, `ordena os pom.xml pelo mais raso (empate: pelo caminho): ${ordenados.map((x) => `"${x.dir}" (${x.prof})`).join(", ")}. Vale "${pom.dir}"`, pom.dir === "." ? "" : pom.dir);
    if (segundo && segundo.prof === pom.prof) {
      est.avisos.push(`AVISO ${pac}: dois pom.xml na mesma profundidade; vale ${pom.dir}`);
      passo(77, `empate de profundidade com "${segundo.dir}": avisa`);
    } else passo(76, `nenhum empate: sem aviso`);
    lidos = mainsDoProjeto(pom.dir === "." ? "" : pom.dir);
    est.lidos = lidos.slice();
    passo(78, `o código do projeto: ${lidos.length ? lidos.join(", ") : "(nenhum src/main)"}`);
    if (lidos.length > 1) { est.avisos.push(`AVISO ${pac}: multimodulo; valem ${lidos.join(", ")}`); passo(79, `mais de um src/main: projeto multimódulo, avisa`); }
  } else if (est.mains.length) {
    lidos = [ord(est.mains)[0].dir];
    est.lidos = lidos.slice();
    est.avisos.push(`AVISO ${pac}: sem pom.xml; vale ${lidos[0]}`);
    passo(81, `nenhum pom.xml: vale o src/main mais raso, "${lidos[0]}", e avisa`, lidos[0]);
  } else passo(80, `nenhum pom.xml e nenhum src/main`);

  const varre = (dir) => {
    for (const e of entradas(dir)) {
      const p = junta(dir, e.nome);
      if (e.dir) { if (!IGNORADAS.has(e.nome)) varre(p); continue; }
      if (!/\.(java|properties|ya?ml)$/.test(e.nome)) { est.fora.push(p); passo(59, `"${p}" não é .java, .properties nem .yml: fica de fora`, p); continue; }
      est.copiados.push(p); est.n++;
      passo(63, `copia "${p}" sem comentários, para limpa/${pac}/${p} (o mesmo caminho relativo)`, p);
    }
  };
  for (const m of lidos) { passo(84, `varre "${m}"`, m); varre(m); }
  if (!lidos.length) { est.avisos.push(`AVISO ${pac}: nenhum src/main (o classificador marca sem-codigo)`); passo(85, `nada para ler: avisa (o classificador vai marcar sem-codigo)`); }
  passo(87, `fim: 1 pacotes, ${est.n} arquivos sem comentarios`);
  return { eventos: ev, lidos: est.copiados.slice(), avisos: est.avisos.slice() };
}

// ---------- utilidades ----------
function fnv1a(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, "0");
}

// diferenca linha a linha (LCS), para o "experimente" do gerador
function diffLinhas(a, b) {
  const n = a.length, m = b.length;
  const t = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    t[i][j] = a[i] === b[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({ t: "=", s: a[i] }); i++; j++; }
    else if (t[i + 1][j] >= t[i][j + 1]) out.push({ t: "-", s: a[i++] });
    else out.push({ t: "+", s: b[j++] });
  }
  while (i < n) out.push({ t: "-", s: a[i++] });
  while (j < m) out.push({ t: "+", s: b[j++] });
  return out;
}

// ---------- o juiz: o classificar.mjs original, num sistema de arquivos de mentira ----------
// arvore: { pacote: [caminhos relativos ao pacote] }; json: a saida do Semgrep.
function carregaJuiz(src, json, arvore, MP) {
  const trocas = [
    ['import { readFileSync, readdirSync } from "node:fs";', "const { readFileSync, readdirSync } = __fs;"],
    ['import { join } from "node:path";', "const { join } = __path;"],
    ['import { PONTOS, REGIOES_CLASSE, nomes, casoDe } from "./pontos.mjs";', "const { PONTOS, REGIOES_CLASSE, nomes, casoDe } = __pontos;"],
    ["const lista = (h, id) => h[id] ?? [];", "const __antes = JSON.parse(JSON.stringify(achados));\nconst lista = (h, id) => h[id] ?? [];"],
  ];
  let s = src;
  for (const [de, para] of trocas) { if (s.split(de).length !== 2) throw new Error("o classificar.mjs mudou de forma: " + de); s = s.replace(de, para); }
  s += "\nreturn { __antes, textos, classesP5, avisos, quebrados, semListasDeValidos, eRegistro, citaTodos, listaDeComparacoes, listaDeRotulos };";
  const arquivos = Object.entries(arvore).flatMap(([pac, fs]) => fs.map((f) => `/raiz/${pac}/${f}`));
  const entradas = (dir) => {
    const pre = dir.replace(/\/$/, "") + "/", nomes = new Map();
    for (const a of arquivos) if (a.startsWith(pre)) { const resto = a.slice(pre.length).split("/"); nomes.set(resto[0], nomes.get(resto[0]) || resto.length > 1); }
    return [...nomes].map(([name, eDir]) => ({ name, isDirectory: () => eDir }));
  };
  const saida = [];
  const r = new Function("__fs", "__path", "__pontos", "process", "console", s)(
    { readFileSync: () => JSON.stringify(json), readdirSync: (dir) => entradas(dir) },
    { join: (...p) => p.join("/").replace(/\/+/g, "/") },
    MP,
    { argv: ["node", "classificar.mjs", "/saida.json", "/raiz", "/pacotes"], exit: (c) => { throw new Error("exit " + c); } },
    { log: (x) => saida.push(String(x)), error: (x) => saida.push("ERRO " + x) });
  return { ...r, saida };
}

// o caminho de uma decisao, com as funcoes do proprio classificar.mjs (o rastro da pagina)
function rastroJuiz(J, MP, pac) {
  const h = JSON.parse(JSON.stringify(J.__antes[pac] || {}));
  const L = (id) => h[id] ?? [];
  const tx = (o) => J.textos[`${pac}|${o}`] ?? "";
  const P4 = MP.PONTOS.find((p) => p.id === "p4");
  const recusas = [...new Set([...L("p4-cond-validacao"), ...L("p4-cond-recusa")])];
  const naoConta = new Set([...recusas, ...L("p4-cond-fabrica")]);
  const ccSemLista = J.semListasDeValidos(pac, L("p4-cond-calc"), P4, J.listaDeComparacoes);
  const listaFora = L("p4-cond-calc").filter((o) => !ccSemLista.includes(o));
  const tiradasNaoConta = ccSemLista.filter((o) => naoConta.has(o));
  const registro = ccSemLista.filter((o) => !naoConta.has(o) && J.eRegistro(pac, o, P4));
  const condCalc = ccSemLista.filter((o) => !naoConta.has(o) && !J.eRegistro(pac, o, P4));
  const condValidacao = J.semListasDeValidos(pac, recusas, P4, J.listaDeComparacoes);
  const fabrica = [...new Set([...L("p4-switch-fabrica"), ...L("p4-cond-fabrica")])];
  const rotulosAntes = L("p4-switch-label").filter((l) => !fabrica.includes(l));
  const rotulos = J.semListasDeValidos(pac, rotulosAntes, P4, J.listaDeRotulos);
  const conjTodos = L("p4-conjunto").filter((o) => J.citaTodos(tx(o), P4));
  const conjuntos = L("p4-conjunto").filter((o) => !J.citaTodos(tx(o), P4));
  const instRecusa = [...new Set(L("p4-instanceof-recusa"))];
  const inst = L("p4-instanceof").filter((o) => !instRecusa.includes(o));
  const calculo = condCalc.length + inst.length + rotulos.length + conjuntos.length;
  const validacao = condValidacao.length + instRecusa.length;
  const alarme4 = L("p4-nome").length === 0;
  const loc = alarme4 ? "indeterminado" : calculo + validacao > 0 ? "espalhado" : "isolado";
  const sel = alarme4 ? "indeterminado" : calculo > 0 ? "condicional-no-calculo" : fabrica.length > 0 ? "condicional-unica" : "consulta";
  // P5
  const alarme5 = L("p5-nome").length + L("p5-config").length === 0;
  const classes = J.classesP5[pac] ?? new Map();
  const comNome = [...classes.keys()].some((c) => new RegExp(MP.REGIOES_CLASSE).test(c));
  const objEstrutura = classes.size >= 2 || comNome, objDados = classes.size === 1 && !comNome;
  const objNoMapa = [...classes.values()].flat().some((o) => /Map\.|\bput\s*\(|\bentry\s*\(/.test(tx(o)));
  const traducao = L("p5-traducao"), rot5 = L("p5-switch-label").filter((o) => !traducao.includes(o));
  const n = (id) => L(id).length;
  const estrutura = n("p5-enum-corpo") + n("p5-classe-regiao") + n("p5-switch-fabrica") + n("p5-mapa-funcao") + (objEstrutura ? 1 : 0);
  const condicional = rot5.length - n("p5-switch-fabrica");
  const forma = alarme5 ? "outro" : n("p5-enum-corpo") ? "enum-abstrato" : n("p5-classe-regiao") ? "classes"
    : n("p5-mapa") + n("p5-mapa-funcao") + (objNoMapa ? 1 : 0) ? "mapa" : condicional + n("p5-switch-fabrica") > 0 ? "switch" : n("p5-enum-dados") ? "enum-dados" : "outro";
  const prop = alarme5 ? "indeterminado" : estrutura > 0 ? "estrutura" : condicional > 0 ? "condicional"
    : n("p5-enum-dados") + n("p5-mapa") + n("p5-config") + (objDados ? 1 : 0) ? "dados" : "indeterminado";
  return { h, recusas, naoConta: [...naoConta], listaFora, tiradasNaoConta, registro, condCalc, condValidacao, fabrica, rotulosAntes, rotulos, conjTodos, conjuntos,
    instRecusa, inst, calculo, validacao, alarme4, loc, sel, alarme5, classes: [...classes.entries()], comNome, objEstrutura, objDados, objNoMapa, traducao, rot5, estrutura, condicional, forma, prop,
    quebrado: J.quebrados.has(pac), avisos: J.avisos[pac] || [] };
}

// o trecho da sugestao dentro de um arquivo que compila de cabeca (o que o editor mostra)
function arquivoDaSugestao(s) {
  if ((s.caminho || "").includes("resources")) return s.cod + "\n";
  const enumRegiao = /^\s*[A-Z_]+(\s*\(|\s*\{|,)/.test(s.cod) && !/^(case|class|record)/.test(s.cod);
  if (enumRegiao) return "package com.loja.lab;\n\npublic enum Teste {\n    " + s.cod + "\n    ;\n}\n";
  if (/^(case|default)/.test(s.cod)) return "package com.loja.lab;\n\npublic class Teste {\n    Object f(Object x) {\n        switch (x) {\n            " + s.cod + "\n        }\n        return null;\n    }\n}\n";
  if (/^(class|record)/.test(s.cod)) return "package com.loja.lab;\n\n" + s.cod + "\n";
  if (/^(static|int|Cliente|String)/.test(s.cod)) return "package com.loja.lab;\n\npublic class Teste {\n    " + s.cod + "\n}\n";
  return "package com.loja.lab;\n\npublic class Teste {\n    void f() {\n        " + s.cod + "\n    }\n}\n";
}
