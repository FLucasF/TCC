// ---------- cores do codigo ----------
const KW = {
  java: new Set("abstract boolean break case catch char class default do double else enum extends final for if implements import instanceof int interface long new null package private protected public record return static super switch this throw throws try var void when while true false yield Override".split(" ")),
  js: new Set("const let var function return if else for of in new import export from throw while do break continue typeof true false null undefined class extends default".split(" ")),
  bash: new Set("if then else elif fi for in do done while case esac function return exit set trap local echo printf".split(" ")),
};
function tokens(lang, linha, st) {
  const t = [], n = linha.length;
  let i = 0;
  const push = (a, b, c) => { if (b > a) t.push([a, b, c]); };
  if (lang === "yaml") {
    const com = linha.match(/^\s*#.*$/);
    if (com) { push(0, n, "s-com"); return t; }
    const k = linha.match(/^(\s*-?\s*)([\w-]+)(:)/);
    if (k) push(k[1].length, k[1].length + k[2].length, "s-key");
    const re = /'(?:[^']|'')*'|"(?:[^"\\]|\\.)*"/g;
    let m;
    while ((m = re.exec(linha))) push(m.index, m.index + m[0].length, "s-str");
    return t;
  }
  if (lang === "bash") {
    while (i < n) {
      const c = linha[i];
      if (c === "#" && (i === 0 || /\s/.test(linha[i - 1])) && !(i === 0 && linha.startsWith("#!"))) { push(i, n, "s-com"); break; }
      if (c === '"' || c === "'") { let j = i + 1; while (j < n && linha[j] !== c) j += linha[j] === "\\" && c === '"' ? 2 : 1; push(i, j + 1, "s-str"); i = j + 1; continue; }
      if (c === "$") { const m = linha.slice(i).match(/^\$(\{[^}]*\}|\w+|#|@|\?)/); if (m) { push(i, i + m[0].length, "s-key"); i += m[0].length; continue; } }
      if (/[A-Za-z_]/.test(c)) { let j = i; while (j < n && /[\w-]/.test(linha[j])) j++; if (KW.bash.has(linha.slice(i, j))) push(i, j, "s-kw"); i = j; continue; }
      i++;
    }
    return t;
  }
  const kw = KW[lang] || KW.java;
  while (i < n) {
    if (st.bloco) { const f = linha.indexOf("*/", i); const ate = f < 0 ? n : f + 2; push(i, ate, "s-com"); if (f >= 0) st.bloco = false; i = ate; continue; }
    if (st.texto) { const f = linha.indexOf('"""', i); const ate = f < 0 ? n : f + 3; push(i, ate, "s-str"); if (f >= 0) st.texto = false; i = ate; continue; }
    const c = linha[i], d = linha[i + 1];
    if (c === "/" && d === "/") { push(i, n, "s-com"); break; }
    if (c === "/" && d === "*") { st.bloco = true; continue; }
    if (c === '"' && linha.startsWith('"""', i)) { st.texto = true; push(i, i + 3, "s-str"); i += 3; continue; }
    if (c === '"' || c === "'" || (c === "`" && lang === "js")) { let j = i + 1; while (j < n && linha[j] !== c) j += linha[j] === "\\" ? 2 : 1; push(i, Math.min(j + 1, n), "s-str"); i = j + 1; continue; }
    if (/[A-Za-z_$]/.test(c)) { let j = i; while (j < n && /[\w$]/.test(linha[j])) j++; if (kw.has(linha.slice(i, j))) push(i, j, "s-kw"); i = j; continue; }
    if (/\d/.test(c)) { let j = i; while (j < n && /[\d._]/.test(linha[j])) j++; push(i, j, "s-num"); i = j; continue; }
    i++;
  }
  return t;
}

// ---------- o visor de codigo ----------
// atual: [[a,b], ...] faixas de linhas (1 = primeira); marcas: [{l1,c1,l2,c2,cls}] (colunas do Semgrep: 1 = primeira, c2 exclusiva)
// linhas: {n: "regiao erro ..."}; notas: {n: {txt, cls}}
function codigo(o) {
  const texto = o.texto.replace(/\n$/, "");
  const ls = texto.split("\n");
  const ini = o.inicio || 1;
  const caixa = el("div", { class: "codigo" + (o.baixo ? " baixo" : "") });
  if (o.titulo) caixa.append(el("div", { class: "cab", html: o.titulo }));
  const corpo = el("div", { class: "corpo" });
  const st = {};
  const atual = new Set();
  for (const [a, b] of o.atual || []) for (let k = a; k <= b; k++) atual.add(k);
  let foco = null;
  ls.forEach((linha, idx) => {
    const n = idx + ini;
    const syn = new Array(linha.length).fill(""), mk = new Array(linha.length).fill("");
    for (const [a, b, c] of tokens(o.lang || "java", linha, st)) for (let k = a; k < b; k++) syn[k] = c;
    for (const m of o.marcas || []) {
      if (n < m.l1 || n > m.l2) continue;
      const a = n === m.l1 ? m.c1 - 1 : 0, b = n === m.l2 ? m.c2 - 1 : linha.length;
      for (let k = Math.max(0, a); k < Math.min(linha.length, b); k++) mk[k] = m.cls;
    }
    const src = el("span", { class: "src" });
    if (!linha.length) src.append("​");
    let k = 0;
    while (k < linha.length) {
      let j = k + 1;
      while (j < linha.length && syn[j] === syn[k] && mk[j] === mk[k]) j++;
      const cls = [syn[k], mk[k]].filter(Boolean).join(" ");
      src.append(cls ? el("span", { class: cls }, linha.slice(k, j)) : linha.slice(k, j));
      k = j;
    }
    const classes = ["ln"];
    if (atual.has(n)) classes.push("atual");
    if (o.linhas && o.linhas[n]) classes.push(o.linhas[n]);
    const div = el("div", { class: classes.join(" "), "data-n": n }, el("span", { class: "num" }, n), src);
    const nota = o.notas && o.notas[n];
    if (nota) div.append(el("span", { class: "nota " + (nota.cls || ""), html: nota.txt }));
    if (foco === null && (atual.has(n) || (o.foco && o.foco === n))) foco = div;
    corpo.append(div);
  });
  if (foco === null && (o.marcas || []).length) {
    const prim = Math.min(...o.marcas.map((m) => m.l1));
    foco = corpo.querySelector(`[data-n="${prim}"]`);
  }
  caixa.append(corpo);
  // depois que a caixa entra na pagina: rola ate a linha atual (a 1/3 da altura)
  if (foco) setTimeout(() => {
    const alvo = foco.offsetTop - caixa.clientHeight / 3;
    caixa.scrollTop = Math.max(0, alvo);
  }, 0);
  return caixa;
}

const STEPPERS = {};
let ABA_ATUAL = null;
function stepper(host, { chave, aba, passos, desenha }) {
  host.replaceChildren();
  const bAnt = el("button", { title: "passo anterior (←)", "aria-label": "anterior" }, "◀");
  const bIni = el("button", { title: "primeiro passo", "aria-label": "primeiro" }, "⏮");
  const bFim = el("button", { title: "último passo", "aria-label": "último" }, "⏭");
  const bProx = el("button", { class: "prox", title: "próximo passo (→)" }, "próximo ▶");
  const t = el("div", { class: "t" }), n = el("div", { class: "n" }), barra = el("i");
  const ctrl = el("div", { class: "controles" }, bIni, bAnt,
    el("div", { class: "info" }, t, n, el("div", { class: "barra" }, barra)),
    el("span", { class: "dica" }, el("kbd", null, "←"), " ", el("kbd", null, "→")), bProx, bFim);
  const corpo = el("div");
  host.append(ctrl, corpo);
  let i = Math.min(Math.max(0, MEM[chave] ?? 0), passos.length - 1);
  const api = {
    ir(k) {
      i = Math.max(0, Math.min(passos.length - 1, k));
      lembra(chave, i);
      t.textContent = passos[i].t || "";
      n.textContent = `passo ${i + 1} de ${passos.length}`;
      barra.style.width = ((i + 1) / passos.length * 100) + "%";
      bAnt.disabled = bIni.disabled = i === 0;
      bProx.disabled = bFim.disabled = i === passos.length - 1;
      corpo.replaceChildren();
      desenha(passos[i], i, corpo);
    },
    prox() { if (i < passos.length - 1) this.ir(i + 1); },
    ant() { if (i > 0) this.ir(i - 1); },
    get i() { return i; },
  };
  bAnt.onclick = () => api.ant(); bProx.onclick = () => api.prox();
  bIni.onclick = () => api.ir(0); bFim.onclick = () => api.ir(passos.length - 1);
  STEPPERS[aba] = api;
  api.ir(i);
  return api;
}
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  const s = STEPPERS[ABA_ATUAL];
  if (!s) return;
  if (e.key === "ArrowRight") { s.prox(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { s.ant(); e.preventDefault(); }
});

const unicas = (lista) => { const vis = new Set(); return lista.filter((x) => { const k = x.f + ":" + x.l1 + ":" + x.l2; if (vis.has(k)) return false; vis.add(k); return true; }); };
const FORMAS = ["$X == $C", "$C == $X", "$X != $C", "$C != $X", "$C.equals($X)", "$X.equals($C)", "$X.equalsIgnoreCase($C)", "$C.equalsIgnoreCase($X)", "Objects.equals($X, $C)", "Objects.equals($C, $X)", "$X.compareTo($C)", "$C.compareTo($X)"];

// o regex de um metavariable-regex, lido do bloco da regra (como o YAML diz)
function regexDoBloco(bloco, mv) {
  const ls = bloco.linhas;
  for (let k = 0; k < ls.length; k++) {
    const inl = ls[k].match(/\{ metavariable: (\$\w+), regex: (['"])(.*)\2 \}/);
    if (inl && inl[1] === mv) return inl[2] === "'" ? inl[3].replace(/''/g, "'") : JSON.parse('"' + inl[3] + '"');
    if (ls[k].trim() === `metavariable: ${mv}`) {
      const r = ls[k + 1].match(/regex: '(.*)'$/);
      if (r) return r[1].replace(/''/g, "'");
    }
  }
  throw new Error(`sem metavariable-regex ${mv} em ${bloco.id}`);
}
// a linha (0 = primeira) do bloco que contem um texto
function lnb(bloco, txt, desde = 0) {
  for (let k = desde; k < bloco.linhas.length; k++) if (bloco.linhas[k].includes(txt)) return k;
  throw new Error(`"${txt}" nao esta em ${bloco.id}`);
}

// o visor de varios arquivos do laboratorio, com marcas por arquivo
function visorLab({ arquivos, marcas: ms = [], linhas = {}, notas = {}, versao = "limpa", titulo }) {
  const box = el("div", { class: "pilha" });
  for (const f of arquivos) {
    const doArq = (x) => !x.f || x.f === f;
    const mk = ms.filter(doArq);
    box.append(codigo({
      texto: arqLab(f, versao), lang: "java", baixo: arquivos.length > 1,
      titulo: `<b>${esc(f)}</b> ${versao === "limpa" ? "· a cópia limpa (o que o Semgrep lê)" : "· o original (com comentários)"}${titulo ? " · " + titulo : ""}`,
      marcas: mk, linhas: linhas[f] || {}, notas: notas[f] || {},
    }));
  }
  return box;
}

// ui-abas-2.js: o laboratorio das regras (as 21 regras do P4 e do P5, uma a uma).
"use strict";

const LISTA_P4 = ["p4-cond-calc", "p4-cond-validacao", "p4-cond-recusa", "p4-cond-fabrica", "p4-instanceof", "p4-instanceof-recusa", "p4-switch-label", "p4-switch-fabrica", "p4-conjunto", "p4-nome"];
const LISTA_P5 = ["p5-nome", "p5-enum-corpo", "p5-enum-dados", "p5-classe-regiao", "p5-mapa", "p5-mapa-funcao", "p5-config", "p5-objeto", "p5-switch-label", "p5-switch-fabrica", "p5-traducao"];

function abaRegras(sec) {
  sec.append(el("h2", null, "As regras, uma a uma (o laboratório)"),
    el("p", { class: "lead", html: "Escolha uma regra. Os passos andam pelas linhas do YAML <b>exatamente como está no <code>regras.yml</code></b>, e mostram o que cada linha fez no pacote inventado. Regras <span class=\"pill java\">java</span>: o que o Semgrep real achou em cada pedaço. Regras <span class=\"pill texto\">texto</span>: rodam aqui, ao vivo, e você pode editar o código." }));
  const lista = el("div", { class: "painel lista-regras" });
  const area = el("div");
  sec.append(el("div", { class: "grade-lab" }, lista, area));
  const msg = (id) => (BL[id].texto.match(/message: (.*)/) || [, ""])[1];
  const botoes = {};
  const escolhe = (id) => {
    lembra("regra", id);
    Object.entries(botoes).forEach(([k, b]) => b.classList.toggle("ativa", k === id));
    montaRegra(area, id);
  };
  for (const [nome, ids] of [["P4: o clube", LISTA_P4], ["P5: o seguro por região", LISTA_P5]]) {
    lista.append(el("div", { class: "grupo" }, nome));
    for (const id of ids) {
      const b = el("button", { title: msg(id), onclick: () => escolhe(id) }, el("span", { class: "mono" }, id), el("span", { class: "pill " + (BL[id].lang === "regex" ? "texto" : "java") }, BL[id].lang === "regex" ? "texto" : "java"));
      botoes[id] = b;
      lista.append(b);
    }
  }
  escolhe(MEM.regra && BL[MEM.regra] ? MEM.regra : "p4-cond-calc");
}

function montaRegra(area, id) {
  area.replaceChildren();
  const b = BL[id];
  const passos = [...passosCabecalho(b), ...(b.lang === "regex" ? passosTexto(b) : passosJava(b))];
  stepper(area, {
    chave: "regra:" + id, aba: "regras", passos,
    desenha: (p, i, corpo) => {
      const y = p.y || [0, 0];
      const esquerda = [codigo({ texto: b.texto, lang: "yaml", titulo: `<b>${id}</b> · regras.yml, linha ${b.inicio}`, inicio: 1, atual: [[y[0] + 1, y[1] + 1]], baixo: true })];
      if (p.vista) esquerda.push(p.vista());
      duasColunas(corpo, esquerda, explicacao(p, p.extra ? p.extra() : []));
    },
  });
}

// ---------- os dois primeiros passos de toda regra ----------
function passosCabecalho(b) {
  const msg = (b.texto.match(/message: (.*)/) || [, ""])[1];
  const lang = b.lang === "regex"
    ? "<li><code>languages: [regex]</code>: <b>não</b> monta árvore nenhuma. Procura um <b>texto</b> no arquivo inteiro, por uma expressão regular. Serve onde a árvore não ajuda (o <code>case</code> do Java 21, nomes soltos, arquivos de configuração).</li>"
    : "<li><code>languages: [java]</code>: o Semgrep monta a <b>árvore</b> do Java e procura <b>formas</b> de código (um <code>if</code>, uma comparação, um <code>new</code>).</li>";
  const iPaths = lnb(b, "paths:");
  const java = b.include.endsWith(".java");
  return [
    {
      t: "O cabeçalho", y: [0, 3],
      txt: `<ul><li><code>- id: ${b.id}</code>: o nome. O ponto (<code>${b.id.slice(0, 2)}</code>) e o tipo (<code>${b.id.slice(3)}</code>). O classificador junta os achados por esse nome.</li>${lang}<li><code>severity: INFO</code>: obrigatório no formato do Semgrep. Aqui não quer dizer nada: nenhuma regra acusa um erro, todas só <b>marcam</b>.</li><li><code>message</code>: um texto livre que vai junto de cada achado. É a melhor documentação da regra: <i>${esc(msg)}</i>.</li></ul>`,
    },
    {
      t: "paths: onde procurar", y: [iPaths, iPaths],
      txt: java
        ? "<p>Só arquivos que casam com <code>**/src/main/**/*.java</code>: qualquer pasta, depois <code>src/main</code>, qualquer pasta, terminando em <code>.java</code>. Os 7 arquivos do laboratório passam.</p>"
        : "<p>Só arquivos em <code>src/main/resources</code>: <code>application.properties</code>, <code>application.yml</code>. Esta é a <b>única</b> regra que olha configuração, e não olha <code>.java</code>. Nenhum arquivo do laboratório passa: use o \"experimente\" no fim.</p>",
      aconteceu: java ? Object.keys(LAB.arquivos).map((f) => `<code>${f}</code> <span class="sim">✓</span>`).join(" · ") : "nenhum arquivo do laboratório está em <code>src/main/resources</code>.",
    },
  ];
}

// =====================================================================
function passosJava(b) {
  const id = b.id;
  const linhasRegiao = (lista) => { const o = {}; for (const r of lista) { o[r.f] = o[r.f] || {}; for (let k = r.l1; k <= r.l2; k++) o[r.f][k] = "regiao"; } return o; };
  const cmpTodas = real("p4-cond-calc");
  const fim = b.linhas.length - 1;
  const iCmp = (desde) => lnb(b, "- pattern-either:", desde);
  const regInfo = (lista, mv) => tabela(["arquivo:linhas", "o que o " + mv + " guardou"], lista.map((r) => [`${r.f}:${r.l1}${r.l2 > r.l1 ? "–" + r.l2 : ""}`, `<code>${esc(r.mv[mv] ?? "")}</code>`]));
  const passoCmp = (desde, arquivos, extraTxt = "") => ({
    t: "As comparações que nomeiam um nível", y: [iCmp(desde), fim],
    vista: () => visorLab({ arquivos, marcas: marcas(cmpTodas, "m-cand") }),
    txt: `<p>Este <code>pattern-either</code> é <b>o mesmo</b> da <code>p4-cond-calc</code>, copiado pelo gerador: as 12 formas com o filtro do <code>$C</code>, mais os 25 textos por extenso. Sozinho, ele acha as mesmas 6 comparações (em azul). Veja a <code>p4-cond-calc</code> para o detalhe.</p>${extraTxt}`,
    aconteceu: `6 comparações em Condicoes.java: linhas ${cmpTodas.map((x) => x.l1).join(", ")}.`,
  });
  const passoFim = (arquivos, lnsRegiao, txt, quiz) => {
    const r = real(id);
    return {
      t: "O resultado: E das condições", y: [lnb(b, "patterns:"), fim],
      vista: () => visorLab({ arquivos, linhas: lnsRegiao || {}, marcas: marcas(r, "m-ok"), notas: Object.fromEntries(arquivos.map((f) => [f, Object.fromEntries(r.filter((x) => x.f === f).map((x) => [x.l1, { txt: "✓ " + id, cls: "ok" }]))])) }),
      txt, aconteceu: `o Semgrep real marcou ${r.length === 1 ? "1 linha" : r.length + " linhas"}: ${r.map((x) => `${x.f}:${x.l1}`).join(", ")}.`, quiz,
    };
  };

  if (id === "p4-cond-calc") {
    const iE = lnb(b, "pattern-either:"), iP = lnb(b, "- patterns:"), iF0 = lnb(b, "pattern: $X == $C"), iFU = lnb(b, "pattern: $C.compareTo($X)");
    const iM = lnb(b, "- metavariable-regex:"), iL0 = lnb(b, 'pattern: $X.equals("BRONZE")');
    const cc = regexDoBloco(b, "$C");
    const todas = FORMAS.flatMap((f, k) => dec("form-" + k, "Condicoes.java").map((x) => ({ ...x, forma: f })));
    const cand = unicas(todas);

  if (id === "p4-cond-validacao") {

  if (id === "p5-objeto") {

        txt: "<p>Quase todo <code>new</code> do laboratório tem um número ou um texto como primeiro argumento (<code>new BigDecimal(\"0.010\")</code>, <code>new IllegalArgumentException(\"PEDIDO_INVALIDO\")</code>): o <code>$R</code> não é região, e cai. Sobram os dois <code>Map.of</code> de Tabelas.java.</p>",
        aconteceu: `ficaram ${passaR.map((x) => `${x.f}:${x.l1} ($R = ${esc(x.mv.$R)}, $T = ${esc(x.mv.$T)})`).join(" e ")}.`,

}

function tabelaPedacos(linhas, achado) {
  const t = el("table", { class: "t" });
  t.append(el("tr", null, el("th", null, "pedaço"), el("th", null, "o que quer dizer"), achado ? el("th", null, "casou com") : null));
  for (const l of linhas) {
    const pad = `padding-left:${6 + l.nivel * 14}px`;
    if (l.cab) { t.append(el("tr", { class: "cab-ramo" }, el("td", { colspan: achado ? 3 : 2, style: pad }, "— " + l.txt))); continue; }
    let casou = null;
    if (achado) {
      if (l.flag) casou = el("td", { class: "mini" }, "(muda o jeito de ler)");
      else { const v = achado.grupos[l.g]; casou = el("td", { class: v === undefined ? "mini" : "mono" }, v === undefined ? "não participou" : v === "" ? "(nada: ok)" : JSON.stringify(v)); }
    }
    const tr = el("tr", { class: achado && !l.flag && achado.grupos[l.g] === undefined ? "nao-part" : null },
      el("td", { style: pad, class: "ped" }, el("code", null, l.re.length > 90 ? l.re.slice(0, 87) + "…" : l.re)), el("td", { html: (l.grupo ? "<b>grupo:</b> " : "") + l.txt }), casou);
    t.append(tr);
  }
  return el("div", { class: "tabela-rolagem", style: "max-height:420px" }, t);
}

function passosTexto(b) {
  const id = b.id, info = REGRAS_TEXTO[id], ped = PED[id];
  const iRe = lnb(b, "pattern-regex:");
  const rodaArq = (f, versao = "limpa") => rodaRegex(b, ped, arqLab(f, versao)).achados.map((a) => ({ ...a, f }));
  const passa = (f) => passaPaths(b.include, "src/main/java/com/loja/lab/" + f);
  const achados = Object.keys(LAB.arquivos).filter(passa).flatMap((f) => rodaArq(f));
  const arqs = info.arquivos.length ? info.arquivos : [];
  const passos = [
    { t: "A expressão, pedaço por pedaço", y: [iRe, iRe],
      txt: `<p>${info.intro}</p><p>A expressão inteira está na linha ${iRe + 1}. A tabela a abriu em pedaços, na ordem em que o regex os testa. Um <b>grupo</b> com ramos é um <b>ou</b> (<code>(?:a|b)</code>); um pedaço com <code>?</code> no fim é opcional.</p>`,
      extra: () => [tabelaPedacos(montaNomeado(ped).linhas, null)] },
  ];
  // rodar no laboratorio
  passos.push({
    t: "Rodou no laboratório", y: [iRe, iRe],
    estado: { sel: 0 },
    vistaDin: true,
    txt: achados.length
      ? `<p>Rodou agora, no seu navegador, nos 7 arquivos (a cópia limpa). ${achados.length === 1 ? "Um achado" : achados.length + " achados"}. Clique num achado para ver o que <b>cada pedaço</b> casou.</p>`
      : "<p>Rodou agora, nos 7 arquivos do laboratório: <b>nenhum achado</b>. O laboratório não tem esse jeito de escrever. Use o \"experimente\" (último passo) para ver a regra casar.</p>",
  });
  if (info.fora.length) passos.push({
    t: "O que ficou de fora, e por quê", y: [iRe, iRe],
    vista: () => {
      const fs = [...new Set(info.fora.map((x) => x.f))];
      const versao = id === "p4-nome" && MEM.originalNome ? "original" : "limpa";
      const ms = fs.flatMap((f) => rodaArq(f, versao)).map((a) => ({ ...a, cls: "m-hit" }));
      return visorLab({ arquivos: fs, marcas: ms, linhas: Object.fromEntries(fs.map((f) => [f, Object.fromEntries(info.fora.filter((x) => x.f === f).map((x) => [x.l, "erro"]))])), versao });
    },
    txt: "<ul>" + info.fora.map((x) => `<li><b>${x.f}:${x.l}</b>: ${x.txt}</li>`).join("") + "</ul>",
    extra: () => id === "p4-nome" ? [el("button", { class: "b" + (MEM.originalNome ? " on" : ""), onclick: () => { lembra("originalNome", !MEM.originalNome); STEPPERS.regras.ir(STEPPERS.regras.i); } }, MEM.originalNome ? "ver a cópia limpa" : "ver o original (com o comentário)")] : [],
  });
  passos.push({ t: "Experimente", y: [iRe, iRe], editor: true,
    txt: "<p>Escreva ou cole código. A página faz o que o <code>detect.sh</code> faz: tira os comentários (com o <code>sem-comentarios.mjs</code> original), confere o <code>paths</code> e roda a regra. Os botões trazem exemplos; o rótulo diz o que a regra faz com cada um e por quê.</p>" });

  // os passos que desenham algo especial
  for (const p of passos) {
    if (p.vistaDin) {
      p.vista = () => {
        const sel = achados[p.estado.sel];
        if (!sel && !arqs.length) return el("div", { class: "caixa", html: "Esta regra não olha nenhum dos arquivos do laboratório." });
        const f = sel ? sel.f : arqs[0];
        return visorLab({ arquivos: [f], marcas: achados.filter((a) => a.f === f).map((a) => ({ ...a, cls: a === sel ? "m-hitsel" : "m-hit" })) });
      };
      p.extra = () => {
        if (!achados.length) return [];
        const lst = el("div", { class: "linha-botoes" });
        achados.forEach((a, k) => lst.append(el("button", { class: "b" + (k === p.estado.sel ? " on" : ""), onclick: () => { p.estado.sel = k; STEPPERS.regras.ir(STEPPERS.regras.i); } }, `${a.f}:${a.l1}`)));
        const sel = achados[p.estado.sel];
        return [el("div", { class: "caixa aconteceu" }, el("div", { class: "rotulo" }, `▶ achado ${p.estado.sel + 1} de ${achados.length}: ${sel.f}:${sel.l1}`), el("div", { class: "ped" }, el("code", null, sel.txt.length > 160 ? sel.txt.slice(0, 157) + "…" : sel.txt)), lst),
          tabelaPedacos(rodaRegex(b, ped, arqLab(sel.f)).linhas, sel)];
      };
    }
    if (p.editor) {
      p.vista = null;
      p.extra = () => [editorRegra(b, ped, info)];
    }
  }
  return passos;
}

function editorRegra(b, ped, info) {
  const box = el("div", { class: "pilha" });
  const caminho = el("input", { type: "text", value: info.caminho || "src/main/java/com/loja/lab/Teste.java" });
  const area = el("textarea", { spellcheck: "false" });
  area.value = arquivoDaSugestao(info.sugestoes[0] || { cod: "" , caminho: info.caminho });
  if (info.sugestoes[0]) caminho.value = info.sugestoes[0].caminho || caminho.value;
  const saida = el("div", { class: "pilha" });
  const roda = () => {
    saida.replaceChildren();
    const c = caminho.value.trim();
    if (!passaPaths(b.include, c)) { saida.append(el("div", { class: "caixa aviso", html: `O caminho <code>${esc(c)}</code> não passa no <code>paths</code> desta regra (<code>${esc(b.include)}</code>): o Semgrep nem olharia este arquivo.` })); return; }
    const ext = c.toLowerCase().split(".").pop();
    const limpo = ext === "java" ? SC.semComentariosJava(area.value) : ["properties", "yml", "yaml"].includes(ext) ? SC.semComentariosLinha(area.value) : area.value;
    const r = rodaRegex(b, ped, limpo);
    saida.append(codigo({ texto: limpo || " ", lang: ext === "java" ? "java" : "yaml", titulo: "<b>a cópia limpa</b> · o que a regra lê", marcas: r.achados.map((a, k) => ({ ...a, cls: k === 0 ? "m-hitsel" : "m-hit" })), baixo: true }));
    saida.append(el("div", { class: "caixa " + (r.achados.length ? "certo" : ""), html: r.achados.length ? `<b>${r.achados.length} achado(s)</b>: linha ${r.achados.map((a) => a.l1).join(", ")}. A tabela mostra o primeiro.` : "<b>Nenhum achado.</b>" }));
    if (r.achados.length) saida.append(tabelaPedacos(r.linhas, r.achados[0]));
  };
  let t = null;
  const agenda = () => { clearTimeout(t); t = setTimeout(roda, 120); };
  area.addEventListener("input", agenda); caminho.addEventListener("input", agenda);
  const sug = el("div", { class: "pilha" });
  for (const s of info.sugestoes) sug.append(el("div", null,
    el("button", { class: "b", onclick: () => { area.value = arquivoDaSugestao(s); caminho.value = s.caminho || "src/main/java/com/loja/lab/Teste.java"; roda(); } }, s.cod),
    el("span", { class: "mini", html: ` ${s.casa ? '<span class="sim">casa</span>' : '<span class="nao">não casa</span>'}: ${esc(s.por)}` })));
  box.append(el("div", { class: "rotulo" }, "exemplos"), sug, el("div", { class: "rotulo" }, "caminho do arquivo (relativo ao pacote)"), caminho, el("div", { class: "rotulo" }, "o código"), area, saida);
  setTimeout(roda);
  return box;
}

  stepper(host, {

function experimenteGerador() {
  const box = el("div", { class: "painel", style: "margin-top:14px" });
  box.append(el("h3", { style: "margin-top:0" }, "Experimente: mude o P4 no pontos.mjs e gere de novo"),
    H("<p>Isto roda o gerador original com um <code>pontos.mjs</code> alterado <b>só aqui na página</b>, e mostra o que mudaria no <code>regras.yml</code>. Tente acrescentar <code>PLATINA</code> aos casos, ou <code>PLATINUM=PLATINA</code> aos sinônimos.</p>"));
  const casos = el("input", { type: "text", value: P4.lista.filter((n) => !(n in (MP.PONTOS[3].sinonimos || {}))).join(", ") });
  const sin = el("input", { type: "text", value: Object.entries(MP.PONTOS[3].sinonimos).map(([k, v]) => `${k}=${v}`).join(", ") });
  const cls = el("input", { type: "text", value: MP.PONTOS[3].classes });
  const saida = el("div", { class: "pilha", style: "margin-top:10px" });
  const gera = () => {
    saida.replaceChildren();
    const lista = casos.value.split(",").map((s) => s.trim()).filter(Boolean);
    const sinonimos = Object.fromEntries(sin.value.split(",").map((s) => s.trim()).filter(Boolean).map((s) => s.split("=").map((x) => x.trim())));
    const mod = { ...MP, PONTOS: MP.PONTOS.map((p) => (p.id === "p4" ? { ...p, casos: lista, sinonimos, classes: cls.value.trim() } : p)) };
    let G2;

// a linha (1 = primeira) de um texto que contem um trecho, a partir de uma linha
function ln(texto, sub, desde = 1) {
  const ls = texto.split("\n");
  for (let k = desde - 1; k < ls.length; k++) if (ls[k].includes(sub)) return k + 1;
  throw new Error("nao achei no classificar.mjs: " + sub);
}

        aconteceu: `cálculo = ${r.condCalc.length} + ${r.inst.length} + ${r.rotulos.length} + ${r.conjuntos.length} = <b>${r.calculo}</b><br>validação = ${r.condValidacao.length} + ${r.instRecusa.length} = <b>${r.validacao}</b>` },
      { t: "O alarme", l: L("// Alarme: nenhum nome de caso", 'if (conta(h, `${p}-nome`) === 0)'), txt: "<p>Se o pacote inteiro não cita <b>nenhum</b> nome do ponto, o agente usou outros nomes, e as regras não veriam um remendo: a resposta é <code>indeterminado</code>, nunca um <code>isolado</code> falso.</p>",
        aconteceu: r.alarme4 ? `nenhum nome do P4 em ${pac}: <b>o alarme dispara</b>, P4 indeterminado (é um pacote do P5)` : `${r.h["p4-nome"]?.length || 0} citações de nome do P4: o alarme fica quieto.` },
      { t: "A decisão do P4", l: L("const localizacao =", "return [localizacao, selecao];"), txt: "<ul><li><b>localização</b>: sobrou cálculo ou validação? <code>espalhado</code>. Senão, <code>isolado</code>.</li><li><b>seleção</b>: sobrou cálculo? <code>condicional-no-calculo</code>. Senão, houve fábrica? <code>condicional-unica</code>. Senão, <code>consulta</code>.</li></ul><p>Repare: a validação faz o pacote ficar <code>espalhado</code>, mas não mexe na seleção (régua §2.1 e §2.2).</p>",
        aconteceu: `P4 de ${pac}: <b>${r.loc}</b> e <b>${r.sel}</b>.` + comRegua("P4", r.loc, r.sel) },
      { t: "P5: o alarme", l: L("function negativo(pac, h) {", 'if (conta(h, "p5-nome") + conta(h, "p5-config") === 0)'), txt: "<p>O mesmo alarme, para as regiões; as taxas num arquivo de configuração também contam como nome.</p>", aconteceu: r.alarme5 ? `nenhuma região em ${pac}: P5 <b>outro</b> e <b>indeterminado</b> (é um pacote do P4)` : "há nomes de região: segue." },
      { t: "P5: os objetos por região", l: L("// Objetos por regiao:", "const objNoMapa ="), txt: "<p>As classes que o <code>p5-objeto</code> capturou. <b>Uma classe só</b>, sem nome de região, para todas: é uma tabela, <b>dado</b>. <b>Duas ou mais</b>, ou com nome de região (<code>SeguroNorte</code>): <b>estrutura</b>.</p>",
        aconteceu: r.classes.length ? `classes criadas por região: ${r.classes.map(([c, os]) => `<code>${esc(c)}</code> (${os.length}x)`).join(", ")} → ${r.objEstrutura ? "<b>estrutura</b>" : r.objDados ? "<b>dado</b>" : "—"}${r.objNoMapa ? " (num mapa)" : ""}` : "nenhum objeto por região." },
      { t: "P5: tradução, estrutura e condicional", l: L('const traducao = new Set(lista(h, "p5-traducao"));', "const condicional ="), txt: "<p>Os rótulos que só <b>traduzem</b> o texto para a constante não contam como decisão. <b>estrutura</b> soma corpo de enum, classe por região, <code>switch</code> que devolve objeto, mapa de funções e os objetos de estrutura. <b>condicional</b> são os rótulos que sobram, menos os de fábrica.</p>",
        aconteceu: `estrutura = <b>${r.estrutura}</b>; condicional = <b>${r.condicional}</b>` },
      { t: "A decisão do P5", l: L("const forma = conta(h, \"p5-enum-corpo\")", "return [forma, proporcao];"), txt: "<p>A <b>forma</b> segue uma ordem de prioridade: corpo de enum, classe, mapa, <code>switch</code>, enum de dados, outro. A <b>proporção</b>: qualquer estrutura é <code>estrutura</code>; senão, condicional; senão, algum dado (enum, mapa, configuração, objeto de classe única) é <code>dados</code>.</p>",
        aconteceu: `P5 de ${pac}: <b>${r.forma}</b> e <b>${r.prop}</b>.` + comRegua("P5", r.forma, r.prop) },
      { t: "Pacote sem código", l: L("const pacotes = readdirSync", "for (const pac of pacotes) if (!temJava"), txt: "<p>Um pacote sem nenhum <code>.java</code> na cópia limpa não foi medido (o projeto não foi achado): ganha o aviso <code>sem-codigo</code>, que faz o <code>verify.mjs</code> recusar o lote, em vez de a falta virar zero na nota. Veio do ensaio de 10/10.</p>" },
      { t: "A linha do CSV", l: L("console.log([", "console.log([pac, ...respostas"), txt: "<p>Uma linha por pacote: as 10 respostas, a <b>evidência</b> (o que contou, com a primeira linha de cada regra: é o que se confere numa discordância) e os avisos. As respostas do P1 ao P3 também saem, pela mesma função do P4.</p>",
        aconteceu: `<code style="word-break:break-all">${esc(linhaCsv)}</code>`,
        extra: () => [H(`<p class="mini">${pac === "ZZL1" ? "" : "P1 a P3 saem indeterminado nos exercícios: os trechos não têm entrega, cupom nem pagamento, e o alarme dispara."}</p>`)] },
    ];
    stepper(host, {
      chave: "juiz:" + pac, aba: "juiz", passos,
      desenha: (p, i, corpo) => {
        const esq = [codigo({ texto: SRC, lang: "js", titulo: "<b>classificar.mjs</b> · TCC_V5/evaluation/tools/semgrep", atual: [p.l] })];
        esq.push(codigo({ texto: arqs[principal], lang: "java", titulo: `<b>${esc(principal)}</b> · ${pac}: ${esc(titulo)} (a cópia limpa)`, baixo: true }));
        duasColunas(corpo, esq, explicacao(p, p.extra ? p.extra() : []));
      },
    });
  };
  roda(MEM.cenarioJuiz && CENARIOS[MEM.cenarioJuiz] ? MEM.cenarioJuiz : "EXJ02");
}

// ---- ui-main.js ----
// ui-main.js: as abas e o tema.
"use strict";

const ABAS = [
  { id: "mapa", nome: "0 · O mapa", init: abaMapa },
  { id: "zero", nome: "1 · Semgrep do zero", init: abaZero },
  { id: "pontos", nome: "2 · pontos.mjs", init: abaPontos },
  { id: "gerador", nome: "3 · gerar-regras.mjs", init: abaGerador },
  { id: "regras", nome: "4 · As regras", init: abaRegras },
  { id: "detect", nome: "5 · detect.sh", init: abaDetect },
  { id: "copia", nome: "6 · copia-limpa.mjs", init: abaCopia },
  { id: "semcom", nome: "7 · sem-comentarios.mjs", init: abaSemCom },
  { id: "juiz", nome: "8 · O juiz", init: abaJuiz },
  { id: "auto", nome: "9 · Autoavaliação", init: abaAuto },
];
const SECOES = {}, BOTOES = {}, PRONTAS = new Set();

function mostraAba(id) {
  if (!SECOES[id]) id = "mapa";
  ABA_ATUAL = id;
  lembra("aba", id);
  for (const a of ABAS) { SECOES[a.id].classList.toggle("ativa", a.id === id); BOTOES[a.id].classList.toggle("ativa", a.id === id); }
  if (!PRONTAS.has(id)) {
    PRONTAS.add(id);
    try { ABAS.find((a) => a.id === id).init(SECOES[id]); }
    catch (e) { SECOES[id].append(el("div", { class: "caixa aviso" }, "Erro ao montar esta aba: " + e.message)); console.error(e); }
  }
  BOTOES[id].scrollIntoView({ block: "nearest", inline: "nearest" });
  window.scrollTo({ top: 0 });
}

function aplicaTema(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

(function inicia() {
  const faixa = document.querySelector("nav.abas .faixa");
  const main = document.querySelector("main");
  for (const a of ABAS) {
    BOTOES[a.id] = el("button", { onclick: () => mostraAba(a.id) }, a.nome);
    faixa.append(BOTOES[a.id]);
    SECOES[a.id] = el("section", { class: "aba", id: "aba-" + a.id });
    main.append(SECOES[a.id]);
  }
  const temas = ["auto", "light", "dark"], nomes = { auto: "tema: automático", light: "tema: claro", dark: "tema: escuro" };
  let tema = temas.includes(MEM.tema) ? MEM.tema : "auto";
  const bt = document.querySelector("button.tema");
  const pinta = () => { aplicaTema(tema); bt.textContent = nomes[tema]; };
  bt.onclick = () => { tema = temas[(temas.indexOf(tema) + 1) % temas.length]; lembra("tema", tema); pinta(); };
  pinta();
  mostraAba(MEM.aba || "mapa");
})();

</script>
