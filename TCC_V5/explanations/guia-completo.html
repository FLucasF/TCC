ado?\", \"SonarQube e CK\"],\n        [\"<b>custo<\/b>\", \"quanto gastou, e como trabalhou?\", \"o <code>meta.json<\/code>: tokens, tempo, turnos\"],\n      ], { rolagem: false }),\n      H_(`<p><b>Os pontos do enunciado.<\/b> Quatro <b>positivos<\/b>, onde o padrão resolve uma variação: P1 entrega, P2 cupom, P3 pagamento e <b>P4 clube<\/b> (o foco). E um <b>controle negativo<\/b>, o P5 (seguro por região), onde só a porcentagem muda e aplicar o padrão é o erro. Assim a influência <b>negativa<\/b> (o exagero) também aparece.<\/p>`)));\n}\n\n// =====================================================================\n// 1. A sequencia de verificacao\n// =====================================================================\nconst SEQ = [\n  { q: \"até 09/10\", t: \"Validar os instrumentos na bancada\", st: \"feito\", contra: \"um instrumento que mede errado\", txt: \"<ul><li><b>A suíte<\/b>: 17 mutantes reprovados, o enunciado contra a calculadora (73 de 73), implementações independentes que chegam aos mesmos números, e a sua revisão das leituras do enunciado (07/10).<\/li><li><b>O Semgrep<\/b>: 4 corpora com a resposta escrita antes (80 de 80; <b>44 de 44 no de controle<\/b>; 10 de 10; 12 de 12) e a regressão nos 64 pacotes reais da bancada.<\/li><li><b>SonarQube e CK<\/b>: travados por hash.<\/li><li><b>A régua<\/b>: revisada por você e calibrada em 2 pacotes (8 de 8 com o Semgrep).<\/li><\/ul>\", onde: \"OBJETIVO §5; evaluation/acceptance-prototype/README.md; evaluation/tools/semgrep/corpus/\" },\n  { q: \"09/10\", t: \"O mapa no N0\", st: \"feito\", contra: \"uma escada sem modelos fora do teto (sem espaço para efeito)\", txt: \"<p>Uma execução por modelo, sem harness, mostrou que há modelos no teto e fora dele. É o que a escada precisa. No V5, o mapa <b>não escolhe nada<\/b>: todos os modelos entram, e quem está no teto sai das próprias execuções do V5.<\/p>\", onde: \"OBJETIVO §2; DECISOES §2\" },\n  { q: \"10/10\", t: \"O ensaio geral, com o V4 descartado\", st: \"feito\", contra: \"um defeito no caminho da análise que só aparece com dado de verdade\", txt: \"<p>Todos os passos rodaram nos 100 pacotes do V4, com a leitura humana <b>simulada<\/b> (não vale como conferência). Achou um defeito real: um projeto numa subpasta não era lido pelo Semgrep. Três correções entraram antes do congelamento: o <code>pom.xml<\/code> mais raso, a trava do <code>verify<\/code> para pacote sem código, e o <code>indeterminado<\/code> deixando a execução sem nota.<\/p><p><b>Quem viu o quê:<\/b> o Claude viu os resultados do V4; você, só os operacionais (a concordância, os defeitos), sem a direção de nenhum efeito. Nenhum dado do V4 entra no V5.<\/p>\", onde: \"OBJETIVO §2; TCC_V4/analysis/ensaio/LEIA-ME.md; commit 6c371f4\" },\n  { q: \"10/10\", t: \"O pré-registro e o congelamento\", st: \"feito\", contra: \"escolher a hipótese, a regra ou o limite depois de ver os dados\", txt: \"<p>O <code>OBJETIVO.md<\/code> (a pergunta, as hipóteses, as regras do §4.1 com os limites para 55 pares), a régua e os scripts foram <b>congelados antes da primeira execução<\/b>: 122 arquivos com hash em <code>CONGELADO-V5.sha256<\/code>, no commit <code>54e13fc<\/code>. Daqui em diante, mudança vira <b>emenda datada<\/b>, e as conclusões dizem o que foi lido antes e depois dela.<\/p><p>O <code>hipoteses.mjs<\/code> também foi congelado: \\\"nenhuma escolha (qual par conta, o que é melhor, quem está no teto) fica para depois\\\".<\/p>\", onde: \"OBJETIVO (topo); CONGELADO-V5.sha256; README\" },\n  { q: \"10/10\", t: \"A ordem sorteada e os quartetos simultâneos\", st: \"feito\", contra: \"horário, fila e carga do servidor misturados com o efeito do harness\", txt: \"<p>Os 4 níveis de um modelo rodam <b>no mesmo instante<\/b>: o que muda dentro de um par é só o harness. A ordem dos quartetos foi sorteada (semente 20261020), uma réplica de cada modelo por rodada, para um corte no meio deixar réplicas inteiras.<\/p>\", onde: \"experiment/ordem-v5.csv; infra/scripts/run-levels.sh\" },\n  { q: \"10 a 12/10\", t: \"As 220 execuções, conferidas rodada a rodada\", st: \"feito\", contra: \"execução fora do desenho, cortada pela cota, ou contaminada pelo ambiente\", txt: \"<ul><li>Container descartável; <code>~/.claude<\/code> vazio e nenhum <code>CLAUDE.md<\/code> fora do workspace (as linhas <code>[pre]<\/code>); nenhuma ferramenta restringida.<\/li><li>O build roda em <b>outro<\/b> container, sem token.<\/li><li>A regra da janela (começar só com folga) evitou cortes: <b>nenhum quarteto cortado<\/b>.<\/li><li>O <code>verify.mjs<\/code> [4] [6] [2] depois de cada rodada: réplicas, modelo, harness, imagem, effort, simultaneidade, cota, enunciado, CSV.<\/li><\/ul>\", onde: \"runs/; infra/scripts/verify.mjs\" },\n  { q: \"12/10\", t: \"Medir, sem IA e antes da leitura\", st: \"feito\", contra: \"a medida mudar depois de saber o resultado\", txt: \"<p>A suíte (que nunca mede duas vezes, e grava o hash da suíte e do enunciado), as métricas (versões travadas) e o Semgrep (regras geradas, cópia limpa) rodaram nos 220 <b>antes<\/b> da sua leitura, e foram commitados.<\/p>\", onde: \"commit 01ee214; analysis/\" },\n  { q: \"12/10\", t: \"Cegar: os pacotes e a amostra\", st: \"feito\", contra: \"o avaliador saber o nível e ler o que espera\", txt: \"<p>Os pacotes ganham códigos sorteados (semente 20261021); somem o <code>CLAUDE.md<\/code>, o <code>.claude/<\/code>, o <code>meta.json<\/code>, a transcrição, os comentários e os <code>.md<\/code>; as datas ficam iguais. O <b>mapa<\/b> código → execução fica fora do git até a leitura ser commitada. A amostra: 1 pacote por modelo × nível, 44 (semente 20261022), só os códigos, em ordem alfabética.<\/p>\", onde: \"evaluation/tools/anonymize.mjs; sample.mjs\" },\n  { q: \"12/10\", t: \"A sua leitura, commitada antes da comparação\", st: \"feito\", contra: \"ajustar a leitura humana ao que o Semgrep disse\", txt: \"<p>Você leu os 44 às cegas, com a régua, sem ver o Semgrep. A planilha foi <b>commitada antes<\/b> de qualquer comparação (commit <code>7d4f18a<\/code>).<\/p>\", onde: \"evaluation/reading/leitura-lucas.csv\" },\n  { q: \"12/10\", t: \"A conferência do Semgrep\", st: \"feito\", contra: \"o Semgrep errar nos pacotes reais, com formas que ninguém previu\", txt: \"<p>O <code>compare.mjs<\/code> cruza as duas leituras. Uma pergunta <b>vale para os 220<\/b> se concordarem em pelo menos <b>40 de 44<\/b> (90%); senão, as hipóteses dela viram descritivas. Vazio ou <code>indeterminado<\/code> conta como discordância, e <b>a conta oficial é a primeira<\/b>: corrigir uma regra depois não a refaz.<\/p><p>No V5: <b>174 de 176<\/b>, as 4 perguntas valem.<\/p>\", onde: \"analysis/conferencia-V5-STRATEGY.md (o resumo)\" },\n  { q: \"12/10\", t: \"O verify da leitura\", st: \"feito\", contra: \"o mapa, a amostra, as planilhas e o Semgrep não baterem entre si\", txt: \"<p>A checagem [1] do <code>verify.mjs<\/code>, com o mapa, a amostra e o CSV do Semgrep: o mapa liga cada execução a um código, um para um; a amostra tem um por grupo; as planilhas têm os códigos certos e valores da régua; o Semgrep tem todos os pacotes, e nenhum sem código lido.<\/p>\", onde: \"infra/scripts/verify.mjs\" },\n  { q: \"12/10\", t: \"As hipóteses\", st: \"feito\", contra: \"decidir caso a caso o que conta\", txt: \"<p>O <code>hipoteses.mjs<\/code> congelado junta tudo por execução, forma os pares e aplica a regra de cada tipo. Saem as tabelas de pares (publicadas inteiras), o tamanho do efeito e o veredito de cada hipótese, e o teste de Page só como informação.<\/p>\", onde: \"analysis/hipoteses-V5-STRATEGY.md\" },\n  { q: \"prevista para 19 a 26/10\", t: \"A releitura\", st: \"naofeito\", contra: \"um leitor instável (e o cegamento vazar)\", txt: \"<p>O pré-registro previa que você relesse <b>11 dos 44<\/b> (25%), uma ou duas semanas depois, sorteados no dia, sem ver as respostas antigas, para medir se responderia igual.<\/p><p><b>Não será feita<\/b> (decisão de 12/10): o V5 fecha como primeiro ciclo, e uma pesquisa nova e mais ampla vem a seguir. É um <b>desvio declarado<\/b> do pré-registro: a estabilidade do leitor não foi medida, e isso entra nas limitações, ao lado de \\\"um leitor só\\\". Os vereditos não mudam.<\/p><p>Com isso acabou a cegueira depois da leitura: o mapa, a conferência por pacote, o CSV do Semgrep e o <code>classificar.mjs<\/code> podem ser abertos.<\/p>\", onde: \"TCC_V3/DECISOES.md (12/10: sem releitura no V5)\" },\n  { q: \"depois\", t: \"A escrita\", st: \"pendente\", contra: \"dizer mais do que os dados permitem\", txt: \"<p>O §6 do <code>OBJETIVO<\/code> (o que o trabalho não afirma) vira a seção de limitações. As secundárias são publicadas, mas não sustentam conclusão sozinhas. Qualquer análise extra (uma regra corrigida, uma hipótese lida à mão) sai marcada como tal.<\/p>\", onde: \"OBJETIVO §6\" },\n];\nfunction abaSequencia(sec) {\n  sec.append(el(\"h2\", null, \"A sequência de verificação\"),\n    el(\"p\", { class: \"lead\", html: \"Cada passo existe para fechar uma porta: a coluna \\\"protege contra\\\" diz qual. Verde: feito no V5. Amarelo: falta. Cinza: não feito, por decisão. Clique num passo.\" }));\n  const lista = el(\"div\", { class: \"tl painel\" }), det = el(\"div\");\n  const mostra = (k) => {\n    lembra(\"seq\", k);\n    [...lista.children].forEach((c, j) => c.classList.toggle(\"sel\", j === k));\n    const s = SEQ[k];\n    det.replaceChildren(explicacao({ t: `${k + 1}. ${s.t}`, txt: `<p class=\"mini\">${s.q} · ${s.st === \"feito\" ? '<span class=\"sim\">feito<\/span>' : s.st === \"pendente\" ? '<span style=\"color:var(--cur);font-weight:700\">pendente<\/span>' : '<span style=\"color:var(--muted);font-weight:700\">não feito, por decisão<\/span>'}<\/p>` + s.txt }, [\n      el(\"div\", { class: \"caixa aconteceu\" }, el(\"div\", { class: \"rotulo\" }, \"protege contra\"), H_(`<p>${s.contra}<\/p>`)),\n      el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, \"onde está a prova\"), H_(`<p><code>${esc(s.onde)}<\/code><\/p>`)),\n    ]));\n  };\n  SEQ.forEach((s, k) => lista.append(el(\"div\", { class: \"tl-item \" + s.st, onclick: () => mostra(k) }, el(\"div\", { class: \"bola\" }, String(k + 1)), el(\"div\", { class: \"cx\" }, el(\"b\", null, s.t), el(\"span\", null, `${s.q} · protege contra ${s.contra}`)))));\n  sec.append(el(\"div\", { class: \"grade2\" }, lista, det));\n  mostra(Number.isInteger(MEM.seq) ? MEM.seq : 0);\n}\n\n// =====================================================================\n// 2. As hipoteses\n// =====================================================================\nconst AFIRMA = {\n  \"Desenho: isola cada caso no P4\": [\"com o harness, mais pacotes com acerto no P4 (o clube)\", \"Semgrep, conferido\"],\n  \"Exagero: aplica onde nao pede\": [\"o harness altera a taxa de exagero no P5\", \"Semgrep, conferido\"],\n  \"Correcao: suite inteira\": [\"com o harness, o código não faz menos pontos na suíte\", \"a suíte\"],\n  \"Qualidade: menos complexidade\": [\"com o harness, a complexidade cognitiva cai\", \"SonarQube\"],\n  \"Modelo: efeito maior no mais fraco\": [\"o efeito no desenho é maior no modelo que menos acerta o P4 sem harness\", \"Semgrep, conferido\"],\n  \"Desenho: isola cada caso no P1 a P3\": [\"o mesmo do P4, na entrega, no cupom e no pagamento\", \"Semgrep, sem conferência humana\"],\n  \"Desenho: nao repete o comum\": [\"com o harness, menos repetição do que é comum aos casos\", \"SonarQube (duplicação)\"],\n  \"Desenho: replicas mais parecidas\": [\"as 5 réplicas dão respostas mais parecidas no N1\", \"Semgrep\"],\n  \"Exagero: mais arquivos\": [\"com o harness, mais tipos para o mesmo enunciado\", \"SonarQube (classes)\"],\n  \"Exagero: estrutura especulativa (CBO)\": [\"o harness altera o acoplamento médio\", \"CK\"],\n  \"Exagero: estrutura especulativa (LCOM)\": [\"o harness altera a coesão média\", \"CK\"],\n  \"Correcao: contas\": [\"não faz menos pontos nos 12 casos de conta\", \"a suíte\"],\n  \"Correcao: recusas\": [\"não faz menos pontos nos 9 casos de recusa\", \"a suíte\"],\n  \"Correcao: nao quebra o build\": [\"não tem mais builds quebrados nem serviços que não sobem\", \"a suíte\"],\n  \"Correcao: casos de borda\": [\"nas fronteiras, na precedência e na colisão OURO + FRETEGRATIS, não erra mais\", \"a suíte\"],\n  \"Qualidade: menos code smells\": [\"com o harness, menos code smells\", \"SonarQube\"],\n  \"Custo: tokens de entrada\": [\"o harness altera o consumo de entrada\", \"meta.json\"],\n  \"Custo: tempo de API\": [\"o harness altera o tempo de API\", \"meta.json\"],\n  \"Custo: processo de trabalho (turnos)\": [\"o harness altera o processo de trabalho (turnos)\", \"meta.json\"],\n  \"Custo: sinal muda por modelo\": [\"a direção do efeito no custo muda conforme o modelo\", \"meta.json\"],\n  \"Modelo: no teto, nao piora (desenho)\": [\"nos modelos que já acertam tudo sem harness, ele não piora o desenho\", \"Semgrep, conferido\"],\n  \"Modelo: no teto, nao piora (correcao)\": [\"nos modelos no teto, o harness não piora a correção\", \"a suíte\"],\n  \"Skills: mais efeito no desenho\": [\"acrescentar a skill aumenta o efeito no desenho\", \"Semgrep, conferido\"],\n  \"Skills: mais custo (tokens)\": [\"acrescentar a skill aumenta o custo\", \"meta.json\"],\n  \"Skills: mudam o exagero\": [\"mais componentes alteram o exagero\", \"Semgrep, conferido\"],\n  \"Skills: so valem se carregadas\": [\"o efeito depende de a skill ser carregada\", \"meta.json\"],\n  \"Processo: corrige mais\": [\"o N3 passa em mais casos da suíte que o N2\", \"a suíte\"],\n  \"Processo: mais efeito no desenho\": [\"o efeito no desenho do N3 é maior que o do N2\", \"Semgrep, conferido\"],\n  \"Processo: menos exagero\": [\"o N3 exagera menos que o N2 (o revisor aponta complexidade)\", \"Semgrep, conferido\"],\n  \"Processo: mais custo (tokens)\": [\"o N3 gasta mais tokens que o N2\", \"meta.json\"],\n  \"Processo: mais custo (tempo)\": [\"o N3 gasta mais tempo que o N2\", \"meta.json\"],\n  \"Processo: so vale se usado\": [\"execuções do N3 sem o revisor se comportam como o N2\", \"meta.json\"],\n};\nconst TIPO = { \"direcional\": \"direcional: melhora?\", \"nao-inferioridade\": \"não-inferioridade: não piora?\", \"sem-direcao-continua\": \"sem direção: altera? (contínua)\", \"sem-direcao-binaria\": \"sem direção: altera? (sim/não)\", \"modelo\": \"compara modelos\", \"descritiva-replicas\": \"descritiva\", \"descritiva-sinal\": \"descritiva\", \"descritiva-uso\": \"descritiva\" };\nfunction abaHipoteses(sec) {\n  sec.append(el(\"h2\", null, \"Quais hipóteses servem para o quê\"),\n    el(\"p\", { class: \"lead\", html: \"As 32 hipóteses do V5. <b>★ principais<\/b>: as 5 que respondem à pergunta. As <b>secundárias<\/b> são medidas e publicadas, mas não sustentam conclusão sozinhas: com muitas hipóteses, alguma \\\"dá certo\\\" por acaso. Use os filtros.\" }));\n  const f = { ped: \"todas\", eixo: \"todos\", v: \"todos\" };\n  const barra = el(\"div\", { class: \"pilha\" }), cards = el(\"div\", { class: \"cards\" });\n  const eixos = [\"todos\", ...new Set(HIP.map((h) => h.nome.replace(\"★ \", \"\").split(\":\")[0]))];\n  const vs = [\"todos\", \"apoiada\", \"contrariada\", \"inconclusiva\", \"descritiva\"];\n  const grupo = (rot, chave, ops, nomes) => el(\"div\", { class: \"filtros\" }, el(\"span\", { class: \"mini\" }, rot), ...ops.map((o) => el(\"button\", { class: \"b\" + (f[chave] === o ? \" on\" : \"\"), onclick: () => { f[chave] = o; desenha(); } }, nomes ? nomes[o] || o : acento(o))));\n  function desenha() {\n    barra.replaceChildren(grupo(\"peso:\", \"ped\", [\"todas\", \"principais\", \"secundárias\"]), grupo(\"eixo:\", \"eixo\", eixos), grupo(\"veredito:\", \"v\", vs));\n    const lista = HIP.filter((h) => (f.ped === \"todas\" || (f.ped === \"principais\") === h.principal) && (f.eixo === \"todos\" || h.nome.replace(\"★ \", \"\").startsWith(f.eixo + \":\")) && (f.v === \"todos\" || h.veredito.startsWith(f.v)));\n    cards.replaceChildren(...lista.map((h) => {\n      const base = h.nome.replace(\"★ \", \"\"), [afirma, instr] = AFIRMA[base] || [\"\", \"\"];\n      const cls = \"v-\" + h.veredito.split(\" \")[0];\n      return el(\"div\", { class: \"hcard\" },\n        el(\"div\", { class: \"nm\" }, (h.principal ? \"★ \" : \"\") + acento(base)),\n        H_(`<p style=\"margin:0\">${afirma}<\/p>`),\n        el(\"div\", { class: \"meta\" }, el(\"span\", { class: \"pill\" }, h.par ? h.par.join(\" → \") : \"N2/N3\"), el(\"span\", { class: \"pill\" }, TIPO[h.tipo] || h.tipo), el(\"span\", { class: \"pill\" }, instr), h.depende ? el(\"span\", { class: \"pill\", title: \"se a conferência reprovasse esta pergunta, a hipótese viraria descritiva\" }, \"depende da conferência\") : null),\n        H_(`<p style=\"margin:0\">V5: <span class=\"${cls}\">${h.veredito}<\/span>${h.efeito !== null && h.efeito !== undefined ? ` · efeito ${String(h.efeito).replace(\".\", \",\")}` : \"\"}<\/p>${h.regra ? `<p class=\"mini\" style=\"margin:0\">${esc(h.regra)}<\/p>` : \"\"}`));\n    }));\n    if (!lista.length) cards.append(H_(\"<p>Nenhuma com esses filtros.<\/p>\"));\n  }\n  sec.append(barra, cards,\n    el(\"div\", { class: \"painel\", style: \"margin-top:12px\" }, H_(`<h3 style=\"margin-top:0\">Como ler<\/h3><ul>\n      <li><b>A comparação<\/b>: as principais e as de desenho, exagero, correção, qualidade, custo e modelo comparam <b>N1 com N0<\/b> (o <code>CLAUDE.md<\/code> contra nada, o contraste mais limpo). As de skills comparam N2 × N1; as de processo, N3 × N2.<\/li>\n      <li><b>O efeito<\/b> é o saldo de pares (melhores − piores) dividido pelo número de pares, de −1 a +1 (a versão pareada do <i>Cliff's delta<\/i>): abaixo de 0,15, desprezível; perto de 0,33, médio; acima de 0,47, grande. Não muda o veredito.<\/li>\n      <li><b>Inconclusiva é resultado<\/b>, não falha.<\/li>\n      <li class=\"mini\">Fonte: OBJETIVO §4 e a saída do <code>hipoteses.mjs<\/code> (<code>analysis/hipoteses-V5-STRATEGY.md<\/code>).<\/li><\/ul>`)));\n  desenha();\n}\n\n// =====================================================================\n// 3. As regras de leitura, e por que\n// =====================================================================\nfunction abaRegras(sec) {\n  sec.append(el(\"h2\", null, \"As regras de leitura, e por quê\"),\n    el(\"p\", { class: \"lead\", html: \"OBJETIVO §4.1. As regras foram escritas <b>antes<\/b> dos dados, e o <code>hipoteses.mjs<\/code> as aplica. Aqui, o porquê de cada número, com as funções de limite tiradas do próprio script.\" }));\n  sec.append(el(\"div\", { class: \"painel pilha\", style: \"margin-bottom:12px\" }, H_(`<h3 style=\"margin-top:0\">Por que pares, e não um teste estatístico por modelo<\/h3>\n    <p>Com 5 réplicas, cada modelo tem 5 pares por comparação. Mesmo com os 5 na mesma direção, a chance disso por pura sorte é de <b>${pct(R.caudaDupla(5, 5))}<\/b>: nunca passaria dos 5% convencionais. E somar os 55 pares num teste só misturaria modelos que se comportam diferente. Por isso a leitura é <b>por pares, descritiva, e decidida antes<\/b>.<\/p>`)));\n\n  // a moeda\n  const nIn = el(\"input\", { type: \"number\", value: 55, min: 5, max: 200, style: \"max-width:100px\" });\n  const out = el(\"div\", { class: \"pilha\" });\n  const joga = () => {\n    const n = Math.max(5, Math.min(200, Number(nIn.value) || 55));\n    const k = R.minimoSinal(n, 0.05), baixo = Math.floor(0.6 * n);\n    const vezes = 4000, cont = new Array(n + 1).fill(0);\n    let acima = 0;\n    for (let v = 0; v < vezes; v++) { let c = 0; for (let i = 0; i < n; i++) if (Math.random() < 0.5) c++; const maior = Math.max(c, n - c); cont[maior]++; if (maior >= k) acima++; }\n    const ini = Math.ceil(n / 2), max = Math.max(...cont);\n    out.replaceChildren(\n      el(\"div\", { class: \"histo\" }, cont.slice(ini).map((x, j) => el(\"i\", { class: ini + j >= k ? \"fora\" : null, style: `height:${(x / max) * 100}%`, title: `lado maior = ${ini + j}: ${x} vezes` }))),\n      H_(`<p class=\"mini\">Cada barra: em quantas das ${vezes} jogadas o lado maior teve aquele número de pares (de ${ini} a ${n}). Em vermelho, a partir de <b>${k}<\/b>.<\/p>\n        <p>Com ${n} pares, se o harness não fizesse nada, o lado maior chegou a ${k} ou mais em <b>${pct(acima / vezes)}<\/b> das jogadas. A conta exata (a função <code>caudaDupla<\/code> do script): <b>${pct(R.caudaDupla(n, k))}<\/b>. Por isso: <b>apoiada com ${k} ou mais<\/b>; <b>contrariada com ${baixo} ou menos<\/b> (até 60% de um lado: os pares se dividem); entre os dois, inconclusiva.<\/p>\n        ${n === 55 ? '<p class=\"mini\">É a tabela do OBJETIVO: 36 ou mais, 3,0%; 35 ou mais, 5,8%. (No V4, com 25 pares, o limite era 18.)<\/p>' : \"\"}`));\n  };\n  nIn.oninput = joga;\n  sec.append(el(\"div\", { class: \"painel pilha\", style: \"margin-bottom:12px\" }, el(\"h3\", { style: \"margin-top:0\" }, \"A moeda: de onde vem o 36 de 55\"),\n    H_(\"<p>Se o harness não mudasse nada, cada par subiria ou desceria por sorte, como cara ou coroa. A página joga 55 moedas 4000 vezes e conta quantas vezes um dos lados chega ao limite.<\/p>\"),\n    el(\"div\", { class: \"linha-botoes\" }, el(\"label\", { class: \"mini\" }, \"pares: \", nIn), el(\"button\", { class: \"b on\", onclick: joga }, \"jogar de novo\")), out));\n  joga();\n\n  sec.append(el(\"div\", { class: \"grade2\" },\n    el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">O saldo de 13% (não-inferioridade)<\/h3><p>Mesmo sem efeito nenhum, o modelo não acerta sempre igual, e alguns pares saem diferentes por acaso, para os dois lados. O <b>saldo<\/b> (piores − melhores) desconta os melhores. A mesma proporção que justificava 2 em 15 pares dá <b>${R.limiteSaldo(55)} em 55<\/b>. Acima disso, o harness atrapalha mais do que ajuda.<\/p>`)),\n    el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">O teto<\/h3><p>Um modelo que já acerta tudo sem harness, nas 5 réplicas, <b>não tem como melhorar<\/b>: só empatar ou piorar. Contá-lo tornaria impossível apoiar uma hipótese direcional sempre que vários modelos estivessem no teto. Por isso ele <b>sai da contagem<\/b> e é lido por \\\"no teto, não piora\\\". Se todos estiverem no teto: \\\"sem espaço para efeito\\\".<\/p>`)),\n    el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">Direcional: voto por modelo<\/h3><p>Apoiada quando a <b>maioria dos modelos fora do teto<\/b> tem mais pares melhores que piores, <b>e nenhum modelo<\/b> (nem os do teto) tem mais piores. Contrariada quando a maioria fora do teto tem mais piores.<\/p>`)),\n    el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">Sim/não (o exagero)<\/h3><p>Quando a medida é \\\"exagerou ou não\\\", quase todo par empata (nenhum dos dois exagerou). Contam só os pares em que os níveis diferem, com a mesma conta da moeda e limite de 6,3% (o exagero é raro). Com 1 ou 2 pares diferentes: contrariada.<\/p>`))),\n    el(\"div\", { class: \"painel\", style: \"margin-top:12px\" }, H_(`<h3 style=\"margin-top:0\">E dois números só como informação<\/h3><ul><li><b>O tamanho do efeito<\/b> (saldo ÷ pares), publicado ao lado de cada hipótese.<\/li><li><b>O teste de Page<\/b>: a medida sobe de N0 a N3? Cada quarteto é um bloco. Publicado com o p, <b>não decide nenhuma hipótese<\/b>.<\/li><\/ul>`)),\n    quiz({ p: \"A conferência deu <b>39 de 44<\/b> na <code>P4_localizacao<\/code>. O que acontece com a hipótese do desenho?\", op: [\"nada, 39 é quase 40\", \"vira descritiva, lida só nos 44 conferidos\", \"o Semgrep é corrigido e a conta refeita\"], certa: 1, exp: \"Abaixo de 40, a pergunta vira descritiva: as hipóteses que dependem dela são lidas só nos 44 pacotes conferidos, e a discordância entra nas limitações. Corrigir a regra para refazer a conta oficial não é permitido; uma regra corrigida só pode aparecer como análise extra, marcada.\" }));\n}\n\n// =====================================================================\n// 4. Ameacas e defesas\n// =====================================================================\nconst AMEACAS = [\n  [\"quem avalia saber o nível, e ler o que espera\", \"cópia cega (sem CLAUDE.md, .claude, comentários, .md; datas iguais), códigos sorteados, mapa fora do git até a leitura ser commitada\", \"o próprio código pode entregar o nível; a coluna achei_que_sabia_nivel mede isso\"],\n  [\"um avaliador de IA da mesma família dos agentes\", \"nenhum modelo avalia: o Semgrep e as métricas são regras fixas, e quem confere é você\", \"os instrumentos foram desenhados com ajuda do Claude (declarado no §6)\"],\n  [\"decidir a hipótese, a regra ou o limite depois de ver os dados\", \"pré-registro congelado com hash antes da primeira execução; regras escritas no script; emenda datada\", \"o V4 rodou antes (declarado); a cognitiva como principal veio do ensaio do V3 (declarado)\"],\n  [\"horário, fila e carga do servidor\", \"os 4 níveis de um modelo rodam no mesmo instante, e a comparação é dentro do quarteto\", \"entre quartetos, não controlado, mas a análise não compara entre quartetos\"],\n  [\"a ordem das execuções\", \"ordem sorteada com semente, uma réplica de cada modelo por rodada\", \"—\"],\n  [\"o ambiente contaminado (configuração do autor, rede, permissões)\", \"container descartável; ~/.claude vazio e nenhum CLAUDE.md fora (as linhas [pre]); build em outro container, sem token\", \"o Claude Code tem as próprias orientações, iguais para todos (o efeito medido é o do harness somado a elas)\"],\n  [\"a suíte medir errado\", \"17 mutantes, o enunciado contra a calculadora (73 de 73), implementações independentes, revisão das leituras\", \"um erro que fosse o mesmo na calculadora e em todas as implementações\"],\n  [\"o Semgrep medir errado\", \"corpora (o de controle, com forma nova: 44 de 44), conferência humana (40 de 44 por pergunta), alarme de nomes\", \"forma que ninguém previu; ordinal(); código que ninguém chama; P1 a P3 sem conferência; o nível em minúsculas\"],\n  [\"um leitor instável\", \"o pré-registro previa a releitura de 11, sorteada no dia, semanas depois; ela não foi feita (decisão de 12/10, o V5 fechou como primeiro ciclo)\", \"a estabilidade do leitor não foi medida, e há um leitor só (não se mede a concordância entre pessoas)\"],\n  [\"muitas hipóteses (alguma dá certo por acaso)\", \"5 principais (★); as secundárias não sustentam conclusão sozinhas\", \"—\"],\n  [\"poucas réplicas para estatística por modelo\", \"leitura por pares, descritiva, decidida antes; o teste de sinal só sobre os 55\", \"o efeito num modelo só (5 pares) não é prova\"],\n  [\"modelos que já acertam tudo (teto)\", \"saem da contagem nas direcionais; \\\"no teto, não piora\\\"\", \"neles, o estudo só diz se o harness atrapalha\"],\n  [\"medir de novo até dar o resultado esperado\", \"nada é refeito por cima (execução, medição, ordem, mapa, saída); quarteto interrompido refeito inteiro\", \"—\"],\n  [\"o cache da API mexer no custo\", \"o custo é todo secundário; os tokens são registrados separados\", \"o custo não sustenta conclusão\"],\n  [\"generalizar demais\", \"o §6 diz o que o trabalho não afirma\", \"um enunciado, Java/Spring, do zero; só modelos Claude; o harness dentro do Claude Code 2.1.288\"],\n];\nfunction abaAmeacas(sec) {\n  sec.append(el(\"h2\", null, \"Ameaças e defesas\"),\n    el(\"p\", { class: \"lead\", html: \"O que poderia fazer o resultado parecer o que não é, o que o desenho faz contra, e o que <b>sobra<\/b> (o que vai para as limitações). Clique numa ameaça.\" }));\n  const lista = el(\"div\", { class: \"painel lista-regras\" }), det = el(\"div\");\n  const mostra = (k) => {\n    [...lista.children].forEach((c, j) => c.classList.toggle(\"ativa\", j === k));\n    const [a, d, r] = AMEACAS[k];\n    det.replaceChildren(el(\"div\", { class: \"painel pilha\" }, el(\"div\", { class: \"passo-t\" }, a),\n      el(\"div\", { class: \"caixa certo\" }, el(\"div\", { class: \"rotulo\" }, \"a defesa\"), H_(`<p>${d}<\/p>`)),\n      el(\"div\", { class: \"caixa aviso\" }, el(\"div\", { class: \"rotulo\" }, \"o que sobra\"), H_(`<p>${r}<\/p>`))));\n  };\n  AMEACAS.forEach(([a], k) => lista.append(el(\"button\", { onclick: () => mostra(k) }, a)));\n  sec.append(el(\"div\", { class: \"grade-lab\", style: \"grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)\" }, lista, det));\n  mostra(0);\n}\n\n// =====================================================================\n// 5. O que se conclui, e o que nao\n// =====================================================================\nfunction abaConclui(sec) {\n  const P = HIP.filter((h) => h.principal);\n  sec.append(el(\"h2\", null, \"O que o V5 permite concluir, e o que não\"),\n    el(\"p\", { class: \"lead\", html: \"Só as 5 principais sustentam conclusão. Abaixo, o veredito, a regra aplicada (a frase que o <code>hipoteses.mjs<\/code> escreveu) e o tamanho do efeito.\" }),\n    el(\"div\", { class: \"cards\" }, P.map((h) => el(\"div\", { class: \"hcard\" }, el(\"div\", { class: \"nm\" }, acento(h.nome)), H_(`<p style=\"margin:0\" class=\"v-${h.veredito.split(\" \")[0]}\">${h.veredito}<\/p><p class=\"mini\" style=\"margin:0\">${esc(h.regra || \"\")}<\/p><p class=\"mini\" style=\"margin:0\">efeito: ${h.efeito !== null ? String(h.efeito).replace(\".\", \",\") : \"—\"}<\/p>`)))),\n    el(\"div\", { class: \"painel\", style: \"margin-top:12px\" }, H_(`<h3 style=\"margin-top:0\">Lendo junto<\/h3><ul>\n      <li><b>Desenho<\/b>: o <code>CLAUDE.md<\/code> (N1) melhora o acerto no P4 nos modelos que tinham espaço (fora do teto), sem nenhum modelo piorar.<\/li>\n      <li><b>Exagero<\/b>: não apareceu. Quase nenhum par diferiu no P5. O <code>CLAUDE.md<\/code> tem uma regra contra estrutura para variação imaginada, que pode explicar isso (está nas lições).<\/li>\n      <li><b>Correção<\/b>: o harness não piorou a suíte (o saldo ficou a favor do harness).<\/li>\n      <li><b>Qualidade<\/b>: a complexidade cognitiva caiu na grande maioria dos pares (efeito 0,82, grande).<\/li>\n      <li><b>Modelo<\/b>: apoiada pela regra de empate decidida antes (dois modelos empataram como os mais fracos no N0, e o maior saldo, sem empate, é de um deles). Vale ler com essa ressalva.<\/li><\/ul>`)),\n    el(\"div\", { class: \"painel\", style: \"margin-top:12px\" }, H_(`<h3 style=\"margin-top:0\">O que o trabalho não afirma (OBJETIVO §6, resumido)<\/h3><ul>\n      <li>não generaliza para qualquer enunciado: um serviço pequeno, do zero, em Java/Spring;<\/li>\n      <li>não compara padrões nem versões de harness estatisticamente (entre lotes não há pares);<\/li>\n      <li>o Semgrep pode errar em silêncio (formas imprevistas; o P1 a P3 sem conferência);<\/li>\n      <li>há um leitor humano só, e a releitura prevista não foi feita (a estabilidade dele não foi medida);<\/li>\n      <li>os instrumentos foram desenhados com ajuda de um modelo de IA da mesma família;<\/li>\n      <li>o ensaio influenciou escolhas, e o V4 rodou antes (os dois declarados);<\/li>\n      <li>o N3 gasta muito mais: uma melhora nele pode ser o processo ou só mais computação;<\/li>\n      <li>nos modelos no teto, o estudo só diz se o harness atrapalha;<\/li>\n      <li>a skill do N2 traz exemplos próximos do domínio (o de Strategy é pagamento);<\/li>\n      <li>mede o harness somado às orientações do próprio Claude Code 2.1.288;<\/li>\n      <li>só modelos Claude; a manutenção ficou de fora.<\/li><\/ul>`)));\n}\n\n// =====================================================================\n// 6. Pendencias do metodo\n// =====================================================================\nfunction abaPendencias(sec) {\n  sec.append(el(\"h2\", null, \"O que ainda falta, no método\"),\n    el(\"div\", { class: \"pilha\", style: \"max-width:1000px\" },\n      el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">1. A releitura: decidido que não será feita<\/h3><p>Prevista no pré-registro (§4.10), ela não acontece: o V5 fecha como primeiro ciclo (decisão de 12/10, no <code>DECISOES.md<\/code>). Na escrita, entra como <b>desvio declarado<\/b> e como limitação: a estabilidade do leitor não foi medida. Não há mais nada a fazer aqui, além de citá-la.<\/p>`)),\n      el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">2. Uma hipótese pré-registrada que o script não roda<\/h3><p>O §4.6 do <code>OBJETIVO<\/code> lista <b>\\\"Modelo: quem melhora não é quem exagera\\\"<\/b> (secundária, sem direção): a influência negativa (o exagero) aparece em modelos diferentes dos que têm a positiva. Ela <b>não está<\/b> na lista do <code>hipoteses.mjs<\/code>, e não tem veredito no V5.<\/p><p>Como é secundária e o exagero quase não apareceu, o peso é pequeno, mas o pré-registro pede que ela seja tratada. Caminhos: declará-la como <b>não testada<\/b> (com o motivo), ou lê-la à mão a partir das tabelas de pares, <b>marcada como análise extra<\/b>. Qualquer um dos dois é uma decisão a registrar.<\/p>`)),\n      el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">3. O texto antigo na régua congelada<\/h3><p>A §0 da <code>regua.md<\/code> do V5 ainda diz \\\"20\\\" e \\\"18 de 20\\\" (números do V4). O que valeu foi o pré-registro (40 de 44), aplicado pelo <code>compare.mjs<\/code>. Já registrado no <code>DECISOES.md<\/code>.<\/p>`)),\n      el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">4. O commit da análise<\/h3><p>A conferência, o mapa, as notas, as hipóteses, o resumo dos resultados e as páginas de explicação ainda não estão no git.<\/p>`))));\n}\n\n// =====================================================================\n// 7. Autoavaliacao\n// =====================================================================\nfunction abaAuto(sec) {\n  const Q = [\n    [\"Qual a unidade de análise, e por quê?\", \"O <b>par<\/b>: dois níveis vizinhos do mesmo modelo que rodaram no mesmo instante. Assim, horário, fila e carga são iguais nos dois, e o que muda é só o harness.\"],\n    [\"Por que pré-registrar e congelar com hash?\", \"Para provar que as hipóteses, as regras e os limites foram escolhidos <b>antes<\/b> de ver os dados. Mudança depois vira emenda datada.\"],\n    [\"Por que o Semgrep precisa de conferência humana, se passou nos corpora?\", \"Os corpora são formas que nós imaginamos (e só o de controle é forma nova). A conferência testa nos pacotes reais, com o que os agentes escreveram. Se uma pergunta não chegar a 40 de 44, as hipóteses dela viram descritivas.\"],\n    [\"Por que 36 de 55 para dizer que o harness \\\"altera\\\"?\", \"Sem efeito, cada par é cara ou coroa. A chance de 36 ou mais caírem do mesmo lado por sorte é de 3,0%; com 35, já é 5,8%. 36 é o menor número abaixo de 5%.\"],\n    [\"Por que os modelos no teto saem da contagem nas direcionais?\", \"Eles não têm como melhorar. Contá-los impediria apoiar a hipótese sempre que vários estivessem no teto, mesmo com efeito claro nos outros. Eles são lidos por \\\"no teto, não piora\\\".\"],\n    [\"O que diferencia uma hipótese principal de uma secundária?\", \"As principais respondem à pergunta e sustentam conclusão. As secundárias são publicadas, mas não sustentam conclusão sozinhas: com 32 hipóteses, alguma daria certo por acaso.\"],\n    [\"\\\"Inconclusiva\\\" é um problema?\", \"Não: é um resultado. A regra decide antes o que conta como apoio e como contrariedade; o que fica no meio é registrado como tal, com a tabela de pares inteira.\"],\n    [\"O que a releitura mediria, e o que se perde sem ela?\", \"Mediria se você responde igual semanas depois (a estabilidade do leitor). Sem ela, isso fica sem medida, e entra nas limitações como desvio declarado do pré-registro. A conferência continua valendo: ela mede se o Semgrep concorda com a sua leitura, não se a sua leitura é estável.\"],\n    [\"O que fazer com uma hipótese pré-registrada que não foi rodada?\", \"Não esconder: declarar como não testada, com o motivo, ou analisá-la depois, marcada como análise extra. Os dois caminhos ficam registrados.\"],\n  ];\n  sec.append(el(\"h2\", null, \"Autoavaliação\"), el(\"p\", { class: \"lead\" }, \"Para explicar o método ao orientador. Responda de cabeça antes de abrir.\"),\n    el(\"div\", { style: \"max-width:900px\" }, Q.map(([q, r], k) => el(\"details\", { class: \"r\" }, el(\"summary\", { html: `${k + 1}. ${q}` }), H_(`<p>${r}<\/p>`)))));\n}\n\n// ---- abas-acerto.js ----\n// abas-acerto.js: o que conta como acerto (o gabarito e a regua).\n\"use strict\";\n\n// trechos INVENTADOS; a resposta e a da regua (evaluation/regua.md), com a linha que decide\nconst EXERCICIOS = [\n  { t: \"Um mapa e uma classe por nível\", cod: `Map<String, Nivel> NIVEIS = Map.of(\n    \"BRONZE\", new Bronze(), \"PRATA\", new Prata(), \"OURO\", new Ouro());\n\nBigDecimal frete(String codigo, BigDecimal base) {\n    return NIVEIS.get(codigo).frete(base);   // cada nivel faz a sua conta\n}`, perguntas: [\n    [\"P4_localizacao\", \"isolado\", \"Todo o código específico de cada nível está na classe dele. O nome no <code>Map.of<\/code> é só chave de registro, e isso não conta (régua §2.1).\"],\n    [\"P4_selecao\", \"consulta\", \"O nível é achado <b>sem nomear<\/b>: um <code>Map.get<\/code> (régua §2.2).\"]] },\n  { t: \"Estrutura, mas o Ouro escapa num if\", cod: `BigDecimal frete(String codigo, BigDecimal base) {\n    Nivel nivel = NIVEIS.get(codigo);\n    if (nivel instanceof Ouro) return BigDecimal.ZERO;   // fora da classe Ouro\n    return nivel.frete(base);\n}`, perguntas: [\n    [\"P4_localizacao\", \"espalhado\", \"O Ouro tem código específico <b>também<\/b> fora da classe dele (régua §2.1).\"],\n    [\"P4_selecao\", \"condicional-no-calculo\", \"O nível foi achado por consulta, mas a conta do Ouro é feita por um <code>if<\/code> que o nomeia: \\\"o <code>if<\/code> passou por cima da estrutura\\\" (régua §2.2).\"]] },\n  { t: \"Uma fábrica num lugar só\", cod: `Nivel criar(String codigo) {\n    return switch (codigo) {\n        case \"BRONZE\" -> new Bronze();\n        case \"PRATA\" -> new Prata();\n        default -> new Ouro();\n    };\n}\n// depois: criar(codigo).frete(base)`, perguntas: [\n    [\"P4_localizacao\", \"isolado\", \"O <code>switch<\/code> só escolhe o objeto; a conta de cada nível continua na classe dele.\"],\n    [\"P4_selecao\", \"condicional-unica\", \"Um <code>switch<\/code> que nomeia os níveis <b>num lugar só<\/b> e <b>devolve um objeto<\/b> para outro calcular (régua §2.2).\"]] },\n  { t: \"Um enum que é só rótulo\", cod: `enum Nivel { BRONZE, PRATA, OURO }\n\nBigDecimal frete(Nivel nivel, BigDecimal base) {\n    switch (nivel) {\n        case OURO: return BigDecimal.ZERO;\n        case PRATA: return base.multiply(new BigDecimal(\"0.5\"));\n        default: return base;\n    }\n}`, perguntas: [\n    [\"P4_localizacao\", \"espalhado\", \"Os níveis <b>não têm unidade própria<\/b> (constantes sem corpo, comparadas num método de todos): qualquer código específico está fora da casa deles (régua §2.1).\"],\n    [\"P4_selecao\", \"condicional-no-calculo\", \"\\\"Um <code>enum<\/code> que é só rótulo, com a conta num <code>switch<\/code> que nomeia os níveis\\\" (régua §2.2).\"]] },\n  { t: \"Uma lista de válidos antes do mapa\", cod: `if (!Set.of(\"BRONZE\", \"PRATA\", \"OURO\").contains(codigo))\n    throw new IllegalArgumentException(\"NIVEL_CLUBE_INVALIDO\");\nreturn NIVEIS.get(codigo).frete(base);`, perguntas: [\n    [\"P4_localizacao\", \"isolado\", \"Um bloco que cita <b>todos<\/b> os níveis só para conferir se o código existe é uma <b>lista de válidos<\/b>, e não conta (régua §2.1).\"],\n    [\"P4_selecao\", \"consulta\", \"Achado pelo mapa. E um <code>if<\/code> que só recusa o pedido não muda a seleção (régua §2.2).\"]] },\n  { t: \"Um if que nomeia o Ouro só para recusar\", cod: `if (\"OURO\".equals(codigo) && subtotal.signum() < 0)\n    throw new IllegalArgumentException(\"PEDIDO_INVALIDO\");\nreturn NIVEIS.get(codigo).frete(base);`, perguntas: [\n    [\"P4_localizacao\", \"espalhado\", \"\\\"<b>Inclusive<\/b> um <code>if<\/code> que o nomeia numa validação\\\": é código só do Ouro, fora da casa dele (régua §2.1).\"],\n    [\"P4_selecao\", \"consulta\", \"Para a seleção, um <code>if<\/code> que só recusa (valida, mas não calcula) não muda nada: o nível continua achado pelo mapa (régua §2.2).\"]] },\n  { t: \"P5: um enum que só carrega números\", cod: `enum Regiao {\n    SUDESTE(new BigDecimal(\"0.010\")), SUL(new BigDecimal(\"0.010\")),\n    NORTE(new BigDecimal(\"0.025\"));\n    final BigDecimal taxa;\n    Regiao(BigDecimal t) { taxa = t; }\n    BigDecimal seguro(BigDecimal v) { return v.multiply(taxa); }\n}`, perguntas: [\n    [\"P5_forma\", \"enum-dados\", \"Constantes que só carregam valores, e um método só para todas (régua §3.1).\"],\n    [\"P5_proporcao\", \"dados\", \"A variação como dado: a resposta tem o tamanho do problema (régua §3.2).\"]] },\n  { t: \"P5: uma região com corpo próprio\", cod: `enum Regiao {\n    SUL(new BigDecimal(\"0.010\")),\n    NORTE(new BigDecimal(\"0.025\")) {\n        BigDecimal seguro(BigDecimal v) { return super.seguro(v); }\n    };\n    ...\n}`, perguntas: [\n    [\"P5_forma\", \"enum-abstrato\", \"Alguma constante tem corpo próprio (<code>NORTE { ... }<\/code>) (régua §3.1).\"],\n    [\"P5_proporcao\", \"estrutura\", \"Uma constante de enum <b>com corpo<\/b> é estrutura, mesmo que faça a mesma conta (régua §3.2): o <b>exagero<\/b>.\"]] },\n  { t: \"P5: objetos, mas da mesma classe\", cod: `List<Taxa> TAXAS = List.of(\n    new Taxa(\"SUL\", new BigDecimal(\"0.010\")),\n    new Taxa(\"NORTE\", new BigDecimal(\"0.025\")));`, perguntas: [\n    [\"P5_forma\", \"outro\", \"Não é enum, nem mapa, nem switch, nem uma classe por região: uma lista (régua §3.2: \\\"a <code>forma<\/code> é <code>mapa<\/code> se estiver num mapa, ou <code>outro<\/code>\\\").\"],\n    [\"P5_proporcao\", \"dados\", \"\\\"Objeto não é sempre estrutura\\\": objetos <b>da mesma classe<\/b>, só com os números, são uma tabela (régua §3.2).\"]] },\n  { t: \"P5: uma função por região\", cod: `Map<String, Function<BigDecimal, BigDecimal>> SEGURO = Map.of(\n    \"SUL\", v -> v.multiply(new BigDecimal(\"0.010\")),\n    \"NORTE\", v -> v.multiply(new BigDecimal(\"0.025\")));`, perguntas: [\n    [\"P5_forma\", \"mapa\", \"Um <code>Map<\/code> da região para alguma coisa (régua §3.1).\"],\n    [\"P5_proporcao\", \"estrutura\", \"Cada região com <b>função própria<\/b>, mesmo que todas façam a mesma conta (régua §3.2).\"]] },\n  { t: \"P5: um switch que só devolve o número\", cod: `BigDecimal taxa(Regiao r) {\n    return switch (r) {\n        case NORTE -> new BigDecimal(\"0.025\");\n        case NORDESTE -> new BigDecimal(\"0.020\");\n        default -> new BigDecimal(\"0.010\");\n    };\n}`, perguntas: [\n    [\"P5_forma\", \"switch\", \"Um <code>switch<\/code> sobre a região (régua §3.1).\"],\n    [\"P5_proporcao\", \"condicional\", \"Um <code>switch<\/code> que só <b>devolve o número<\/b> de cada região: proporcional (régua §3.2).\"]] },\n];\nconst VALORES = {\n  P4_localizacao: [\"isolado\", \"espalhado\"], P4_selecao: [\"consulta\", \"condicional-unica\", \"condicional-no-calculo\"],\n  P5_forma: [\"enum-dados\", \"enum-abstrato\", \"classes\", \"mapa\", \"switch\", \"outro\"], P5_proporcao: [\"dados\", \"condicional\", \"estrutura\"],\n};\n\nfunction abaAcerto(sec) {\n  sec.append(el(\"h2\", null, \"O que conta como acerto: o gabarito e a régua\"),\n    el(\"p\", { class: \"lead\", html: \"\\\"Acerto\\\" aparece em três níveis, e cada um tem a sua regra. Esta aba é o <b>primeiro<\/b>: como se lê um pacote. Fontes: <code>evaluation/strategy/gabarito.md<\/code> e <code>evaluation/regua.md<\/code> (versão 5, congelada em 10/10).\" }),\n    el(\"div\", { class: \"painel\" }, tabela([\"nível\", \"a pergunta\", \"a regra\", \"onde\"], [\n      [\"<b>1 · o pacote<\/b>\", \"o código isolou o Ouro? o Norte virou estrutura?\", \"a régua (4 perguntas, valores fechados) e a ficha\", \"esta aba\"],\n      [\"2 · a execução\", \"quantos pontos ela faz?\", \"a nota (suíte + desenho)\", \"página dos scripts, aba 7\"],\n      [\"3 · a hipótese\", \"o harness melhorou, nos 55 pares?\", \"as regras do §4.1\", \"abas 3 e 4 desta página\"],\n    ], { rolagem: false })));\n\n  sec.append(el(\"div\", { class: \"grade2\", style: \"margin-top:12px\" },\n    el(\"div\", { class: \"painel\" }, el(\"h3\", { style: \"margin-top:0\" }, \"O gabarito: os pontos e os casos\"),\n      tabela([\"ponto\", \"tipo\", \"casos\"], [\n        [\"P1 entrega\", \"positivo\", \"<code>ECONOMICA<\/code>, <code>EXPRESSA<\/code>, <code>RETIRADA_LOJA<\/code>, <code>MOTOBOY<\/code>\"],\n        [\"P2 cupom\", \"positivo\", \"<code>BEMVINDO10<\/code>, <code>MENOS50<\/code>, <code>FRETEGRATIS<\/code>, <code>LEVE3PAGUE2<\/code>\"],\n        [\"P3 pagamento\", \"positivo\", \"<code>PIX<\/code>, <code>CARTAO<\/code>, <code>BOLETO<\/code>\"],\n        [\"<b>P4 clube<\/b>\", \"positivo, <b>o foco<\/b>\", \"<code>BRONZE<\/code>, <code>PRATA<\/code>, <code>OURO<\/code>\"],\n        [\"<b>P5 seguro<\/b>\", \"<b>controle negativo<\/b>\", \"<code>SUDESTE<\/code>, <code>SUL<\/code>, <code>CENTRO_OESTE<\/code>, <code>NORTE<\/code>, <code>NORDESTE<\/code>\"],\n      ], { rolagem: false }),\n      H_(`<p class=\"mini\">Só o Semgrep lê o P1 a P3 (secundários). O P4 e o P5, o Semgrep e você.<\/p>`)),\n    el(\"div\", { class: \"painel\" }, H_(`<h3 style=\"margin-top:0\">Por que esses dois<\/h3>\n      <p><b>O P4 é o foco<\/b> porque o <code>OURO<\/code> mexe em três partes do resumo (o crédito, o frete e o brinde), e o frete é calculado em outro lugar. Quem escreve o clube olhando só o Bronze e a Prata tende a resolver o Ouro com um <code>if (nivel == OURO)<\/code> no frete: o desenho espalhado que o harness quer evitar.<\/p>\n      <p><b>O P5 é o controle negativo<\/b> porque o enunciado diz que \\\"é só a porcentagem que muda\\\". A resposta proporcional é a variação como dado; uma classe ou um corpo por região é o <b>exagero<\/b>.<\/p>\n      <p class=\"mini\"><b>Não são pontos de variação:<\/b> a ordem dos erros (uma sequência fixa), a moeda (\\\"só reais\\\") e a troca de produto (\\\"não entra no cálculo\\\").<\/p>`))));\n\n  sec.append(el(\"div\", { class: \"painel pilha\", style: \"margin-top:12px\" }, H_(`<h3 style=\"margin-top:0\">A régua: 4 perguntas, valores fechados<\/h3>\n    <p>A régua lê <b>desenho<\/b>, não correção: um erro de conta não muda nenhuma resposta (a correção é da suíte). Duas ideias sustentam tudo:<\/p>\n    <ul><li><b>Nomear um caso<\/b> é escrever qual ele é (<code>\"OURO\"<\/code>, <code>OURO<\/code>, <code>NivelOuro<\/code>, <code>case OURO -&gt;<\/code>). O teste: <i>se eu criar um caso parecido, esta linha precisa mudar?<\/i> <code>nivel.freteGratis()<\/code> não nomeia: o nível novo responde sozinho.<\/li>\n    <li><b>Na dúvida entre dois valores, não escolha o mais provável:<\/b> escreva <code>indeterminado<\/code> (na conferência, conta como discordância).<\/li><\/ul>`),\n    el(\"div\", { class: \"grade2\" },\n      tabela([\"P4 · pergunta\", \"valor\", \"quando\"], [\n        [\"<code>localizacao<\/code>: o que é de um nível aparece fora dele?\", \"<code>isolado<\/code>\", \"todo o código específico de cada nível está numa unidade só dele\"],\n        [\"\", \"<code>espalhado<\/code>\", \"algum nível tem código específico <b>também<\/b> em outra unidade, inclusive um <code>if<\/code> que o nomeia numa validação\"],\n        [\"<code>selecao<\/code>: o caminho do texto até a conta nomeia níveis?\", \"<code>consulta<\/code>\", \"achado sem nomear: <code>Map<\/code>, <code>valueOf<\/code>, beans injetados, laço genérico\"],\n        [\"\", \"<code>condicional-unica<\/code>\", \"um <code>switch<\/code>/<code>if<\/code> num lugar só que <b>devolve um objeto<\/b> (fábrica)\"],\n        [\"\", \"<code>condicional-no-calculo<\/code>\", \"um <code>switch<\/code>/<code>if<\/code> que nomeia e <b>faz a conta<\/b> ali\"],\n      ], { rolagem: false }),\n      tabela([\"P5 · pergunta\", \"valor\", \"quando\"], [\n        [\"<code>forma<\/code>: que formato?\", \"<code>enum-dados<\/code> · <code>enum-abstrato<\/code> · <code>classes<\/code> · <code>mapa<\/code> · <code>switch<\/code> · <code>outro<\/code>\", \"o que se vê\"],\n        [\"<code>proporcao<\/code>: tem o tamanho do problema?\", \"<code>dados<\/code>\", \"a variação como dado: enum de números, mapa de números, tabela, configuração\"],\n        [\"\", \"<code>condicional<\/code>\", \"um <code>switch<\/code>/<code>if<\/code> que só devolve o número\"],\n        [\"\", \"<code>estrutura<\/code>\", \"classe, corpo ou função própria por região (o exagero)\"],\n      ], { rolagem: false })),\n    el(\"div\", { class: \"rotulo\" }, \"a ficha (aplicada depois, por conta)\"),\n    tabela([\"ponto\", \"acerto\", \"erro\", \"exagero\"], [\n      [\"positivo (P1 a P4)\", \"<code>isolado<\/code> <b>e<\/b> <code>consulta<\/code> ou <code>condicional-unica<\/code>\", \"<code>espalhado<\/code>, ou <code>condicional-no-calculo<\/code>\", \"—\"],\n      [\"controle negativo (P5)\", \"<code>dados<\/code> ou <code>condicional<\/code>\", \"—\", \"<code>estrutura<\/code>\"],\n    ], { rolagem: false }),\n    H_(`<p class=\"mini\">A ficha alimenta a hipótese do desenho (acerto no P4) e a do exagero (<code>estrutura<\/code> no P5). A nota dá 10 por ponto com as duas certas, 5 com uma, 0 com nenhuma.<\/p>`)));\n\n  // o exercicio\n  const box = el(\"div\", { class: \"painel pilha\", style: \"margin-top:12px\" });\n  const corpo = el(\"div\");\n  let k = Math.min(MEM.exercicio || 0, EXERCICIOS.length - 1);\n  const nav = el(\"div\", { class: \"linha-botoes\" });\n  const desenha = () => {\n    lembra(\"exercicio\", k);\n    nav.replaceChildren(...EXERCICIOS.map((e, j) => el(\"button\", { class: \"b\" + (j === k ? \" on\" : \"\"), onclick: () => { k = j; desenha(); } }, `${j + 1}`)));\n    const e = EXERCICIOS[k];\n    corpo.replaceChildren(el(\"div\", { class: \"grade2\" },\n      codigo({ texto: e.cod, lang: \"java\", titulo: `<b>${k + 1}. ${e.t}<\/b> · código inventado` }),\n      el(\"div\", { class: \"pilha\" }, e.perguntas.map(([p, certo, porque]) => {\n        const q = el(\"div\", { class: \"quiz\" }, el(\"div\", { class: \"q\" }, el(\"code\", null, p)));\n        const lb = el(\"div\", { class: \"linha-botoes\" }), r = el(\"div\", { class: \"r txt\", html: `<p><b>${certo}<\/b>. ${porque}<\/p>` });\n        VALORES[p].forEach((v) => lb.append(el(\"button\", { class: \"b\", onclick: () => { q.classList.add(\"respondida\"); [...lb.children].forEach((b) => { b.classList.remove(\"certa\", \"errada\"); if (b.textContent === certo) b.classList.add(\"certa\"); else if (b.textContent === v) b.classList.add(\"errada\"); }); } }, v)));\n        q.append(lb, r);\n        return q;\n      }))));\n  };\n  box.append(el(\"h3\", { style: \"margin-top:0\" }, \"Classifique você\"), H_(\"<p>Trechos inventados, cada um mostrando uma regra da régua. Escolha o valor; a resposta cita a seção da régua que decide.<\/p>\"), nav, corpo);\n  sec.append(box);\n  desenha();\n}\n\n// ---- main.js ----\n// main.js: as abas e o tema.\n\"use strict\";\n\nconst ABAS = [\n  { id: \"pergunta\", nome: \"0 · A pergunta e o desenho\", init: abaPergunta },\n  { id: \"sequencia\", nome: \"1 · A sequência de verificação\", init: abaSequencia },\n  { id: \"acerto\", nome: \"2 · O que conta como acerto\", init: abaAcerto },\n  { id: \"hipoteses\", nome: \"3 · As hipóteses\", init: abaHipoteses },\n  { id: \"regras\", nome: \"4 · As regras de leitura\", init: abaRegras },\n  { id: \"ameacas\", nome: \"5 · Ameaças e defesas\", init: abaAmeacas },\n  { id: \"conclui\", nome: \"6 · O que se conclui\", init: abaConclui },\n  { id: \"pendencias\", nome: \"7 · O que falta\", init: abaPendencias },\n  { id: \"auto\", nome: \"8 · Autoavaliação\", init: abaAuto },\n];\nconst SECOES = {}, BOTOES = {}, PRONTAS = new Set();\n\nfunction mostraAba(id) {\n  if (!SECOES[id]) id = \"pergunta\";\n  ABA_ATUAL = id;\n  lembra(\"aba\", id);\n  for (const a of ABAS) { SECOES[a.id].classList.toggle(\"ativa\", a.id === id); BOTOES[a.id].classList.toggle(\"ativa\", a.id === id); }\n  if (!PRONTAS.has(id)) {\n    PRONTAS.add(id);\n    try { ABAS.find((a) => a.id === id).init(SECOES[id]); }\n    catch (e) { SECOES[id].append(el(\"div\", { class: \"caixa aviso\" }, \"Erro ao montar esta aba: \" + e.message)); console.error(e); }\n  }\n  BOTOES[id].scrollIntoView({ block: \"nearest\", inline: \"nearest\" });\n  window.scrollTo({ top: 0 });\n}\n\n(function inicia() {\n  const faixa = document.querySelector(\"nav.abas .faixa\");\n  const main = document.querySelector(\"main\");\n  for (const a of ABAS) {\n    BOTOES[a.id] = el(\"button\", { onclick: () => mostraAba(a.id) }, a.nome);\n    faixa.append(BOTOES[a.id]);\n    SECOES[a.id] = el(\"section\", { class: \"aba\", id: \"aba-\" + a.id });\n    main.append(SECOES[a.id]);\n  }\n  const temas = [\"auto\", \"light\", \"dark\"], nomes = { auto: \"tema: automático\", light: \"tema: claro\", dark: \"tema: escuro\" };\n  let tema = temas.includes(MEM.tema) ? MEM.tema : \"auto\";\n  const bt = document.querySelector(\"button.tema\");\n  const pinta = () => { if (tema === \"auto\") document.documentElement.removeAttribute(\"data-theme\"); else document.documentElement.setAttribute(\"data-theme\", tema); bt.textContent = nomes[tema]; };\n  bt.onclick = () => { tema = temas[(temas.indexOf(tema) + 1) % temas.length]; lembra(\"tema\", tema); pinta(); };\n  pinta();\n  mostraAba(MEM.aba || \"pergunta\");\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"</script>

; }\n.linha-botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }\n.quiz { border: 1px dashed var(--accent); border-radius: 10px; padding: 9px 11px; margin-top: 10px; background: var(--bg); }\n.quiz .q { font-weight: 600; margin-bottom: 6px; }\n.quiz .r { margin-top: 8px; display: none; }\n.quiz.respondida .r { display: block; }\n.quiz button.certa { background: var(--ok-bg); border-color: var(--ok); }\n.quiz button.errada { background: var(--bad-bg); border-color: var(--bad); }\n.lista-regras { display: flex; flex-direction: column; gap: 3px; max-height: 75vh; overflow: auto; }\n.lista-regras .grupo { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 2px; }\n.lista-regras button { text-align: left; border: 1px solid transparent; background: none; color: var(--fg); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }\n.lista-regras button:hover { background: var(--bg3); }\n.lista-regras button.ativa { background: var(--cand-bg); border-color: var(--cand); }\n@media (max-width: 1000px) { .lista-regras { flex-direction: row; flex-wrap: wrap; max-height: none; } .lista-regras .grupo { width: 100%; } }\n.arvore { font-family: \"Cascadia Code\", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; }\n.arvore div { white-space: pre; padding: 0 6px; border-radius: 4px; }\n.arvore .foco { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }\n.arvore .ign { color: var(--muted); text-decoration: line-through; }\n.arvore .cop { color: var(--ok); font-weight: 600; }\n.arvore .fora { color: var(--bad); }\n.arvore .proj { background: var(--ok-bg); }\n.tag { display: inline-block; font-family: system-ui, sans-serif; font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 6px; background: var(--bg3); color: var(--muted); }\n.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.fora { background: var(--bad-bg); color: var(--bad); } .tag.cand { background: var(--cand-bg); color: var(--cand); } .tag.reg { background: var(--reg-bg); color: var(--reg); }\n.fita { font-family: \"Cascadia Code\", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 300px; overflow: auto; }\n.fita .codigo-k { color: var(--fg); } .fita .texto-k { color: var(--str); background: rgba(31,122,61,.08); }\n.fita .com-k { color: var(--bad); text-decoration: line-through; background: var(--bad-bg); }\n.fita .atual-k { outline: 2px solid var(--cur); border-radius: 3px; }\n.fita .depois { opacity: .45; }\n.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }\n.no { border: 1px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: var(--fg); box-shadow: var(--shadow); }\n.no:hover { border-color: var(--accent); }\n.no b { display: block; font-family: \"Cascadia Code\", Consolas, monospace; font-size: 13px; }\n.no span { font-size: 13px; color: var(--muted); }\n.no.etapa1 { border-top: 4px solid var(--cand); } .no.etapa2 { border-top: 4px solid var(--reg); } .no.prep { border-top: 4px solid var(--cur); }\n.seta { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }\n.trilha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }\n.trilha .x { background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: \"Cascadia Code\", Consolas, monospace; font-size: 12px; }\n.ped { font-family: \"Cascadia Code\", Consolas, monospace; font-size: 12px; word-break: break-all; }\ntr.cab-ramo td { color: var(--muted); font-style: italic; font-size: 12px; background: var(--bg3); }\ntr.nao-part td { opacity: .5; }\n.cadeado { font-size: 42px; line-height: 1; }\ndetails.r { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg2); margin: 8px 0; }\ndetails.r summary { cursor: pointer; font-weight: 600; }\ndetails.r[open] summary { margin-bottom: 6px; }\n.verif { font-size: 13px; }\n.verif li { margin: 3px 0; }\n.mini { font-size: 12.5px; color: var(--muted); }\nkbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg2); }\n.tema { position: absolute; top: 16px; right: 16px; }\nheader.topo { position: relative; }\n.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }\n.form-grid label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }\ntable.t input[type=text], table.t input[type=number] { padding: 3px 5px; font-size: 12.5px; }\ninput[type=number] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }\ninput[type=range] { width: 100%; }\n.big { font-size: 26px; font-weight: 700; }\n.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }\n.lane { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--bg); font-size: 12.5px; }\n.lane b { display: block; }\n.lane .barra2 { height: 8px; border-radius: 4px; background: var(--bg3); margin-top: 6px; overflow: hidden; }\n.lane .barra2 i { display: block; height: 100%; background: var(--accent); transition: width .4s; }\n.chip { display: inline-block; font-family: \"Cascadia Code\", Consolas, monospace; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--line); margin: 2px; }\n.chip.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }\n.chip.off { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }\n\n<\/style>\n<\/head>\n<body>\n<header class=\"topo\">\n  <h1>Scripts por dentro<\/h1>\n  <p>O resto da bancada: rodar, medir, sortear, conferir e resumir. Vários scripts rodam de verdade aqui.<\/p>\n  <button class=\"b tema\" type=\"button\">tema<\/button>\n<\/header>\n<nav class=\"abas\" aria-label=\"abas\"><div class=\"faixa\"><\/div><\/nav>\n<main><\/main>\n<script>\nwindow.DADOS = {\"fontes\":{\"ref\":\"// Calculadora de referencia do enunciado do Strategy (experiment/prompt/prompt.md).\\n// Dinheiro em centavos inteiros; arredondamento meio-para-o-par em cada etapa.\\n// O P5 e o seguro do envio por regiao (no enunciado da bancada, ate 06/10, era um imposto).\\n//\\n// COMO LER. calcular(pedido) devolve ou { erro: \\\"CODIGO\\\" } ou o resumo, com o dinheiro\\n// em CENTAVOS inteiros (40970 = R$ 409,70), para nao ter erro de ponto flutuante. Ela\\n// segue o enunciado na ordem: primeiro as recusas, na ordem da tabela de erros; depois\\n// subtotal, cupom, frete, seguro, total, ajuste do pagamento, credito e brinde. A suite\\n// (strategy.mjs) compara o servico do agente com ela; os 73 numeros escritos no\\n// enunciado foram conferidos contra ela (check-prompt.mjs), e 4 implementacoes\\n// independentes do Opus 5 chegaram aos mesmos valores nos 21 casos (09/10).\\nexport const PCT_SEGURO = { SUDESTE: 100, SUL: 100, CENTRO_OESTE: 150, NORTE: 250, NORDESTE: 200 }; // em pontos-base\\n\\n// (valorCentavos * pontosBase / 10000), arredondado meio-para-o-par\\nexport function pct(c, bp) {\\n  const num = BigInt(c) * BigInt(bp), den = 10000n;\\n  let q = num / den, r = num % den;\\n  if (r * 2n > den || (r * 2n === den && q % 2n === 1n)) q += 1n;\\n  return Number(q);\\n}\\n// arredonda um numero real (em reais) para centavos, meio-para-o-par\\nexport function centavos(x) {\\n  const v = x * 100, f = Math.floor(v), d = v - f;\\n  if (Math.abs(d - 0.5) < 1e-7) return f % 2 === 0 ? f : f + 1;\\n  return Math.round(v);\\n}\\n\\nexport function calcular(p) {\\n  const itens = p.itens || [];\\n  if (!itens.length || itens.some((i) => !(i.precoUnitario > 0) || !(i.quantidade > 0) || !(i.pesoKg > 0))) return { erro: \\\"PEDIDO_INVALIDO\\\" };\\n  if (![\\\"BRONZE\\\", \\\"PRATA\\\", \\\"OURO\\\"].includes(p.nivelClube)) return { erro: \\\"NIVEL_CLUBE_INVALIDO\\\" };\\n  if (!Object.hasOwn(PCT_SEGURO, p.regiao ?? \\\"\\\")) return { erro: \\\"REGIAO_INVALIDA\\\" };\\n  if (![\\\"ECONOMICA\\\", \\\"EXPRESSA\\\", \\\"RETIRADA_LOJA\\\", \\\"MOTOBOY\\\"].includes(p.modalidadeEntrega)) return { erro: \\\"MODALIDADE_INVALIDA\\\" };\\n  const peso = itens.reduce((s, i) => s + i.pesoKg * i.quantidade, 0);\\n  if (p.modalidadeEntrega === \\\"MOTOBOY\\\" && peso > 5) return { erro: \\\"MODALIDADE_INDISPONIVEL\\\" };\\n  const cupom = p.cupom ?? null;\\n  if (cupom !== null && ![\\\"BEMVINDO10\\\", \\\"MENOS50\\\", \\\"FRETEGRATIS\\\", \\\"LEVE3PAGUE2\\\"].includes(cupom)) return { erro: \\\"CUPOM_INVALIDO\\\" };\\n  const subtotal = itens.reduce((s, i) => s + centavos(i.precoUnitario * i.quantidade), 0);\\n  if (cupom === \\\"MENOS50\\\" && subtotal < 30000) return { erro: \\\"CUPOM_NAO_APLICAVEL\\\" };\\n  if (![\\\"PIX\\\", \\\"CARTAO\\\", \\\"BOLETO\\\"].includes(p.formaPagamento)) return { erro: \\\"FORMA_PAGAMENTO_INVALIDA\\\" };\\n  const n = p.parcelas ?? 1;\\n  if (p.formaPagamento === \\\"CARTAO\\\" ? !(n >= 1 && n <= 12) : n !== 1) return { erro: \\\"PARCELAMENTO_INVALIDO\\\" };\\n\\n  let frete = { ECONOMICA: 1200 + centavos(2 * peso), EXPRESSA: 2500 + centavos(4.5 * peso), RETIRADA_LOJA: 0, MOTOBOY: 1800 }[p.modalidadeEntrega];\\n  const prazo = { ECONOMICA: 7, EXPRESSA: 2, RETIRADA_LOJA: 1, MOTOBOY: 0 }[p.modalidadeEntrega];\\n  if (p.nivelClube === \\\"OURO\\\") frete = 0;\\n  let desconto = 0;\\n  if (cupom === \\\"BEMVINDO10\\\") desconto = pct(subtotal, 1000);\\n  if (cupom === \\\"MENOS50\\\") desconto = 5000;\\n  if (cupom === \\\"FRETEGRATIS\\\") desconto = frete;\\n  if (cupom === \\\"LEVE3PAGUE2\\\") desconto = itens.reduce((s, i) => s + centavos(Math.floor(i.quantidade / 3) * i.precoUnitario), 0);\\n  const seguro = pct(subtotal, PCT_SEGURO[p.regiao]);\\n  const totalPedido = subtotal - desconto + frete + seguro;\\n  if (p.formaPagamento === \\\"BOLETO\\\" && totalPedido > 100000) return { erro: \\\"FORMA_PAGAMENTO_INDISPONIVEL\\\" };\\n\\n  let totalFinal, parcela;\\n  if (p.formaPagamento === \\\"PIX\\\") { totalFinal = totalPedido - pct(totalPedido, 500); parcela = totalFinal; }\\n  if (p.formaPagamento === \\\"BOLETO\\\") { totalFinal = totalPedido + 349; parcela = totalFinal; }\\n  if (p.formaPagamento === \\\"CARTAO\\\") {\\n    if (n <= 3) { totalFinal = totalPedido; parcela = centavos(totalPedido / 100 / n); }\\n    else { const i = 0.0199; parcela = centavos((totalPedido / 100) * i / (1 - Math.pow(1 + i, -n))); totalFinal = parcela * n; }\\n  }\\n  return {\\n    subtotalProdutos: subtotal, descontoCupom: desconto, frete, prazoEntregaDias: prazo, seguro,\\n    ajustePagamento: totalFinal - totalPedido, totalFinal, parcelas: n, valorParcela: parcela,\\n    creditoProximaCompra: p.nivelClube === \\\"PRATA\\\" ? pct(subtotal, 200) : p.nivelClube === \\\"OURO\\\" ? pct(subtotal, 500) : 0,\\n    brinde: p.nivelClube === \\\"OURO\\\" && subtotal > 50000,\\n  };\\n}\\n\",\"mutants\":\"// Mutantes da calculadora de referencia (ref-strategy.mjs): cada um planta UM erro.\\n// Servem para provar que a suite (strategy.mjs) REPROVA codigo errado, e nao so\\n// que aprova o certo. Quem roda: validate-mutants.mjs.\\n//\\n// Criterio para entrar: um mutante por regra do enunciado que tem armadilha.\\n// Erro grosseiro, que qualquer caso pega (aliquota trocada, tarifa esquecida),\\n// nao entra: nao diz nada sobre a suite.\\n//\\n// Cada troca [de, para] precisa aparecer exatamente uma vez no ref-strategy.mjs.\\nexport const MUTANTES = [\\n  { id: \\\"MUT1\\\", regra: \\\"FRETEGRATIS: o frete aparece normalmente e o desconto fica igual ao frete\\\", origem: \\\"erro observado: Haiku HARNESS, TESTE-STRATEGY-01\\\",\\n    trocas: [['if (cupom === \\\"FRETEGRATIS\\\") desconto = frete;', 'if (cupom === \\\"FRETEGRATIS\\\") { frete = 0; desconto = 0; }']] },\\n  { id: \\\"MUT2\\\", regra: \\\"FRETEGRATIS vale para qualquer nivel do clube\\\", origem: \\\"erro observado: Haiku CONTROL, TESTE-STRATEGY-01\\\",\\n    trocas: [['if (cupom === \\\"FRETEGRATIS\\\") desconto = frete;', 'if (cupom === \\\"FRETEGRATIS\\\") desconto = 0;']] },\\n  { id: \\\"MUT3\\\", regra: \\\"arredondamento meio-para-o-par em cada etapa\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [[\\\"if (r * 2n > den || (r * 2n === den && q % 2n === 1n)) q += 1n;\\\", \\\"if (r * 2n >= den) q += 1n;\\\"],\\n             [\\\"return f % 2 === 0 ? f : f + 1;\\\", \\\"return f + 1;\\\"]] },\\n  // MUT4 era \\\"imposto sobre os produtos ja com o desconto\\\"; desde 07/10 o P5 e o seguro,\\n  // sobre os produtos SEM desconto, e o erro plantado e o contrario.\\n  { id: \\\"MUT4\\\", regra: \\\"seguro sobre os produtos sem desconto e sem frete\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [[\\\"pct(subtotal, PCT_SEGURO[p.regiao])\\\", \\\"pct(subtotal - desconto, PCT_SEGURO[p.regiao])\\\"]] },\\n  { id: \\\"MUT5\\\", regra: \\\"precedencia dos erros: regiao antes de modalidade\\\", origem: \\\"erro observado: Haiku HARNESS, TESTE-STRATEGY-01\\\",\\n    trocas: [['  if (!Object.hasOwn(PCT_SEGURO, p.regiao ?? \\\"\\\")) return { erro: \\\"REGIAO_INVALIDA\\\" };\\\\n', \\\"\\\"],\\n             [\\\"  const peso = itens\\\", '  if (!Object.hasOwn(PCT_SEGURO, p.regiao ?? \\\"\\\")) return { erro: \\\"REGIAO_INVALIDA\\\" };\\\\n  const peso = itens']] },\\n  { id: \\\"MUT6\\\", regra: \\\"cartao: ate 3x sem juros\\\", origem: \\\"fronteira\\\",\\n    trocas: [[\\\"if (n <= 3)\\\", \\\"if (n < 3)\\\"]] },\\n  // MUT7 saiu em 03/10, quando o enunciado da bancada definia o limite do boleto de dois\\n  // jeitos, e voltou em 06/10. Desde 07/10 o limite e sobre o total do pedido, que inclui o\\n  // seguro, e o erro plantado e deixar o seguro de fora. Os ids nao mudam.\\n  { id: \\\"MUT7\\\", regra: \\\"boleto recusado quando o total do pedido, com o seguro, passa de R$ 1.000\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [[\\\"totalPedido > 100000\\\", \\\"subtotal - desconto + frete > 100000\\\"]] },\\n  { id: \\\"MUT8\\\", regra: \\\"motoboy leva pedidos de ate 5 kg\\\", origem: \\\"fronteira\\\",\\n    trocas: [[\\\"peso > 5\\\", \\\"peso >= 5\\\"]] },\\n  { id: \\\"MUT9\\\", regra: \\\"LEVE3PAGUE2: a cada 3 unidades de um mesmo item, uma sai de graca\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [[\\\"desconto = itens.reduce((s, i) => s + centavos(Math.floor(i.quantidade / 3) * i.precoUnitario), 0);\\\",\\n              \\\"{ const u = itens.flatMap((i) => Array(i.quantidade).fill(i.precoUnitario)).sort((a, b) => a - b); desconto = u.slice(0, Math.floor(u.length / 3)).reduce((s, x) => s + centavos(x), 0); }\\\"]] },\\n  { id: \\\"MUT10\\\", regra: \\\"brinde do OURO se os produtos passarem de R$ 500\\\", origem: \\\"fronteira\\\",\\n    trocas: [[\\\"subtotal > 50000\\\", \\\"subtotal >= 50000\\\"]] },\\n  { id: \\\"MUT11\\\", regra: \\\"MENOS50 so para compras a partir de R$ 300 em produtos\\\", origem: \\\"fronteira\\\",\\n    trocas: [[\\\"subtotal < 30000\\\", \\\"subtotal <= 30000\\\"]] },\\n  { id: \\\"MUT12\\\", regra: \\\"credito do clube sobre os produtos sem desconto e sem frete\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [['p.nivelClube === \\\"PRATA\\\" ? pct(subtotal, 200) : p.nivelClube === \\\"OURO\\\" ? pct(subtotal, 500) : 0',\\n              'p.nivelClube === \\\"PRATA\\\" ? pct(subtotal - desconto, 200) : p.nivelClube === \\\"OURO\\\" ? pct(subtotal - desconto, 500) : 0']] },\\n  { id: \\\"MUT13\\\", regra: \\\"peso do pedido sem arredondar\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [[\\\"const peso = itens.reduce((s, i) => s + i.pesoKg * i.quantidade, 0);\\\",\\n              \\\"const peso = Math.ceil(itens.reduce((s, i) => s + i.pesoKg * i.quantidade, 0));\\\"]] },\\n  { id: \\\"MUT14\\\", regra: \\\"cartao com juros: parcela arredondada, e o final e parcela x numero de parcelas\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [[\\\"totalFinal = parcela * n;\\\", \\\"totalFinal = centavos((totalPedido / 100) * i / (1 - Math.pow(1 + i, -n)) * n);\\\"]] },\\n  { id: \\\"MUT15\\\", regra: \\\"Pix: 5% de desconto no total do pedido\\\", origem: \\\"armadilha do enunciado\\\",\\n    trocas: [[\\\"totalFinal = totalPedido - pct(totalPedido, 500);\\\", \\\"totalFinal = totalPedido - pct(subtotal, 500);\\\"]] },\\n  { id: \\\"MUT16\\\", regra: \\\"colisao OURO + FRETEGRATIS: o OURO zera o frete, e o desconto do cupom fica igual a esse frete zerado\\\", origem: \\\"colisao citada na hipotese Correcao: casos de borda\\\",\\n    trocas: [['  if (p.nivelClube === \\\"OURO\\\") frete = 0;', '  const freteOriginal = frete;\\\\n  if (p.nivelClube === \\\"OURO\\\") frete = 0;'],\\n             ['if (cupom === \\\"FRETEGRATIS\\\") desconto = frete;', 'if (cupom === \\\"FRETEGRATIS\\\") desconto = freteOriginal;']] },\\n  { id: \\\"MUT17\\\", regra: \\\"boleto so e recusado quando PASSA de R$ 1.000\\\", origem: \\\"fronteira\\\",\\n    trocas: [[\\\"totalPedido > 100000\\\", \\\"totalPedido >= 100000\\\"]] },\\n];\\n\",\"strategy\":\"// Teste de aceitacao do enunciado do Strategy (experiment/prompt/prompt.md),\\n// caixa-preta, pela API. O esperado vem da calculadora de referencia, que\\n// reproduz os 5 exemplos conferidos e a resposta de exemplo do anexo.\\n// A unidade e o CASO, como na hipotese da correcao: passa se todos os campos batem.\\n// Os campos que falharam aparecem nas linhas FALHA, como diagnostico.\\n// Escrita para o enunciado do V4, que corrigiu as contradicoes do da bancada (06/10)\\n// e trocou o imposto pelo seguro por regiao (07/10); por isso nao ha observacoes, so casos.\\n// O enunciado nao diz os numeros de status (07/10): sucesso e qualquer 2xx, recusa e\\n// qualquer 4xx, desde que venha o codigo de erro certo.\\n//\\n// COMO LER. Tres partes: (1) post() manda um pedido ao servico do agente; (2) a lista\\n// \\\"casos\\\" sao os 21 pedidos: os 5 exemplos do enunciado, a resposta do anexo, as\\n// combinacoes que cruzam regras (OURO com FRETEGRATIS, boleto no limite), as recusas\\n// (um pedido que tem de dar erro), a ordem das recusas (\\\"precedencia\\\": dois problemas\\n// no mesmo pedido, qual aparece) e as fronteiras (\\\"ate 5 kg\\\" com 5 kg exatos); (3) o\\n// laco no fim: para cada caso, a calculadora de referencia diz a resposta certa, e o\\n// caso passa se todos os campos baterem. Uma conta vale 1 ou 0; uma recusa vale 1, ou\\n// 0,5 com o codigo certo e status de sucesso.\\nimport { calcular } from \\\"./ref-strategy.mjs\\\";\\nconst BASE = process.env.BASE;\\nlet passaram = 0; const falhas = [];\\nconst post = async (corpo) => {\\n  const r = await fetch(BASE + \\\"/checkout/resumo\\\", { method: \\\"POST\\\", headers: { \\\"Content-Type\\\": \\\"application/json\\\" }, body: JSON.stringify(corpo) });\\n  let j = null; try { j = await r.json(); } catch {}\\n  return { status: r.status, j };\\n};\\nconst cam = { nome: \\\"Camiseta\\\", precoUnitario: 79.90, quantidade: 2, pesoKg: 0.30 };\\nconst ten = { nome: \\\"Tenis\\\", precoUnitario: 249.90, quantidade: 1, pesoKg: 1.20 };\\nconst fone = { nome: \\\"Fone\\\", precoUnitario: 199.90, quantidade: 2, pesoKg: 0.25 };\\nconst meia = { nome: \\\"Meia\\\", precoUnitario: 19.90, quantidade: 7, pesoKg: 0.10 };\\nconst bota = { nome: \\\"Bota\\\", precoUnitario: 349.90, quantidade: 2, pesoKg: 2.10 };\\nconst casos = [\\n  // os exemplos do enunciado, como estao escritos\\n  [\\\"Ex1\\\", { itens: [cam, ten], modalidadeEntrega: \\\"EXPRESSA\\\", cupom: \\\"BEMVINDO10\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"NORTE\\\" }],\\n  [\\\"Ex2\\\", { itens: [cam, ten], modalidadeEntrega: \\\"ECONOMICA\\\", formaPagamento: \\\"CARTAO\\\", parcelas: 6, nivelClube: \\\"PRATA\\\", regiao: \\\"CENTRO_OESTE\\\" }],\\n  [\\\"Ex3\\\", { itens: [fone], modalidadeEntrega: \\\"MOTOBOY\\\", cupom: \\\"MENOS50\\\", formaPagamento: \\\"BOLETO\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"NORDESTE\\\" }],\\n  [\\\"Ex4\\\", { itens: [meia, cam], modalidadeEntrega: \\\"RETIRADA_LOJA\\\", cupom: \\\"LEVE3PAGUE2\\\", formaPagamento: \\\"CARTAO\\\", parcelas: 3, nivelClube: \\\"PRATA\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"Ex5\\\", { itens: [cam, ten], modalidadeEntrega: \\\"EXPRESSA\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"OURO\\\", regiao: \\\"SUDESTE\\\" }],\\n  [\\\"anexo: a resposta de exemplo\\\", { itens: [cam, ten], modalidadeEntrega: \\\"EXPRESSA\\\", cupom: \\\"BEMVINDO10\\\", formaPagamento: \\\"PIX\\\", parcelas: 1, nivelClube: \\\"OURO\\\", regiao: \\\"SUDESTE\\\" }],\\n  [\\\"OURO + FRETEGRATIS + cartao 10x\\\", { itens: [bota], modalidadeEntrega: \\\"EXPRESSA\\\", cupom: \\\"FRETEGRATIS\\\", formaPagamento: \\\"CARTAO\\\", parcelas: 10, nivelClube: \\\"OURO\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"FRETEGRATIS sem OURO\\\", { itens: [cam], modalidadeEntrega: \\\"ECONOMICA\\\", cupom: \\\"FRETEGRATIS\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"PRATA\\\", regiao: \\\"SUDESTE\\\" }],\\n  [\\\"erro: motoboy acima de 5 kg\\\", { itens: [bota, bota], modalidadeEntrega: \\\"MOTOBOY\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"erro: MENOS50 abaixo de 300\\\", { itens: [cam], modalidadeEntrega: \\\"ECONOMICA\\\", cupom: \\\"MENOS50\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"erro: boleto acima de 1000\\\", { itens: [bota, bota], modalidadeEntrega: \\\"ECONOMICA\\\", formaPagamento: \\\"BOLETO\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"erro: pix parcelado\\\", { itens: [cam], modalidadeEntrega: \\\"ECONOMICA\\\", formaPagamento: \\\"PIX\\\", parcelas: 2, nivelClube: \\\"BRONZE\\\", regiao: \\\"SUL\\\" }],\\n  // o limite do boleto e sobre o total do pedido, com o seguro: 990 + 2,5% passa de 1000\\n  [\\\"boleto: o seguro entra no limite\\\", { itens: [{ nome: \\\"Casaco\\\", precoUnitario: 990.00, quantidade: 1, pesoKg: 1.00 }], modalidadeEntrega: \\\"RETIRADA_LOJA\\\", formaPagamento: \\\"BOLETO\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"NORTE\\\" }],\\n  [\\\"precedencia: nivel antes de regiao\\\", { itens: [cam], modalidadeEntrega: \\\"ECONOMICA\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"DIAMANTE\\\", regiao: \\\"MARTE\\\" }],\\n  [\\\"precedencia: regiao antes de modalidade\\\", { itens: [cam], modalidadeEntrega: \\\"DRONE\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"MARTE\\\" }],\\n  [\\\"precedencia: cupom antes de pagamento\\\", { itens: [cam], modalidadeEntrega: \\\"ECONOMICA\\\", cupom: \\\"XPTO\\\", formaPagamento: \\\"CHEQUE\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"precedencia: pedido invalido primeiro\\\", { itens: [], modalidadeEntrega: \\\"DRONE\\\", formaPagamento: \\\"CHEQUE\\\", nivelClube: \\\"X\\\", regiao: \\\"Y\\\" }],\\n  // fronteiras: cada \\\"ate\\\", \\\"passa de\\\" e \\\"a partir de\\\" do enunciado com o valor exato.\\n  // Entraram porque os mutantes MUT8, MUT10, MUT11 e MUT17 passavam pela suite sem eles.\\n  [\\\"fronteira: motoboy com 5 kg exatos\\\", { itens: [{ nome: \\\"Mochila\\\", precoUnitario: 120.00, quantidade: 2, pesoKg: 2.50 }], modalidadeEntrega: \\\"MOTOBOY\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"fronteira: OURO com produtos em 500,00 exatos\\\", { itens: [{ nome: \\\"Jaqueta\\\", precoUnitario: 250.00, quantidade: 2, pesoKg: 1.00 }], modalidadeEntrega: \\\"ECONOMICA\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"OURO\\\", regiao: \\\"SUL\\\" }],\\n  [\\\"fronteira: MENOS50 com produtos em 300,00 exatos\\\", { itens: [{ nome: \\\"Vestido\\\", precoUnitario: 150.00, quantidade: 2, pesoKg: 0.50 }], modalidadeEntrega: \\\"ECONOMICA\\\", cupom: \\\"MENOS50\\\", formaPagamento: \\\"PIX\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"SUL\\\" }],\\n  // 960,00 em produtos + 30,40 de frete + 9,60 de seguro = 1000,00 exatos: o boleto vale\\n  [\\\"fronteira: boleto com 1000,00 exatos\\\", { itens: [{ nome: \\\"Casaco\\\", precoUnitario: 480.00, quantidade: 2, pesoKg: 4.60 }], modalidadeEntrega: \\\"ECONOMICA\\\", formaPagamento: \\\"BOLETO\\\", nivelClube: \\\"BRONZE\\\", regiao: \\\"SUDESTE\\\" }],\\n];\\nconst num = (a, b) => typeof a === \\\"number\\\" && Math.abs(a - b / 100) < 0.001;\\n// Pontos por tipo de caso (decisao de 09/10): a conta vale 1 ou 0; a recusa vale 1\\n// com o codigo e o status de recusa certos, 0,5 com o codigo certo e status de\\n// sucesso (a regra de negocio certa, a convencao do HTTP errada), e 0 no resto.\\n// O RESULTADO continua tudo ou nada; CONTAS, RECUSAS e PONTOS vem depois dele.\\nconst placar = { conta: { pontos: 0, casos: 0 }, recusa: { pontos: 0, casos: 0 } };\\nfor (const [nome, corpo] of casos) {\\n  const antes = falhas.length;\\n  const esp = calcular(corpo);\\n  const tipo = esp.erro ? \\\"recusa\\\" : \\\"conta\\\";\\n  let parcial = 0;\\n  try {\\n    const r = await post(corpo);\\n    if (esp.erro) {\\n      if (!(r.status >= 400 && r.status < 500 && r.j?.erro === esp.erro)) {\\n        if (r.status >= 200 && r.status < 300 && r.j?.erro === esp.erro) parcial = 0.5;\\n        falhas.push(`${nome}: esperado recusa (4xx) ${esp.erro}, veio ${r.status} ${JSON.stringify(r.j)}${parcial ? \\\" [vale 0,5: codigo certo, status de sucesso]\\\" : \\\"\\\"}`);\\n      }\\n    } else if (!(r.status >= 200 && r.status < 300)) {\\n      falhas.push(`${nome}: esperado sucesso (2xx), veio ${r.status} ${JSON.stringify(r.j)}`);\\n    } else {\\n      for (const [k, v] of Object.entries(esp)) {\\n        const got = r.j?.[k];\\n        const
