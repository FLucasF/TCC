t); }\n.linha-botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }\n.quiz { border: 1px dashed var(--accent); border-radius: 10px; padding: 9px 11px; margin-top: 10px; background: var(--bg); }\n.quiz .q { font-weight: 600; margin-bottom: 6px; }\n.quiz .r { margin-top: 8px; display: none; }\n.quiz.respondida .r { display: block; }\n.quiz button.certa { background: var(--ok-bg); border-color: var(--ok); }\n.quiz button.errada { background: var(--bad-bg); border-color: var(--bad); }\n.lista-regras { display: flex; flex-direction: column; gap: 3px; max-height: 75vh; overflow: auto; }\n.lista-regras .grupo { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 2px; }\n.lista-regras button { text-align: left; border: 1px solid transparent; background: none; color: var(--fg); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }\n.lista-regras button:hover { background: var(--bg3); }\n.lista-regras button.ativa { background: var(--cand-bg); border-color: var(--cand); }\n@media (max-width: 1000px) { .lista-regras { flex-direction: row; flex-wrap: wrap; max-height: none; } .lista-regras .grupo { width: 100%; } }\n.arvore { font-family: \"Cascadia Code\", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; }\n.arvore div { white-space: pre; padding: 0 6px; border-radius: 4px; }\n.arvore .foco { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }\n.arvore .ign { color: var(--muted); text-decoration: line-through; }\n.arvore .cop { color: var(--ok); font-weight: 600; }\n.arvore .fora { color: var(--bad); }\n.arvore .proj { background: var(--ok-bg); }\n.tag { display: inline-block; font-family: system-ui, sans-serif; font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 6px; background: var(--bg3); color: var(--muted); }\n.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.fora { background: var(--bad-bg); color: var(--bad); } .tag.cand { background: var(--cand-bg); color: var(--cand); } .tag.reg { background: var(--reg-bg); color: var(--reg); }\n.fita { font-family: \"Cascadia Code\", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 300px; overflow: auto; }\n.fita .codigo-k { color: var(--fg); } .fita .texto-k { color: var(--str); background: rgba(31,122,61,.08); }\n.fita .com-k { color: var(--bad); text-decoration: line-through; background: var(--bad-bg); }\n.fita .atual-k { outline: 2px solid var(--cur); border-radius: 3px; }\n.fita .depois { opacity: .45; }\n.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }\n.no { border: 1px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: var(--fg); box-shadow: var(--shadow); }\n.no:hover { border-color: var(--accent); }\n.no b { display: block; font-family: \"Cascadia Code\", Consolas, monospace; font-size: 13px; }\n.no span { font-size: 13px; color: var(--muted); }\n.no.etapa1 { border-top: 4px solid var(--cand); } .no.etapa2 { border-top: 4px solid var(--reg); } .no.prep { border-top: 4px solid var(--cur); }\n.seta { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }\n.trilha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }\n.trilha .x { background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: \"Cascadia Code\", Consolas, monospace; font-size: 12px; }\n.ped { font-family: \"Cascadia Code\", Consolas, monospace; font-size: 12px; word-break: break-all; }\ntr.cab-ramo td { color: var(--muted); font-style: italic; font-size: 12px; background: var(--bg3); }\ntr.nao-part td { opacity: .5; }\n.cadeado { font-size: 42px; line-height: 1; }\ndetails.r { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg2); margin: 8px 0; }\ndetails.r summary { cursor: pointer; font-weight: 600; }\ndetails.r[open] summary { margin-bottom: 6px; }\n.verif { font-size: 13px; }\n.verif li { margin: 3px 0; }\n.mini { font-size: 12.5px; color: var(--muted); }\nkbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg2); }\n.tema { position: absolute; top: 16px; right: 16px; }\nheader.topo { position: relative; }\n\n<\/style>\n<\/head>\n<body>\n<header class=\"topo\">\n  <h1>Métricas por dentro<\/h1>\n  <p>SonarQube e CK no experimento: o que cada número mede, conferido em exemplos inventados.<\/p>\n  <button class=\"b tema\" type=\"button\">tema<\/button>\n<\/header>\n<nav class=\"abas\" aria-label=\"abas\"><div class=\"faixa\"><\/div><\/nav>\n<main><\/main>\n<script>\nwindow.DADOS = {\"fontes\":{\"metrics\":\"#!/usr/bin/env bash\\n# Metricas automaticas do codigo de cada execucao de um lote: CK e SonarQube.\\n#\\n# Uso (Git Bash):\\n#   evaluation/tools/metrics.sh <prefixo>        (ex.: TESTE-STRATEGY-01)\\n#\\n# Mede o codigo de producao (src/main/java), ja compilado pelo build da bancada\\n# (target/classes, que o SonarQube precisa para analisar Java). Nao julga nada:\\n# so extrai numeros, e por isso roda direto em runs/, sem pacote anonimizado.\\n# Uma ferramenta nao sabe qual e o braco; a cegueira protege o julgamento humano.\\n#\\n# Pre-requisitos:\\n#   - Docker aberto, com o servidor tcc-sonarqube no ar (ver evaluation/tools/README.md)\\n#   - .env.sonar na raiz, com SONAR_TOKEN=... (fora do git; nunca e impresso)\\n#\\n# Saida: evaluation/metrics/<prefixo>/<run_id>/ (ck/ e sonar/) e, no fim,\\n# evaluation/metrics/<prefixo>/metricas.csv, uma linha por execucao.\\n# Recusa rodar se a pasta de saida ja existe, ou se alguma execucao ja foi\\n# analisada no SonarQube: uma analise nunca e refeita por cima de outra.\\n#\\n# COMO LER. Duas ferramentas, as duas so contam, sem julgar:\\n#   - o CK (um .jar) le o codigo-fonte e mede cada classe: acoplamento (CBO),\\n#     complexidade somada dos metodos (WMC), coesao (LCOM), heranca (DIT)...\\n#   - o SonarQube (um servidor no Docker) recebe o codigo e as classes compiladas por\\n#     um \\\"scanner\\\" e devolve linhas de codigo, complexidade ciclomatica e COGNITIVA (a\\n#     hipotese da qualidade), duplicacao e code smells.\\n# Tres partes: (1) preflight: confere que as versoes sao as travadas (o hash do .jar\\n# do CK, a imagem do SonarQube e do scanner) e que nenhuma execucao foi analisada\\n# antes; (2) por execucao: acha o projeto, roda o CK, roda o scanner e espera o\\n# servidor devolver as medidas; (3) no fim, o aggregate-metrics.mjs junta tudo no CSV.\\n# O SonarQube fica DESLIGADO durante as execucoes do V4 e ligado so para esta etapa.\\n\\nset -uo pipefail\\nmorrer() { printf '\\\\033[31mERRO: %s\\\\033[0m\\\\n' \\\"$*\\\" >&2; exit 1; }\\n\\n[ $# -eq 1 ] || morrer \\\"uso: $0 <prefixo>\\\"\\nPREFIXO=\\\"$1\\\"\\ncase \\\"$PREFIXO\\\" in \\\"\\\"|*[!A-Za-z0-9-]*) morrer \\\"prefixo invalido: '$PREFIXO'\\\" ;; esac\\n\\nRAIZ=\\\"$(cd \\\"$(dirname \\\"${BASH_SOURCE[0]}\\\")/../..\\\" && pwd -P)\\\"\\nOUT=\\\"$RAIZ/evaluation/metrics/$PREFIXO\\\"\\nENV_SONAR=\\\"$RAIZ/.env.sonar\\\"\\n\\n# As versoes travadas. Mudar qualquer uma destas e um instrumento novo.\\nCK_JAR=\\\"$RAIZ/evaluation/tools/ck/ck-0.7.1-8a1ef916-jar-with-dependencies.jar\\\"\\nCK_SHA256=\\\"f3c0e5bc159189ebd213badf693ab792a31cbea749eb9f97b9185938c54a7baf\\\"\\nSONAR_IMAGE_ID=\\\"sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1\\\"\\nSCANNER=\\\"sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57\\\"\\nSONAR_URL=\\\"http://localhost:9000\\\"\\nREDE=\\\"tcc-sonar-net\\\"\\nMETRICAS=\\\"ncloc,classes,functions,complexity,cognitive_complexity,duplicated_lines_density,duplicated_blocks,code_smells,sqale_index\\\"\\n\\n# ------------------------------------------------------------------ preflight\\n[ -f \\\"$CK_JAR\\\" ] || morrer \\\"falta o CK em $CK_JAR\\\"\\n[ \\\"$(sha256sum \\\"$CK_JAR\\\" | cut -d' ' -f1)\\\" = \\\"$CK_SHA256\\\" ] || morrer \\\"o .jar do CK nao e o travado (sha256 diferente)\\\"\\n[ -f \\\"$ENV_SONAR\\\" ] && grep -q '^SONAR_TOKEN=.\\\\+' \\\"$ENV_SONAR\\\" || morrer \\\"falta $ENV_SONAR com SONAR_TOKEN=...\\\"\\n[ \\\"$(docker inspect --format '{{.Image}}' tcc-sonarqube 2>/dev/null)\\\" = \\\"$SONAR_IMAGE_ID\\\" ] \\\\\\n    || morrer \\\"o container tcc-sonarqube nao existe ou nao usa a imagem travada\\\"\\n[ \\\"$(docker inspect --format '{{.State.Running}}' tcc-sonarqube)\\\" = \\\"true\\\" ] || morrer \\\"tcc-sonarqube esta parado (docker start tcc-sonarqube)\\\"\\ncurl -s \\\"$SONAR_URL/api/system/status\\\" | grep -q '\\\"status\\\":\\\"UP\\\"' || morrer \\\"o SonarQube nao esta pronto em $SONAR_URL\\\"\\ndocker image inspect \\\"$SCANNER\\\" >/dev/null 2>&1 || morrer \\\"falta a imagem travada do scanner\\\"\\ndocker network inspect \\\"$REDE\\\" >/dev/null 2>&1 || docker network create \\\"$REDE\\\" >/dev/null\\ndocker network inspect \\\"$REDE\\\" --format '{{range .Containers}}{{.Name}} {{end}}' | grep -qw tcc-sonarqube \\\\\\n    || docker network connect \\\"$REDE\\\" tcc-sonarqube\\n\\nRUNS=\\\"$(cd \\\"$RAIZ/runs\\\" && ls -d \\\"$PREFIXO\\\"-* 2>/dev/null | LC_ALL=C sort)\\\"\\n[ -n \\\"$RUNS\\\" ] || morrer \\\"nenhuma execucao runs/$PREFIXO-*\\\"\\n[ -e \\\"$OUT\\\" ] && morrer \\\"$OUT ja existe: apague a pasta para refazer\\\"\\n\\n# O token so vive nesta variavel; nunca e impresso.\\nTOKEN=\\\"$(sed -n 's/^SONAR_TOKEN=//p' \\\"$ENV_SONAR\\\" | tr -d '\\\\r\\\\n ')\\\"\\nfor run in $RUNS; do\\n    code=\\\"$(curl -s -o /dev/null -w '%{http_code}' -u \\\"$TOKEN:\\\" \\\"$SONAR_URL/api/components/show?component=$run\\\")\\\"\\n    [ \\\"$code\\\" = \\\"404\\\" ] || morrer \\\"$run ja foi analisada no SonarQube (HTTP $code): nao se refaz por cima\\\"\\ndone\\n\\nmkdir -p \\\"$OUT\\\"\\nexport MSYS_NO_PATHCONV=1\\nprintf '\\\\033[36m=== metricas %s: %s execucoes ===\\\\033[0m\\\\n' \\\"$PREFIXO\\\" \\\"$(echo \\\"$RUNS\\\" | wc -l)\\\"\\n\\n# ------------------------------------------------------------------ por execucao\\nfor run in $RUNS; do\\n    dir=\\\"$OUT/$run\\\"; mkdir -p \\\"$dir/ck\\\" \\\"$dir/sonar\\\"\\n    # O pom mais raso, como no build da bancada: o agente escolhe onde poe o projeto.\\n    pom=\\\"$(find \\\"$RAIZ/runs/$run/workspace\\\" -name pom.xml -not -path '*/target/*' -printf '%d %p\\\\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2-)\\\"\\n    if [ -z \\\"$pom\\\" ]; then echo \\\"sem_pom\\\" > \\\"$dir/status\\\"; echo \\\"  $run: sem pom\\\"; continue; fi\\n    proj=\\\"$(dirname \\\"$pom\\\")\\\"\\n    if [ ! -d \\\"$proj/src/main/java\\\" ]; then echo \\\"sem_src_main_java\\\" > \\\"$dir/status\\\"; echo \\\"  $run: sem src/main/java\\\"; continue; fi\\n\\n    java -jar \\\"$(cygpath -w \\\"$CK_JAR\\\")\\\" \\\"$(cygpath -w \\\"$proj/src/main/java\\\")\\\" false 0 false \\\"$(cygpath -w \\\"$dir/ck\\\")/\\\" \\\\\\n        > \\\"$dir/ck/ck.log\\\" 2>&1 || { echo \\\"ck_falhou\\\" > \\\"$dir/status\\\"; echo \\\"  $run: CK falhou\\\"; continue; }\\n\\n    if [ ! -d \\\"$proj/target/classes\\\" ]; then echo \\\"sem_classes\\\" > \\\"$dir/status\\\"; echo \\\"  $run: CK ok, sem classes compiladas para o SonarQube\\\"; continue; fi\\n    docker run --rm --network \\\"$REDE\\\" --env-file \\\"$(cygpath -w \\\"$ENV_SONAR\\\")\\\" -e SONAR_HOST_URL=http://tcc-sonarqube:9000 \\\\\\n        --mount \\\"type=bind,source=$(cygpath -w \\\"$proj\\\"),target=/usr/src,readonly\\\" \\\\\\n        -v tcc-sonar-scannercache:/opt/sonar-scanner/.sonar/cache \\\\\\n        \\\"$SCANNER\\\" \\\\\\n        -Dsonar.projectKey=\\\"$run\\\" -Dsonar.sources=src/main/java -Dsonar.java.binaries=target/classes \\\\\\n        -Dsonar.java.source=21 -Dsonar.scm.disabled=true -Dsonar.working.directory=/tmp/scannerwork \\\\\\n        > \\\"$dir/sonar/scanner.log\\\" 2>&1 || { echo \\\"sonar_falhou\\\" > \\\"$dir/status\\\"; echo \\\"  $run: SonarQube falhou\\\"; continue; }\\n\\n    # O servidor processa o relatorio depois do scanner sair: espera as medidas.\\n    ok=\\\"\\\"\\n    for i in $(seq 1 40); do\\n        curl -s -u \\\"$TOKEN:\\\" \\\"$SONAR_URL/api/measures/component?component=$run&metricKeys=$METRICAS\\\" > \\\"$dir/sonar/measures.json\\\"\\n        grep -q '\\\"measures\\\":\\\\[{' \\\"$dir/sonar/measures.json\\\" && { ok=1; break; }\\n        sleep 3\\n    done\\n    [ -n \\\"$ok\\\" ] || { echo \\\"sonar_sem_medidas\\\" > \\\"$dir/status\\\"; echo \\\"  $run: SonarQube nao devolveu medidas\\\"; continue; }\\n    echo \\\"ok\\\" > \\\"$dir/status\\\"; echo \\\"  $run: ok\\\"\\ndone\\n\\nnode \\\"$(cygpath -w \\\"$RAIZ/evaluation/tools/aggregate-metrics.mjs\\\")\\\" \\\"$PREFIXO\\\"\\n\",\"aggregate\":\"// Junta as metricas de um lote (CK e SonarQube) num CSV, uma linha por execucao.\\n//\\n// Uso:\\n//   node evaluation/tools/aggregate-metrics.mjs <prefixo>\\n//\\n// Le evaluation/metrics/<prefixo>/<run_id>/ (o que o metrics.sh gravou) e o\\n// meta.json de cada execucao, so para identificar modelo, braco e replica.\\n// Grava evaluation/metrics/<prefixo>/metricas.csv. So junta numeros: nenhuma\\n// leitura nem nota sai daqui.\\n//\\n// COMO LER. Para cada execucao: as colunas sonar_* vem do measures.json (o que o\\n// servidor do SonarQube devolveu); as colunas ck_* vem do class.csv do CK (uma linha\\n// por classe), resumidas em contagens, medias e maximos. A coluna \\\"condition\\\" diz\\n// CONTROL ou HARNESS, e a \\\"nivel\\\" diz N0 a N3 (tirada do fim do run_id).\\n\\nimport { readdirSync, readFileSync, existsSync, writeFileSync } from \\\"node:fs\\\";\\nimport { join, dirname } from \\\"node:path\\\";\\nimport { fileURLToPath } from \\\"node:url\\\";\\n\\nconst RAIZ = join(dirname(fileURLToPath(import.meta.url)), \\\"..\\\", \\\"..\\\");\\nconst prefixo = process.argv[2];\\nif (!prefixo) { console.error(\\\"uso: node evaluation/tools/aggregate-metrics.mjs <prefixo>\\\"); process.exit(1); }\\nconst OUT = join(RAIZ, \\\"evaluation\\\", \\\"metrics\\\", prefixo);\\nif (!existsSync(OUT)) { console.error(`nao existe ${OUT}: rode antes o metrics.sh`); process.exit(1); }\\n\\n// CSV do CK: os campos nao trazem virgula, mas o caminho do arquivo pode trazer\\n// aspas no Windows; este leitor respeita aspas.\\nfunction lerCsv(texto) {\\n  const linhas = texto.replace(/\\\\r/g, \\\"\\\").split(\\\"\\\\n\\\").filter(Boolean);\\n  const campos = (l) => { const r = []; let c = \\\"\\\", q = false;\\n    for (const ch of l) { if (ch === '\\\"') q = !q; else if (ch === \\\",\\\" && !q) { r.push(c); c = \\\"\\\"; } else c += ch; }\\n    r.push(c); return r; };\\n  const cab = campos(linhas[0]);\\n  return linhas.slice(1).map((l) => Object.fromEntries(campos(l).map((v, i) => [cab[i], v])));\\n}\\nconst num = (v) => (v === undefined || v === \\\"\\\" || isNaN(Number(v)) ? null : Number(v));\\nconst media = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);\\nconst fmt = (v) => (v === null || v === undefined ? \\\"\\\" : Number.isInteger(v) ? String(v) : v.toFixed(3));\\n\\nconst SONAR = [\\\"ncloc\\\", \\\"classes\\\", \\\"functions\\\", \\\"complexity\\\", \\\"cognitive_complexity\\\",\\n  \\\"duplicated_lines_density\\\", \\\"duplicated_blocks\\\", \\\"code_smells\\\", \\\"sqale_index\\\"];\\nconst TIPOS = [\\\"class\\\", \\\"interface\\\", \\\"enum\\\", \\\"record\\\"];\\n\\nconst linhas = [];\\nfor (const run of readdirSync(OUT, { withFileTypes: true }).filter((d) => d.isDirectory()).map((d) => d.name).sort()) {\\n  const dir = join(OUT, run);\\n  const meta = JSON.parse(readFileSync(join(RAIZ, \\\"runs\\\", run, \\\"meta.json\\\"), \\\"utf8\\\"));\\n  const status = existsSync(join(dir, \\\"status\\\")) ? readFileSync(join(dir, \\\"status\\\"), \\\"utf8\\\").trim() : \\\"incompleto\\\";\\n  // O nivel (N0 a N3) e o fim do run_id do V4 (V4-STRATEGY-01-HAIKU45-N2); vazio nos\\n  // lotes da bancada, que tinham so CONTROL e HARNESS (coluna nivel desde 09/10).\\n  const nivel = run.match(/-(N\\\\d)$/)?.[1] ?? \\\"\\\";\\n  const l = { run_id: run, model: meta.model_requested, condition: meta.condition, nivel, replicate: meta.replicate ?? \\\"\\\", status };\\n\\n  const sonarArq = join(dir, \\\"sonar\\\", \\\"measures.json\\\");\\n  const medidas = existsSync(sonarArq) ? JSON.parse(readFileSync(sonarArq, \\\"utf8\\\")).component?.measures ?? [] : [];\\n  for (const k of SONAR) l[`sonar_${k}`] = num(medidas.find((m) => m.metric === k)?.value);\\n\\n  // O CK conta como \\\"anonymous\\\" o corpo de cada constante de enum com\\n  // comportamento proprio (e as classes anonimas). Contagens e medias usam so os\\n  // tipos com nome, o mesmo criterio do sonar_classes; as anonimas vao numa\\n  // coluna propria, porque medem um desenho (o enum com corpo por constante).\\n  // A soma de WMC usa tudo: a logica dentro das constantes tambem e codigo.\\n  const ckArq = join(dir, \\\"ck\\\", \\\"class.csv\\\");\\n  const todos = existsSync(ckArq) ? lerCsv(readFileSync(ckArq, \\\"utf8\\\")) : [];\\n  const cls = todos.filter((c) => TIPOS.includes(c.type));\\n  l.ck_tipos = todos.length ? cls.length : null;\\n  for (const t of TIPOS) l[`ck_${t}`] = todos.length ? cls.filter((c) => c.type === t).length : null;\\n  l.ck_anonymous = todos.length ? todos.filter((c) => c.type === \\\"anonymous\\\").length : null;\\n  const col = (k, lista = cls) => lista.map((c) => num(c[k])).filter((v) => v !== null);\\n  l.ck_cbo_media = media(col(\\\"cbo\\\")); l.ck_cbo_max = col(\\\"cbo\\\").length ? Math.max(...col(\\\"cbo\\\")) : null;\\n  l.ck_wmc_soma = col(\\\"wmc\\\", todos).length ? col(\\\"wmc\\\", todos).reduce((s, x) => s + x, 0) : null;\\n  l.ck_wmc_max = col(\\\"wmc\\\").length ? Math.max(...col(\\\"wmc\\\")) : null;\\n  l.ck_lcom_media = media(col(\\\"lcom\\\")); l.ck_rfc_media = media(col(\\\"rfc\\\"));\\n  l.ck_dit_max = col(\\\"dit\\\").length ? Math.max(...col(\\\"dit\\\")) : null;\\n  linhas.push(l);\\n}\\n\\nconst colunas = Object.keys(linhas[0] ?? {});\\nconst celula = (v) => (v === null || v === undefined ? \\\"\\\" : typeof v === \\\"number\\\" ? fmt(v) : String(v));\\nconst csv = [colunas.join(\\\",\\\"), ...linhas.map((l) => colunas.map((c) => celula(l[c])).join(\\\",\\\"))].join(\\\"\\\\n\\\") + \\\"\\\\n\\\";\\nwriteFileSync(join(OUT, \\\"metricas.csv\\\"), csv);\\nconsole.log(`${linhas.length} execucoes -> evaluation/metrics/${prefixo}/metricas.csv (${colunas.length} colunas)`);\\nfor (const l of linhas) console.log(`  ${l.run_id.padEnd(34)} ${l.status}`);\\n\"},\"ex\":{\"A-remendo\":{\"arquivos\":{\"FreteService.java\":\"package com.loja.frete;\\n\\nimport java.math.BigDecimal;\\n\\npublic class FreteService {\\n\\n    public BigDecimal frete(String nivel, BigDecimal pesoKg, String regiao) {\\n        BigDecimal base = new BigDecimal(\\\"12\\\").add(pesoKg.multiply(new BigDecimal(\\\"2\\\")));\\n        if (nivel.equals(\\\"OURO\\\")) {\\n            return BigDecimal.ZERO;\\n        } else if (nivel.equals(\\\"PRATA\\\")) {\\n            if (regiao.equals(\\\"NORTE\\\") || regiao.equals(\\\"NORDESTE\\\")) {\\n                return base.multiply(new BigDecimal(\\\"0.8\\\"));\\n            }\\n            return base.multiply(new BigDecimal(\\\"0.5\\\"));\\n        } else {\\n            return base;\\n        }\\n    }\\n\\n    public int prazo(String nivel, int distanciaKm) {\\n        int dias = 0;\\n        for (int km = 0; km < distanciaKm; km += 500) {\\n            if (nivel.equals(\\\"BRONZE\\\")) {\\n                dias += 2;\\n            } else {\\n                dias += 1;\\n            }\\n        }\\n        return nivel.equals(\\\"OURO\\\") ? Math.max(1, dias - 1) : dias;\\n    }\   sec.append(barra, barraArq, corpo);\r\n  const mostra = (p, f) => {\r\n    lembra(\"exProj\", p); lembra(\"exArq\", f);\r\n    barra.replaceChildren(...Object.keys(EX).map((k) => el(\"button\", { class: \"b\" + (k === p ? \" on\" : \"\"), onclick: () => mostra(k, Object.keys(EX[k].arquivos)[0]) }, NOME_EX[k])));\r\n    barraArq.replaceChildren(el(\"span\", { class: \"mini\" }, \"arquivo: \"), ...Object.keys(EX[p].arquivos).map((k) => el(\"button\", { class: \"b\" + (k === f ? \" on\" : \"\"), onclick: () => mostra(p, k) }, k)));\r\n    const s = EX[p].sonar.projeto, a = EX[p].sonar.porArquivo[f], c = EX[p].ck.find((x) => x.classe + \".java\" === f);\r\n    corpo.replaceChildren(el(\"div\", { class: \"grade2\" },\r\n      codigo({ texto: arq(p, f), lang: \"java\", titulo: `<b>${esc(f)}<\/b> · projeto ${esc(p)}` }),\r\n      el(\"div\", { class: \"painel pilha\" },\r\n        H(`<p>${SOBRE[p]}<\/p>`),\r\n        el(\"div\", { class: \"rotulo\" }, \"SonarQube, este arquivo\"),\r\n        tabela(null, [[\"linhas de código (ncloc)\", a.ncloc], [\"funções\", a.functions], [\"complexidade ciclomática\", a.complexity], [\"complexidade cognitiva\", a.cognitive_complexity], [\"linhas duplicadas\", a.duplicated_lines], [\"code smells\", a.code_smells]], { estado: true, rolagem: false }),\r\n        c ? el(\"div\", { class: \"rotulo\" }, \"CK, esta classe\") : null,\r\n        c ? tabela(null, [[\"CBO\", c.cbo], [\"WMC\", c.wmc], [\"DIT\", c.dit], [\"RFC\", c.rfc], [\"LCOM\", c.lcom], [\"métodos / campos\", `${c.metodos} / ${c.campos}`]], { estado: true, rolagem: false }) : null,\r\n        el(\"div\", { class: \"rotulo\" }, \"SonarQube, o projeto inteiro\"),\r\n        tabela(null, [[\"linhas de código\", s.ncloc], [\"classes\", s.classes], [\"complexidade cognitiva\", s.cognitive_complexity], [\"duplicação\", fmt(s.duplicated_lines_density) + \"%\"], [\"code smells\", s.code_smells], [\"dívida técnica\", s.sqale_index + \" min\"]], { estado: true, rolagem: false }))));\r\n  };\r\n  const p0 = EX[MEM.exProj] ? MEM.exProj : \"A-remendo\";\r\n  mostra(p0, EX[p0].arquivos[MEM.exArq] ? MEM.exArq : Object.keys(EX[p0].arquivos)[0]);\r\n}\r\n\r\n// =====================================================================\r\n// 2 e 3. As duas complexidades (passo a passo, somando)\r\n// =====================================================================\r\n// itens: {l, tok, oc, mais, por}; mostra a conta acumulada e, no fim, compara com a ferramenta\r\nfunction passosContagem(texto, itens, unidade) {\r\n  let soma = 0;\r\n  return itens.map((it) => { soma += it.mais; return { ...it, soma, unidade }; });\r\n}\r\nfunction desenhaContagem(texto, titulo, passos, extraFim) {\r\n  return (p, i, corpo) => {\r\n    const feitos = passos.slice(0, i + 1).filter((x) => x.l);\r\n    const mk = feitos.filter((x) => x.tok).map((x) => tok(texto, x.l, x.tok, x === p ? \"m-hitsel\" : (x.mais ? \"m-ok\" : \"m-fora\"), x.oc || 1));\r\n    const notas = {};\r\n    for (const x of feitos.filter((y) => !y.semNota)) notas[x.l] = { txt: (notas[x.l] ? notas[x.l].txt + \" \" : \"\") + (x.mais > 0 ? \"+\" + x.mais : \"+0\"), cls: x.mais ? \"ok\" : \"fora\" };\r\n    const ledger = tabela([\"linha\", \"o quê\", \"soma\", \"total\"], feitos.map((x) => ({ cls: x === p ? null : null, cels: [x.l, x.por, x.mais > 0 ? \"+\" + x.mais : \"0\", `<b>${x.soma}<\/b>`] })));\r\n    duasColunas(corpo,\r\n      codigo({ texto, lang: \"java\", titulo, atual: p.l ? [[p.l, p.l]] : [], marcas: mk, notas }),\r\n      explicacao({ t: p.t, txt: p.txt, quiz: p.quiz }, [\r\n        el(\"div\", { class: \"caixa aconteceu\" }, el(\"div\", { class: \"rotulo\" }, \"▶ a conta até aqui\"), H(`<p style=\"font-size:22px;margin:0\"><b>${p.soma}<\/b> <span class=\"mini\">${p.unidade}<\/span><\/p>`)),\r\n        el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, \"cada soma\"), ledger),\r\n        p.fim ? extraFim() : null,\r\n      ]));\r\n  };\r\n}\r\n\r\nfunction abaCiclomatica(sec) {\r\n  const F = arq(\"A-remendo\", \"FreteService.java\");\r\n  const L = (s, d) => ln(F, s, d);\r\n  const lElse1 = L(\"} else {\", L(\"if (regiao.equals\")), lElse2 = L(\"} else {\", L('if (nivel.equals(\"BRONZE\"))'));\r\n  sec.append(el(\"h2\", null, \"Complexidade ciclomática\"),\r\n    el(\"p\", { class: \"lead\", html: \"Quantos <b>caminhos<\/b> diferentes o código pode seguir. No SonarQube é a medida <code>complexity<\/code>; no CK, a soma dela pelos métodos da classe é o <b>WMC<\/b>. Aqui, contada à mão no <code>FreteService<\/code> do projeto A, e comparada com as duas ferramentas.\" }));\r\n  const host = el(\"div\"); sec.append(host);\r\n  const passos = passosContagem(F, [\r\n    { t: \"A regra\", txt: \"<p>Começa em <b>1 por método<\/b> (o caminho reto) e soma <b>+1 a cada ponto de decisão<\/b>: <code>if<\/code>, <code>for<\/code>, <code>while<\/code>, <code>case<\/code>, ternário (<code>? :<\/code>) e cada <code>&amp;&amp;<\/code> ou <code>||<\/code>. O <code>else<\/code> não soma: ele é o outro lado de um <code>if<\/code> que já foi contado.<\/p><p>Aninhar não muda nada aqui: um <code>if<\/code> dentro de outro vale +1, igual ao de fora. (É essa a diferença para a cognitiva, na próxima aba.)<\/p>\", mais: 0, por: \"\" },\r\n    { t: \"O método frete\", l: L(\"public BigDecimal frete(\"), tok: \"frete\", mais: 1, por: \"método\", txt: \"<p>Todo método começa com 1: existe pelo menos um caminho.<\/p>\" },\r\n    { t: \"if\", l: L('if (nivel.equals(\"OURO\"))'), tok: \"if\", mais: 1, por: \"<code>if<\/code>\", txt: \"<p>Uma decisão: o código pode entrar ou não. +1.<\/p>\" },\r\n    { t: \"else if\", l: L(\"else if\"), tok: \"if\", mais: 1, por: \"<code>else if<\/code>\", txt: \"<p>O <code>else if<\/code> é outro <code>if<\/code>: mais uma decisão. +1.<\/p>\" },\r\n    { t: \"o if de dentro\", l: L(\"if (regiao.equals\"), tok: \"if\", mais: 1, por: \"<code>if<\/code> aninhado\", txt: \"<p>Um <code>if<\/code> dentro do <code>else if<\/code>. Para a ciclomática, aninhado ou não, é +1.<\/p>\" },\r\n    { t: \"||\", l: L(\"if (regiao.equals\"), tok: \"||\", mais: 1, por: \"<code>||<\/code>\", txt: \"<p>O <code>||<\/code> cria um caminho a mais: a condição pode ser verdadeira pelo lado esquerdo <b>ou<\/b> pelo direito. +1.<\/p>\" },\r\n    { t: \"else\", l: lElse1, tok: \"else\", mais: 0, por: \"<code>else<\/code>\", txt: \"<p>O <code>else<\/code> não soma: ele é só o \\\"senão\\\" de uma decisão já contada.<\/p>\" },\r\n    { t: \"Fim do frete: 5\", l: L(\"public BigDecimal frete(\"), tok: \"frete\", mais: 0, por: \"fim do método\", semNota: true, txt: \"<p>O método <code>frete<\/code> tem complexidade <b>5<\/b>.<\/p>\", aconteceu: true },\r\n    { t: \"O método prazo\", l: L(\"public int prazo(\"), tok: \"prazo\", mais: 1, por: \"método\", txt: \"<p>Outro método, outro 1.<\/p>\" },\r\n    { t: \"for\", l: L(\"for (int km\"), tok: \"for\", mais: 1, por: \"<code>for<\/code>\", txt: \"<p>Um laço é uma decisão (\\\"de novo ou para?\\\"). +1.<\/p>\" },\r\n    { t: \"if dentro do for\", l: L('if (nivel.equals(\"BRONZE\"))'), tok: \"if\", mais: 1, por: \"<code>if<\/code>\", txt: \"<p>+1, mesmo estando dentro do <code>for<\/code>.<\/p>\" },\r\n    { t: \"else\", l: lElse2, tok: \"else\", mais: 0, por: \"<code>else<\/code>\", txt: \"<p>0, de novo.<\/p>\" },\r\n    { t: \"ternário\", l: L('return nivel.equals(\"OURO\") ?'), tok: \"?\", mais: 1, por: \"ternário <code>? :<\/code>\", txt: \"<p>O ternário é um <code>if<\/code> numa linha só. +1.<\/p>\" },\r\n    { t: \"Resultado: 9\", l: null, mais: 0, por: \"\", fim: true, txt: \"<p>Total do arquivo: 5 + 4 = <b>9<\/b>. Agora, o que as ferramentas reais disseram:<\/p>\" },\r\n  ], \"pontos de complexidade ciclomática\");\r\n  passos[7].txt += `<p>O CK, que mede por método, deu ${EX[\"A-remendo\"].metodos.find((m) => m.classe === \"FreteService\" && m.metodo === \"frete\").wmc} para o <code>frete<\/code>. ${sim(EX[\"A-remendo\"].metodos.find((m) => m.classe === \"FreteService\" && m.metodo === \"frete\").wmc === 5)}<\/p>`;\r\n  const fim = () => {\r\n    const s = EX[\"A-remendo\"].sonar.porArquivo[\"FreteService.java\"].complexity, c = EX[\"A-remendo\"].ck.find((x) => x.classe === \"FreteService\").wmc;\r\n    const sB = EX[\"B-strategy\"].sonar.projeto.complexity, sA = EX[\"A-remendo\"].sonar.projeto.complexity;\r\n    const ni = EX[\"B-strategy\"];\r\n    return el(\"div\", { class: \"pilha\" },\r\n      el(\"div\", { class: \"caixa certo\", html: `<p>SonarQube, <code>complexity<\/code> do arquivo: <b>${s}<\/b> ${sim(s === 9)}<br>CK, <code>wmc<\/code> da classe: <b>${c}<\/b> ${sim(c === 9)}<\/p>` }),\r\n      el(\"div\", { class: \"caixa\", html: `<p><b>Um detalhe que separa as duas.<\/b> Na interface <code>Nivel<\/code> (projeto B), os 5 métodos não têm corpo. O SonarQube dá <b>${ni.sonar.porArquivo[\"Nivel.java\"].complexity}<\/b> (método sem corpo não tem caminho), o CK dá WMC <b>${ni.ck.find((x) => x.classe === \"Nivel\").wmc}<\/b> (conta 1 por método, mesmo sem corpo).<\/p><p><b>E o Strategy?<\/b> A ciclomática do projeto inteiro <b>dobra<\/b>: ${sA} no A, ${sB} no B. Cada método pequeno das classes de nível soma 1, mesmo sem decisão nenhuma. Por isso ela é ruim para comparar desenhos com muitas classes pequenas. A hipótese do TCC usa a <b>cognitiva<\/b>, que não conta método.<\/p>` }));\r\n  };\r\n  stepper(host, { chave: \"ciclo\", aba: \"ciclomatica\", passos, desenha: desenhaContagem(F, \"<b>FreteService.java<\/b> · projeto A\", passos, fim) });\r\n}\r\n\r\nfunction abaCognitiva(sec) {\r\n  const F = arq(\"A-remendo\", \"FreteService.java\");\r\n  const L = (s, d) => ln(F, s, d);\r\n  const lElse1 = L(\"} else {\", L(\"if (regiao.equals\")), lElse2 = L(\"} else {\", L('if (nivel.equals(\"BRONZE\"))'));\r\n  sec.append(el(\"h2\", null, \"Complexidade cognitiva ★\"),\r\n    el(\"p\", { class: \"lead\", html: \"A medida da hipótese principal de qualidade do TCC. Em vez de contar caminhos, ela tenta medir <b>o esforço para ler<\/b>: estruturas que quebram o fluxo custam, e custam <b>mais quando estão aninhadas<\/b>. Criada pela SonarSource; a medida <code>cognitive_complexity<\/code> do SonarQube.\" }));\r\n  const host = el(\"div\"); sec.append(host);\r\n  const passos = passosContagem(F, [\r\n    { t: \"A regra\", mais: 0, por: \"\", txt: \"<ul><li><b>+1<\/b> para cada estrutura que quebra o fluxo: <code>if<\/code>, <code>else if<\/code>, <code>else<\/code>, <code>switch<\/code>, <code>for<\/code>, <code>while<\/code>, <code>catch<\/code>, ternário, e cada <b>sequência<\/b> de <code>&amp;&amp;<\/code> ou <code>||<\/code>.<\/li><li><b>+ o nível de aninhamento<\/b> para as que estão dentro de outra (<code>if<\/code>, laços, <code>switch<\/code>, ternário, <code>catch<\/code>). O <code>else<\/code> e o <code>else if<\/code> não pagam aninhamento.<\/li><li><b>Método não conta.<\/b> Um método reto vale 0.<\/li><\/ul><p>Compare com a aba anterior: lá, aninhar não custava nada, e cada método valia 1.<\/p>\" },\r\n    { t: \"O método frete\", l: L(\"public BigDecimal frete(\"), tok: \"frete\", mais: 0, por: \"método (não conta)\", txt: \"<p>Método não soma: 0.<\/p>\" },\r\n    { t: \"if, no nível 0\", l: L('if (nivel.equals(\"OURO\"))'), tok: \"if\", mais: 1, por: \"<code>if<\/code>\", txt: \"<p>Um <code>if<\/code> direto no método, sem nada em volta. +1.<\/p>\" },\r\n    { t: \"else if\", l: L(\"else if\"), tok: \"else if\", mais: 1, por: \"<code>else if<\/code>\", txt: \"<p>+1 (sem aninhamento: <code>else if<\/code> não paga).<\/p>\" },\r\n    { t: \"if aninhado: +1 +1\", l: L(\"if (regiao.equals\"), tok: \"if\", mais: 2, por: \"<code>if<\/code> no nível 1\", txt: \"<p>Este <code>if<\/code> está <b>dentro<\/b> do <code>else if<\/code>: nível de aninhamento 1. Paga 1 (a estrutura) + 1 (o aninhamento) = <b>+2<\/b>. É aqui que a cognitiva pune o código \\\"em escada\\\".<\/p>\" },\r\n    { t: \"a sequência ||\", l: L(\"if (regiao.equals\"), tok: \"||\", mais: 1, por: \"sequência de <code>||<\/code>\", txt: \"<p>Uma sequência de <code>||<\/code>: +1. (Três condições ligadas só por <code>||<\/code> ainda seriam +1; misturar <code>&amp;&amp;<\/code> e <code>||<\/code> soma por troca.)<\/p>\" },\r\n    { t: \"else\", l: lElse1, tok: \"else\", mais: 1, por: \"<code>else<\/code>\", txt: \"<p>Aqui o <code>else<\/code> <b>soma<\/b> +1 (na ciclomática, não somava): quem lê precisa guardar mais um ramo na cabeça.<\/p>\" },\r\n    { t: \"Fim do frete: 6\", l: L(\"public BigDecimal frete(\"), tok: \"frete\", mais: 0, por: \"fim do método\", semNota: true, txt: \"<p>O <code>frete<\/code> vale <b>6<\/b> de cognitiva (contra 5 de ciclomática).<\/p>\" },\r\n    { t: \"O método prazo\", l: L(\"public int prazo(\"), tok: \"prazo\", mais: 0, por: \"método (não conta)\", txt: \"<p>0.<\/p>\" },\r\n    { t: \"for\", l: L(\"for (int km\"), tok: \"for\", mais: 1, por: \"<code>for<\/code>\", txt: \"<p>+1.<\/p>\" },\r\n    { t: \"if dentro do for: +1 +1\", l: L('if (nivel.equals(\"BRONZE\"))'), tok: \"if\", mais: 2, por: \"<code>if<\/code> no nível 1\", txt: \"<p>Dentro do <code>for<\/code>: nível 1. <b>+2<\/b>.<\/p>\", quiz: { p: \"E se houvesse <b>mais um<\/b> <code>if<\/code> dentro deste, quanto ele somaria?\", op: [\"+1\", \"+2\", \"+3\"], certa: 2, exp: \"+3: 1 pela estrutura e 2 pelo aninhamento (ele estaria dentro do <code>if<\/code>, que está dentro do <code>for<\/code>). Cada nível a mais encarece.\" } },\r\n    { t: \"else\", l: lElse2, tok: \"else\", mais: 1, por: \"<code>else<\/code>\", txt: \"<p>+1.<\/p>\" },\r\n    { t: \"ternário\", l: L('return nivel.equals(\"OURO\") ?'), tok: \"?\", mais: 1, por: \"ternário\", txt: \"<p>+1 (no nível 0: está direto no método).<\/p>\" },\r\n    { t: \"Resultado: 11\", l: null, mais: 0, por: \"\", fim: true, txt: \"<p>Total do arquivo: 6 + 5 = <b>11<\/b>. O que o SonarQube real disse, e o que acontece no projeto B:<\/p>\" },\r\n  ], \"pontos de complexidade cognitiva\");\r\n  const fim = () => {\r\n    const A = EX[\"A-remendo\"].sonar, B = EX[\"B-strategy\"].sonar;\r\n    const linhasArq = (P) => Object.entries(EX[P].sonar.porArquivo).map(([f, m]) => [f, m.cognitive_complexity]);\r\n    return el(\"div\", { class: \"pilha\" },\r\n      el(\"div\", { class: \"caixa certo\", html: `<p>SonarQube, <code>cognitive_complexity<\/code> do arquivo: <b>${A.porArquivo[\"FreteService.java\"].cognitive_complexity}<\/b> ${sim(A.porArquivo[\"FreteService.java\"].cognitive_complexity === 11)}<\/p>` }),\r\n      el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, \"A × B: a mesma regra de frete\"),\r\n        el(\"div\", { class: \"grade2\" },\r\n          el(\"div\", null, el(\"b\", null, \"A · remendo\"), tabela([\"arquivo\", \"cognitiva\"], linhasArq(\"A-remendo\").concat([[\"<b>projeto<\/b>\", `<b>${A.projeto.cognitive_complexity}<\/b>`]]), { rolagem: false })),\r\n          el(\"div\", null, el(\"b\", null, \"B · Strategy\"), tabela([\"arquivo\", \"cognitiva\"], linhasArq(\"B-strategy\").concat([[\"<b>projeto<\/b>\", `<b>${B.projeto.cognitive_complexity}<\/b>`]]), { rolagem: false }))),\r\n        H(`<p>De <b>${A.projeto.cognitive_complexity}<\/b> para <b>${B.projeto.cognitive_complexity}<\/b>. A pergunta \"qual é o nível?\" sumiu dos serviços: virou uma busca no mapa (<code>Niveis.de<\/code>). O único <code>if<\/code> de regra que sobrou é o da região, que mudou para dentro da <code>Prata<\/code>.<\/p>\r\n        <p>No V5, a média foi de <b>${fmt(V5.cognitiva[0])}<\/b> (N0) para <b>${fmt(V5.cognitiva[1])}<\/b> (N1), e a hipótese ★ foi <b>apoiada<\/b>. É esta mesma mecânica, em código de verdade.<\/p>`)));\r\n  };\r\n  stepper(host, { chave: \"cogn\", aba: \"cognitiva\", passos, desenha: desenhaContagem(F, \"<b>FreteService.java<\/b> · projeto A\", passos, fim) });\r\n}\r\n\r\n// =====================================================================\r\n// 4. Duplicacao\r\n// =====================================================================\r\nfunction iguais(a, b) {\r\n  // as linhas de a que aparecem iguais (sem espaco) em b, na ordem: comparacao desta pagina, nao do Sonar\r\n  const nb = new Set(b.split(\"\\n\").map((l) => l.trim()).filter((l) => l.length > 2));\r\n  return a.split(\"\\n\").map((l, i) => (nb.has(l.trim()) && l.trim().length > 2 ? i + 1 : null)).filter(Boolean);\r\n}\r\nfunction abaDuplicacao(sec) {\r\n  sec.append(el(\"h2\", null, \"Duplicação\"),\r\n    el(\"p\", { class: \"lead\", html: \"O SonarQube procura <b>trechos de código que se repetem<\/b> e mede a porcentagem de linhas que estão em algum trecho repetido (<code>duplicated_lines_density<\/code>). É a hipótese \\\"não repete o comum\\\" do TCC.\" }));\r\n  const host = el(\"div\"); sec.append(host);\r\n  const C = EX[\"C-copia\"], B = EX[\"B-strategy\"];\r\n  const par = (P, f1, f2, titulo) => {\r\n    const a = arq(P, f1), b = arq(P, f2);\r\n    const la = Object.fromEntries(iguais(a, b).map((l) => [l, \"regiao\"])), lb = Object.fromEntries(iguais(b, a).map((l) => [l, \"regiao\"]));\r\n    return el(\"div\", { class: \"grade2\" },\r\n      codigo({ texto: a, lang: \"java\", titulo: `<b>${f1}<\/b> · ${titulo}`, linhas: la, baixo: true }),\r\n      codigo({ texto: b, lang: \"java\", titulo: `<b>${f2}<\/b> · ${titulo}`, linhas: lb, baixo: true }));\r\n  };\r\n  const passos = [\r\n    { t: \"Copiar e colar (projeto C)\", vista: () => par(\"C-copia\", \"Etiqueta.java\", \"Recibo.java\", \"projeto C\"),\r\n      txt: `<p>Duas classes montando quase o mesmo texto. Em roxo, as linhas que aparecem iguais nos dois arquivos (essa marcação é uma comparação <b>desta página<\/b>, linha a linha).<\/p><p>O que o SonarQube real mediu:<\/p>`,\r\n      extra: () => tabela([\"arquivo\", \"linhas duplicadas\", \"blocos\"], Object.entries(C.sonar.porArquivo).map(([f, m]) => [f, m.duplicated_lines, m.duplicated_blocks]).concat([[\"<b>projeto<\/b>\", `<b>${C.sonar.projeto.duplicated_lines}<\/b>`, `<b>${C.sonar.projeto.duplicated_blocks}<\/b>`], [\"<b>densidade<\/b>\", `<b>${fmt(C.sonar.projeto.duplicated_lines_density)}%<\/b>`, \"\"]]), { rolagem: false }) },\r\n    { t: \"Como o número sai\", vista: () => par(\"C-copia\", \"Etiqueta.java\", \"Recibo.java\", \"projeto C\"),\r\n      txt: `<p><b>Densidade = linhas que estão em algum bloco repetido ÷ linhas do projeto.<\/b> No C, ${C.sonar.projeto.duplicated_lines} linhas duplicadas: ${fmt(C.sonar.projeto.duplicated_lines_density)}%.<\/p><p>O SonarQube não compara linha por linha como a marcação roxa: ele quebra o código em pedaços (palavras, símbolos) e procura <b>sequências longas<\/b> que se repetem. Por isso os blocos dele não batem exatamente com as linhas roxas: uma assinatura de método diferente ou uma linha a mais no fim podem mudar onde o bloco começa e acaba. Trecho repetido curto não conta: tem de ser uma sequência comprida.<\/p>` },\r\n    { t: \"O Strategy também \\\"repete\\\" (projeto B)\", vista: () => par(\"B-strategy\", \"Bronze.java\", \"Prata.java\", \"projeto B\"),\r\n      txt: `<p>Agora a surpresa. No projeto B, ninguém copiou nada de propósito, mas o SonarQube mediu <b>${fmt(B.sonar.projeto.duplicated_lines_density)}%<\/b> de duplicação: ${B.sonar.porArquivo[\"Bronze.java\"].duplicated_lines} linhas na <code>Bronze<\/code> e ${B.sonar.porArquivo[\"Prata.java\"].duplicated_lines} na <code>Prata<\/code>, a <code>Ouro<\/code> com ${B.sonar.porArquivo[\"Ouro.java\"].duplicated_lines}.<\/p><p>As classes de uma Strategy têm <b>a mesma forma<\/b>: os mesmos métodos, na mesma ordem, quase com o mesmo corpo. A <code>Bronze<\/code> e a <code>Prata<\/code> diferem só no <code>frete<\/code> e no número de dias. Repare: o bloco de 18 linhas só cabe se incluir a linha <code>return 2;<\/code> / <code>return 1;<\/code> (as linhas iguais em texto, depois dela, são só 17). A comparação do SonarQube olha a <b>forma<\/b>: um número diferente não quebra a repetição.<\/p>`,\r\n      quiz: { p: \"Isso quer dizer que o Strategy do B está mal escrito?\", op: [\"sim, é cópia\", \"não necessariamente\"], certa: 1, exp: \"Não necessariamente. É <b>repetição estrutural<\/b> (classes parecidas, cada uma com o seu comportamento), não cópia de lógica. A métrica não separa uma da outra. É a lição que ficou no DECISOES para a próxima versão: uma medida de duplicação que distinga as duas.\" } },\r\n    { t: \"No V5\", vista: () => par(\"B-strategy\", \"Bronze.java\", \"Prata.java\", \"projeto B\"),\r\n      txt: `<p>A duplicação média foi de <b>${fmt(V5.duplicacao[0])}%<\/b> (N0) para <b>${fmt(V5.duplicacao[1])}%<\/b> (N1). A hipótese \\\"não repete o comum\\\" esperava <b>menos<\/b> duplicação com o harness, e foi <b>contrariada<\/b>: subiu.<\/p><p>Os exemplos mostram uma explicação possível, que é só hipótese até alguém olhar os blocos dos pacotes reais: mais classes de nível parecidas (as classes subiram de ${fmt(V5.classes[0])} para ${fmt(V5.classes[1])} em média) dão mais \\\"repetição\\\" para o SonarQube.<\/p>` },\r\n  ];\r\n  stepper(host, { chave: \"dup\", aba: \"duplicacao\", passos, desenha: (p, i, corpo) => { corpo.append(p.vista(), explicacao(p, [p.extra ? p.extra() : null])); corpo.lastChild.style.marginTop = \"12px\"; } });\r\n}\r\n\r\n// =====================================================================\r\n// 5. Code smells\r\n// =====================================================================\r\nfunction abaSmells(sec) {\r\n  const D = EX[\"D-smells\"], F = arq(\"D-smells\", \"CupomService.java\");\r\n  sec.append(el(\"h2\", null, \"Code smells e dívida técnica\"),\r\n    el(\"p\", { class: \"lead\", html: \"Um <b>code smell<\/b> é um trecho que funciona, mas sugere problema de manutenção. O SonarQube aponta cada um por uma <b>regra<\/b> do perfil \\\"Sonar way\\\" (599 regras para Java, no padrão), com uma severidade e um <b>esforço<\/b> estimado para corrigir. A soma dos esforços é a <b>dívida técnica<\/b> (<code>sqale_index<\/code>, em minutos).\" }));\r\n  const host = el(\"div\"); sec.append(host);\r\n  const SEV = { INFO: \"informativa\", MINOR: \"menor\", MAJOR: \"maior\", CRITICAL: \"crítica\", BLOCKER: \"bloqueadora\" };\r\n  const PQ = {\r\n    \"java:S1128\": \"o <code>import java.util.List<\/code> não é usado: ruído.\",\r\n    \"java:S1068\": \"o campo <code>contador<\/code> nunca é lido nem escrito: código morto.\",\r\n    \"java:S1135\": \"um <code>TODO<\/code> é trabalho pendente esquecido no código. Severidade só informativa, esforço 0.\",\r\n    \"java:S106\": \"<code>System.out.println<\/code> no lugar de um log: em produção, some ou polui a saída, e não tem nível (erro, aviso...).\",\r\n    \"java:S1192\": \"o texto <code>\\\"FRETEGRATIS\\\"<\/code> aparece 3 vezes. Se mudar, é preciso lembrar de mudar em todos: melhor uma constante.\",\r\n  };\r\n  const passos = D.sonar.issues.map((x) => ({ t: `${x.regra}: ${x.nome}`, x }));\r\n  passos.unshift({ t: \"O que o SonarQube achou\", todos: true });\r\n  passos.push({ t: \"A conta da dívida, e o que ele não viu\", fim: true });\r\n  const notasTodas = Object.fromEntries(D.sonar.issues.map((x) => [x.linha, { txt: x.regra.replace(\"java:\", \"\"), cls: \"fora\" }]));\r\n  stepper(host, {\r\n    chave: \"smells\", aba: \"smells\", passos,\r\n    desenha: (p, i, corpo) => {\r\n      const linhas = {};\r\n      if (p.x) linhas[p.x.linha] = \"erro\";\r\n      const rep = ln(F, 'if (cupom.equals(\"FRETEGRATIS\"))', ln(F, \"public String descricao(\"));\r\n      const rep2 = ln(F, 'if (cupom.equals(\"FRETEGRATIS\"))', rep + 1);\r\n      if (p.fim) { linhas[rep2] = \"regiao\"; }\r\n      const extra = [];\r\n      if (p.todos) extra.push(tabela([\"linha\", \"regra\", \"severidade\", \"esforço\"], D.sonar.issues.map((x) => [x.linha, `<code>${x.regra}<\/code> ${esc(x.nome)}`, SEV[x.severidade] || x.severidade, x.esforco])));\r\n      if (p.x) extra.push(el(\"div\", { class: \"caixa aconteceu\" }, el(\"div\", { class: \"rotulo\" }, \"▶ a mensagem do SonarQube\"), H(`<p><code>${esc(p.x.msg)}<\/code><\/p><p>linha ${p.x.linha} · severidade <b>${SEV[p.x.severidade]}<\/b> · esforço <b>${p.x.esforco}<\/b><\/p>`)), H(`<p><b>Por quê:<\/b> ${PQ[p.x.regra] || \"\"}<\/p>`));\r\n      if (p.fim) {\r\n        const soma = D.sonar.issues.reduce((s, x) => s + parseInt(x.esforco, 10), 0);\r\n        extra.push(el(\"div\", { class: \"caixa certo\", html: `<p>Soma dos esforços: ${D.sonar.issues.map((x) => x.esforco).join(\" + \")} = <b>${soma} min<\/b>. O <code>sqale_index<\/code> do projeto: <b>${D.sonar.projeto.sqale_index} min<\/b> ${sim(soma === D.sonar.projeto.sqale_index)}<\/p>` }),\r\n          H(`<p><b>O que ele não viu.<\/b> O <code>descricao<\/code> testa <code>\"FRETEGRATIS\"<\/code> duas vezes (linhas ${rep} e ${rep2}, em roxo): o segundo <code>if<\/code> nunca é verdadeiro. Nenhuma regra do perfil padrão acusou. (A regra de condição repetida do SonarQube olha cadeias <code>if / else if<\/code>; aqui são dois <code>if<\/code> separados.) O SonarQube aponta o que as regras dele descrevem, e só isso.<\/p>\r\n          <p><b>E os outros projetos?<\/b> A, B e C: <b>0<\/b> smells. Código pequeno e limpo quase não dispara regra. No V5, a hipótese \\\"menos code smells\\\" deu <b>inconclusiva<\/b>.<\/p>`));\r\n      }\r\n      duasColunas(corpo, codigo({ texto: F, lang: \"java\", titulo: \"<b>CupomService.java<\/b> · projeto D\", atual: p.x ? [[p.x.linha, p.x.linha]] : [], linhas, notas: notasTodas }), explicacao({ t: p.t, txt: p.todos ? `<p>${D.sonar.issues.length} code smells. Use <kbd>→<\/kbd> para ver um por um.<\/p>` : null }, extra));\r\n    },\r\n  });\r\n}\r\n\r\n// =====================================================================\r\n// 6. CK\r\n// =====================================================================\r\nfunction abaCK(sec) {\r\n  sec.append(el(\"h2\", null, \"CK: as métricas de cada classe\"),\r\n    el(\"p\", { class: \"lead\", html: \"O CK mede <b>classe por classe<\/b> as métricas de orientação a objetos de Chidamber e Kemerer (daí o nome). Escolha uma classe: para cada métrica, a página refaz a conta no código e confere com o número que o CK real devolveu.\" }));\r\n  const barra = el(\"div\", { class: \"linha-botoes\" }), corpo = el(\"div\");\r\n  sec.append(barra, corpo);\r\n  const opcoes = [[\"B-strategy\", \"Niveis\"], [\"B-strategy\", \"Prata\"], [\"B-strategy\", \"Nivel\"], [\"B-strategy\", \"FreteService\"], [\"B-strategy\", \"ResumoService\"], [\"A-remendo\", \"FreteService\"], [\"A-remendo\", \"ResumoService\"]];\r\n  const mostra = (P, cl) => {\r\n    lembra(\"ckSel\", P + \"/\" + cl);\r\n    barra.replaceChildren(el(\"span\", { class: \"mini\" }, \"classe: \"), ...opcoes.map(([p, c]) => el(\"button\", { class: \"b\" + (p === P && c === cl ? \" on\" : \"\"), onclick: () => mostra(p, c) }, `${c} (${p[0]})`)));\r\n    const proj = EX[P], c = proj.ck.find((x) => x.classe === cl), texto = arq(P, cl + \".java\");\r\n    const tipos = proj.ck.map((x) => x.classe);\r\n    const cita = (t, nome) => new RegExp(`\\\\b${nome}\\\\b`).test(t.replace(/\"[^\"]*\"/g, '\"\"'));\r\n    const usa = tipos.filter((n) => n !== cl && cita(texto, n));\r\n    const usadoPor = tipos.filter((n) => n !== cl && cita(arq(P, n + \".java\"), cl));\r\n    const met = proj.metodos.filter((m) => m.classe === cl).sort((a, b) => a.linha - b.linha);\r\n    const chamadas = [...new Set([...texto.replace(/\"[^\"]*\"/g, '\"\"').matchAll(/\\.(\\w+)\\s*\\(/g)].map((m) => m[1]))];\r\n    const n = c.metodos, pares = n * (n - 1) / 2;\r\n    const cards = [\r\n      [\"CBO · acoplamento\", c.cbo, `<p>Quantos <b>outros tipos<\/b> a classe usa. Nesta: <code>${usa.join(\", \") || \"nenhum\"}<\/code> = ${usa.length}. ${sim(usa.length === c.cbo)}<\/p><p class=\"mini\">Nos exemplos, tipos do próprio Java (<code>String<\/code>, <code>BigDecimal<\/code>, <code>Map<\/code>, <code>Math<\/code>) não entram na conta do CK: o <code>FreteService<\/code> do A usa <code>BigDecimal<\/code> e tem CBO 0. O TCC usa a <b>média<\/b> do CBO das classes.<\/p>`],\r\n      [\"fan-in · quem usa esta classe\", c.fanin, `<p>O contrário do CBO: quantas classes usam <b>esta<\/b>. Aqui: <code>${usadoPor.join(\", \") || \"nenhuma\"}<\/code> = ${usadoPor.length}. ${sim(usadoPor.length === c.fanin)}<\/p>`],\r\n      [\"WMC · complexidade somada\", c.wmc, `<p>A complexidade ciclomática de cada método, somada (aba 2). ${met.map((m) => `<code>${m.metodo}<\/code> ${m.wmc}`).join(\" + \")} = ${met.reduce((s, m) => s + m.wmc, 0)}. ${sim(met.reduce((s, m) => s + m.wmc, 0) === c.wmc)}<\/p>`],\r\n      [\"DIT · profundidade de herança\", c.dit, `<p>Quantos níveis de <code>extends<\/code> até <code>Object<\/code>. Toda classe que não estende nada vale 1. <b>Implementar uma interface não conta<\/b>: a <code>Prata implements Nivel<\/code> continua com DIT 1.<\/p>`],\r\n      [\"RFC · resposta da classe\", c.rfc, `<p>Quantos <b>métodos diferentes<\/b> a classe chama. Achados pelo nome, no código: <code>${chamadas.join(\", \") || \"nenhum\"}<\/code> = ${chamadas.length}. ${chamadas.length === c.rfc ? sim(true) : `<span class=\"mini\">O CK deu ${c.rfc}: ele conta cada <b>versão<\/b> de um método separado. Aqui, o <code>append<\/code> é chamado com texto, com caractere (<code>'\\\\n'<\/code>) e com número: são três <code>append<\/code> diferentes para o Java.<\/span>`}<\/p><p class=\"mini\">Construtores (<code>new BigDecimal(...)<\/code>) não entraram na conta do CK nos exemplos.<\/p>`],\r\n      [\"LCOM · falta de coesão\", c.lcom, `<p>Olha os <b>pares de métodos<\/b>: conta os que <b>não<\/b> usam nenhum campo em comum, menos os que usam (mínimo 0). Esta classe tem ${n} métodos e ${c.campos} campo(s)${c.campos === 0 ? `: sem campo, nenhum par compartilha nada, e todos os ${pares} pares contam. ${sim(pares === c.lcom)}` : \".\"}<\/p><p class=\"mini\"><b>Cuidado ao ler:<\/b> uma classe de Strategy sem estado (<code>Bronze<\/code>, <code>Prata<\/code>, <code>Ouro<\/code>: 5 métodos, nenhum campo) tira LCOM <b>10<\/b>, o máximo para 5 métodos, embora seja coesa por desenho (tudo nela é \\\"o nível Prata\\\"). O LCOM clássico pune classe sem campo. O TCC usa a <b>média<\/b> do LCOM.<\/p>`],\r\n    ];\r\n    corpo.replaceChildren(el(\"div\", { class: \"grade2\" },\r\n      el(\"div\", { class: \"pilha\" }, codigo({ texto, lang: \"java\", titulo: `<b>${cl}.java<\/b> · projeto ${P}` }),\r\n        el(\"div\", { class: \"painel\" }, el(\"div\", { class: \"rotulo\" }, \"a linha do CK para esta classe (class.csv)\"), tabela([\"cbo\", \"fan-in\", \"wmc\", \"dit\", \"noc\", \"rfc\", \"lcom\", \"métodos\", \"campos\", \"loc\"], [[c.cbo, c.fanin, c.wmc, c.dit, c.noc, c.rfc, c.lcom, c.metodos, c.campos, c.loc]], { rolagem: false }))),\r\n      el(\"div\", { class: \"pilha\" }, cards.map(([t, v, h]) => el(\"div\", { class: \"painel\" }, el(\"div\", { class: \"rotulo\" }, t, el(\"span\", { class: \"dir\" }, el(\"b\", { style: \"font-size:18px;color:var(--fg)\" }, String(v)))), H(h))))));\r\n  };\r\n  const [p0, c0] = (MEM.ckSel || \"B-strategy/Niveis\").split(\"/\");\r\n  mostra(EX[p0] ? p0 : \"B-strategy\", c0 || \"Niveis\");\r\n}\r\n\r\n// =====================================================================\r\n// 7. A x B\r\n// =====================================================================\r\nfunction resumoCK(lista) {\r\n  // as mesmas contas do aggregate-metrics.mjs (tipos com nome; media, maximo, soma)\r\n  const TIPOS = [\"class\", \"interface\", \"enum\", \"record\"];\r\n  const cls = lista.filter((c) => TIPOS.includes(c.tipo));\r\n  const media = (k) => cls.reduce((s, c) => s + c[k], 0) / cls.length;\r\n  const max = (k) => Math.max(...cls.map((c) => c[k]));\r\n  return { tipos: cls.length, cbo_media: media(\"cbo\"), cbo_max: max(\"cbo\"), wmc_soma: lista.reduce((s, c) => s + c.wmc, 0), wmc_max: max(\"wmc\"), lcom_media: media(\"lcom\"), rfc_media: media(\"rfc\"), dit_max: max(\"dit\") };\r\n}\r\nfunction abaAxB(sec) {\r\n  const A = EX[\"A-remendo\"], B = EX[\"B-strategy\"], ra = resumoCK(A.ck), rb = resumoCK(B.ck);\r\n  const seta = (a, b, melhor) => a === b ? \"=\" : (b < a) === (melhor === \"menos\") ? '<span class=\"sim\">' + (b < a ? \"▼\" : \"▲\") + \"<\/span>\" : '<span class=\"nao\">' + (b < a ? \"▼\" : \"▲\") + \"<\/span>\";\r\n  const linhas = [\r\n    [\"linhas de código\", \"sonar\", A.sonar.projeto.ncloc, B.sonar.projeto.ncloc, \"menos\"],\r\n    [\"classes\", \"sonar\", A.sonar.projeto.classes, B.sonar.projeto.classes, null],\r\n    [\"complexidade ciclomática\", \"sonar\", A.sonar.projeto.complexity, B.sonar.projeto.complexity, \"menos\"],\r\n    [\"★ complexidade cognitiva\", \"sonar\", A.sonar.projeto.cognitive_complexity, B.sonar.projeto.cognitive_complexity, \"menos\"],\r\n    [\"duplicação (%)\", \"sonar\", A.sonar.projeto.duplicated_lines_density, B.sonar.projeto.duplicated_lines_density, \"menos\"],\r\n    [\"code smells\", \"sonar\", A.sonar.projeto.code_smells, B.sonar.projeto.code_smells, \"menos\"],\r\n    [\"CBO médio\", \"CK\", ra.cbo_media, rb.cbo_media, \"menos\"],\r\n    [\"CBO máximo\", \"CK\", ra.cbo_max, rb.cbo_max, \"menos\"],\r\n    [\"WMC somado\", \"CK\", ra.wmc_soma, rb.wmc_soma, \"menos\"],\r\n    [\"WMC máximo (a classe mais complexa)\", \"CK\", ra.wmc_max, rb.wmc_max, \"menos\"],\r\n    [\"LCOM médio\", \"CK\", ra.lcom_media, rb.lcom_media, \"menos\"],\r\n    [\"RFC médio\", \"CK\", ra.rfc_media, rb.rfc_media, \"menos\"],\r\n  ];\r\n  sec.append(el(\"h2\", null, \"A × B: o mesmo frete, dois desenhos\"),\r\n    el(\"p\", { class: \"lead\", html: \"Todas as medidas lado a lado. As do CK estão resumidas com as <b>mesmas contas<\/b> do <code>aggregate-metrics.mjs<\/code> (média e máximo sobre as classes com nome, WMC somado). Verde: melhorou; vermelho: piorou (no sentido em que menos é melhor).\" }),\r\n    el(\"div\", { class: \"grade2\" },\r\n      el(\"div\", { class: \"painel\" }, tabela([\"medida\", \"ferramenta\", \"A · remendo\", \"B · Strategy\", \"\"], linhas.map(([n, f, a, b, m]) => [n, f, fmt(a), fmt(b), m ? seta(a, b, m) : \"\"]), { rolagem: false })),\r\n      el(\"div\", { class: \"painel\" }, H(`<h3 style=\"margin-top:0\">A troca<\/h3>\r\n        <p>O Strategy <b>concentra<\/b> a complexidade: a <b>cognitiva<\/b> cai (${A.sonar.projeto.cognitive_complexity} → ${B.sonar.projeto.cognitive_complexity}) e a classe mais complexa fica mais simples (WMC máximo ${ra.wmc_max} → ${rb.wmc_max}). Em troca, há <b>mais código<\/b> (${A.sonar.projeto.ncloc} → ${B.sonar.projeto.ncloc} linhas), <b>mais classes<\/b> (${A.sonar.projeto.classes} → ${B.sonar.projeto.classes}), <b>mais acoplamento<\/b> médio (a interface e o mapa ligam todo mundo), a <b>duplicação estrutural<\/b> das classes parecidas e o <b>LCOM<\/b> alto das classes sem estado.<\/p>\r\n        <p>Nenhuma métrica sozinha diz \"melhor desenho\". Cada uma mede uma coisa, e o Strategy troca umas pelas outras.<\/p>\r\n        <h3>E no V5?<\/h3>`),\r\n        tabela([\"média por execução\", \"N0\", \"N1\", \"N2\", \"N3\"], [\r\n          [\"★ complexidade cognitiva\", ...V5.cognitiva.map(fmt)],\r\n          [\"linhas de código\", ...V5.linhas.map(fmt)],\r\n          [\"classes\", ...V5.classes.map(fmt)],\r\n          [\"duplicação (%)\", ...V5.duplicacao.map(fmt)],\r\n        ], { rolagem: false }),\r\n        H(`<p>A mesma direção dos exemplos: com o harness, a cognitiva caiu, e linhas, classes e duplicação subiram. <span class=\"mini\">Fonte: <code>analysis/resultados-V5-STRATEGY.md<\/code>.<\/span><\/p>`))));\r\n}\r\n\r\n// =====================================================================\r\n// 8. Os scripts do TCC: metrics.sh e aggregate-metrics.mjs\r\n// =====================================================================\r\nfunction abaScripts(sec) {\r\n  sec.append(el(\"h2\", null, \"O que é do TCC: metrics.sh e aggregate-metrics.mjs\"),\r\n    el(\"p\", { class: \"lead\", html: \"Os dois únicos arquivos escritos para o TCC em volta das ferramentas. Nenhum muda o que elas medem: um <b>roda<\/b>, o outro <b>junta<\/b>.\" }));\r\n  const barra = el(\"div\", { class: \"linha-botoes\" }), host = el(\"div\");\r\n  sec.append(barra, host);\r\n  const MS = [\r\n    [[1, 31], \"O cabeçalho\", \"<p>Uso: <code>metrics.sh &lt;prefixo&gt;<\/code> (o lote, como <code>V5-STRATEGY<\/code>). Mede o código de produção já compilado pelo build. <b>Não julga nada<\/b>, só extrai números: por isso roda direto nas execuções, sem a cópia cega (\\\"uma ferramenta não sabe qual é o braço\\\"). Recusa refazer uma análise por cima de outra.<\/p>\"],\r\n    [[33, 38], \"Travas e o nome do lote\", \"<p><code>set -uo pipefail<\/code> e <code>morrer<\/code>, como no <code>detect.sh<\/code>. O prefixo só pode ter letras, números e hífen (o <code>case<\/code> recusa o resto): ele vira nome de pasta e chave no SonarQube.<\/p>\"],\r\n    [[40, 42], \"Os caminhos\", \"<p>A raiz do projeto, a pasta de saída (<code>evaluation/metrics/&lt;prefixo&gt;<\/code>) e o <code>.env.sonar<\/code>, o arquivo com o token de acesso ao servidor (fora do git).<\/p>\"],\r\n    [[44, 51], \"As versões travadas\", \"<p>O <code>.jar<\/code> do CK e o hash dele, a imagem do SonarQube, a do scanner (pelo hash), o endereço do servidor e a rede Docker. E a lista <code>METRICAS<\/code>: as 9 medidas que serão pedidas ao SonarQube.<\/p>\"],\r\n    [[53, 55], \"Preflight: o CK é o travado?\", \"<p>O <code>.jar<\/code> existe e o sha256 dele é o anotado. Se alguém trocar o <code>.jar<\/code>, para aqui.<\/p>\"],\r\n    [[56, 61], \"Preflight: o SonarQube é o travado e está de pé?\", \"<p>O token existe no <code>.env.sonar<\/code>; o container <code>tcc-sonarqube<\/code> usa a imagem travada e está rodando; o servidor responde <code>UP<\/code>; a imagem do scanner está presente.<\/p>\"],\r\n    [[62, 64], \"A rede\", \"<p>O scanner roda num container e precisa falar com o servidor, que é outro container: os dois entram na mesma rede Docker (<code>tcc-sonar-net<\/code>).<\/p>\"],\r\n    [[66, 68], \"As execuções do lote\", \"<p>Lista as pastas <code>runs/&lt;prefixo&gt;-*<\/code>. Se a pasta de saída já existe, para: nada é refeito por cima.<\/p>\"],\r\n    [[70, 75], \"O token, e nunca refazer\", \"<p>O token é lido para uma variável e <b>nunca é impresso<\/b>. Para cada execução, pergunta ao servidor se ela já existe lá (HTTP 404 = não existe). Se existir, para: uma análise nunca é refeita por cima de outra.<\/p>\"],\r\n    [[77, 79], \"Começa\", \"<p>Cria a pasta de saída e avisa quantas execuções vai medir.<\/p>\"],\r\n    [[82, 88], \"Por execução: achar o projeto\", \"<p>O <code>pom.xml<\/code> mais raso, a mesma regra do build e do Semgrep. Sem <code>pom<\/code> ou sem <code>src/main/java<\/code>, anota o motivo no <code>status<\/code> e passa para a próxima.<\/p>\"],\r\n    [[90, 91], \"Roda o CK\", \"<p><code>java -jar ck.jar &lt;src/main/java&gt; false 0 false &lt;saída&gt;<\/code>. Os três do meio dizem ao CK: não usar os <code>.jar<\/code> do projeto (<code>false<\/code>), deixar ele decidir quantos arquivos lê de cada vez (<code>0<\/code>), e não gerar as tabelas por variável e por campo (<code>false<\/code>). Ele escreve o <code>class.csv<\/code> (uma linha por classe) e o <code>method.csv<\/code>.<\/p>\"],\r\n    [[93, 100], \"Roda o scanner do SonarQube\", \"<p>Precisa das classes compiladas (<code>target/classes<\/code>): a análise de Java do SonarQube usa os <code>.class<\/code>. O scanner roda num container, com o código montado <b>só para leitura<\/b>. Os parâmetros: a chave (o nome da execução), onde está o código, onde estão os compilados, Java 21, e sem olhar o git. Nenhum mexe no perfil de regras: vale o padrão.<\/p>\"],\r\n    [[102, 110], \"Espera as medidas\", \"<p>O scanner manda o relatório e sai; o servidor processa depois. O script pergunta a cada 3 segundos, até 40 vezes, se as medidas já estão lá, e grava o <code>measures.json<\/code>.<\/p>\"],\r\n    [[113, 113], \"Junta tudo\", \"<p>Chama o <code>aggregate-metrics.mjs<\/code> (o outro botão, acima).<\/p>\"],\r\n  ];\r\n  const AG = [\r\n    [[1, 14], \"O cabeçalho\", \"<p>Junta o que o <code>metrics.sh<\/code> gravou num CSV, uma linha por execução. \\\"Só junta números: nenhuma leitura nem nota sai daqui.\\\"<\/p>\"],\r\n    [[25, 37], \"Ler o CSV do CK, e ajudantes\", \"<p>Um leitor de CSV que respeita aspas (no Windows, o caminho do arquivo pode vir entre aspas), e três ajudantes: número, média, formato.<\/p>\"],\r\n    [[39, 42], \"As colunas do SonarQube, e os tipos\", \"<p>As 9 medidas do SonarQube viram colunas <code>sonar_*<\/code>. <code>TIPOS<\/code>: os tipos <b>com nome<\/b> (classe, interface, enum, record).<\/p>\"],\r\n    [[44, 51], \"Por execução: quem é\", \"<p>Lê o <code>meta.json<\/code> da execução só para identificar: modelo, braço, réplica, e o nível (N0 a N3), tirado do fim do nome.<\/p>\"],\r\n    [[53, 55], \"As medidas do SonarQube\", \"<p>Copia cada medida do <code>measures.json<\/code> para a coluna <code>sonar_*<\/code>, sem conta nenhuma.<\/p>\"],\r\n    [[57, 75], \"O resumo do CK\", \"<p>O CK dá uma linha por classe; o CSV precisa de um número por execução. Aqui estão as únicas escolhas do TCC:<\/p><ul><li>contagens por tipo (<code>ck_class<\/code>, <code>ck_interface<\/code>...);<\/li><li>as classes <b>anônimas<\/b> (o corpo de cada constante de enum com comportamento próprio) ficam numa coluna à parte e fora das médias, mas entram na soma do WMC (a lógica delas também é código);<\/li><li><b>média<\/b> de CBO, LCOM e RFC; <b>máximo<\/b> de CBO, WMC e DIT; <b>soma<\/b> de WMC.<\/li><\/ul><p>A aba \\\"A × B\\\" faz exatamente estas contas nos exemplos.<\/p>\"],\r\n    [[78, 83], \"Grava o CSV\", \"<p>Escreve o <code>metricas.csv<\/code>, que o <code>hipoteses.mjs<\/code> lê.<\/p>\"],\r\n  ];\r\n  const roda = (qual) => {\r\n    lembra(\"scriptSel\", qual);\r\n    barra.replaceChildren(...[[\"metrics\", \"metrics.sh\"], [\"aggregate\", \"aggregate-metrics.mjs\"]].map(([k, n]) => el(\"button\", { class: \"b\" + (k === qual ? \" on\" : \"\"), onclick: () => roda(k) }, n)));\r\n    const lista = qual === \"metrics\" ? MS : AG, fonte = qual === \"metrics\" ? DADOS.fontes.metrics : DADOS.fontes.aggregate;\r\n    stepper(host, {\r\n      chave: \"script:\" + qual, aba: \"scripts\", passos: lista.map(([l, t, txt]) => ({ l, t, txt })),\r\n      desenha: (p, i, corpo) => duasColunas(corpo, codigo({ texto: fonte, lang: qual === \"metrics\" ? \"bash\" : \"js\", titulo: `<b>${qual === \"metrics\" ? \"metrics.sh\" : \"aggregate-metrics.mjs\"}<\/b> · TCC_V5/evaluation/tools`, atual: [p.l] }), explicacao(p)),\r\n    });\r\n  };\r\n  roda(MEM.scriptSel === \"aggregate\" ? \"aggregate\" : \"metrics\");\r\n}\r\n\r\n// =====================================================================\r\n// 9. Cuidados e autoavaliacao\r\n// =====================================================================\r\nfunction abaAuto(sec) {\r\n  const Q = [\r\n    [\"O SonarQube e o CK precisaram de validação como o Semgrep? Por quê?\", \"Não da mesma forma. As regras e as métricas são as <b>padrão<\/b> das ferramentas (o perfil \\\"Sonar way\\\", as métricas de Chidamber e Kemerer), usadas na indústria e na pesquisa; qualquer um reproduz com as mesmas versões. O que o TCC garante é que as versões são as travadas (hash) e que os scripts só rodam e juntam. O Semgrep é diferente porque as regras são <b>nossas<\/b>.\"],\r\n    [\"Qual a diferença entre a complexidade ciclomática e a cognitiva?\", \"A ciclomática conta <b>caminhos<\/b>: +1 por método e por decisão, sem ligar para aninhamento. A cognitiva tenta medir <b>esforço de leitura<\/b>: método não conta, o <code>else<\/code> conta, e cada nível de aninhamento encarece. Num desenho com muitos métodos pequenos (Strategy), a ciclomática sobe e a cognitiva cai.\"],\r\n    [\"Por que a hipótese principal de qualidade usa a cognitiva?\", \"Porque ela mede o que o padrão promete melhorar: tirar a decisão \\\"qual nível?\\\" do meio do código e evitar <code>if<\/code> em escada. A ciclomática puniria o Strategy só por ter mais métodos (no exemplo, dobrou).\"],\r\n    [\"O B (Strategy) teve 20% de duplicação. Isso prova que ele é pior?\", \"Não. É <b>repetição estrutural<\/b>: classes com a mesma forma, cada uma com o seu comportamento. A medida de duplicação do SonarQube não separa isso de cópia de lógica. Por isso a hipótese \\\"não repete o comum\\\" contrariada no V5 pede cuidado na interpretação.\"],\r\n    [\"Por que o LCOM de uma classe de nível (Bronze) é 10, e o que isso diz?\", \"Ela tem 5 métodos e nenhum campo: os 10 pares de métodos não compartilham campo, e todos contam. O LCOM clássico pune classe sem estado, mesmo coesa por desenho. Não quer dizer que a classe é ruim.\"],\r\n    [\"O que o CBO conta, e o que fica de fora?\", \"Os outros tipos do <b>projeto<\/b> que a classe usa. Nos exemplos, os tipos do Java (<code>String<\/code>, <code>BigDecimal<\/code>, <code>Map<\/code>) não entraram. Um Strategy aumenta o CBO médio: a interface e o mapa ligam várias classes.\"],\r\n    [\"O que é a dívida técnica do SonarQube?\", \"A soma dos esforços estimados para corrigir cada code smell, em minutos (<code>sqale_index<\/code>). No exemplo D: 1 + 5 + 0 + 10 + 8 = 24 min. É uma estimativa do fabricante, não uma medida de tempo real.\"],\r\n    [\"O que o TCC escolheu, nas métricas?\", \"Quais medidas pedir (9 do SonarQube, as do CK), as versões travadas, e o <b>resumo<\/b> por execução no <code>aggregate-metrics.mjs<\/code>: média ou máximo ou soma, só sobre as classes com nome. E quais colunas entram em quais hipóteses (<code>hipoteses.mjs<\/code>).\"],\r\n  ];\r\n  sec.append(el(\"h2\", null, \"Cuidados de leitura e autoavaliação\"),\r\n    el(\"div\", { class: \"painel\", style: \"max-width:900px;margin-bottom:12px\" }, H(`<h3 style=\"margin-top:0\">O que as métricas não dizem<\/h3><ul>\r\n      <li><b>Nenhuma diz \"bom desenho\".<\/b> Cada uma mede uma coisa; um padrão troca umas pelas outras (aba A × B).<\/li>\r\n      <li><b>Média esconde forma.<\/b> O TCC compara médias por execução; uma execução com uma classe enorme e várias pequenas pode ter a mesma média de outra bem distribuída. O WMC máximo ajuda a ver isso.<\/li>\r\n      <li><b>Pequeno quase não pontua.<\/b> Code smells e duplicação dependem de tamanho: código curto e limpo tende a zero.<\/li>\r\n      <li><b>As ferramentas não sabem o enunciado.<\/b> Uma classe que ninguém usa é medida igual a uma usada.<\/li>\r\n    <\/ul>`)),\r\n    el(\"p\", { class: \"lead\" }, \"Responda de cabeça antes de abrir.\"),\r\n    el(\"div\", { style: \"max-width:900px\" }, Q.map(([q, r], k) => el(\"details\", { class: \"r\" }, el(\"summary\", { html: `${k + 1}. ${q}` }), H(`<p>${r}<\/p>`)))));\r\n}\r\n\n// ---- main.js ----\n// main.js: as abas e o tema.\n\"use strict\";\n\nconst ABAS = [\n  { id: \"mapa\", nome: \"0 · O mapa\", init: abaMapa },\n  { id: \"exemplos\", nome: \"1 · Os exemplos\", init: abaExemplos },\n  { id: \"ciclomatica\", nome: \"2 · Ciclomática\", init: abaCiclomatica },\n  { id: \"cognitiva\", nome: \"3 · Cognitiva ★\", init: abaCognitiva },\n  { id: \"duplicacao\", nome: \"4 · Duplicação\", init: abaDuplicacao },\n  { id: \"smells\", nome: \"5 · Code smells\", init: abaSmells },\n  { id: \"ck\", nome: \"6 · CK\", init: abaCK },\n  { id: \"axb\", nome: \"7 · A × B\", init: abaAxB },\n  { id: \"scripts\", nome: \"8 · Os scripts do TCC\", init: abaScripts },\n  { id: \"auto\", nome: \"9 · Cuidados e autoavaliação\", init: abaAuto },\n];\nconst SECOES = {}, BOTOES = {}, PRONTAS = new Set();\n\nfunction mostraAba(id) {\n  if (!SECOES[id]) id = \"mapa\";\n  ABA_ATUAL = id;\n  lembra(\"aba\", id);\n  for (const a of ABAS) { SECOES[a.id].classList.toggle(\"ativa\", a.id === id); BOTOES[a.id].classList.toggle(\"ativa\", a.id === id); }\n  if (!PRONTAS.has(id)) {\n    PRONTAS.add(id);\n    try { ABAS.find((a) => a.id === id).init(SECOES[id]); }\n    catch (e) { SECOES[id].append(el(\"div\", { class: \"caixa aviso\" }, \"Erro ao montar esta aba: \" + e.message)); console.error(e); }\n  }\n  BOTOES[id].scrollIntoView({ block: \"nearest\", inline: \"nearest\" });\n  window.scrollTo({ top: 0 });\n}\n\n(function inicia() {\n  const faixa = document.querySelector(\"nav.abas .faixa\");\n  const main = document.querySelector(\"main\");\n  for (const a of ABAS) {\n    BOTOES[a.id] = el(\"button\", { onclick: () => mostraAba(a.id) }, a.nome);\n    faixa.append(BOTOES[a.id]);\n    SECOES[a.id] = el(\"section\", { class: \"aba\", id: \"aba-\" + a.id });\n    main.append(SECOES[a.id]);\n  }\n  const temas = [\"auto\", \"light\", \"dark\"], nomes = { auto: \"tema: automático\", light: \"tema: claro\", dark: \"tema: escuro\" };\n  let tema = temas.includes(MEM.tema) ? MEM.tema : \"auto\";\n  const bt = document.querySelector(\"button.tema\");\n  const pinta = () => { if (tema === \"auto\") document.documentElement.removeAttribute(\"data-theme\"); else document.documentElement.setAttribute(\"data-theme\", tema); bt.textContent = nomes[tema]; };\n  bt.onclick = () => { tema = temas[(temas.indexOf(tema) + 1) % temas.length]; lembra(\"tema\", tema); pinta(); };\n  pinta();\n  mostraAba(MEM.aba || \"mapa\");\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script>
"use strict";
const G = window.GUIA;
const CHAVE = "guia-completo-v1";
let MEM = {};
try { MEM = JSON.parse(localStorage.getItem(CHAVE) || "{}") || {}; } catch (e) { MEM = {}; }
const lembra = (k, v) => { MEM[k] = v; try { localStorage.setItem(CHAVE, JSON.stringify(MEM)); } catch (e) { /* sem memoria */ } };
const el = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) { if (k === "html") e.innerHTML = v; else if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
};
const parte = (id) => G.partes.find((p) => p.id === id);
const nomeAba = (p, a) => parte(p).abas.find((x) => x.id === a).nome;

// ---------- as paginas, cada uma inteira num iframe ----------
const QUADROS = {}, PRONTO = {}, FILA = {};
const ESTILO = "header.topo, nav.abas { display: none !important; } .controles { top: 0 !important; } main { padding-top: 10px !important; }";
let tema = ["auto", "light", "dark"].includes(MEM.tema) ? MEM.tema : "auto";
const aplicaTema = (doc) => { if (tema === "auto") doc.documentElement.removeAttribute("data-theme"); else doc.documentElement.setAttribute("data-theme", tema); };
function quadro(id) {
  if (QUADROS[id]) return QUADROS[id];
  const f = el("iframe", { title: parte(id).titulo });
  f.addEventListener("load", () => {
    const w = f.contentWindow, d = f.contentDocument;
    d.head.append(Object.assign(d.createElement("style"), { textContent: ESTILO }));
    aplicaTema(d);
    // a barra lateral acompanha a aba, mesmo quando ela muda por um botao de dentro da pagina
    const original = w.mostraAba;
    w.mostraAba = function (aba) { original(aba); marca(id, w.eval("ABA_ATUAL")); };
    PRONTO[id] = true;
    if (FILA[id]) { w.mostraAba(FILA[id]); FILA[id] = null; } else marca(id, w.eval("ABA_ATUAL"));
  });
  f.srcdoc = JSON.parse(document.getElementById("html-" + id).textContent);
  document.getElementById("principal").append(f);
  return (QUADROS[id] = f);
}
let atual = null;
function abre(id, aba) {
  document.body.classList.remove("menu-aberto");
  document.getElementById("inicio").classList.toggle("ativa", id === "inicio");
  for (const [k, f] of Object.entries(QUADROS)) f.classList.toggle("ativa", k === id);
  atual = id;
  if (id === "inicio") { lembra("onde", ["inicio"]); marca("inicio"); return; }
  const f = quadro(id);
  f.classList.add("ativa");
  if (PRONTO[id]) { if (aba) f.contentWindow.mostraAba(aba); else marca(id, f.contentWindow.eval("ABA_ATUAL")); }
  else FILA[id] = aba || null;
}
function marca(id, aba) {
  if (id === atual) lembra("onde", [id, aba]);
  document.querySelectorAll("aside button").forEach((b) => b.classList.remove("ativa"));
  document.querySelectorAll("aside .parte").forEach((p) => p.classList.toggle("aberta", p.dataset.id === id || p.classList.contains("fixa")));
  const alvo = id === "inicio" ? document.querySelector("aside .inicio") : document.querySelector(`aside button[data-p="${id}"][data-a="${aba}"]`);
  if (alvo) { alvo.classList.add("ativa"); alvo.scrollIntoView({ block: "nearest" }); }
}

// ---------- a barra lateral ----------
const lado = document.getElementById("lado");
lado.append(el("div", { class: "marca" }, el("b", null, "O V5 por dentro"), el("span", null, "o experimento inteiro, explicado e rodando")));
lado.append(el("button", { class: "inicio", onclick: () => abre("inicio") }, "★ Comece aqui: o roteiro"));
G.partes.forEach((p, k) => {
  const abas = el("div", { class: "abas" }, p.abas.map((a) => el("button", { "data-p": p.id, "data-a": a.id, onclick: () => abre(p.id, a.id) }, a.nome)));
  const bloco = el("div", { class: "parte", "data-id": p.id },
    el("button", { onclick: () => { bloco.classList.toggle("fixa"); bloco.classList.add("aberta"); abre(p.id); } }, el("b", null, `${k + 1}. ${p.titulo}`), el("span", null, p.sub)), abas);
  lado.append(bloco);
});
const btTema = el("button", { onclick: () => { tema = ["auto", "light", "dark"][(["auto", "light", "dark"].indexOf(tema) + 1) % 3]; lembra("tema", tema); pinta(); } });
const pinta = () => { aplicaTema(document); Object.entries(QUADROS).forEach(([id, f]) => PRONTO[id] && aplicaTema(f.contentDocument)); btTema.textContent = { auto: "tema: automático", light: "tema: claro", dark: "tema: escuro" }[tema]; };
lado.append(el("div", { class: "rodape" }, btTema));
pinta();
document.getElementById("menu").onclick = () => document.body.classList.toggle("menu-aberto");

// as setas do teclado vao para a pagina aberta, mesmo com o foco aqui fora
document.addEventListener("keydown", (e) => {
  if (!atual || atual === "inicio" || !PRONTO[atual] || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  QUADROS[atual].contentWindow.eval(`(() => { const s = STEPPERS[ABA_ATUAL]; if (s) s.${e.key === "ArrowRight" ? "prox" : "ant"}(); })()`);
  e.preventDefault();
});

// ---------- o comeco ----------
const ini = document.getElementById("inicio");
ini.append(el("h1", null, "O V5 por dentro"),
  el("p", { class: "lead", html: "Tudo o que foi explicado sobre o experimento, num lugar só: as quatro páginas de <code>TCC_V5/explanations/</code>, inteiras, organizadas pela barra lateral. Abaixo, as quatro partes e um <b>roteiro</b> na ordem em que a pesquisa acontece." }),
  el("div", { class: "cards" }, G.partes.map((p, k) => el("button", { class: "card", onclick: () => abre(p.id) }, el("b", null, `${k + 1}. ${p.titulo}`), el("span", null, p.sub), el("i", null, `${p.abas.length} abas`)))),
  el("h2", null, "O roteiro: da pergunta à conclusão"),
  el("div", { class: "roteiro" }, G.roteiro.map(([titulo, itens]) => el("div", { class: "etapa" }, el("div", null, el("b", null, titulo),
    el("div", { class: "links" }, itens.map(([p, a]) => el("button", { onclick: () => abre(p, a) }, el("small", null, parte(p).titulo + " · "), nomeAba(p, a)))))))),
  el("h2", null, "Para ler bem"),
  el("div", { class: "nota", html: `<ul>
    <li>Cada aba tem a numeração da página de origem (\"página dos scripts, aba 7\" continua certo no texto).</li>
    <li>Nas abas de passo a passo, <b>←</b> e <b>→</b> avançam e voltam.</li>
    <li>Todo o código analisado é <b>inventado</b>; os números das ferramentas são os que elas devolveram de verdade. Cada página conta, no começo, de onde vêm os seus.</li>
    <li>O roteiro passa por <b>todas</b> as abas das quatro páginas, sem deixar nenhuma de fora.</li></ul>` }));

const onde = MEM.onde;
if (onde && onde[0] !== "inicio" && parte(onde[0])) abre(onde[0], onde[1]); else abre("inicio");
</script>
</body>
</html>
