classificador.\",\n    fora: [\n      { f: \"Switches.java\", l: 9, txt: \"A linha 9 é marcada <b>uma vez<\/b>, pelo <code>case PRATA,<\/code>. O <code>OURO<\/code> depois da vírgula não tem a palavra <code>case<\/code> na frente, e a expressão exige <code>case<\/code> antes do nome.\" },\n      { f: \"Switches.java\", l: 17, txt: \"<code>default:<\/code> não nomeia nenhum nível.\" },\n      { f: \"Switches.java\", l: 7, txt: \"<code>switch (nivel)<\/code> não é rótulo: a regra marca o <code>case<\/code>, não o <code>switch<\/code>.\" },\n    ],\n    sugestoes: [\n      { cod: \"case NivelClube.OURO -> 0.10;\", casa: true, por: \"prefixo + nome + seta\" },\n      { cod: \"case Gold g when g.ativo() -> 1;\", casa: true, por: \"classe com Gold + variável + when\" },\n      { cod: \"case OuroVip(var x) -> 2;\", casa: true, por: \"classe com Ouro + parêntese (record pattern)\" },\n      { cod: \"case PLATINA -> 3;\", casa: false, por: \"PLATINA não é nome do P4\" },\n      { cod: \"case 3 -> \\\"ouro\\\";\", casa: false, por: \"o rótulo é um número; o \\\"ouro\\\" minúsculo vem depois da seta\" },\n    ],\n  },\n  \"p4-switch-fabrica\": {\n    arquivos: [\"Switches.java\"],\n    intro: \"Marca o rótulo que <b>só devolve um objeto<\/b>: o <code>switch<\/code> escolhe quem vai fazer a conta (uma fábrica), em vez de fazer a conta ele mesmo. Também pega a <b>tradução<\/b> do texto para a constante (<code>case \\\"OURO\\\" -&gt; NivelClube.OURO;<\/code>).\",\n    fora: [\n      { f: \"Switches.java\", l: 8, txt: \"<code>case BRONZE -&gt; BigDecimal.ZERO;<\/code> devolve um <b>valor<\/b>: não é <code>new<\/code>, não é a constante de um nível, não é uma variável com nome de nível.\" },\n      { f: \"Switches.java\", l: 9, txt: \"Aqui a vírgula não entra (só <code>-&gt;<\/code> ou <code>:<\/code>), e o que vem depois é uma conta.\" },\n      { f: \"Switches.java\", l: 23, txt: \"<code>case Ouro o<\/code>: o rótulo é uma classe, não um nome do P4. Esta regra só olha os nomes.\" },\n    ],\n    sugestoes: [\n      { cod: \"case \\\"OURO\\\" -> ouro;\", casa: true, por: \"uma variável com o nome do nível\" },\n      { cod: \"case OURO -> creditoOuro;\", casa: false, por: \"\\\"credito\\\" é nome de número: aí o switch faz a conta\" },\n      { cod: \"case \\\"OURO\\\" -> NivelClube.OURO;\", casa: true, por: \"tradução do texto para a constante\" },\n      { cod: \"case OURO -> Ouro::new;\", casa: true, por: \"referência ao construtor\" },\n      { cod: \"case OURO: return new BigDecimal(\\\"10\\\");\", casa: false, por: \"BigDecimal é tipo de valor\" },\n    ],\n  },\n  \"p4-conjunto\": {\n    arquivos: [\"Conjuntos.java\"],\n    intro: \"Marca um <code>Set.of<\/code>, <code>List.of<\/code> ou <code>EnumSet.of<\/code> que cita níveis. Pela mensagem da regra, o classificador só conta os que <b>não citam todos<\/b>: um conjunto com os três é uma lista de válidos; com parte deles, é tratamento especial de alguns níveis.\",\n    fora: [\n      { f: \"Conjuntos.java\", l: 9, txt: \"<code>Set.of(\\\"BRL\\\", \\\"USD\\\")<\/code> não cita nenhum nível.\" },\n    ],\n    sugestoes: [\n      { cod: \"static final List<NivelClube> TOPO = List.of(NivelClube.OURO);\", casa: true, por: \"List.of com um nível\" },\n      { cod: \"static final Set<String> X = Set.of(String.valueOf(1), \\\"OURO\\\");\", casa: false, por: \"um LIMITE: o [^()]* não atravessa o parêntese do valueOf(...)\" },\n      { cod: \"static final List<String> Y = Arrays.asList(\\\"OURO\\\");\", casa: false, por: \"Arrays.asList não está na lista (só Set, List e EnumSet .of)\" },\n    ],\n  },\n  \"p4-nome\": {\n    arquivos: [\"Condicoes.java\", \"Switches.java\", \"Tipos.java\", \"Ouro.java\", \"Conjuntos.java\"],\n    intro: \"O <b>alarme<\/b>. Não procura remendo nenhum: só confere se o nome de algum nível aparece no código. Se não aparece nenhum, o agente usou outros nomes, e a <b>falta<\/b> de achados nas outras regras deixa de provar alguma coisa (a resposta vira <code>indeterminado<\/code>).\",\n    fora: [\n      { f: \"Condicoes.java\", l: 8, txt: \"<code>PERCENTUAL_OURO<\/code> não é marcado: o <code>\\\\b<\/code> exige uma fronteira, e para o regex o <code>_<\/code> é letra de palavra. Para o alarme isso não pesa: basta um nome em algum lugar do pacote.\" },\n      { f: \"Condicoes.java\", l: 10, txt: \"O comentário <code>// calculo: o OURO nao paga frete<\/code> some na cópia limpa: o Semgrep lê a linha vazia. Ligue \\\"ver o original\\\" para comparar.\" },\n    ],\n    sugestoes: [\n      { cod: \"int TIER_3 = 3;\", casa: false, por: \"nenhum nome do P4: é o caso que o alarme existe para pegar\" },\n      { cod: \"Cliente goldMember;\", casa: false, por: \"gold minúsculo: o pedaço de classe é Gold, com maiúscula\" },\n      { cod: \"Cliente GoldMember;\", casa: true, por: \"Gold dentro de um nome\" },\n    ],\n  },\n  \"p5-nome\": {\n    arquivos: [\"Regiao.java\", \"Tabelas.java\"],\n    intro: \"O alarme do P5: o nome de alguma região aparece no código?\",\n    fora: [],\n    sugestoes: [\n      { cod: \"String r = \\\"norte\\\";\", casa: false, por: \"minúsculo e sem Norte com maiúscula\" },\n      { cod: \"class TaxaNordeste {}\", casa: true, por: \"Nordeste dentro de um nome\" },\n    ],\n  },\n  \"p5-enum-corpo\": {\n    arquivos: [\"Regiao.java\"],\n    intro: \"Uma constante de região <b>com corpo próprio<\/b> (<code>NORTE(...) { ... }<\/code>): a região tem comportamento só dela, uma estrutura por região.\",\n    fora: [\n      { f: \"Regiao.java\", l: 6, txt: \"<code>SUDESTE(...),<\/code> acaba na vírgula: só carrega dados (é da próxima regra).\" },\n    ],\n    sugestoes: [\n      { cod: \"SUL { BigDecimal seguro(BigDecimal v) { return v; } },\", casa: true, por: \"região + chave, sem argumentos\" },\n    ],\n  },\n  \"p5-enum-dados\": {\n    arquivos: [\"Regiao.java\"],\n    intro: \"Uma constante de região que <b>só carrega valores<\/b> (<code>SUL(new BigDecimal(\\\"0.012\\\")),<\/code>): a variação é dado.\",\n    fora  -> v.multiply(T));\", casa: true, por: \"região e uma lambda\" },\n      { cod: \"Map.entry(Regiao.SUL, Seguros::sul);\", casa: true, por: \"região e uma referência a método\" },\n      { cod: \"Map.of(\\\"NORTE\\\", new Seguro() {\", casa: true, por: \"região e uma classe anônima\" },\n    ],\n  },\n  \"p5-config\": {\n    arquivos: [],\n    intro: \"A taxa por região num <b>arquivo de configuração<\/b> (<code>seguro.taxa.norte=0.025<\/code>). Repare no <code>paths<\/code>: é a única regra que olha <code>src/main/resources<\/code>, e não olha <code>.java<\/code>.\",\n    fora: [],\n    caminho: \"src/main/resources/application.properties\",\n    sugestoes: [\n      { cod: \"seguro.taxa.norte=0.025\", casa: true, por: \"chave com a região e um número\", caminho: \"src/main/resources/application.properties\" },\n      { cod: \"seguro.taxa.norte=${TAXA}\", casa: false, por: \"o valor não começa por número\", caminho: \"src/main/resources/application.properties\" },\n    ],\n  },\n  \"p5-switch-label\": {\n    arquivos: [\"Regiao.java\"],\n    intro: \"Um rótulo de <code>switch<\/code> ou uma condição que nomeia uma região: a variação decidida por <code>switch<\/code>/<code>if<\/code>.\",\n    fora: [],\n    sugestoes: [\n      { cod: \"case NORTE -> taxa = T_NORTE;\", casa: true, por: \"case + região\" },\n      { cod: \"if (\\\"NORTE\\\".equals(r)) taxa = T;\", casa: true, por: \"\\\"NORTE\\\".equals\" },\n      { cod: \"if (r == Regiao.SUL) taxa = T;\", casa: true, por: \"== + região\" },\n    ],\n  },\n  \"p5-switch-fabrica\": {\n    arquivos: [\"Regiao.java\"],\n    intro: \"O rótulo de região que devolve um <b>objeto<\/b> (uma fábrica de seguros por região).\",\n    fora: [],\n    sugestoes: [\n      { cod: \"case NORTE -> new SeguroNorte();\", casa: true, por: \"case + região + new de uma classe\" },\n      { cod: \"case NORTE -> new BigDecimal(\\\"0.025\\\");\", casa: false, por: \"BigDecimal é valor\" },\n    ],\n  },\n  \"p5-traducao\": {\n    arquivos: [\"Regiao.java\"],\n    intro: \"Um <code>switch<\/code> ou <code>if<\/code> que <b>só traduz<\/b> o texto para a constante da região: não decide nada, e por isso não conta como condicional de cálculo.\",\n    fora: [],\n    sugestoes: [\n      { cod: \"case \\\"NORTE\\\" -> Regiao.NORTE;\", casa: true, por: \"o texto vira a constante\" },\n      { cod: \"if (texto.equals(\\\"SUL\\\")) return Regiao.SUL;\", casa: true, por: \"o mesmo, com if\" },\n      { cod: \"case \\\"NORTE\\\" -> Regiao.NORTE.taxa();\", casa: false, por: \"não acaba na constante: chama um método\" },\n    ],\n  },\n};\n\n// o trecho da sugestao dentro de um arquivo que compila de cabeca (o que o editor mostra)\nfunction arquivoDaSugestao(s) {\n  if ((s.caminho || \"\").includes(\"resources\")) return s.cod + \"\\n\";\n  const enumRegiao = /^\\s*[A-Z_]+(\\s*\\(|\\s*\\{|,)/.test(s.cod) && !/^(case|class|record)/.test(s.cod);\n  if (enumRegiao) return \"package com.loja.lab;\\n\\npublic enum Teste {\\n    \" + s.cod + \"\\n    ;\\n}\\n\";\n  if (/^(case|default)/.test(s.cod)) return \"package com.loja.lab;\\n\\npublic class Teste {\\n    Object f(Object x) {\\n        switch (x) {\\n            \" + s.cod + \"\\n        }\\n        return null;\\n    }\\n}\\n\";\n  if (/^(class|record)/.test(s.cod)) return \"package com.loja.lab;\\n\\n\" + s.cod + \"\\n\";\n  if (/^(static|int|Cliente|String)/.test(s.cod)) return \"package com.loja.lab;\\n\\npublic class Teste {\\n    \" + s.cod + \"\\n}\\n\";\n  return \"package com.loja.lab;\\n\\npublic class Teste {\\n    void f() {\\n        \" + s.cod + \"\\n    }\\n}\\n\";\n}\n\n\n// ---- ui-base.js ----\n// ui-base.js: o que todas as abas usam (DOM, codigo colorido, passo a passo, quiz, testador).\n\"use strict\";\n\nconst DADOS = window.DADOS;\nconst MP = carregaPontos(DADOS.fontes.pontos);\nconst G = carregaGerador(DADOS.fontes.gerador, MP);\nconst SC = carregaSemCom(DADOS.fontes.semcom);\nconst BL = blocos(G.saida);\nconst PED = definePedacos(G, MP);\nconst L b(f, \"original\")).saida === SC.semComentariosJava(arqLab(f, \"original\")) && SC.semComentariosJava(arqLab(f, \"original\")) === arqLab(f, \"limpa\"));\r\n  out.push({ ok: iguais.length === fs.length, txt: `o removedor passo a passo, o <code>sem-comentarios.mjs<\/code> original e a cópia limpa que o Semgrep leu dão o mesmo texto nos ${fs.length} arquivos do laboratório: ${iguais.length} de ${fs.length}` });\r\n  const casos = DADOS.casosCopia;\r\n  const certos = casos.filter((c) => { const r = simulaCopiaLimpa(c.arq, c.nome); return JSON.stringify(r.lidos.slice().sort()) === JSON.stringify(c.lidos.slice().sort()) && c.avisos.every((a) => r.avisos.some((l) => l.includes(a))) && (c.avisos.length || !r.avisos.length); });\r\n  out.push({ ok: certos.length === casos.length, txt: `a cópia limpa simulada dá o resultado que o <code>copia-limpa-teste.mjs<\/code> exige nos ${casos.length} formatos de pasta: ${certos.length} de ${casos.length}` });\r\n  return out;\r\n}\r\n\r\n// =====================================================================\r\n// 1. O Semgrep do zero (os operadores, um por passo)\r\n// =====================================================================\r\nfunction abaZero(sec) {\r\n  sec.append(el(\"h2\", null, \"O Semgrep do zero\"),\r\n    el(\"p\", { class: \"lead\", html: \"Os operadores que as regras usam, um por passo, todos no mesmo arquivo inventado (<code>Condicoes.java<\/code>). Cada achado mostrado aqui é o que o Semgrep 1.95.0 achou de verdade, rodando o padrão do passo sozinho.\" }));\r\n  const host = el(\"div\");\r\n  sec.append(host);\r\n  const cc = G.casoRegex(P4.casos);\r\n  const mini = (corpo) => \"rules:\\n  - id: exemplo\\n    languages: [java]\\n    severity: INFO\\n    message: x\\n    paths: { include: [\\\"**/src/main/**/*.java\\\"] }\\n\" + corpo;\r\n  const formaRows = (k) => dec(\"form-\" + k, \"Condicoes.java\");\r\n  const tabBind = (lista, extra) => tabela([\"linha\", \"trecho que casou\", \"$X\", \"$C\"].concat(extra ? [extra.cab] : []),\r\n    lista.map((x) => [x.l1, `<code>${esc(arqLab(x.f).split(\"\\n\")[x.l1 - 1].slice(x.c1 - 1, x.l1 === x.l2 ? x.c2 - 1 : undefined))}<\/code>`, `<code>${esc(x.mv.$X)}<\/code>`, `<code>${esc(x.mv.$C)}<\/code>`].concat(extra ? [extra.f(x)] : [])));\r\n  const notasMv = (lista, cls, quais) => Object.fromEntries(lista.map((x) => [x.l1, { txt: esc(mvTxt(x.mv, quais)), cls }]));\r\n\r\n  const buscaOuro = () => {\r\n    const t = arqLab(\"Condicoes.java\", \"original\"), ms = [], re = /OURO/g;\r\n    let m;\r\n    while ((m = re.exec(t))) { const a = t.slice(0, m.index).split(\"\\n\"); ms.push({ f: \"Condicoes.java\", l1: a.length, c1: a[a.length - 1].length + 1, l2: a.length, c2: a[a.length - 1].length + 5, cls: \"m-hit\" }); }\r\n    return ms;\r\n  };\r\n  const NOTA_BUSCA = { 7: \"a constante VIP\", 8: \"dentro de outro nome\", 10: \"um comentário\", 19: \"dentro de outro nome\", 34: \"uma comparação\" };\r\n\r\n  const xeq = formaRows(5), ceq = formaRows(4);\r\n  const ramo1 = dec(\"ramo1\").map((x) => x.l1);\r\n  const todasFormas = FORMAS.flatMap((f, k) => formaRows(k).map((x) => ({ ...x, forma: f })));\r\n  const instCand = dec(\"inst\"), eqMet = dec(\"equals-metodo\");\r\n  const regioesThrow = unicas(dec(\"if-throw-1\").concat(dec(\"if-throw-2\")));\r\n  const linhasRegiao = (lista) => { const o = {}; for (const r of lista) { o[r.f] = o[r.f] || {}; for (let k = r.l1; k <= r.l2; k++) o[r.f][k] = \"regiao\"; } return o; };\r\n\r\n  const passos = [\r\n    {\r\n      t: \"Uma busca de texto não basta\",\r\n      yaml: \"rules:\\n  - id: busca-de-texto\\n    languages: [regex]\\n    severity: INFO\\n    message: a palavra OURO\\n    pattern-regex: 'OURO'\",\r\n      vista: () => visorLab({ arquivos: [\"Condicoes.java\"], versao: \"original\", marcas: buscaOuro(), notas: { \"Condicoes.java\": Object.fromEntries(Object.entries(NOTA_BUSCA).map(([l, t]) => [l, { txt: t, cls: \"cand\" }])) } }),\r\n      txt: \"<p>Comece pelo jeito ingênuo: procurar a palavra <code>OURO<\/code>, como um Ctrl+F ou um <code>grep<\/code>. A busca acha <b>5 linhas<\/b>.<\/p><p>Ela vê <b>letras<\/b>. Não sabe que a linha 10 é um comentário, nem que <code>PERCENTUAL_OURO<\/code> é o nome de um número. E não vê a linha 18, que compara com <code>VIP<\/code>, sendo que <code>VIP<\/code> vale <code>\\\"OURO\\\"<\/code> (linha 7).<\/p>\",\r\n      aconteceu: \"a busca leu o arquivo como um texto só e parou em cada sequência <code>O-U-R-O<\/code>. Esta busca rodou agora, no seu navegador.\",\r\n      quiz: { p: \"Das 5 linhas achadas, quantas são uma <b>comparação<\/b> com o nível?\", op: [\"5\", \"3\", \"1\"], certa: 2, exp: \"Só a 34 (<code>codigo.equalsIgnoreCase(\\\"OURO\\\")<\/code>). A 7 declara a constante, a 8 e a 19 usam um número, a 10 é comentário. E a comparação da linha 18 nem aparece, porque lá está escrito <code>VIP<\/code>.\" },\r\n    },\r\n    {\r\n      t: \"pattern e metavariável: $X.equals($C)\",\r\n      yaml: mini(\"    pattern: $X.equals($C)\"),\r\n      vista: () => visorLab({ arquivos: [\"Condicoes.java\"], marcas: marcas(xeq, \"m-cand\"), notas: { \"Condicoes.java\": notasMv(xeq, \"cand\") } }),\r\n      txt: \"<p>Agora o Semgrep. Ele transforma o código numa <b>árvore<\/b>: este <code>if<\/code> tem esta condição, esta chamada tem este objeto e este argumento. O <code>pattern<\/code> descreve uma <b>forma<\/b>: <i>alguma coisa<\/i>, ponto, <code>equals<\/code>, <i>uma coisa<\/i> entre parênteses.<\/p><p><code>$X<\/code> e <code>$C<\/code> são <b>metavariáveis<\/b>: coringas que casam com qualquer expressão e <b>guardam<\/b> o que casaram (a tabela abaixo).<\/p><p>Repare no que <b>não<\/b> casou: a linha 15 é <code>Objects.equals(a, b)<\/code>, outra forma (um método estático com dois argumentos), e a 34 é <code>equalsIgnoreCase<\/code>, outro nome de método. Para o Semgrep, forma diferente é outra coisa.<\/p>\",\r\n      aconteceu: `o Semgrep achou ${xeq.length} lugares com essa forma: linhas ${xeq.map((x) => x.l1).join(\", \")}.`,\r\n      extra: () => [tabBind(xeq)],\r\n      quiz: { p: \"Na linha 28, <code>\\\"BRONZE\\\".equals(codigo)<\/code>, quem ficou no <code>$X<\/code>?\", op: [\"<code>\\\"BRONZE\\\"<\/code>\", \"<code>codigo<\/code>\", \"não casa\"], certa: 0, exp: \"O <code>$X<\/code> é o que vem antes do ponto: aqui, o próprio texto <code>\\\"BRONZE\\\"<\/code>. O coringa aceita qualquer expressão, inclusive um texto. Confira na tabela.\" },\r\n    },\r\n    {\r\n      t: \"Os mesmos achados, com os nomes trocados\",\r\n      yaml: mini(\"    pattern: $C.equals($X)\"),\r\n      vista: () => visorLab({ arquivos: [\"Condicoes.java\"], marcas: marcas(ceq, \"m-cand\"), notas: { \"Condicoes.java\": notasMv(ceq, \"cand\") } }),\r\n      txt: \"<p>O mesmo padrão com os coringas trocados casa nas <b>mesmas<\/b> linhas: só muda quem guarda o quê. O nome do coringa não importa para achar. Importa para o que vem depois, quando uma condição olha <b>um coringa específico<\/b>.<\/p>\",\r\n      aconteceu: `de novo as linhas ${ceq.map((x) => x.l1).join(\", \")}; agora o <code>$C<\/code> é o que vem antes do ponto.`,\r\n      extra: () => [tabBind(ceq)],\r\n    },\r\n    {\r\n      t: \"patterns (E) e metavariable-regex: o filtro\",\r\n      yaml: mini(`    patterns:\\n      - pattern: $X.equals($C)\\n      - metavariable-regex:\\n          metavariable: $C\\n          regex: '${cc}'`),\r\n      vista: () => { const ok = dec(\"xeq-com-regex\").map((x) => x.l1); return visorLab({ arquivos: [\"Condicoes.java\"], marcas: xeq.map((x) => ({ ...x, cls: ok.includes(x.l1) ? \"m-ok\" : \"m-fora\" })), notas: { \"Condicoes.java\": Object.fromEntries(xeq.map((x) => [x.l1, { txt: `$C = ${esc(x.mv.$C)} ${ok.includes(x.l1) ? \"✓\" : \"✗\"}`, cls: ok.includes(x.l1) ? \"ok\" : \"fora\" }])) } }); },\r\n      txt: \"<p><code>patterns<\/code> é um <b>E<\/b>: todas as condições da lista têm de valer. A segunda não procura código: ela <b>testa o que o coringa guardou<\/b>. O <code>$C<\/code> tem de bater com a expressão regular, que lida pedaço por pedaço diz:<\/p><ul><li><code>^<\/code> começo, e <code>$<\/code> no fim: nada pode sobrar<\/li><li><code>\\\"?<\/code> aspas, se houver<\/li><li><code>([A-Za-z_]\\\\w*\\\\.)*<\/code> prefixos, como <code>NivelClube.<\/code><\/li><li><code>(BRONZE|PRATA|OURO|SILVER|GOLD)<\/code> um nome do P4<\/li><li><code>(\\\\.\\\\w+\\\\(\\\\))?<\/code> um sufixo sem argumento, como <code>.name()<\/code><\/li><\/ul>\",\r\n      aconteceu: \"das 3 linhas, sobrou só a 39 (<code>$C<\/code> = <code>\\\"PRATA\\\"<\/code>). A 18 caiu (<code>VIP<\/code>) e a 28 também: lá o <code>$C<\/code> é <code>codigo<\/code>, porque o <code>\\\"BRONZE\\\"<\/code> está do lado de fora do <code>equals<\/code>.\",\r\n      extra: () => [testador({ regex: cc, rotulo: \"$C\", linhas: xeq.map((x) => ({ onde: \"linha \" + x.l1, v: x.mv.$C, real: dec(\"xeq-com-regex\").some((y) => y.l1 === x.l1) })), sugestoes: [\"NivelClube.OURO\", \"nivel.OURO.name()\", \"PERCENTUAL_OURO\", \"\\\"ouro\\\"\"], explica: \"O regex é testado aqui, no seu navegador; a última coluna é o que o Semgrep real fez com a linha.\" })],\r\n    },\r\n    {\r\n      t: \"Por que as duas ordens\",\r\n      yaml: mini(`    patterns:\\n      - pattern: $C.equals($X)\\n      - metavariable-regex:\\n          metavariable: $C\\n          regex: '${cc}'`),\r\n      vista: () => { const ok = dec(\"ceq-com-regex\").map((x) => x.l1); return visorLab({ arquivos: [\"Condicoes.java\"], marcas: ceq.map((x) => ({ ...x, cls: ok.includes(x.l1) ? \"m-ok\" : \"m-fora\" })), notas: { \"Condicoes.java\": Object.fromEntries(ceq.map((x) => [x.l1, { txt: `$C = ${esc(x.mv.$C)} ${ok.includes(x.l1) ? \"✓\" : \"✗\"}`, cls: ok.includes(x.l1) ? \"ok\" : \"fora\" }])) } }); },\r\n      txt: \"<p>Com a ordem trocada, sobra a <b>outra<\/b> linha: a 28. Cada ordem sozinha pega metade: <code>x.equals(\\\"PRATA\\\")<\/code> só com <code>$X.equals($C)<\/code>, <code>\\\"BRONZE\\\".equals(x)<\/code> só com <code>$C.equals($X)<\/code>.<\/p><p>O Semgrep não sabe que <code>equals<\/code> funciona igual nos dois sentidos. Por isso a regra de verdade lista as duas ordens, e mais <code>==<\/code>, <code>!=<\/code>, <code>equalsIgnoreCase<\/code>, <code>Objects.equals<\/code> e <code>compareTo<\/code>: <b>12 formas<\/b>.<\/p>\",\r\n      aconteceu: \"sobrou a linha 28, com <code>$C<\/code> = <code>\\\"BRONZE\\\"<\/code>.\",\r\n    },\r\n    {\r\n      t: \"pattern-either (OU): as 12 formas\",\r\n      yaml: BL[\"p4-cond-calc\"].linhas.slice(5, lnb(BL[\"p4-cond-calc\"], \"regex:\") + 1).join(\"\\n\"),\r\n      vista: () => { const cand = unicas(todasFormas); return visorLab({ arquivos: [\"Condicoes.java\"], marcas: cand.map((x) => ({ ...x, cls: ramo1.includes(x.l1) ? \"m-ok\" : \"m-fora\" })), notas: { \"Condicoes.java\": Object.fromEntries(cand.map((x) => [x.l1, { txt: ramo1.includes(x.l1) ? \"✓ sobreviveu\" : \"✗ caiu\", cls: ramo1.includes(x.l1) ? \"ok\" : \"fora\" }])) } }); },\r\n      txt: \"<p><code>pattern-either<\/code> é um <b>OU<\/b>: basta uma das formas. Este é o primeiro ramo da regra <code>p4-cond-calc<\/code> de verdade: as 12 formas, e o mesmo filtro no <code>$C<\/code>.<\/p><p>A tabela mostra cada forma que casou e o que ficou no <code>$C<\/code>. Uma linha sobrevive se <b>alguma<\/b> forma passou no filtro. Na 12, por exemplo, <code>$X == $C<\/code> passa (<code>$C<\/code> = <code>NivelClube.GOLD<\/code>) e <code>$C == $X<\/code> não.<\/p>\",\r\n      aconteceu: `sobreviveram as linhas ${ramo1.join(\", \")}. Caiu a 18: o <code>$C<\/code> lá é <code>VIP<\/code>, e o regex olha o <b>texto<\/b> do código, não o valor.`,\r\n      extra: () => [testador({ regex: cc, rotulo: \"forma → $C\", linhas: todasFormas.map((x) => ({ onde: `linha ${x.l1} · ${x.forma}`, v: x.mv.$C, real: ramo1.includes(x.l1) })), explica: \"Cada linha da tabela é uma forma que casou. \\\"Semgrep real\\\" diz o que aconteceu com a <b>linha<\/b> inteira.\" })],\r\n    },\r\n    {\r\n      t: \"O texto escrito na regra, e a constante VIP\",\r\n      yaml: mini('    pattern: $X.equals(\"OURO\")'),\r\n      vista: () => visorLab({ arquivos: [\"Condicoes.java\"], marcas: marcas(dec(\"lit-ouro\"), \"m-ok\").concat([{ f: \"Condicoes.java\", l1: 7, c1: 33, l2: 7, c2: 45, cls: \"m-cand\" }]), notas: { \"Condicoes.java\": { 7: { txt: \"VIP vale \\\"OURO\\\"\", cls: \"cand\" }, 18: { txt: \"✓ casou pelo valor\", cls: \"ok\" } } } }),\r\n      txt: \"<p>Este padrão tem o texto <code>\\\"OURO\\\"<\/code> escrito. E ele casa com a linha 18, que diz <code>equals(VIP)<\/code>! O Semgrep faz <b>propagação de constantes<\/b>: sabe que <code>VIP<\/code> é <code>static final<\/code> e vale <code>\\\"OURO\\\"<\/code>, e casa o padrão pelo valor.<\/p><p>O filtro do passo anterior não faz isso: o <code>metavariable-regex<\/code> olha o texto (<code>VIP<\/code>). Por isso a regra de verdade tem um <b>segundo ramo<\/b>, com os nomes por extenso: 5 formas × 5 nomes = 25 padrões. O comentário do gerador conta isso (linhas 53 e 54).<\/p>\",\r\n      aconteceu: \"casou só a linha 18, com <code>$X<\/code> = <code>cliente.codigo()<\/code>. A palavra OURO não está nela.\",\r\n    },\r\n    {\r\n      t: \"pattern-inside: uma região, não um achado\",\r\n      yaml: mini(\"    pattern: if (...) throw $E;\\n# (para ver a REGIAO que o pattern-inside marca, rodei este padrao sozinho)\"),\r\n      vista: () => visorLab({ arquivos: [\"Condicoes.java\", \"Tipos.java\"], linhas: linhasRegiao(regioesThrow), notas: Object.fromEntries(regioesThrow.map((r) => [r.f, { [r.l1]: { txt: \"$E = \" + esc(r.mv.$E), cls: \"reg\" } }])) }),\r\n      txt: \"<p>Na regra de verdade, isto aparece como <code>pattern-inside: if (...) throw $E;<\/code>. O <code>(...)<\/code> quer dizer <b>qualquer condição<\/b>; o <code>$E<\/code> guarda o que é lançado.<\/p><p>O <code>pattern-inside<\/code> sozinho não marca nada: ele diz <b>onde<\/b> os outros padrões podem estar. As regiões ficam em roxo. Repare que o padrão sem chaves casou com um <code>if<\/code> com chaves e uma instrução só dentro.<\/p>\",\r\n      aconteceu: `duas regiões: Condicoes.java, linhas 28 a 30, e Tipos.java, linhas 9 a 11.`,\r\n    },\r\n    {\r\n      t: \"patterns (E): região E comparação\",\r\n      yaml: BL[\"p4-cond-validacao\"].linhas.slice(5, 12).join(\"\\n\") + \"\\n          # ... (as 12 formas e os 25 textos, como na p4-cond-calc)\",\r\n      vista: () => visorLab({ arquivos: [\"Condicoes.java\", \"Tipos.java\"], linhas: linhasRegiao(regioesThrow), marcas: real(\"p4-cond-calc\").map((x) => ({ ...x, cls: real(\"p4-cond-validacao\").some((y) => y.l1 === x.l1) ? \"m-ok\" : \"m-cand\" })), notas: { \"Condicoes.java\": { 28: { txt: \"✓ comparação dentro da região\", cls: \"ok\" } } } }),\r\n      txt: \"<p>Agora as duas coisas juntas, numa lista <code>patterns<\/code>: o achado tem de ser uma comparação que nomeia um nível (as 6 da <code>p4-cond-calc<\/code>, em azul) <b>e<\/b> estar dentro de uma região de <code>if ... throw<\/code> (em roxo).<\/p><p>Esta é a regra <code>p4-cond-validacao<\/code>: um <code>if<\/code> que nomeia o nível <b>só para recusar<\/b>.<\/p>\",\r\n      aconteceu: \"das 6 comparações, só a da linha 28 está dentro de uma região. A região de Tipos.java não tem comparação nenhuma.\",\r\n      quiz: { p: \"A linha 28 continua marcada também pela <code>p4-cond-calc<\/code>?\", op: [\"sim\", \"não, uma regra tira a outra\"], certa: 0, exp: \"Sim. Cada regra marca por conta própria; a mesma linha pode ser marcada por várias. Quem junta as marcas e decide é o classificador (a mensagem da <code>cond-calc<\/code> avisa: ele tira as de recusa e as de fábrica).\" },\r\n    },\r\n    {\r\n      t: \"pattern-not-inside: o NÃO\",\r\n      yaml: BL[\"p4-instanceof\"].texto,\r\n      vista: () => visorLab({ arquivos: [\"Tipos.java\", \"Ouro.java\"], linhas: linhasRegiao(eqMet), marcas: instCand.map((x) => ({ ...x, cls: real(\"p4-instanceof\").some((y) => y.f === x.f && y.l1 === x.l1) ? \"m-ok\" : \"m-fora\" })), notas: { \"Tipos.java\": Object.fromEntries(instCand.filter((x) => x.f === \"Tipos.java\").map((x) => [x.l1, { txt: \"✓ $K = \" + esc(x.mv.$K), cls: \"ok\" }])), \"Ouro.java\": { 12: { txt: \"✗ dentro do equals()\", cls: \"fora\" } } } }),\r\n      txt: \"<p><code>pattern-not-inside<\/code> é o contrário do <code>pattern-inside<\/code>: o achado <b>não<\/b> pode estar dentro da forma. Aqui: um <code>instanceof<\/code> de uma classe de nível, fora de um método <code>equals<\/code>.<\/p><p>Por quê? Um <code>equals(Object o)<\/code> que faz <code>o instanceof Ouro<\/code> é a classe se comparando com ela mesma: o jeito normal de escrever <code>equals<\/code> em Java, não um remendo. O padrão não diz <code>public<\/code> nem <code>@Override<\/code>, e casou mesmo assim: o que falta no padrão não é exigido.<\/p>\",\r\n      aconteceu: \"3 <code>instanceof<\/code> candidatos; o da Ouro.java:12 está dentro do <code>equals<\/code> (região roxa) e cai. Ficam Tipos.java 5 e 9.\",\r\n    },\r\n    {\r\n      t: \"Quando a árvore falha: o Java 21\",\r\n      yaml: BL[\"p4-switch-label\"].texto,\r\n      vista: () => visorLab({ arquivos: [\"Switches.java\"], linhas: { \"Switches.java\": { 23: \"erro\" } }, marcas: marcas(real(\"p4-switch-label\"), \"m-hit\"), notas: { \"Switches.java\": { 23: { txt: \"o parser falhou aqui; o regex achou\", cls: \"fora\" } } } }),\r\n      txt: `<p>O <code>case Ouro o -&gt;<\/code> da linha 23 é o <i>pattern matching<\/i> do Java 21. O parser de Java do Semgrep 1.95.0 <b>não entende<\/b>: ele avisou <code>${esc(LAB.erros[0].msg)}<\/code> (um erro do tipo <code>${esc(LAB.erros[0].tipo)}<\/code>) e pulou o trecho. Uma regra de árvore nunca veria essa linha.<\/p><p>Por isso as regras de <code>switch<\/code> são de <b>texto<\/b>: <code>languages: [regex]<\/code> e <code>pattern-regex<\/code>. O texto sempre está lá. E o erro não some em silêncio: o classificador transforma um erro de leitura num aviso do pacote.<\/p>`,\r\n      aconteceu: \"a regra de texto <code>p4-switch-label<\/code> marcou as linhas 8, 9, 15, 16 e 23, inclusive a que o parser não leu. Este erro aconteceu de verdade, no Semgrep real, com este arquivo.\",\r\n    },\r\n    {\r\n      t: \"paths: em quais arquivos procurar\",\r\n      yaml: BL[\"p4-cond-calc\"].linhas.slice(0, 5).join(\"\\n\") + \"\\n\\n\" + BL[\"p5-config\"].linhas.slice(0, 5).join(\"\\n\"),\r\n      vista: () => {\r\n        const cs = [\"ZZL1/src/main/java/com/loja/lab/Condicoes.java\", \"ZZL1/src/test/java/com/loja/lab/CondicoesTest.java\", \"ZZL1/src/main/resources/application.properties\", \"ZZL1/src/main/java/com/loja/lab/notas.md\"];\r\n        return el(\"div\", { class: \"painel\" }, tabela([\"arquivo\", \"<code>**/src/main/**/*.java<\/code>\", \"<code>**/src/main/resources/**<\/code>\"],\r\n          cs.map((c) => [`<code>${c}<\/code>`, passaPaths(\"**/src/main/**/*.java\", c.slice(5)) ? '<span class=\"sim\">lê<\/span>' : '<span class=\"nao\">pula<\/span>', passaPaths(\"**/src/main/resources/**\", c.slice(5)) ? '<span class=\"sim\">lê<\/span>' : '<span class=\"nao\">pula<\/span>'])));\r\n      },\r\n      txt: \"<p><code>paths: include<\/code> diz quais arquivos a regra olha. <code>**<\/code> é <b>qualquer quantidade de pastas<\/b>. 50 das 51 regras olham só <code>.java<\/code> de produção; a <code>p5-config<\/code> olha só os arquivos de configuração.<\/p><p>É uma segunda trava: a cópia limpa já só copia o <code>src/main<\/code> do projeto (os testes nem chegam ao Semgrep).<\/p>\",\r\n      aconteceu: \"a tabela foi calculada agora, com a mesma regra de caminho que as regras usam.\",\r\n    },\r\n  ];\r\n  stepper(host, {\r\n    chave: \"zero\", aba: \"zero\", passos: passos,\r\n    desenha: (p, i, corpo) => {\r\n      duasColunas(corpo, [\r\n        codigo({ texto: p.yaml, lang: \"yaml\", titulo: \"<b>a regra deste passo<\/b>\", baixo: true }),\r\n        p.vista(),\r\n      ], explicacao(p, p.extra ? p.extra() : []));\r\n    },\r\n  });\r\n}\r\n\r\n// =====================================================================\r\n// 2. pontos.mjs\r\n// =====================================================================\r\nfunction abaPontos(sec) {\r\n  sec.append(el(\"h2\", null, \"pontos.mjs: a tabela dos casos\"),\r\n    el(\"p\", { class: \"lead\", html: \"36 linhas. É a <b>única<\/b> lista dos nomes: o gerador e o classificador leem daqui. Os valores à direita foram calculados agora, rodando o arquivo original.\" }));\r\n  const host = el(\"div\");\r\n  sec.append(host);\r\n  const obj = (p) => JSON.stringify(p, null, 2);\r\n  const valor = (titulo, texto) => el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, titulo), el(\"pre\", { class: \"fita\", style: \"margin:0\" }, texto));\r\n  const nomesPor = () => tabela([\"ponto\", \"nomes(p)\"], MP.PONTOS.map((p) => [p.id, `<code>${esc(MP.nomes(p).join(\", \"))}<\/code>`]));\r\n  const dom = { p1: \"a entrega\", p2: \"o cupom\", p3: \"o pagamento\", p4: \"o clube (o nível)\" };\r\n  const passos = [\r\n    { t: \"Para que serve\", l: [1, 3], txt: \"<p>Os nomes dos casos de cada ponto do gabarito do Strategy. <b>Dois<\/b> programas usam: o <code>gerar-regras.mjs<\/code> (para escrever as regras) e o <code>classificar.mjs<\/code> (para decidir). Lendo os dois da mesma lista, eles nunca divergem: um nome que entra aqui entra nos dois.<\/p>\" },\r\n    { t: \"casos\", l: [5, 5], txt: \"<p>Como o caso aparece escrito no <b>enunciado<\/b>: o texto que o site manda (<code>\\\"OURO\\\"<\/code>). É o nome mais provável no código de um agente.<\/p>\" },\r\n    { t: \"sinonimos\", l: [6, 8], txt: \"<p>O mesmo caso com outro nome, em inglês. Um agente pode traduzir: <code>enum Tier { BRONZE, SILVER, GOLD }<\/code>. Entraram em 09/10.<\/p>\",\r\n      quiz: { p: \"Um agente escreve <code>enum Tier { BRONZE, SILVER, GOLD }<\/code> e um remendo <code>if (tier == Tier.GOLD) frete = ZERO;<\/code>. <b>Sem<\/b> a linha dos sinônimos, o que o Semgrep diria?\", op: [\"acharia o remendo\", \"não acharia nada, e o pacote sairia isolado\", \"indeterminado\"], certa: 1, exp: \"Sem sinônimos, <code>GOLD<\/code> não é nome de caso, e o remendo passa. E o alarme não dispara, porque <code>BRONZE<\/code> aparece. A falta de achados parece prova de isolamento: <b>isolado, em silêncio<\/b>. É exatamente o que as linhas 6 a 8 contam.\" } },\r\n    { t: \"classes\", l: [9, 11], txt: \"<p>Pedaços de nome de <b>classe ou variável<\/b>: <code>Ouro<\/code> acha <code>NivelOuro<\/code>, <code>ouro<\/code> não (maiúscula importa). Servem para o <code>instanceof<\/code>, o <code>case Ouro o -&gt;<\/code> e a fábrica que devolve um objeto. Repare que é um texto com <code>|<\/code>: vai direto para dentro de um regex, onde <code>|<\/code> quer dizer <b>ou<\/b>.<\/p>\" },\r\n    { t: \"o P5\", l: [12, 12], txt: \"<p>O mesmo para o seguro por região, o controle negativo.<\/p>\" },\r\n    { t: \"A lista\", l: [14, 14], txt: \"<p><code>export const PONTOS = [<\/code>: uma lista com um objeto por ponto. <code>export<\/code> deixa outros arquivos importarem.<\/p>\", valor: () => valor(\"PONTOS.length\", String(MP.PONTOS.length) + \" pontos: \" + MP.PONTOS.map((p) => p.id).join(\", \")) },\r\n    ...[\"p1\", \"p2\", \"p3\", \"p4\"].map((id, k) => ({\r\n      t: `${id}: ${dom[id]}`, l: [15 + 3 * k, 17 + 3 * k],\r\n      txt: id === \"p4\" ? \"<p>O ponto que você lê à mão: os níveis do clube. Dois sinônimos (<code>SILVER<\/code>, <code>GOLD<\/code>); o <code>BRONZE<\/code> é igual nas duas línguas.<\/p>\" : `<p>O ponto ${id.slice(1)}: ${dom[id]}. Só o Semgrep lê (sem conferência humana).<\/p>`,\r\n      valor: () => valor(\"o objeto, como o JavaScript vê\", obj(MP.PONTOS[k])),\r\n    })),\r\n    { t: \"As regiões\", l: [29, 31], txt: \"<p>O P5 não é um ponto de variação como os outros (não tem a mesma estrutura de objeto), então tem três constantes próprias: as regiões, os sinônimos e os pedaços de classe.<\/p>\", valor: () => valor(\"REGIOES_SINONIMOS\", obj(MP.REGIOES_SINONIMOS)) },\r\n    { t: \"nomes(p)\", l: [33, 34], txt: \"<p>Uma função de uma linha: junta os casos e as chaves dos sinônimos. <code>[...a, ...b]<\/code> espalha as duas listas numa só; <code>?? {}<\/code> usa um objeto vazio se o ponto não tiver sinônimos.<\/p>\", valor: () => nomesPor() },\r\n    { t: \"casoDe(p, nome)\", l: [35, 35], txt: \"<p>O caminho de volta: de um nome achado no código para o caso do enunciado. Se o nome é um sinônimo, devolve o caso (<code>GOLD<\/code> → <code>OURO<\/code>); se não, devolve o próprio nome. <code>?.<\/code> não quebra se não houver sinônimos.<\/p>\",\r\n      valor: () => {\r\n        const box = el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, \"experimente: casoDe(p4, ...)\"));\r\n        const out = el(\"div\", { class: \"mini\" });\r\n        const inp = el(\"input\", { type: \"text\", value: \"GOLD\", oninput: () => { out.innerHTML = `casoDe(p4, \"${esc(inp.value)}\") = <code>${esc(JSON.stringify(MP.casoDe(P4, inp.value)))}<\/code>`; } });\r\n        box.append(inp, out);\r\n        setTimeout(() => inp.dispatchEvent(new Event(\"input\")));\r\n        return box;\r\n      } },\r\n    { t: \"NOMES_REGIOES\", l: [36, 36], txt: \"<p>Todos os nomes de região, os do enunciado e os sinônimos. Fim do arquivo: são só dados, nenhuma decisão.<\/p>\", valor: () => valor(\"NOMES_REGIOES\", MP.NOMES_REGIOES.join(\", \")) },\r\n  ];\r\n  stepper(host, {\r\n    chave: \"pontos\", aba: \"pontos\", passos,\r\n    desenha: (p, i, corpo) => duasColunas(corpo,\r\n      codigo({ texto: DADOS.fontes.pontos, lang: \"js\", titulo: \"<b>pontos.mjs<\/b> · TCC_V5/evaluation/tools/semgrep\", atual: [p.l] }),\r\n      explicacao(p, [p.valor ? p.valor() : null])),\r\n  });\r\n}\r\n\n// ---- ui-abas-2.js ----\n// ui-abas-2.js: o laboratorio das regras (as 21 regras do P4 e do P5, uma a uma).\n\"use strict\";\n\nconst LISTA_P4 = [\"p4-cond-calc\", \"p4-cond-validacao\", \"p4-cond-recusa\", \"p4-cond-fabrica\", \"p4-instanceof\", \"p4-instanceof-recusa\", \"p4-switch-label\", \"p4-switch-fabrica\", \"p4-conjunto\", \"p4-nome\"];\nconst LISTA_P5 = [\"p5-nome\", \"p5-enum-corpo\", \"p5-enum-dados\", \"p5-classe-regiao\", \"p5-mapa\", \"p5-mapa-funcao\", \"p5-config\", \"p5-objeto\", \"p5-switch-label\", \"p5-switch-fabrica\", \"p5-traducao\"];\n\nfunction abaRegras(sec) {\n  sec.append(el(\"h2\", null, \"As regras, uma a uma (o laboratório)\"),\n    el(\"p\", { class: \"lead\", html: \"Escolha uma regra. Os passos andam pelas linhas do YAML <b>exatamente como está no <code>regras.yml<\/code><\/b>, e mostram o que cada linha fez no pacote inventado. Regras <span class=\\\"pill java\\\">java<\/span>: o que o Semgrep real achou em cada pedaço. Regras <span class=\\\"pill texto\\\">texto<\/span>: rodam aqui, ao vivo, e você pode editar o código.\" }));\n  const lista = el(\"div\", { class: \"painel lista-regras\" });\n  const area = el(\"div\");\n  sec.append(el(\"div\", { class: \"grade-lab\" }, lista, area));\n  const msg = (id) => (BL[id].texto.match(/message: (.*)/) || [, \"\"])[1];\n  const botoes = {};\n  const escolhe = (id) => {\n    lembra(\"regra\", id);\n    Object.entries(botoes).forEach(([k, b]) => b.classList.toggle(\"ativa\", k === id));\n    montaRegra(area, id);\n  };\n  for (const [nome, ids] of [[\"P4: o clube\", LISTA_P4], [\"P5: o seguro por região\", LISTA_P5]]) {\n    lista.append(el(\"div\", { class: \"grupo\" }, nome));\n    for (const id of ids) {\n      const b = el(\"button\", { title: msg(id), onclick: () => escolhe(id) }, el(\"span\", { class: \"mono\" }, id), el(\"span\", { class: \"pill \" + (BL[id].lang === \"regex\" ? \"texto\" : \"java\") }, BL[id].lang === \"regex\" ? \"texto\" : \"java\"));\n      botoes[id] = b;\n      lista.append(b);\n    }\n  }\n  escolhe(MEM.regra && BL[MEM.regra] ? MEM.regra : \"p4-cond-calc\");\n}\n\nfunction montaRegra(area, id) {\n  area.replaceChildren();\n  const b = BL[id];\n  const passos = [...passosCabecalho(b), ...(b.lang === \"regex\" ? passosTexto(b) : passosJava(b))];\n  stepper(area, {\n    chave: \"regra:\" + id, aba: \"regras\", passos,\n    desenha: (p, i, corpo) => {\n      const y = p.y || [0, 0];\n      const esquerda = [codigo({ texto: b.texto, lang: \"yaml\", titulo: `<b>${id}<\/b> · regras.yml, linha ${b.inicio}`, inicio: 1, atual: [[y[0] + 1, y[1] + 1]], baixo: true })];\n      if (p.vista) esquerda.push(p.vista());\n      duasColunas(corpo, esquerda, explicacao(p, p.extra ? p.extra() : []));\n    },\n  });\n}\n\n// ---------- os dois primeiros passos de toda regra ----------\nfunction passosCabecalho(b) {\n  const msg = (b.texto.match(/message: (.*)/) || [, \"\"])[1];\n  const lang = b.lang === \"regex\"\n    ? \"<li><code>languages: [regex]<\/code>: <b>não<\/b> monta árvore nenhuma. Procura um <b>texto<\/b> no arquivo inteiro, por uma expressão regular. Serve onde a árvore não ajuda (o <code>case<\/code> do Java 21, nomes soltos, arquivos de configuração).<\/li>\"\n    : \"<li><code>languages: [java]<\/code>: o Semgrep monta a <b>árvore<\/b> do Java e procura <b>formas<\/b> de código (um <code>if<\/code>, uma comparação, um <code>new<\/code>).<\/li>\";\n  const iPaths = lnb(b, \"paths:\");\n  const java = b.include.endsWith(\".java\");\n  return [\n    {\n      t: \"O cabeçalho\", y: [0, 3],\n      txt: `<ul><li><code>- id: ${b.id}<\/code>: o nome. O ponto (<code>${b.id.slice(0, 2)}<\/code>) e o tipo (<code>${b.id.slice(3)}<\/code>). O classificador junta os achados por esse nome.<\/li>${lang}<li><code>severity: INFO<\/code>: obrigatório no formato do Semgrep. Aqui não quer dizer nada: nenhuma regra acusa um erro, todas só <b>marcam<\/b>.<\/li><li><code>message<\/code>: um texto livre que vai junto de cada achado. É a melhor documentação da regra: <i>${esc(msg)}<\/i>.<\/li><\/ul>`,\n    },\n    {\n      t: \"paths: onde procurar\", y: [iPaths, iPaths],\n      txt: java\n        ? \"<p>Só arquivos que casam com <code>**/src/main/**/*.java<\/code>: qualquer pasta, depois <code>src/main<\/code>, qualquer pasta, terminando em <code>.java<\/code>. Os 7 arquivos do laboratório passam.<\/p>\"\n        : \"<p>Só arquivos em <code>src/main/resources<\/code>: <code>application.properties<\/code>, <code>application.yml<\/code>. Esta é a <b>única<\/b> regra que olha configuração, e não olha <code>.java<\/code>. Nenhum arquivo do laboratório passa: use o \\\"experimente\\\" no fim.<\/p>\",\n      aconteceu: java ? Object.keys(LAB.arquivos).map((f) => `<code>${f}<\/code> <span class=\"sim\">✓<\/span>`).join(\" · \") : \"nenhum arquivo do laboratório está em <code>src/main/resources<\/code>.\",\n    },\n  ];\n}\n\n// =====================================================================\n// as regras de arvore (languages: [java]): passos com o que o Semgrep real achou\n// =====================================================================\nfunction passosJava(b) {\n  const id = b.id;\n  const linhasRegiao = (lista) => { const o = {}; for (const r of lista) { o[r.f] = o[r.f] || {}; for (let k = r.l1; k <= r.l2; k++) o[r.f][k] = \"regiao\"; } return o; };\n  const cmpTodas = real(\"p4-cond-calc\");\n  const fim = b.linhas.length - 1;\n  const iCmp = (desde) => lnb(b, \"- pattern-either:\", desde);\n  const regInfo = (lista, mv) => tabela([\"arquivo:linhas\", \"o que o \" + mv + \" guardou\"], lista.map((r) => [`${r.f}:${r.l1}${r.l2 > r.l1 ? \"–\" + r.l2 : \"\"}`, `<code>${esc(r.mv[mv] ?? \"\")}<\/code>`]));\n  const passoCmp = (desde, arquivos, extraTxt = \"\") => ({\n    t: \"As comparações que nomeiam um nível\", y: [iCmp(desde), fim],\n    vista: () => visorLab({ arquivos, marcas: marcas(cmpTodas, \"m-cand\") }),\n    txt: `<p>Este <code>pattern-either<\/code> é <b>o mesmo<\/b> da <code>p4-cond-calc<\/code>, copiado pelo gerador: as 12 formas com o filtro do <code>$C<\/code>, mais os 25 textos por extenso. Sozinho, ele acha as mesmas 6 comparações (em azul). Veja a <code>p4-cond-calc<\/code> para o detalhe.<\/p>${extraTxt}`,\n    aconteceu: `6 comparações em Condicoes.java: linhas ${cmpTodas.map((x) => x.l1).join(\", \")}.`,\n  });\n  const passoFim = (arquivos, lnsRegiao, txt, quiz) => {\n    const r = real(id);\n    return {\n      t: \"O resultado: E das condições\", y: [lnb(b, \"patterns:\"), fim],\n      vista: () => visorLab({ arquivos, linhas: lnsRegiao || {}, marcas: marcas(r, \"m-ok\"), notas: Object.fromEntries(arquivos.map((f) => [f, Object.fromEntries(r.filter((x) => x.f === f).map((x) => [x.l1, { txt: \"✓ \" + id, cls: \"ok\" }]))])) }),\n      txt, aconteceu: `o Semgrep real marcou ${r.length === 1 ? \"1 linha\" : r.length + \" linhas\"}: ${r.map((x) => `${x.f}:${x.l1}`).join(\", \")}.`, quiz,\n    };\n  };\n\n  if (id === \"p4-cond-calc\") {\n    const iE = lnb(b, \"pattern-either:\"), iP = lnb(b, \"- patterns:\"), iF0 = lnb(b, \"pattern: $X == $C\"), iFU = lnb(b, \"pattern: $C.compareTo($X)\");\n    const iM = lnb(b, \"- metavariable-regex:\"), iL0 = lnb(b, 'pattern: $X.equals(\"BRONZE\")');\n    const cc = regexDoBloco(b, \"$C\");\n    const todas = FORMAS.flatMap((f, k) => dec(\"form-\" + k, \"Condicoes.java\").map((x) => ({ ...x, forma: f })));\n    const cand = unicas(todas);\n    const r1 = dec(\"ramo1\").map((x) => x.l1), r2 = dec(\"ramo2\").map((x) => x.l1);\n    const LIT = { 15: 'Objects.equals($X, \"PRATA\")', 18: '$X.equals(\"OURO\") (pelo valor de VIP)', 28: '\"BRONZE\".equals($X)', 34: '$X.equalsIgnoreCase(\"OURO\")', 39: '$X.equals(\"PRATA\")' };\n    return [\n      { t: \"pattern-either: dois ramos\", y: [iE, iE],\n        txt: `<p>A regra inteira é um <b>OU<\/b> entre dois ramos:<\/p><ol><li>linhas ${iP + 1} a ${iM + 2}: as 12 formas de comparação, com um filtro no <code>$C<\/code>;<\/li><li>linhas ${iL0 + 1} a ${fim + 1}: 25 padrões com o nome escrito por extenso (5 formas × 5 nomes).<\/li><\/ol><p>Uma linha do código é marcada se casar com <b>qualquer<\/b> um.<\/p>` },\n      { t: \"Ramo 1: as 12 formas\", y: [iP, iFU],\n        vista: () => visorLab({ arquivos: [\"Condicoes.java\"], marcas: cand.map((x) => ({ ...x, cls: \"m-cand\" })) }),\n        txt: \"<p>Cada <code>pattern<\/code> é uma forma de comparar. <code>$X<\/code> e <code>$C<\/code> casam com qualquer expressão; o <code>$C<\/code> é o lado que vai ser testado. Por isso cada forma aparece nas duas ordens (<code>$X == $C<\/code> e <code>$C == $X<\/code>).<\/p><p>Repare: a linha 21 (<code>cliente.pontos() &gt; 1000<\/code>) não é candidata. <code>&gt;<\/code> não está na lista.<\/p>\",\n        aconteceu: `o Semgrep achou comparações em ${cand.length} linhas: ${cand.map((x) => x.l1).join(\", \")}. A tabela do próximo passo mostra cada forma que casou.` },\n      { t: \"Ramo 1: o filtro no $C\", y: [iM, iM + 2],\n        vista: () => visorLab({ arquivos: [\"Condicoes.java\"], marcas: cand.map((x) => ({ ...x, cls: r1.includes(x.l1) ? \"m-ok\" : \"m-fora\" })), notas: { \"Condicoes.java\": Object.fromEntries(cand.map((x) => [x.l1, { txt: r1.includes(x.l1) ? \"✓ fica\" : \"✗ cai\", cls: r1.includes(x.l1) ? \"ok\" : \"fora\" }])) } }),\n        txt: \"<p>O <code>metavariable-regex<\/code> testa o <b>texto<\/b> que o <code>$C<\/code> guardou: tem de ser o nome de um nível, com aspas, prefixo (<code>NivelClube.<\/code>) ou sufixo sem argumento (<code>.name()<\/code>) opcionais. Uma linha fica se <b>alguma<\/b> forma passou.<\/p>\",\n        aconteceu: `ficaram ${r1.join(\", \")}. Caiu a 18: o <code>$C<\/code> lá é <code>VIP<\/code>.`,\n        extra: () => [testador({ regex: cc, rotulo: \"forma → $C\", linhas: todas.map((x) => ({ onde: `linha ${x.l1} · ${x.forma}`, v: x.mv.$C, real: r1.includes(x.l1) })), sugestoes: [\"NivelClube.OURO.name()\", \"Tier.SILVER\", \"TIER_GOLD\"], explica: \"\\\"Semgrep real\\\" diz o que aconteceu com a <b>linha<\/b>.\" })] },\n      { t: \"Ramo 2: os nomes escritos\", y: [iL0, fim],\n        vista: () => visorLab({ arquivos: [\"Condicoes.java\"], marcas: marcas(dec(\"ramo2\"), \"m-ok\"), notas: { \"Condicoes.java\": Object.fromEntries(r2.map((l) => [l, { txt: esc(LIT[l] || \"\"), cls: \"ok\" }])) } }),\n        txt: \"<p>O segundo ramo repete as formas com o nome <b>dentro do padrão<\/b>: <code>$X.equals(\\\"OURO\\\")<\/code>. Parece redundante, mas pega o que o ramo 1 perde: o Semgrep casa estes padrões também pelo <b>valor<\/b> de uma constante (propagação de constantes). A linha 18 diz <code>equals(VIP)<\/code> e <code>VIP<\/code> vale <code>\\\"OURO\\\"<\/code>.<\/p>\",\n        aconteceu: `casaram ${r2.join(\", \")}. A 18 entra por aqui; a 12 não (é <code>==<\/code> com uma constante de enum, e os textos do ramo 2 são só com <code>equals<\/code>).` },\n      { t: \"O resultado: o OU dos dois ramos\", y: [iE, fim],\n        vista: () => visorLab({ arquivos: [\"Condicoes.java\"], marcas: marcas(real(id), \"m-ok\"), notas: { \"Condicoes.java\": Object.fromEntries(real(id).map((x) => [x.l1, { txt: r1.includes(x.l1) && r2.includes(x.l1) ? \"ramos 1 e 2\" : r1.includes(x.l1) ? \"só o ramo 1\" : \"só o ramo 2\", cls: \"ok\" }])) } }),\n        txt: \"<p>Uma linha marcada por qualquer ramo é um achado da regra. São as comparações que <b>nomeiam um nível<\/b>, sejam para calcular, recusar ou escolher. A mensagem avisa que o classificador tira depois as de recusa e as de fábrica: são justamente as das três próximas regras.<\/p>\",\n        aconteceu: `o Semgrep real marcou ${real(id).map((x) => x.l1).join(\", \")}: a união de ${r1.join(\", \")} (ramo 1) com ${r2.join(\", \")} (ramo 2).`,\n        quiz: { p: \"Se um agente escrevesse <code>if (nivel.ordinal() == 2)<\/code> para o Ouro, esta regra marcaria?\", op: [\"sim\", \"não\"], certa: 1, exp: \"Não: <code>$C<\/code> seria <code>2<\/code>, que não é nome de nível, e nenhum texto do ramo 2 casa. É um limite conhecido (OBJETIVO §6, e o Módulo 10 do roteiro): comparar pela posição não é pego.\" } },\n    ];\n  }\n\n  if (id === \"p4-cond-validacao\") {\n    const iP = lnb(b, \"patterns:\"), iI0 = lnb(b, \"pattern-inside: if (...) throw $E;\"), iI1 = lnb(b, \"pattern-inside: if (...) { ... throw $E; ... }\");\n    const regs = unicas(dec(\"if-throw-1\").concat(dec(\"if-throw-2\")));\n    const arqs = [\"Condicoes.java\", \"Tipos.java\"];\n    return [\n      { t: \"patterns: tudo tem de valer\", y: [iP, iP], txt: \"<p><code>patterns<\/code> é um <b>E<\/b>: os itens da lista têm de valer juntos. Aqui são dois: estar dentro de um <code>if<\/code> que lança uma exceção, <b>e<\/b> ser uma comparação que nomeia um nível.<\/p>\" },\n      { t: \"As regiões: if (...) throw\", y: [iI0 - 1, iI1],\n        vista: () => visorLab({ arquivos: arqs, linhas: linhasRegiao(regs) }),\n        txt: \"<p>Duas formas, num <code>pattern-either<\/code>: <code>if (...) throw $E;<\/code> e <code>if (...) { ... throw $E; ... }<\/code> (o <code>throw<\/code> no meio de outras instruções). <code>(...)<\/code> é qualquer condição. As regiões ficam em roxo.<\/p>\",\n        aconteceu: `${regs.length} regiões: ${regs.map((r) => `${r.f} ${r.l1}–${r.l2}`).join(\", \")}.`,\n        extra: () => [regInfo(regs, \"$E\")] },\n      passoCmp(iI1 + 1, arqs),\n      passoFim(arqs, linhasRegiao(regs), \"<p>Fica a comparação que está <b>dentro<\/b> de uma região: um <code>if<\/code> que nomeia um nível <b>só para recusar<\/b>. Pela régua, ele ainda é algo do nível fora da casa dele (§2.1), mas não é o caminho que escolhe a conta (§2.2). Por isso tem regra própria: o classificador precisa separar uma coisa da outra.<\/p>\",\n        { p: \"A região de Tipos.java (linhas 9 a 11) entrou no resultado?\", op: [\"sim\", \"não\"], certa: 1, exp: \"Não: lá a condição é um <code>instanceof<\/code>, não uma comparação. Quem pega aquele caso é a <code>p4-instanceof-recusa<\/code>.\" }),\n    ];\n  }\n\n  if (id === \"p4-cond-recusa\" || id === \"p4-cond-fabrica\") {\n    const recusa = id === \"p4-cond-recusa\";\n    const mv = recusa ? \"$R\" : \"$V\";\n    const iP = lnb(b, \"patterns:\"), iM = lnb(b, \"- metavariable-regex:\");\n    const rx = regexDoBloco(b, mv);\n
