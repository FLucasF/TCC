>, <code>recus<\/code>, <code>invalid<\/code>, <code>indispon<\/code>, <code>unprocessable<\/code>, um <code>status(4xx)<\/code> ou um <code>HttpStatus.BAD...<\/code>. O <code>(?i)<\/code> do começo ignora maiúsculas; o <code>.*<\/code> deixa a palavra aparecer em qualquer lugar (o Semgrep casa a partir do começo do texto, como o comentário do gerador explica).<\/p><p><code>return false<\/code> <b>não<\/b> é recusa: é o brinde feito por um <code>if<\/code>.<\/p>\"\n          : \"<p>O que o <code>if<\/code> devolve tem de ser <b>só um objeto<\/b>: um <code>new<\/code> de uma classe que não é de valor (<code>new Prata()<\/code> sim, <code>new BigDecimal(...)<\/code> não), a constante de um nível (<code>NivelClube.OURO<\/code>), uma variável com o nome do nível (<code>ouro<\/code>, <code>nivelOuro<\/code>, mas não <code>creditoOuro<\/code>: nome de número quer dizer conta), ou <code>Ouro::new<\/code>. O <code>^...$<\/code> exige que o valor inteiro seja isso: <code>base.multiply(new BigDecimal(...))<\/code> não começa com <code>new<\/code>.<\/p>\",\n        aconteceu: `passou ${passa.length === 1 ? \"só a região\" : \"as regiões\"} ${passa.map((r) => r.l1).join(\", \")}.`,\n        extra: () => [testador({ regex: rx, rotulo: mv, linhas: regs.map((r) => ({ onde: \"linha \" + r.l1, v: r.mv[mv] })), sugestoes: recusa ? [\"Optional.of(new Erro(\\\"X\\\"))\", \"ResponseEntity.status(422).build()\", \"false\", \"null\"] : [\"ouro\", \"nivelOuro\", \"creditoOuro\", \"NivelClube.OURO\", \"Ouro::new\", \"PERCENTUAL_OURO\", \"new BigDecimal(\\\"1\\\")\"] })] },\n      passoCmp(iM + 1, [\"Condicoes.java\"]),\n      passoFim([\"Condicoes.java\"], linhasRegiao(passa), recusa\n        ? \"<p>Fica a comparação dentro de um <code>if<\/code> que devolve um erro: uma recusa <b>sem<\/b> <code>throw<\/code> (comum em controller, com <code>ResponseEntity.badRequest()<\/code>).<\/p>\"\n        : \"<p>Fica a comparação dentro de um <code>if<\/code> que só escolhe o objeto: uma <b>fábrica<\/b> feita com <code>if<\/code>. A conta acontece em outro lugar (na classe <code>Prata<\/code>).<\/p>\"),\n    ];\n  }\n\n  if (id === \"p4-instanceof\" || id === \"p4-instanceof-recusa\") {\n    const recusa = id === \"p4-instanceof-recusa\";\n    const cand = dec(\"inst\"), rx = regexDoBloco(b, \"$K\");\n    const arqs = [\"Tipos.java\", \"Ouro.java\"];\n    const iPat = lnb(b, \"pattern: $X instanceof $K\"), iM = lnb(b, \"metavariable: $K\");\n    const passoCand = { t: \"Os candidatos: $X instanceof $K\", y: [iPat, iPat],\n      vista: () => visorLab({ arquivos: arqs, marcas: marcas(cand, \"m-cand\"), notas: Object.fromEntries(arqs.map((f) => [f, Object.fromEntries(cand.filter((x) => x.f === f).map((x) => [x.l1, { txt: \"$K = \" + esc(x.mv.$K), cls: \"cand\" }]))])) }),\n      txt: \"<p>Todo <code>instanceof<\/code> do código: <code>$X<\/code> é o objeto testado, <code>$K<\/code> é a classe.<\/p>\",\n      aconteceu: `${cand.length} candidatos: ${cand.map((x) => `${x.f}:${x.l1}`).join(\", \")}.` };\n    const passoK = { t: \"O filtro no $K: é uma classe de nível?\", y: [iM, iM],\n      vista: () => visorLab({ arquivos: arqs, marcas: marcas(cand, \"m-ok\") }),\n      txt: \"<p><code>.*(Bronze|Prata|Ouro|Silver|Gold)<\/code>: o nome da classe tem de <b>conter<\/b> um pedaço de nome de nível (<code>NivelOuro<\/code> passa). Os pedaços vêm do <code>classes<\/code> do <code>pontos.mjs<\/code>.<\/p>\",\n      aconteceu: \"os 3 passam.\",\n      extra: () => [testador({ regex: rx, rotulo: \"$K\", linhas: cand.map((x) => ({ onde: `${x.f}:${x.l1}`, v: x.mv.$K })), sugestoes: [\"Cliente\", \"OuroService\", \"nivelOuro\"] })] };\n    if (!recusa) {\n      const eq = dec(\"equals-metodo\");\n      return [\n        { t: \"patterns: tudo tem de valer\", y: [lnb(b, \"patterns:\"), lnb(b, \"patterns:\")], txt: \"<p>Três condições juntas: um <code>instanceof<\/code>, de uma classe de nível, fora de um <code>equals<\/code>.<\/p>\" },\n        passoCand, passoK,\n        { t: \"pattern-not-inside: fora do equals()\", y: [lnb(b, \"pattern-not-inside\"), fim],\n          vista: () => visorLab({ arquivos: arqs, linhas: linhasRegiao(eq), marcas: cand.map((x) => ({ ...x, cls: x.f === \"Ouro.java\" ? \"m-fora\" : \"m-ok\" })), notas: { \"Ouro.java\": { 12: { txt: \"✗ dentro do equals()\", cls: \"fora\" } } } }),\n          txt: \"<p>O <code>|<\/code> do YAML abre um texto de várias linhas: o padrão é a declaração de um método <code>boolean equals(Object $O) { ... }<\/code>. O achado <b>não<\/b> pode estar dentro dele.<\/p><p>Um <code>equals<\/code> com <code>o instanceof Ouro<\/code> é a classe se comparando com ela mesma (o jeito normal de escrever <code>equals<\/code>), não um remendo.<\/p>\",\n          aconteceu: \"a região do <code>equals<\/code> é Ouro.java 10–13 (roxo); o candidato da linha 12 cai.\" },\n        passoFim(arqs, null, \"<p>Ficam os dois <code>instanceof<\/code> de verdade: <code>nivel instanceof NivelOuro<\/code> e <code>nivel instanceof Bronze<\/code>. Os dois perguntam ao objeto <b>qual nível ele é<\/b>, fora da classe do nível.<\/p>\"),\n      ];\n    }\n    const regs = unicas(dec(\"if-throw-1\").concat(dec(\"if-throw-2\")));\n    const arqs2 = [\"Tipos.java\", \"Ouro.java\", \"Condicoes.java\"];\n    return [\n      { t: \"patterns: tudo tem de valer\", y: [lnb(b, \"patterns:\"), lnb(b, \"patterns:\")], txt: \"<p>Um <code>instanceof<\/code> de classe de nível <b>dentro<\/b> de um <code>if<\/code> que lança exceção. Repare que esta regra não tem o <code>pattern-not-inside<\/code> do <code>equals<\/code> da anterior.<\/p>\" },\n      { t: \"As regiões: if (...) throw\", y: [lnb(b, \"pattern-inside: if (...) throw $E;\") - 1, lnb(b, \"pattern-inside: if (...) { ... throw $E; ... }\")],\n        vista: () => visorLab({ arquivos: arqs2, linhas: linhasRegiao(regs) }),\n        txt: \"<p>As mesmas duas formas da <code>p4-cond-validacao<\/code>.<\/p>\", aconteceu: regs.map((r) => `${r.f} ${r.l1}–${r.l2}`).join(\", \") + \".\" },\n      passoCand, passoK,\n      passoFim(arqs2, linhasRegiao(regs), \"<p>Fica o <code>instanceof<\/code> que está numa região: Tipos.java:9. Pela mensagem, o classificador conta este como recusa. A mesma linha também está na <code>p4-instanceof<\/code>.<\/p>\"),\n    ];\n  }\n\n  if (id === \"p5-objeto\") {\n    const iE = lnb(b, \"- pattern-either:\"), iR = lnb(b, \"metavariable: $R\"), iT = lnb(b, \"metavariable: $T\");\n    const cand = dec(\"obj-new\").concat(dec(\"obj-mapof\"), dec(\"obj-var\"));\n    const nomeForma = (x) => x.r === \"obj-new\" ? \"new $T($R, ...)\" : x.r === \"obj-mapof\" ? \"Map.of(..., $R, new $T(...), ...)\" : \"$TT $R = new $T(...);\";\n    const rxR = regexDoBloco(b, \"$R\"), rxT = regexDoBloco(b, \"$T\");\n    const passaR = dec(\"obj-mapof-com-r\");\n    const arqs = [\"Tabelas.java\", \"Regiao.java\"];\n    return [\n      { t: \"patterns: tudo tem de valer\", y: [lnb(b, \"patterns:\"), lnb(b, \"patterns:\")], txt: \"<p>Um objeto criado <b>junto com uma região<\/b>: a região é argumento do construtor, chave de um mapa, ou nome da variável. Depois, dois filtros: o <code>$R<\/code> tem de ser uma região, e o <code>$T<\/code> não pode ser tipo de valor.<\/p>\" },\n      { t: \"As 6 formas\", y: [iE, iR - 1],\n        vista: () => visorLab({ arquivos: arqs, marcas: marcas(cand.filter((x) => arqs.includes(x.f)), \"m-cand\") }),\n        txt: \"<p>Seis formas num <code>pattern-either<\/code>. No laboratório só aparecem três: <code>new $T($R, ...)<\/code> (qualquer <code>new<\/code> com argumento), <code>Map.of(..., $R, new $T(...), ...)<\/code> e <code>$TT $R = new $T(...);<\/code>. Não há <code>Map.entry<\/code>, <code>entry<\/code> nem <code>put<\/code>. No <code>Map.of<\/code>, o <code>...<\/code> deixa o par estar em qualquer posição.<\/p>\",\n        aconteceu: `${cand.length} candidatos, em vários arquivos (a tabela tem todos).`,\n        extra: () => [tabela([\"onde\", \"forma\", \"$R\", \"$T\"], cand.map((x) => [`${x.f}:${x.l1}`, `<code>${esc(nomeForma(x))}<\/code>`, `<code>${esc(x.mv.$R)}<\/code>`, `<code>${esc(x.mv.$T)}<\/code>`]))] },\n      { t: \"O filtro no $R: é uma região?\", y: [iR, iR],\n        vista: () => visorLab({ arquivos: arqs, marcas: cand.filter((x) => arqs.includes(x.f)).map((x) => ({ ...x, cls: passaR.some((y) => y.f === x.f && y.l1 === x.l1) ? \"m-ok\" : \"m-fora\" })) }),\n        txt: \"<p>Quase todo <code>new<\/code> do laboratório tem um número ou um texto como primeiro argumento (<code>new BigDecimal(\\\"0.010\\\")<\/code>, <code>new IllegalArgumentException(\\\"PEDIDO_INVALIDO\\\")<\/code>): o <code>$R<\/code> não é região, e cai. Sobram os dois <code>Map.of<\/code> de Tabelas.java.<\/p>\",\n        aconteceu: `ficaram ${passaR.map((x) => `${x.f}:${x.l1} ($R = ${esc(x.mv.$R)}, $T = ${esc(x.mv.$T)})`).join(\" e \")}.`,\n        extra: () => [testador({ regex: rxR, rotulo: \"$R\", linhas: cand.map((x) => ({ onde: `${x.f}:${x.l1}`, v: x.mv.$R })), sugestoes: [\"Regiao.NORTE\", \"\\\"centro_oeste\\\"\"] })] },\n      { t: \"O filtro no $T: não pode ser valor\", y: [iT, iT],\n        vista: () => visorLab({ arquivos: [\"Tabelas.java\"], marcas: passaR.map((x) => ({ ...x, cls: real(id).some((y) => y.l1 === x.l1) ? \"m-ok\" : \"m-fora\" })) }),\n        txt: \"<p><code>^(?!(BigDecimal|...)$)\\\\w+$<\/code>: um nome qualquer, <b>menos<\/b> os tipos de valor. O <code>(?!...)<\/code> é uma verificação: \\\"o que vem aqui não é isto\\\". <code>Map.of(\\\"SUL\\\", new BigDecimal(...))<\/code> é um mapa de valores (a <code>p5-mapa<\/code> pega), não de objetos.<\/p>\",\n        extra: () => [testador({ regex: rxT, rotulo: \"$T\", linhas: passaR.map((x) => ({ onde: `${x.f}:${x.l1}`, v: x.mv.$T })), sugestoes: [\"String\", \"SeguroSul\", \"Integer\"] })] },\n      passoFim([\"Tabelas.java\"], null, \"<p>Fica <code>Map.of(\\\"NORTE\\\", new SeguroNorte())<\/code>: um objeto por região. Pela mensagem, o classificador olha as classes capturadas para saber se é <b>uma classe só<\/b> (dados em objetos) ou <b>uma classe por região<\/b> (estrutura).<\/p>\"),\n    ];\n  }\n  throw new Error(\"regra java sem passos: \" + id);\n}\n\n// =====================================================================\n// as regras de texto (languages: [regex]): rodam aqui\n// =====================================================================\nfunction tabelaPedacos(linhas, achado) {\n  const t = el(\"table\", { class: \"t\" });\n  t.append(el(\"tr\", null, el(\"th\", null, \"pedaço\"), el(\"th\", null, \"o que quer dizer\"), achado ? el(\"th\", null, \"casou com\") : null));\n  for (const l of linhas) {\n    const pad = `padding-left:${6 + l.nivel * 14}px`;\n    if (l.cab) { t.append(el(\"tr\", { class: \"cab-ramo\" }, el(\"td\", { colspan: achado ? 3 : 2, style: pad }, \"— \" + l.txt))); continue; }\n    let casou = null;\n    if (achado) {\n      if (l.flag) casou = el(\"td\", { class: \"mini\" }, \"(muda o jeito de ler)\");\n      else { const v = achado.grupos[l.g]; casou = el(\"td\", { class: v === undefined ? \"mini\" : \"mono\" }, v === undefined ? \"não participou\" : v === \"\" ? \"(nada: ok)\" : JSON.stringify(v)); }\n    }\n    const tr = el(\"tr\", { class: achado && !l.flag && achado.grupos[l.g] === undefined ? \"nao-part\" : null },\n      el(\"td\", { style: pad, class: \"ped\" }, el(\"code\", null, l.re.length > 90 ? l.re.slice(0, 87) + \"…\" : l.re)), el(\"td\", { html: (l.grupo ? \"<b>grupo:<\/b> \" : \"\") + l.txt }), casou);\n    t.append(tr);\n  }\n  return el(\"div\", { class: \"tabela-rolagem\", style: \"max-height:420px\" }, t);\n}\n\nfunction passosTexto(b) {\n  const id = b.id, info = REGRAS_TEXTO[id], ped = PED[id];\n  const iRe = lnb(b, \"pattern-regex:\");\n  const rodaArq = (f, versao = \"limpa\") => rodaRegex(b, ped, arqLab(f, versao)).achados.map((a) => ({ ...a, f }));\n  const passa = (f) => passaPaths(b.include, \"src/main/java/com/loja/lab/\" + f);\n  const achados = Object.keys(LAB.arquivos).filter(passa).flatMap((f) => rodaArq(f));\n  const arqs = info.arquivos.length ? info.arquivos : [];\n  const passos = [\n    { t: \"A expressão, pedaço por pedaço\", y: [iRe, iRe],\n      txt: `<p>${info.intro}<\/p><p>A expressão inteira está na linha ${iRe + 1}. A tabela a abriu em pedaços, na ordem em que o regex os testa. Um <b>grupo<\/b> com ramos é um <b>ou<\/b> (<code>(?:a|b)<\/code>); um pedaço com <code>?<\/code> no fim é opcional.<\/p>`,\n      extra: () => [tabelaPedacos(montaNomeado(ped).linhas, null)] },\n  ];\n  // rodar no laboratorio\n  passos.push({\n    t: \"Rodou no laboratório\", y: [iRe, iRe],\n    estado: { sel: 0 },\n    vistaDin: true,\n    txt: achados.length\n      ? `<p>Rodou agora, no seu navegador, nos 7 arquivos (a cópia limpa). ${achados.length === 1 ? \"Um achado\" : achados.length + \" achados\"}. Clique num achado para ver o que <b>cada pedaço<\/b> casou.<\/p>`\n      : \"<p>Rodou agora, nos 7 arquivos do laboratório: <b>nenhum achado<\/b>. O laboratório não tem esse jeito de escrever. Use o \\\"experimente\\\" (último passo) para ver a regra casar.<\/p>\",\n  });\n  if (info.fora.length) passos.push({\n    t: \"O que ficou de fora, e por quê\", y: [iRe, iRe],\n    vista: () => {\n      const fs = [...new Set(info.fora.map((x) => x.f))];\n      const versao = id === \"p4-nome\" && MEM.originalNome ? \"original\" : \"limpa\";\n      const ms = fs.flatMap((f) => rodaArq(f, versao)).map((a) => ({ ...a, cls: \"m-hit\" }));\n      return visorLab({ arquivos: fs, marcas: ms, linhas: Object.fromEntries(fs.map((f) => [f, Object.fromEntries(info.fora.filter((x) => x.f === f).map((x) => [x.l, \"erro\"]))])), versao });\n    },\n    txt: \"<ul>\" + info.fora.map((x) => `<li><b>${x.f}:${x.l}<\/b>: ${x.txt}<\/li>`).join(\"\") + \"<\/ul>\",\n    extra: () => id === \"p4-nome\" ? [el(\"button\", { class: \"b\" + (MEM.originalNome ? \" on\" : \"\"), onclick: () => { lembra(\"originalNome\", !MEM.originalNome); STEPPERS.regras.ir(STEPPERS.regras.i); } }, MEM.originalNome ? \"ver a cópia limpa\" : \"ver o original (com o comentário)\")] : [],\n  });\n  passos.push({ t: \"Experimente\", y: [iRe, iRe], editor: true,\n    txt: \"<p>Escreva ou cole código. A página faz o que o <code>detect.sh<\/code> faz: tira os comentários (com o <code>sem-comentarios.mjs<\/code> original), confere o <code>paths<\/code> e roda a regra. Os botões trazem exemplos; o rótulo diz o que a regra faz com cada um e por quê.<\/p>\" });\n\n  // os passos que desenham algo especial\n  for (const p of passos) {\n    if (p.vistaDin) {\n      p.vista = () => {\n        const sel = achados[p.estado.sel];\n        if (!sel && !arqs.length) return el(\"div\", { class: \"caixa\", html: \"Esta regra não olha nenhum dos arquivos do laboratório.\" });\n        const f = sel ? sel.f : arqs[0];\n        return visorLab({ arquivos: [f], marcas: achados.filter((a) => a.f === f).map((a) => ({ ...a, cls: a === sel ? \"m-hitsel\" : \"m-hit\" })) });\n      };\n      p.extra = () => {\n        if (!achados.length) return [];\n        const lst = el(\"div\", { class: \"linha-botoes\" });\n        achados.forEach((a, k) => lst.append(el(\"button\", { class: \"b\" + (k === p.estado.sel ? \" on\" : \"\"), onclick: () => { p.estado.sel = k; STEPPERS.regras.ir(STEPPERS.regras.i); } }, `${a.f}:${a.l1}`)));\n        const sel = achados[p.estado.sel];\n        return [el(\"div\", { class: \"caixa aconteceu\" }, el(\"div\", { class: \"rotulo\" }, `▶ achado ${p.estado.sel + 1} de ${achados.length}: ${sel.f}:${sel.l1}`), el(\"div\", { class: \"ped\" }, el(\"code\", null, sel.txt.length > 160 ? sel.txt.slice(0, 157) + \"…\" : sel.txt)), lst),\n          tabelaPedacos(rodaRegex(b, ped, arqLab(sel.f)).linhas, sel)];\n      };\n    }\n    if (p.editor) {\n      p.vista = null;\n      p.extra = () => [editorRegra(b, ped, info)];\n    }\n  }\n  return passos;\n}\n\nfunction editorRegra(b, ped, info) {\n  const box = el(\"div\", { class: \"pilha\" });\n  const caminho = el(\"input\", { type: \"text\", value: info.caminho || \"src/main/java/com/loja/lab/Teste.java\" });\n  const area = el(\"textarea\", { spellcheck: \"false\" });\n  area.value = arquivoDaSugestao(info.sugestoes[0] || { cod: \"\" , caminho: info.caminho });\n  if (info.sugestoes[0]) caminho.value = info.sugestoes[0].caminho || caminho.value;\n  const saida = el(\"div\", { class: \"pilha\" });\n  const roda = () => {\n    saida.replaceChildren();\n    const c = caminho.value.trim();\n    if (!passaPaths(b.include, c)) { saida.append(el(\"div\", { class: \"caixa aviso\", html: `O caminho <code>${esc(c)}<\/code> não passa no <code>paths<\/code> desta regra (<code>${esc(b.include)}<\/code>): o Semgrep nem olharia este arquivo.` })); return; }\n    const ext = c.toLowerCase().split(\".\").pop();\n    const limpo = ext === \"java\" ? SC.semComentariosJava(area.value) : [\"properties\", \"yml\", \"yaml\"].includes(ext) ? SC.semComentariosLinha(area.value) : area.value;\n    const r = rodaRegex(b, ped, limpo);\n    saida.append(codigo({ texto: limpo || \" \", lang: ext === \"java\" ? \"java\" : \"yaml\", titulo: \"<b>a cópia limpa<\/b> · o que a regra lê\", marcas: r.achados.map((a, k) => ({ ...a, cls: k === 0 ? \"m-hitsel\" : \"m-hit\" })), baixo: true }));\n    saida.append(el(\"div\", { class: \"caixa \" + (r.achados.length ? \"certo\" : \"\"), html: r.achados.length ? `<b>${r.achados.length} achado(s)<\/b>: linha ${r.achados.map((a) => a.l1).join(\", \")}. A tabela mostra o primeiro.` : \"<b>Nenhum achado.<\/b>\" }));\n    if (r.achados.length) saida.append(tabelaPedacos(r.linhas, r.achados[0]));\n  };\n  let t = null;\n  const agenda = () => { clearTimeout(t); t = setTimeout(roda, 120); };\n  area.addEventListener(\"input\", agenda); caminho.addEventListener(\"input\", agenda);\n  const sug = el(\"div\", { class: \"pilha\" });\n  for (const s of info.sugestoes) sug.append(el(\"div\", null,\n    el(\"button\", { class: \"b\", onclick: () => { area.value = arquivoDaSugestao(s); caminho.value = s.caminho || \"src/main/java/com/loja/lab/Teste.java\"; roda(); } }, s.cod),\n    el(\"span\", { class: \"mini\", html: ` ${s.casa ? '<span class=\"sim\">casa<\/span>' : '<span class=\"nao\">não casa<\/span>'}: ${esc(s.por)}` })));\n  box.append(el(\"div\", { class: \"rotulo\" }, \"exemplos\"), sug, el(\"div\", { class: \"rotulo\" }, \"caminho do arquivo (relativo ao pacote)\"), caminho, el(\"div\", { class: \"rotulo\" }, \"o código\"), area, saida);\n  setTimeout(roda);\n  return box;\n}\n\n// ---- ui-abas-3.js ----\n// ui-abas-3.js: o gerador, o detect.sh, a copia limpa, o removedor, o juiz e a autoavaliacao.\r\n\"use strict\";\r\n\r\nconst caixaValor = (titulo, texto, lang) => lang\r\n  ? el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, titulo), codigo({ texto, lang, baixo: true }))\r\n  : el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, titulo), el(\"pre\", { class: \"fita\", style: \"margin:0\" }, texto));\r\n\r\n// =====================================================================\r\n// 4. gerar-regras.mjs\r\n// =====================================================================\r\nfunction abaGerador(sec) {\r\n  sec.append(el(\"h2\", null, \"gerar-regras.mjs: quem escreve as 51 regras\"),\r\n    el(\"p\", { class: \"lead\", html: \"274 linhas. O arquivo original está rodando <b>agora<\/b> no seu navegador: os valores à direita são o que cada linha produziu de verdade. O resultado final é comparado com o <code>regras.yml<\/code> do V5.\" }));\r\n  const host = el(\"div\");\r\n  sec.append(host);\r\n  const SRC = DADOS.fontes.gerador.split(\"\\n\");\r\n  const linhaDe = (txt, desde = 1) => { for (let k = desde - 1; k < SRC.length; k++) if (SRC[k].includes(txt)) return k + 1; throw new Error(\"gerador sem: \" + txt); };\r\n  const fimPos = linhaDe(\"`;\", linhaDe(\"- id: ${id}-nome\")) - 1;\r\n  const fimNeg = linhaDe(\"`;\", linhaDe(\"- id: p5-traducao\")) - 1;\r\n  const TIPOS = [\"cond-calc\", \"cond-validacao\", \"cond-recusa\", \"cond-fabrica\", \"instanceof\", \"instanceof-recusa\", \"switch-label\", \"switch-fabrica\", \"conjunto\", \"nome\"];\r\n  const T5 = LISTA_P5.map((x) => x.slice(3));\r\n  const ini = (t, p5) => linhaDe(p5 ? `- id: p5-${t}` : \"- id: ${id}-\" + t);\r\n  const rangos = (lista, p5, fim) => lista.map((t, k) => [ini(t, p5), k + 1 < lista.length ? ini(lista[k + 1], p5) - 1 : fim]);\r\n  const R4 = rangos(TIPOS, false, fimPos), R5 = rangos(T5, true, fimNeg);\r\n  const COMO = {\r\n    \"cond-calc\": \"Um <code>pattern-either<\/code> com o texto que <code>comparacoes(p)<\/code> devolve. Repare no <code>${SO_MAIN}<\/code> e no <code>${id}<\/code>: são os buracos do modelo.\",\r\n    \"cond-validacao\": \"<code>patterns<\/code>: a região <code>if ... throw<\/code> <b>e<\/b> as mesmas comparações. O gerador cola o mesmo <code>comparacoes(p)<\/code>: por isso as comparações são idênticas em todas as regras <code>cond-*<\/code>.\",\r\n    \"cond-recusa\": \"A região <code>if ... return $R<\/code>, o filtro <code>RECUSA<\/code> no <code>$R<\/code> e as comparações.\",\r\n    \"cond-fabrica\": \"As 4 regiões de fábrica, o filtro <code>fabricaRegex(p)<\/code> no <code>$V<\/code> e as comparações.\",\r\n    \"instanceof\": \"<code>$X instanceof $K<\/code>, o <code>$K<\/code> com os pedaços de classe do ponto, e o <code>pattern-not-inside<\/code> do <code>equals<\/code>.\",\r\n    \"instanceof-recusa\": \"A região de <code>throw<\/code> e o mesmo <code>instanceof<\/code>.\",\r\n    \"switch-label\": \"Uma regra de texto. Atenção às barras: no arquivo <code>.mjs<\/code> está <code>\\\\\\\\b<\/code>, que o JavaScript transforma em <code>\\\\b<\/code> no texto gerado.\",\r\n    \"switch-fabrica\": \"Texto, com o <code>OBJETO<\/code> e o <code>objetoComNome<\/code> encaixados.\",\r\n    \"conjunto\": \"Texto: <code>Set<\/code>/<code>List<\/code>/<code>EnumSet<\/code><code>.of(<\/code> com um caso dentro.\",\r\n    \"nome\": \"O alarme: os casos soltos ou os pedaços de classe. Fim do modelo do ponto positivo.\",\r\n  };\r\n  const passos = [\r\n    { t: \"O que ele faz\", l: [1, 8], txt: \"<p>Escreve o <code>regras.yml<\/code>. Uso: <code>node gerar-regras.mjs &gt; regras.yml<\/code>: tudo o que ele imprime vira o arquivo. Os pontos P1 a P4 recebem <b>as mesmas regras<\/b>, mudando só os nomes; o P5 tem regras próprias. Sem IA: o mesmo pacote dá sempre o mesmo resultado.<\/p>\" },\r\n    { t: \"A versão 2\", l: [10, 17], txt: \"<p>O histórico: o que entrou depois da revisão com o corpus adversarial (09/10). Cada item é um jeito de escrever que a versão 1 perdia: as duas ordens, <code>Objects.equals<\/code>, constantes com outro nome, o <code>switch<\/code> do Java 21... Os corpora (Módulo 9 do roteiro) são a prova de cada um.<\/p>\" },\r\n    { t: \"Como ler\", l: [19, 35], txt: \"<p>O mapa do arquivo: os 9 tipos de regra por ponto positivo (mais a <code>instanceof-recusa<\/code>) e os 11 do P5. E a frase mais importante: <b>a decisão não está aqui<\/b>, está no <code>classificar.mjs<\/code>. Aqui só se marca o que existe.<\/p>\" },\r\n    { t: \"import: a lista dos nomes\", l: [37, 37], txt: \"<p>Traz do <code>pontos.mjs<\/code> a lista dos pontos (renomeada para <code>BASE<\/code>), os nomes das regiões e a função <code>nomes<\/code>.<\/p>\", valor: () => caixaValor(\"BASE\", G.BASE.map((p) => p.id).join(\", \")) },\r\n    { t: \"PONTOS: cada ponto com o texto dos nomes\", l: [39, 40], txt: \"<p><code>{ ...p, ... }<\/code> copia o ponto e acrescenta: <code>lista<\/code> (todos os nomes, como lista) e <code>casos<\/code>, que <b>troca<\/b> a lista do <code>pontos.mjs<\/code> por um <b>texto<\/b> com <code>|<\/code>. Dentro de um regex, <code>|<\/code> é \\\"ou\\\": <code>BRONZE|PRATA|OURO<\/code> casa com qualquer um.<\/p>\", valor: () => caixaValor(\"PONTOS, o p4\", JSON.stringify({ id: P4.id, casos: P4.casos, lista: P4.lista, classes: P4.classes }, null, 2)) },\r\n    { t: \"REGIOES\", l: [41, 41], txt: \"<p>O mesmo para as regiões.<\/p>\", valor: () => caixaValor(\"REGIOES\", G.REGIOES) },\r\n    { t: \"VALOR e OBJETO\", l: [42, 44], txt: \"<p><code>VALOR<\/code>: os tipos que guardam um número ou um texto. <code>OBJETO<\/code>: <code>new<\/code> seguido de uma classe que <b>não<\/b> é de valor. O <code>(?!...)<\/code> é uma verificação (\\\"o que vem a seguir não é isto\\\"); <code>[A-Z]\\\\w*<\/code> é um nome com maiúscula; <code>\\\\s*\\\\(<\/code> o parêntese.<\/p><p><code>String.raw<\/code> deixa as barras como estão: sem ele, <code>\\\\s<\/code> num texto JavaScript viraria só <code>s<\/code>.<\/p>\", valor: () => caixaValor(\"OBJETO\", G.OBJETO),\r\n      teste: () => testador({ regex: G.OBJETO, rotulo: \"texto\", linhas: [{ v: \"new Ouro()\" }, { v: \"new BigDecimal(\\\"1\\\")\" }, { v: \"new NivelOuro(cliente)\" }, { v: \"new String(x)\" }], explica: \"Testado pelo começo do texto.\" }) },\r\n    { t: \"ARGS: parênteses dentro de parênteses\", l: [45, 46], txt: \"<p>Um regex não sabe contar parênteses. Para aceitar <code>NORTE(BigDecimal.valueOf(25).divide(BigDecimal.valueOf(1000)))<\/code>, a expressão repete o padrão \\\"parêntese sem parêntese dentro\\\" encaixado <b>até três níveis<\/b>. Mais fundo que isso não casa (um limite, com folga).<\/p>\", valor: () => caixaValor(\"ARGS\", G.ARGS) },\r\n    { t: \"SO_MAIN\", l: [47, 47], txt: \"<p>A linha <code>paths<\/code> que quase toda regra recebe: só <code>.java<\/code> de produção.<\/p>\", valor: () => caixaValor(\"SO_MAIN\", G.SO_MAIN) },\r\n    { t: \"casoRegex: o nome de um caso\", l: [49, 51], txt: \"<p>Uma função que recebe o texto dos nomes e devolve o regex do <code>metavariable-regex<\/code>. Aceita aspas, prefixos (<code>NivelClube.<\/code>) e um sufixo sem argumento (<code>.name()<\/code>). Aqui ela foi chamada com os nomes do P4.<\/p>\", valor: () => caixaValor(\"casoRegex(p4.casos)\", G.casoRegex(P4.casos)),\r\n      teste: () => testador({ regex: G.casoRegex(P4.casos), rotulo: \"$C\", linhas: [{ v: \"NivelClube.GOLD\" }, { v: \"\\\"PRATA\\\"\" }, { v: \"Nivel.OURO.name()\" }, { v: \"VIP\" }, { v: \"PERCENTUAL_OURO\" }] }) },\r\n    { t: \"comparacoes(p): as 12 formas e os 25 textos\", l: [53, 77], txt: \"<p>Devolve um <b>pedaço de YAML<\/b> (um texto) com as comparações: o ramo das 12 formas com o filtro, e um <code>.map<\/code> que escreve 5 padrões para cada nome. <code>.join(\\\"\\\")<\/code> cola tudo. É o mesmo texto que vai dentro de todas as regras <code>cond-*<\/code>.<\/p>\", valor: () => caixaValor(`comparacoes(p4): ${G.comparacoes(P4).split(\"\\n\").filter((l) => l.includes(\"pattern:\")).length} linhas de padrão`, G.comparacoes(P4).replace(/^\\n/, \"\"), \"yaml\") },\r\n    { t: \"RECUSA: um return de erro\", l: [79, 83], txt: \"<p>O regex do que um <code>if<\/code> devolve quando recusa. Os comentários contam duas decisões: <code>return false<\/code> não é recusa, e o <code>.*<\/code> do começo existe porque o Semgrep casa a partir do começo do texto.<\/p>\", valor: () => caixaValor(\"RECUSA\", G.RECUSA),\r\n      teste: () => testador({ regex: G.RECUSA, rotulo: \"$R\", linhas: [{ v: \"ResponseEntity.badRequest().build()\" }, { v: \"Optional.of(new Erro(\\\"X\\\"))\" }, { v: \"false\" }, { v: \"BigDecimal.ZERO\" }] }) },\r\n    { t: \"objetoComNome: uma variável com nome de caso\", l: [85, 89], txt: \"<p>Uma variável chamada <code>ouro<\/code> ou <code>nivelOuro<\/code> é um objeto já criado: devolvê-la é escolher (fábrica). Mas <code>creditoOuro<\/code> é um <b>número<\/b>: aí o <code>switch<\/code> faz a conta. Duas verificações <code>(?!...)<\/code>: não pode ser CONSTANTE em maiúsculas, e não pode ter uma palavra de número (<code>NOME_DE_NUMERO<\/code>).<\/p>\", valor: () => caixaValor(\"objetoComNome(p4.classes)\", G.objetoComNome(P4.classes)) },\r\n    { t: \"fabricaRegex: só escolhe o objeto\", l: [90, 92], txt: \"<p>Junta quatro jeitos de \\\"só um objeto\\\": <code>new<\/code> de classe que não é valor, a constante do caso, a variável com nome de caso, e <code>Ouro::new<\/code>. O <code>^...$<\/code> exige que o valor <b>inteiro<\/b> seja um deles.<\/p>\", valor: () => caixaValor(\"fabricaRegex(p4)\", G.fabricaRegex(P4)),\r\n      teste: () => testador({ regex: G.fabricaRegex(P4), rotulo: \"$V\", linhas: [{ v: \"new Prata()\" }, { v: \"ouro\" }, { v: \"creditoOuro\" }, { v: \"NivelClube.OURO\" }, { v: \"base.multiply(x)\" }] }) },\r\n    { t: \"positivo(p): o modelo dos pontos P1 a P4\", l: [94, 96], txt: \"<p>Começa o modelo. <code>const { id, casos, classes } = p;<\/code> tira três campos do ponto. Daqui até a linha \" + fimPos + \" é um único texto entre crases, com <code>${...}<\/code> nos buracos. Os próximos passos mostram cada regra do modelo, preenchida com o P4.<\/p>\", valor: () => caixaValor(\"para o p4\", `id = \"${P4.id}\"\\ncasos = \"${P4.casos}\"\\nclasses = \"${P4.classes}\"`) },\r\n    ...TIPOS.map((t, k) => ({ t: `O modelo de ${t}`, l: R4[k], txt: `<p>${COMO[t]}<\/p>`, valor: () => caixaValor(`o que saiu para o p4: p4-${t}`, BL[\"p4-\" + t].texto, \"yaml\") })),\r\n    { t: \"REG, CHAVE, regiaoRegex\", l: [185, 190], txt: \"<p>Os pedaços do P5. <code>REG<\/code>: uma região, com aspas e prefixo opcionais. <code>CHAVE<\/code>: a chave de um mapa, que tem de estar entre aspas ou qualificada. O comentário conta por quê: o nome solto aparece num <code>case SUDESTE, SUL -&gt;<\/code>, e o <code>SUL -&gt;<\/code> parecia uma função (um defeito achado na regressão de 09/10).<\/p>\", valor: () => caixaValor(\"CHAVE\", G.CHAVE) },\r\n    ...T5.map((t, k) => ({ t: `O P5: p5-${t}`, l: R5[k], txt: k === 0 ? \"<p><code>negativo<\/code> não é função: é um texto só, com as 11 regras do P5. O P5 mede <b>forma<\/b> (dado, condicional, estrutura), não isolamento, e por isso não segue o modelo dos outros pontos.<\/p>\" : \"<p>Veja esta regra rodando na aba 4.<\/p>\", valor: () => caixaValor(`o que saiu: p5-${t}`, BL[\"p5-\" + t].texto, \"yaml\") })),\r\n    { t: \"Escreve o arquivo\", l: [271, 274], txt: \"<p>Imprime a linha de aviso, <code>rules:<\/code>, as regras de cada ponto positivo (<code>PONTOS.map(positivo)<\/code>: 4 pontos × 10 regras = 40) e as 11 do P5. Total: <b>51 regras<\/b>.<\/p><p>É isto que o <code>detect.sh<\/code> compara byte a byte com o <code>regras.yml<\/code> antes de rodar.<\/p>\",\r\n      valor: () => { const ok = G.saida.length === DADOS.tamRegras && fnv1a(G.saida) === DADOS.fnvRegras; return el(\"div\", { class: \"caixa \" + (ok ? \"certo\" : \"aviso\"), html: `${Object.keys(BL).length} regras, ${G.saida.length.toLocaleString(\"pt-BR\")} caracteres, impressão digital <code>${fnv1a(G.saida)}<\/code>. ${ok ? '<span class=\"sim\">Idêntico ao <code>regras.yml<\/code> do V5.<\/span>' : '<span class=\"nao\">DIFERENTE do regras.yml do V5.<\/span>'}` }); } },\r\n  ];\r\n  stepper(host, {\r\n    chave: \"gerador\", aba: \"gerador\", passos,\r\n    desenha: (p, i, corpo) => duasColunas(corpo,\r\n      codigo({ texto: DADOS.fontes.gerador, lang: \"js\", titulo: \"<b>gerar-regras.mjs<\/b> · TCC_V5/evaluation/tools/semgrep\", atual: [p.l] }),\r\n      explicacao(p, [p.valor ? p.valor() : null, p.teste ? p.teste() : null])),\r\n  });\r\n  sec.append(experimenteGerador());\r\n}\r\n\r\nfunction experimenteGerador() {\r\n  const box = el(\"div\", { class: \"painel\", style: \"margin-top:14px\" });\r\n  box.append(el(\"h3\", { style: \"margin-top:0\" }, \"Experimente: mude o P4 no pontos.mjs e gere de novo\"),\r\n    H(\"<p>Isto roda o gerador original com um <code>pontos.mjs<\/code> alterado <b>só aqui na página<\/b>, e mostra o que mudaria no <code>regras.yml<\/code>. Tente acrescentar <code>PLATINA<\/code> aos casos, ou <code>PLATINUM=PLATINA<\/code> aos sinônimos.<\/p>\"));\r\n  const casos = el(\"input\", { type: \"text\", value: P4.lista.filter((n) => !(n in (MP.PONTOS[3].sinonimos || {}))).join(\", \") });\r\n  const sin = el(\"input\", { type: \"text\", value: Object.entries(MP.PONTOS[3].sinonimos).map(([k, v]) => `${k}=${v}`).join(\", \") });\r\n  const cls = el(\"input\", { type: \"text\", value: MP.PONTOS[3].classes });\r\n  const saida = el(\"div\", { class: \"pilha\", style: \"margin-top:10px\" });\r\n  const gera = () => {\r\n    saida.replaceChildren();\r\n    const lista = casos.value.split(\",\").map((s) => s.trim()).filter(Boolean);\r\n    const sinonimos = Object.fromEntries(sin.value.split(\",\").map((s) => s.trim()).filter(Boolean).map((s) => s.split(\"=\").map((x) => x.trim())));\r\n    const mod = { ...MP, PONTOS: MP.PONTOS.map((p) => (p.id === \"p4\" ? { ...p, casos: lista, sinonimos, classes: cls.value.trim() } : p)) };\r\n    let G2;\r\n    try { G2 = carregaGerador(DADOS.fontes.gerador, mod); } catch (e) { saida.append(el(\"div\", { class: \"caixa aviso\" }, \"o gerador falhou: \" + e.message)); return; }\r\n    const B2 = blocos(G2.saida);\r\n    const mudadas = LISTA_P4.filter((id) => BL[id].texto !== B2[id].texto);\r\n    if (!mudadas.length) { saida.append(el(\"div\", { class: \"caixa certo\", html: \"Nada mudou: o gerador produziu exatamente o <code>regras.yml<\/code> do V5.\" })); return; }\r\n    const total = mudadas.reduce((s, id) => s + diffLinhas(BL[id].linhas, B2[id].linhas).filter((d) => d.t !== \"=\").length, 0);\r\n    saida.append(el(\"div\", { class: \"caixa aviso\", html: `<b>${mudadas.length} de 10 regras do P4 mudaram<\/b> (${total} linhas). Com o <code>pontos.mjs<\/code> assim e o <code>regras.yml<\/code> antigo, o <code>detect.sh<\/code> pararia na linha 49: <code>regras.yml difere do gerar-regras.mjs: gere de novo antes de rodar<\/code>. Gerando de novo, ele roda, mas é <b>outro instrumento<\/b> (outro hash no cabeçalho do CSV), e precisaria de validação nova.` }));\r\n    for (const id of mudadas) {\r\n      const d = diffLinhas(BL[id].linhas, B2[id].linhas);\r\n      const txt = d.filter((x, k) => x.t !== \"=\" || d.slice(Math.max(0, k - 1), k + 2).some((y) => y.t !== \"=\")).map((x) => (x.t === \"=\" ? \"  \" : x.t + \" \") + x.s).join(\"\\n\");\r\n      const c = codigo({ texto: txt, lang: \"yaml\", titulo: `<b>${id}<\/b> · - removida, + nova`, baixo: true, linhas: Object.fromEntries(txt.split(\"\\n\").map((l, k) => [k + 1, l.startsWith(\"- \") ? \"erro\" : l.startsWith(\"+ \") ? \"regiao\" : \"\"]).filter(([, v]) => v)) });\r\n      saida.append(c);\r\n    }\r\n  };\r\n  box.append(el(\"div\", { class: \"grade2\" },\r\n    el(\"div\", null, el(\"div\", { class: \"rotulo\" }, \"casos (como no enunciado)\"), casos),\r\n    el(\"div\", null, el(\"div\", { class: \"rotulo\" }, \"sinônimos (NOME=CASO)\"), sin)),\r\n    el(\"div\", { style: \"margin-top:8px\" }, el(\"div\", { class: \"rotulo\" }, \"classes (pedaços, separados por |)\"), cls),\r\n    el(\"div\", { class: \"linha-botoes\" }, el(\"button\", { class: \"b on\", onclick: gera }, \"gerar de novo\"), el(\"button\", { class: \"b\", onclick: () => { casos.value = \"BRONZE, PRATA, OURO\"; sin.value = \"SILVER=PRATA, GOLD=OURO\"; cls.value = \"Bronze|Prata|Ouro|Silver|Gold\"; gera(); } }, \"voltar ao original\")),\r\n    saida);\r\n  return box;\r\n}\r\n\r\n// =====================================================================\r\n// 5. detect.sh\r\n// =====================================================================\r\nfunction abaDetect(sec) {\r\n  sec.append(el(\"h2\", null, \"detect.sh: o fio que liga tudo\"),\r\n    el(\"p\", { class: \"lead\", html: \"70 linhas de bash. Simulação de uma execução no pacote do laboratório (as pastas são ilustrativas). Os números de saída (arquivos, achados, o erro de leitura, os hashes) são os reais; só o nome da pasta temporária é um exemplo, porque muda a cada vez. Escolha um cenário para ver onde o script <b>para<\/b>.\" }));\r\n  const cenarios = { normal: \"tudo certo\", existe: \"a saída já existe\", regras: \"o regras.yml foi editado à mão\", docker: \"o Docker está fechado\" };\r\n  const barra = el(\"div\", { class: \"linha-botoes\" });\r\n  const host = el(\"div\");\r\n  sec.append(barra, host);\r\n  const IMG = \"semgrep/semgrep@sha256:30e6afa99ebd8e7b4115d4904898108eb4bf77025819e9263f09cf14e6f6e549\";\r\n  const H_ = DADOS.hashes;\r\n  const cab = `# regras ${H_.regras}  classificador ${H_.classificador}  limpeza ${H_.limpeza}  imagem ${IMG.split(\":\").pop()}`;\r\n  const PAC = \"/c/Users/Lucas/Desktop/estudo-semgrep/laboratorio/pacotes\", SAI = \"/c/Users/Lucas/Desktop/estudo-semgrep/laboratorio/saida.csv\";\r\n  const monta = (cen) => {\r\n    const E = {};\r\n    const p = [];\r\n    const add = (l, t, txt, mud = {}, tela) => { Object.assign(E, mud); p.push({ l, t, txt, estado: { ...E }, tela }); };\r\n    const morre = (l, msg, porque) => {\r\n      add([27, 27], \"morrer\", `<p>${porque}<\/p><p>O script chama <code>morrer<\/code>: a mensagem sai em vermelho e o script termina com código 1.<\/p>`, {}, `ERRO: ${msg}`);\r\n      add([39, 39], \"E a pasta temporária some\", \"<p>Mesmo saindo por erro, o <code>trap<\/code> roda e apaga a pasta temporária. Nenhum CSV pela metade fica para trás.<\/p>\", E.TMP ? { TMP: \"(apagada)\" } : {});\r\n    };\r\n    add([1, 1], \"A primeira linha\", \"<p><code>#!/usr/bin/env bash<\/code> (o <i>shebang<\/i>) diz com que programa rodar o arquivo: o bash. Por isso se roda no Git Bash.<\/p>\");\r\n    add([2, 24], \"O cabeçalho\", \"<p>Tudo com <code>#<\/code> é comentário. Conta o uso, as duas garantias (recusa regras diferentes das do gerador e recusa sobrescrever uma saída) e a ordem dos arquivos. É o resumo de tudo: vale ler com calma.<\/p>\");\r\n    add([26, 26], \"set -uo pipefail\", \"<p>Duas travas. <code>-u<\/code>: usar uma variável que não existe é erro (um nome digitado errado para o script, em vez de virar texto vazio). <code>-o pipefail<\/code>: em <code>a | b<\/code>, se <code>a<\/code> falhar, o todo falha.<\/p><p>Não tem <code>-e<\/code> (parar em qualquer erro): o script confere cada passo importante com <code>|| morrer<\/code>, e escolhe a mensagem.<\/p>\");\r\n    add([27, 27], \"A função morrer\", \"<p>Só define a função; nada roda agora. <code>printf<\/code> escreve <code>ERRO: ...<\/code>: <code>\\\\033[31m<\/code> liga o vermelho e <code>\\\\033[0m<\/code> desliga. <code>&gt;&amp;2<\/code> manda para a saída de erro. <code>exit 1<\/code> termina com erro.<\/p>\");\r\n    add([29, 29], \"Dois argumentos?\", \"<p><code>$#<\/code> é quantos argumentos vieram. <code>[ ... ]<\/code> é um teste; <code>||<\/code> quer dizer \\\"se falhar, faça isto\\\". Sem 2 argumentos, morre mostrando o uso.<\/p>\", { \"$#\": \"2 ✓\" });\r\n    add([30, 30], \"Os nomes\", \"<p>Guarda os dois argumentos (<code>$1<\/code>, <code>$2<\/code>) com nomes legíveis.<\/p>\", { PACOTES: PAC, SAIDA: SAI });\r\n    add([31, 31], \"A pasta existe?\", \"<p><code>-d<\/code> testa se é uma pasta.<\/p>\", { \"pasta existe\": \"sim ✓\" });\r\n    if (cen === \"existe\") { add([32, 32], \"A saída já existe?\", \"<p><code>-e<\/code> testa se o arquivo existe, e aqui o teste vem com <code>&amp;&amp;<\/code> (\\\"se der certo, faça\\\"): <b>existindo<\/b>, morre.<\/p>\", { \"saída existe\": \"SIM\" }); morre(32, `${SAI} ja existe`, \"Um resultado nunca é refeito por cima de outro. Para rodar de novo, apague a saída antes (e o Módulo 8 do roteiro avisa isso).\"); return p; }\r\n    add([32, 32], \"A saída já existe?\", \"<p><code>-e<\/code> testa se o arquivo existe. Aqui vem com <code>&amp;&amp;<\/code>: <b>se existir<\/b>, morre. Um resultado nunca é refeito por cima de outro.<\/p>\", { \"saída existe\": \"não ✓\" });\r\n    add([34, 34], \"Onde estou?\", \"<p><code>AQUI<\/code> é a pasta do próprio script, em caminho absoluto: <code>BASH_SOURCE[0]<\/code> é o caminho do script, <code>dirname<\/code> tira o nome do arquivo, <code>cd ... &amp;&amp; pwd -P<\/code> devolve o caminho real. Assim o script acha o gerador e as regras, de qualquer pasta de onde for chamado.<\/p>\", { AQUI: \"/j/TCC/TCC_V3/evaluation/tools/semgrep\" });\r\n    add([35, 36], \"A imagem travada\", \"<p>O Semgrep vem de um container Docker escolhido pelo <b>hash<\/b> (<code>@sha256:...<\/code>), não pelo nome. Um nome como <code>1.95.0<\/code> pode ser republicado; o hash identifica exatamente os mesmos bytes. Trocar a imagem é trocar o instrumento.<\/p>\", { IMAGEM: IMG });\r\n    add([38, 39], \"A pasta temporária\", \"<p><code>mktemp -d<\/code> cria uma pasta nova e vazia. <code>trap '...' EXIT<\/code> agenda: quando o script sair, por sucesso ou por erro, apaga essa pasta.<\/p>\", { TMP: \"/tmp/tmp.k3R9xQ (exemplo)\" });\r\n    add([40, 42], \"Caminhos do Windows\", \"<p>O Git Bash escreve <code>/j/TCC/...<\/code>; o node e o Docker no Windows esperam <code>J:/TCC/...<\/code>. <code>win<\/code> converte com <code>cygpath -m<\/code>; num Linux, sem <code>cygpath<\/code>, devolve igual (<code>2&gt;/dev/null || echo<\/code>).<\/p>\");\r\n    add([44, 47], \"Roda o gerador, agora\", \"<p>Roda o <code>gerar-regras.mjs<\/code> e guarda o que ele imprime em <code>$TMP/regras-geradas.yml<\/code>. Se o próprio gerador falhar, a mensagem é outra: o comentário conta que, no ensaio de 10/10, um erro de caminho aparecia como \\\"regras diferentes\\\".<\/p>\", { \"regras-geradas.yml\": \"75.156 caracteres\" });\r\n    if (cen === \"regras\") { add([48, 49], \"Compara byte a byte\", \"<p><code>cmp -s<\/code> compara os dois arquivos em silêncio. Alguém editou o <code>regras.yml<\/code> à mão: eles diferem.<\/p>\", { comparação: \"DIFERENTES\" }); morre(49, \"regras.yml difere do gerar-regras.mjs: gere de novo antes de rodar\", \"Ninguém consegue rodar com uma regra editada à mão: a única forma de mudar uma regra é mudar o gerador (ou o <code>pontos.mjs<\/code>) e gerar de novo.\"); return p; }\r\n    add([48, 49], \"Compara byte a byte\", \"<p><code>cmp -s<\/code> compara em silêncio. Se o <code>regras.yml<\/code> em uso não for <b>exatamente<\/b> o que o gerador produz agora, morre. A barra invertida no fim da linha 48 continua o comando na linha 49.<\/p>\", { comparação: \"iguais ✓\" });\r\n    add([50, 50], \"O caminho absoluto dos pacotes\", \"<p>O mesmo truque do <code>AQUI<\/code>, para a pasta dos pacotes.<\/p>\", { ABS_PACOTES: PAC });\r\n    add([52, 55], \"A cópia limpa\", \"<p>Chama o <code>copia-limpa.mjs<\/code> (aba 6): acha o projeto de cada pacote e copia o <code>src/main<\/code> para <code>$TMP/limpa<\/code>, sem comentários e com as linhas no lugar (aba 7).<\/p>\", { LIMPA: \"/tmp/tmp.k3R9xQ/limpa\" }, \"1 pacotes, 7 arquivos sem comentarios\");\r\n    if (cen === \"docker\") { add([57, 61], \"O Semgrep, num container\", \"<p>Com o Docker fechado, o <code>docker run<\/code> não consegue subir o container e devolve erro.<\/p>\"); morre(61, \"o Semgrep falhou\", \"O <code>|| morrer<\/code> do fim da linha 61 pega o erro do <code>docker run<\/code>.\"); return p; }\r\n    add([57, 61], \"O Semgrep, num container\", `<p>O coração. Peça por peça:<\/p><ul>\r\n      <li><code>MSYS_NO_PATHCONV=1<\/code>: sem isso, o Git Bash trocaria <code>/pacotes<\/code> por <code>C:/Program Files/Git/pacotes<\/code> (comentário das linhas 40 e 41).<\/li>\r\n      <li><code>docker run --rm<\/code>: sobe um container e o apaga no fim.<\/li>\r\n      <li>dois <code>--mount ... readonly<\/code>: a cópia limpa aparece lá dentro como <code>/pacotes<\/code>, e a pasta das regras como <code>/regras<\/code>. Só leitura: o Semgrep não consegue mudar nada.<\/li>\r\n      <li><code>\"$IMAGEM\" semgrep<\/code>: a imagem travada, e o programa a rodar.<\/li>\r\n      <li><code>--config /regras/regras.yml<\/code>: as regras. <code>--json<\/code>: saída para máquina. <code>--metrics=off<\/code>: não manda estatística de uso para a empresa do Semgrep. <code>--quiet<\/code>: sem barra de progresso. <code>--no-git-ignore<\/code>: lê todos os arquivos, mesmo os que um <code>.gitignore<\/code> esconderia. <code>/pacotes<\/code>: onde procurar.<\/li>\r\n      <li><code>&gt; \"$TMP/saida.json\"<\/code>: guarda o JSON.<\/li><\/ul>`, { \"saida.json\": `${LAB.real.length} achados das 51 regras; ${LAB.erros.length} erro de leitura (${LAB.  };\r\n  const fita = (fonte, passos, k) => {\r\n    const box = el(\"div\", { class: \"fita\" });\r\n    passos.forEach((p, j) => {\r\n      if (p.tipo === \"fim\") return;\r\n      const cls = { codigo: \"codigo-k\", texto: \"texto-k\", caractere: \"texto-k\", bloco: \"texto-k\", linha: \"com-k\", blocoComentario: \"com-k\" }[p.tipo];\r\n      box.append(el(\"span\", { class: [cls, j === k ? \"atual-k\" : \"\", j > k ? \"depois\" : \"\"].filter(Boolean).join(\" \") }, fonte.slice(p.de, p.ate)));\r\n    });\r\n    return box;\r\n  };\r\n  const monta = () => {\r\n    lembra(\"semcomEntrada\", entrada.value);\r\n    const fonte = entrada.value;\r\n    const { passos, saida } = passosSemComentarios(fonte);\r\n    const original = SC.semComentariosJava(fonte);\r\n    stepper(host, {\r\n      chave: \"semcom\", aba: \"semcom\", passos: passos.map((p) => ({ ...p, t: NOME[p.tipo] })),\r\n      desenha: (p, k, corpo) => {\r\n        const ultimo = k === passos.length - 1;\r\n        const nIn = fonte.split(\"\\n\").length, nOut = p.saida.split(\"\\n\").length;\r\n        duasColunas(corpo,\r\n          codigo({ texto: DADOS.fontes.semcom, lang: \"js\", titulo: \"<b>sem-comentarios.mjs<\/b> · TCC_V5/evaluation/tools\", atual: [CORPO[p.linha]] }),\r\n          explicacao({ t: NOME[p.tipo], txt: `<p>${EXP[p.tipo]}<\/p>`, aconteceu: p.tipo === \"fim\" ? \"tirou os espaços do fim das linhas.\" : `posição ${p.de} a ${p.ate}: <code>${esc(JSON.stringify(fonte.slice(p.de, p.ate)).slice(0, 120))}<\/code> → ${p.fica ? \"a saída recebe <code>\" + esc(JSON.stringify(p.fica).slice(0, 120)) + \"<\/code>\" : \"<b>nada<\/b> vai para a saída\"}` }, [\r\n            el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, \"a entrada (verde: texto, riscado: comentário, contorno: o passo atual)\"), fita(fonte, passos, k)),\r\n            el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, `a saída até aqui · linhas: ${nIn} na entrada, ${nOut} na saída`), el(\"pre\", { class: \"fita\", style: \"margin:0\" }, p.saida)),\r\n            ultimo ? el(\"div\", { class: \"caixa \" + (saida === original ? \"certo\" : \"aviso\"), html: saida === original ? '<span class=\"sim\">✓<\/span> A saída é igual à do <code>semComentariosJava<\/code> original (rodado aqui, a partir do arquivo do V5).' : '<span class=\"nao\">✗<\/span> Diferente do original.' }) : null,\r\n          ]));\r\n      },\r\n    });\r\n  };\r\n  let t = null;\r\n  entrada.addEventListener(\"input\", () => { clearTimeout(t); t = setTimeout(monta, 300); });\r\n  monta();\r\n}\r\n\r\n// =====================================================================\r\n// 9. autoavaliacao\r\n// =====================================================================\r\nfunction abaAuto(sec) {\r\n  const Q = [\r\n    [\"Por que o Semgrep sozinho não basta, e o que o classificador acrescenta?\", \"O Semgrep só <b>marca linhas<\/b> (\\\"um <code>if<\/code> que nomeia OURO\\\"). Ele não sabe se aquela linha é um remendo, uma lista de válidos, o registro do mapa ou uma recusa, e não junta as marcas de um pacote inteiro numa resposta. O classificador pega todas as marcas de um pacote, tira o que não conta e aplica a régua.\"],\r\n    [\"Por que <code>isolado<\/code> é decidido pela falta de evidência, e o que o alarme faz?\", \"<code>isolado<\/code> quer dizer: nenhuma linha fora da casa do nível faz algo só para ele. A prova é a <b>ausência<\/b> de marcas de remendo. Mas a ausência também acontece se o agente usou outros nomes (<code>TIER_3<\/code>): aí nada seria achado, nem um remendo. O alarme (<code>p4-nome<\/code>) confere que algum nome de caso aparece; sem nenhum, a resposta é <code>indeterminado<\/code> (e, desde 10/10, a execução fica sem nota).\"],\r\n    [\"O que é uma lista de válidos, e por que ela não conta?\", \"Um conjunto que cita <b>todos<\/b> os níveis só para conferir se um código existe: <code>Set.of(\\\"BRONZE\\\", \\\"PRATA\\\", \\\"OURO\\\").contains(c)<\/code>. Ela não faz nada para um nível em especial, então não é remendo. A <code>p4-conjunto<\/code> marca todo conjunto; pela mensagem da regra, o classificador só conta os que não citam todos.\"],\r\n    [\"Por que o <code>regras.yml<\/code> é gerado, e o que o <code>detect.sh<\/code> faz se alguém editá-lo à mão?\", \"São 51 regras, 10 tipos repetidos em 4 pontos: uma correção feita num ponto e esquecida nos outros seria quase invisível. O <code>detect.sh<\/code> roda o gerador a cada execução e compara byte a byte (<code>cmp -s<\/code>); se o arquivo diferir, para com \\\"regras.yml difere do gerar-regras.mjs\\\".\"],\r\n    [\"Por que a cópia limpa tira os comentários mas mantém as linhas?\", \"Tira porque um comentário <code>// trata o OURO<\/code> seria lido pelas regras de texto como código (o alarme, o <code>case<\/code>). Mantém as linhas para o <code>arquivo:linha<\/code> de cada achado ser o mesmo da sua cópia cega e do original.\"],\r\n    [\"Qual a diferença entre o corpus de desenvolvimento e o de controle?\", \"As regras foram <b>ajustadas olhando<\/b> o corpus 1: acertar nele mede o ajuste, é o mínimo. O corpus 2 foi escrito depois, com as respostas decididas antes de rodar, com formas que as regras nunca viram (inclusive duas que se previa que falhariam). Só ele mede forma nova.\"],\r\n    [\"O que a conferência humana prova que os corpora não provam?\", \"Os corpora são formas que <b>nós<\/b> imaginamos. A conferência compara o Semgrep com a sua leitura nos <b>pacotes reais<\/b>, escritos pelos agentes, com as formas que ninguém previu. Foi assim, no ensaio, que apareceu o defeito da subpasta.\"],\r\n    [\"Como você acrescentaria um padrão novo?\", \"Se for um ponto de variação como o Strategy: uma linha nova no <code>pontos.mjs<\/code> (casos, sinônimos, classes). Se for de outra natureza: tipos de regra novos no gerador. Depois: gerar o <code>regras.yml<\/code>, escrever um <b>corpus novo<\/b> com as respostas antes de rodar, e fazer a conferência humana nos pacotes reais.\"],\r\n  ];\r\n  sec.append(el(\"h2\", null, \"Autoavaliação\"),\r\n    el(\"p\", { class: \"lead\", html: \"As 8 perguntas do fim do roteiro. Responda de cabeça (ou em voz alta, como se fosse para o orientador) e só depois abra.\" }),\r\n    el(\"div\", { style: \"max-width:900px\" }, Q.map(([q, r], k) => el(\"details\", { class: \"r\" }, el(\"summary\", { html: `${k + 1}. ${q}` }), H(`<p>${r}<\/p>`)))));\r\n}\r\n\n// ---- ui-juiz.js ----\n// ui-juiz.js: o classificar.mjs (o juiz), passo a passo, rodando de verdade.\r\n\"use strict\";\r\n\r\nconst CENARIOS = {\r\n  EXJ01: [\"Um mapa e uma classe por nível\", { P4: [\"isolado\", \"consulta\"] }],\r\n  EXJ02: [\"Estrutura, mas o Ouro escapa num if\", { P4: [\"espalhado\", \"condicional-no-calculo\"] }],\r\n  EXJ03: [\"Uma fábrica num lugar só\", { P4: [\"isolado\", \"condicional-unica\"] }],\r\n  EXJ04: [\"Um enum que é só rótulo\", { P4: [\"espalhado\", \"condicional-no-calculo\"] }],\r\n  EXJ05: [\"Uma lista de válidos antes do mapa\", { P4: [\"isolado\", \"consulta\"] }],\r\n  EXJ06: [\"Um if que nomeia o Ouro só para recusar\", { P4: [\"espalhado\", \"consulta\"] }],\r\n  EXJ07: [\"P5: um enum que só carrega números\", { P5: [\"enum-dados\", \"dados\"] }],\r\n  EXJ08: [\"P5: uma região com corpo próprio\", { P5: [\"enum-abstrato\", \"estrutura\"] }],\r\n  EXJ09: [\"P5: objetos, mas da mesma classe\", { P5: [\"outro\", \"dados\"] }],\r\n  EXJ10: [\"P5: uma função por região\", { P5: [\"mapa\", \"estrutura\"] }],\r\n  EXJ11: [\"P5: um switch que só devolve o número\", { P5: [\"switch\", \"condicional\"] }],\r\n  ZZL1: [\"O laboratório: tudo junto\", null],\r\n};\r\n\r\n// a linha (1 = primeira) de um texto que contem um trecho, a partir de uma linha\r\nfunction ln(texto, sub, desde = 1) {\r\n  const ls = texto.split(\"\\n\");\r\n  for (let k = desde - 1; k < ls.length; k++) if (ls[k].includes(sub)) return k + 1;\r\n  throw new Error(\"nao achei no classificar.mjs: \" + sub);\r\n}\r\n\r\nfunction abaJuiz(sec) {\r\n  const DJ = DADOS.juiz, SRC = DJ.fonte;\r\n  const J = carregaJuiz(SRC, DJ.json, DJ.arvore, MP);\r\n  const igualReal = JSON.stringify(J.saida) === JSON.stringify(DJ.esperado);\r\n  sec.append(el(\"h2\", null, \"classificar.mjs: o juiz\"),\r\n    el(\"p\", { class: \"lead\", html: \"O Semgrep só <b>marca linhas<\/b>. Quem decide as respostas da régua é este script. Ele está <b>rodando aqui<\/b>, a partir do arquivo original, sobre a saída real do Semgrep em 12 pacotes inventados: os 11 trechos do exercício da régua (na página do método) e o pacote do laboratório. Escolha um pacote e ande pelos passos.\" }),\r\n    el(\"div\", { class: \"caixa \" + (igualReal ? \"certo\" : \"aviso\"), html: igualReal ? `<span class=\"sim\">✓<\/span> O CSV que ele escreveu aqui é <b>idêntico<\/b> ao do <code>classificar.mjs<\/code> rodado no node, sobre o mesmo JSON (${DJ.esperado.length - 1} pacotes). E nos 11 trechos do exercício, as respostas são as da régua.` : '<span class=\"nao\">✗<\/span> diferente do classificar real' }));\r\n  const barra = el(\"div\", { class: \"linha-botoes\", style: \"margin-top:10px\" }), host = el(\"div\");\r\n  sec.append(barra, host);\r\n  const L = (a, b) => { const i = ln(SRC, a); return [i, b ? ln(SRC, b, i) : i]; };\r\n  const lst = (xs) => (xs.length ? xs.map((x) => `<code>${esc(x)}<\/code>`).join(\" \") : \"<span class='mini'>(nenhum)<\/span>\");\r\n  const cab = DJ.esperado[0].split(\",\");\r\n  const roda = (pac) => {\r\n    lembra(\"cenarioJuiz\", pac);\r\n    barra.replaceChildren(el(\"span\", { class: \"mini\" }, \"pacote: \"), ...Object.keys(CENARIOS).map((p) => el(\"button\", { class: \"b\" + (p === pac ? \" on\" : \"\"), title: CENARIOS[p][0], onclick: () => roda(p) }, p)));\r\n    const r = rastroJuiz(J, MP, pac);\r\n    const linhaCsv = DJ.esperado.find((l) => l.startsWith(pac + \",\"));\r\n    const v = linhaCsv.split(\",\"), col = (c) => v[cab.indexOf(c)];\r\n    const [titulo, regua] = CENARIOS[pac];\r\n    const brutos = Object.entries(r.h).filter(([id]) => /^p[45]-/.test(id)).map(([id, os]) => [`<code>${id}<\/code>`, os.length, lst(os.slice(0, 4)) + (os.length > 4 ? \" …\" : \"\")]);\r\n    const comRegua = (ponto, a, b) => !regua || !regua[ponto] ? \"\" : (regua[ponto][0] === a && regua[ponto][1] === b ? `<p><span class=\"sim\">✓<\/span> A régua diz <b>${regua[ponto].join(\" e \")}<\/b>: o juiz concorda.<\/p>` : `<p><span class=\"nao\">✗<\/span> A régua diz <b>${regua[ponto].join(\" e \")}<\/b>.<\/p>`);\r\n    const arqs = DJ.arquivos[pac], principal = Object.keys(arqs).find((f) => /Service|Condicoes|Regiao/.test(f)) || Object.keys(arqs)[0];\r\n    const passos = [\r\n      { t: \"O que ele faz\", l: [1, 37], txt: \"<p>Lê o JSON do Semgrep (uma lista de linhas marcadas, cada uma com o nome da regra), agrupa por pacote e por regra, e decide ponto a ponto. Do P1 ao P4, primeiro <b>tira<\/b> o que a régua manda não contar (recusas, fábricas, registros, listas de válidos) e depois decide. No P5, olha a forma e a proporção. O comentário do topo resume tudo.<\/p>\" },\r\n      { t: \"Lê o JSON e agrupa por pacote e por regra\", l: L(\"const out = JSON.parse\", \"if (regra === \\\"p5-objeto\\\") {\"), txt: \"<p>Para cada achado: o pacote (a primeira pasta do caminho), a regra (o fim do <code>check_id<\/code>) e o <code>arquivo:linha<\/code>. Guarda também o <b>texto da linha<\/b>, que algumas decisões olham. No <code>p5-objeto<\/code>, guarda a <b>classe<\/b> criada (<code>$T<\/code>).<\/p>\",\r\n        extra: () => [el(\"div\", { class: \"caixa\" }, el(\"div\", { class: \"rotulo\" }, `os achados do P4 e do P5 em ${pac}, antes de qualquer decisão`), tabela([\"regra\", \"linhas\", \"onde\"], brutos.length ? brutos : [[\"—\", 0, \"\"]]))] },\r\n      { t: \"Erros do Semgrep viram avisos\", l: L(\"// Erros do Semgrep, por pacote.\", \"process.exit(1);\"), txt: \"<p>Um trecho que o Semgrep não leu (<code>PartialParsing<\/code>, como o <code>case Ouro o<\/code> do Java 21) vira <b>aviso<\/b>, e as respostas continuam. Qualquer outro erro deixa o pacote <b>todo<\/b> <code>indeterminado<\/code>. Um erro sem arquivo para o lote inteiro.<\/p>\",\r\n        aconteceu: r.avisos.length ? `avisos de ${pac}: ${lst(r.avisos)}${r.quebrado ? \" (pacote quebrado: tudo indeterminado)\" : \"\"}` : `${pac} não tem erro do Semgrep.` },\r\n      { t: \"Cita todos os casos?\", l: L(\"const temNome =\", \"const citaTodos =\"), txt: \"<p><code>citaTodos<\/code>: o texto cita <b>todos<\/b> os casos do ponto, cada um por qualquer nome (OURO ou GOLD)? É a base das duas exclusões seguintes: a lista de válidos e o conjunto que cita todos.<\/p>\" },\r\n      { t: \"Tira as listas de válidos\", l: L(\"// Regua 2.1: o nome \\\"numa lista de validos\\\" nao conta.\", \"/^\\\\s*(?:case\"), txt: \"<p>Régua §2.1: um bloco que cita <b>todos<\/b> os níveis só para conferir se o código existe não conta. O script junta os achados em <b>linhas seguidas<\/b> de um mesmo arquivo, e tira o bloco se ele citar todos os casos <b>e<\/b> for só comparações ligadas por <code>&amp;&amp;<\/code>/<code>||<\/code> (sem <code>else<\/code>, ternário ou lambda), ou só rótulos de <code>switch<\/code> sem conta.<\/p>\",\r\n        aconteceu: `condições tiradas como lista de válidos em ${pac}: ${lst(r.listaFora)}` },\r\n      { t: \"Tira o registro\", l: L(\"// O registro:\", \"return nomes(ponto).some\"), txt: \"<p>A casa do nível dizendo que atende o código (<code>return \\\"OURO\\\".equals(c);<\/code> dentro de <code>Ouro.java<\/code>) é o nome usado como chave, <b>dentro da própria casa<\/b>. Não é remendo. O teste: a linha é só o <code>return<\/code> de uma comparação, e o arquivo tem o pedaço de classe do caso no nome.<\/p>\",\r\n        aconteceu: `tiradas como registro em ${pac}: ${lst(r.registro)}` },\r\n      { t: \"Recusas e fábricas saem da conta\", l: L(\"// Recusar: com throw\", \"const naoConta =\"), txt: \"<p>As recusas são as <code>cond-validacao<\/code> (com <code>throw<\/code>) mais as <code>cond-recusa<\/code> (devolvendo erro). Com as <code>cond-fabrica<\/code>, formam o que <b>não conta como cálculo<\/b>.<\/p>\",\r\n        aconteceu: `recusas: ${lst(r.recusas)}<br>não contam como cálculo: ${lst(r.naoConta)}` },\r\n      { t: \"As condições que sobram\", l: L(\"const condCalc = semListasDeValidos\", \"const condValidacao =\"), txt: \"<p>Das <code>cond-calc<\/code>, sobra o que não é lista de válidos, nem recusa ou fábrica, nem registro: as condições que nomeiam um nível <b>para calcular<\/b>. As recusas passam pelo mesmo filtro de lista de válidos e vão para <code>condValidacao<\/code>.<\/p>\",\r\n        aconteceu: `tiradas por serem recusa ou fábrica: ${lst(r.tiradasNaoConta)}<br><b>condições de cálculo<\/b>: ${lst(r.condCalc)}<br><b>recusas que contam<\/b>: ${lst(r.condValidacao)}` },\r\n      { t: \"Fábricas, rótulos e conjuntos\", l: L(\"const fabrica =\", \"const conjuntos =\"), txt: \"<p><b>Fábrica<\/b>: os rótulos de <code>switch<\/code> e os <code>if<\/code> que só devolvem um objeto. <b>Rótulos<\/b>: os <code>case<\/code> que nomeiam um nível, menos os de fábrica e as listas de rótulos. <b>Conjuntos<\/b>: os <code>Set/List.of<\/code> que <b>não<\/b> citam todos (os que citam todos são listas de válidos).<\/p>\",\r\n        aconteceu: `fábrica: ${lst(r.fabrica)}<br>rótulos que contam: ${lst(r.rotulos)}<br>conjuntos que citam todos (saem): ${lst(r.conjTodos)}<br>conjuntos parciais (contam): ${lst(r.conjuntos)}` },\r\n      { t: \"instanceof: recusa ou cálculo\", l: L(\"// instanceof dentro de um if que recusa\", \"h[`${p}-instanceof-recusa`] = [...instRecusa];\"), txt: \"<p>Um <code>instanceof<\/code> dentro de um <code>if<\/code> que recusa conta como <b>recusa<\/b>, não como cálculo (um defeito achado na regressão de 09/10).<\/p>\",\r\n        aconteceu: `instanceof de cálculo: ${lst(r.inst)}<br>instanceof de recusa: ${lst(r.instRecusa)}` },\r\n      { t: \"Somar\", l: L(\"const calculo =\", \"const validacao =\"), txt: \"<p><b>cálculo<\/b> = condições de cálculo + <code>instanceof<\/code> + rótulos + conjuntos parciais. <b>validação<\/b> = recusas + <code>instanceof<\/code> de recusa.<\/p>\",\r\n        aconteceu: `cálculo = ${r.condCalc.length} + ${r.inst.length} + ${r.rotulos.length} + ${r.conjuntos.length} = <b>${r.calculo}<\/b><br>validação = ${r.condValidacao.length} + ${r.instRecusa.length} = <b>${r.validacao}<\/b>` },\r\n      { t: \"O alarme\", l: L(\"// Alarme: nenhum nome de caso\", 'if (conta(h, `${p}-nome`) === 0)'), txt: \"<p>Se o pacote inteiro não cita <b>nenhum<\/b> nome do ponto, o agente usou outros nomes, e as regras não veriam um remendo: a resposta é <code>indeterminado<\/code>, nunca um <code>isolado<\/code> falso.<\/p>\",\r\n        aconteceu: r.alarme4 ? `nenhum nome do P4 em ${pac}: <b>o alarme dispara<\/b>, P4 indeterminado (é um pacote do P5)` : `${r.h[\"p4-nome\"]?.length || 0} citações de nome do P4: o alarme fica quieto.` },\r\n      { t: \"A decisão do P4\", l: L(\"const localizacao =\", \"return [localizacao, selecao];\"), txt: \"<ul><li><b>localização<\/b>: sobrou cálculo ou validação? <code>espalhado<\/code>. Senão, <code>isolado<\/code>.<\/li><li><b>seleção<\/b>: sobrou cálculo? <code>condicional-no-calculo<\/code>. Senão, houve fábrica? <code>condicional-unica<\/code>. Senão, <code>consulta<\/code>.<\/li><\/ul><p>Repare: a validação faz o pacote ficar <code>espalhado<\/code>, mas não mexe na seleção (régua §2.1 e §2.2).<\/p>\",\r\n        aconteceu: `P4 de ${pac}: <b>${r.loc}<\/b> e <b>${r.sel}<\/b>.` + comRegua(\"P4\", r.loc, r.sel) },\r\n      { t: \"P5: o alarme\", l: L(\"function negativo(pac, h) {\", 'if (conta(h, \"p5-nome\") + conta(h, \"p5-config\") === 0)'), txt: \"<p>O mesmo alarme, para as regiões; as taxas num arquivo de configuração também contam como nome.<\/p>\", aconteceu: r.alarme5 ? `nenhuma região em ${pac}: P5 <b>outro<\/b> e <b>indeterminado<\/b> (é um pacote do P4)` : \"há nomes de região: segue.\" },\r\n      { t: \"P5: os objetos por região\", l: L(\"// Objetos por regiao:\", \"const objNoMapa =\"), txt: \"<p>As classes que o <code>p5-objeto<\/code> capturou. <b>Uma classe só<\/b>, sem nome de região, para todas: é uma tabela, <b>dado<\/b>. <b>Duas ou mais<\/b>, ou com nome de região (<code>SeguroNorte<\/code>): <b>estrutura<\/b>.<\/p>\",\r\n        aconteceu: r.classes.length ? `classes criadas por região: ${r.classes.map(([c, os]) => `<code>${esc(c)}<\/code> (${os.length}x)`).join(\", \")} → ${r.objEstrutura ? \"<b>estrutura<\/b>\" : r.objDados ? \"<b>dado<\/b>\" : \"—\"}${r.objNoMapa ? \" (num mapa)\" : \"\"}` : \"nenhum objeto por região.\" },\r\n      { t: \"P5: tradução, estrutura e condicional\", l: L('const traducao = new Set(lista(h, \"p5-traducao\"));', \"const condicional =\"), txt: \"<p>Os rótulos que só <b>traduzem<\/b> o texto para a constante não contam como decisão. <b>estrutura<\/b> soma corpo de enum, classe por região, <code>switch<\/code> que devolve objeto, mapa de funções e os objetos de estrutura. <b>condicional<\/b> são os rótulos que sobram, menos os de fábrica.<\/p>\",\r\n        aconteceu: `estrutura = <b>${r.estrutura}<\/b>; condicional = <b>${r.condicional}<\/b>` },\r\n      { t: \"A decisão do P5\", l: L(\"const forma = conta(h, \\\"p5-enum-corpo\\\")\", \"return [forma, proporcao];\"), txt: \"<p>A <b>forma<\/b> segue uma ordem de prioridade: corpo de enum, classe, mapa, <code>switch<\/code>, enum de dados, outro. A <b>proporção<\/b>: qualquer estrutura é <code>estrutura<\/code>; senão, condicional; senão, algum dado (enum, mapa, configuração, objeto de classe única) é <code>dados<\/code>.<\/p>\",\r\n        aconteceu: `P5 de ${pac}: <b>${r.forma}<\/b> e <b>${r.prop}<\/b>.` + comRegua(\"P5\", r.forma, r.prop) },\r\n      { t: \"Pacote sem código\", l: L(\"const pacotes = readdirSync\", \"for (const pac of pacotes) if (!temJava\"), txt: \"<p>Um pacote sem nenhum <code>.java<\/code> na cópia limpa não foi medido (o projeto não foi achado): ganha o aviso <code>sem-codigo<\/code>, que faz o <code>verify.mjs<\/code> recusar o lote, em vez de a falta virar zero na nota. Veio do ensaio de 10/10.<\/p>\" },\r\n      { t: \"A linha do CSV\", l: L(\"console.log([\", \"console.log([pac, ...respostas\"), txt: \"<p>Uma linha por pacote: as 10 respostas, a <b>evidência<\/b> (o que contou, com a primeira linha de cada regra: é o que se confere numa discordância) e os avisos. As respostas do P1 ao P3 também saem, pela mesma função do P4.<\/p>\",\r\n        aconteceu: `<code style=\"word-break:break-all\">${esc(linhaCsv)}<\/code>`,\r\n        extra: () => [H(`<p class=\"mini\">${pac === \"ZZL1\" ? \"\" : \"P1 a P3 saem indeterminado nos exercícios: os trechos não têm entrega, cupom nem pagamento, e o alarme dispara.\"}<\/p>`)] },\r\n    ];\r\n    stepper(host, {\r\n      chave: \"juiz:\" + pac, aba: \"juiz\", passos,\r\n      desenha: (p, i, corpo) => {\r\n        const esq = [codigo({ texto: SRC, lang: \"js\", titulo: \"<b>classificar.mjs<\/b> · TCC_V5/evaluation/tools/semgrep\", atual: [p.l] })];\r\n        esq.push(codigo({ texto: arqs[principal], lang: \"java\", titulo: `<b>${esc(principal)}<\/b> · ${pac}: ${esc(titulo)} (a cópia limpa)`, baixo: true }));\r\n        duasColunas(corpo, esq, explicacao(p, p.extra ? p.extra() : []));\r\n      },\r\n    });\r\n  };\r\n  roda(MEM.cenarioJuiz && CENARIOS[MEM.cenarioJuiz] ? MEM.cenarioJuiz : \"EXJ02\");\r\n}\r\n\n// ---- ui-main.js ----\n// ui-main.js: as abas e o tema.\r\n\"use strict\";\r\n\r\nconst ABAS = [\r\n  { id: \"mapa\", nome: \"0 · O mapa\", init: abaMapa },\r\n  { id: \"zero\", nome: \"1 · Semgrep do zero\", init: abaZero },\r\n  { id: \"pontos\", nome: \"2 · pontos.mjs\", init: abaPontos },\r\n  { id: \"gerador\", nome: \"3 · gerar-regras.mjs\", init: abaGerador },\r\n  { id: \"regras\", nome: \"4 · As regras\", init: abaRegras },\r\n  { id: \"detect\", nome: \"5 · detect.sh\", init: abaDetect },\r\n  { id: \"copia\", nome: \"6 · copia-limpa.mjs\", init: abaCopia },\r\n  { id: \"semcom\", nome: \"7 · sem-comentarios.mjs\", init: abaSemCom },\r\n  { id: \"juiz\", nome: \"8 · O juiz\", init: abaJuiz },\r\n  { id: \"auto\", nome: \"9 · Autoavaliação\", init: abaAuto },\r\n];\r\nconst SECOES = {}, BOTOES = {}, PRONTAS = new Set();\r\n\r\nfunction mostraAba(id) {\r\n  if (!SECOES[id]) id = \"mapa\";\r\n  ABA_ATUAL = id;\r\n  lembra(\"aba\", id);\r\n  for (const a of ABAS) { SECOES[a.id].classList.toggle(\"ativa\", a.id === id); BOTOES[a.id].classList.toggle(\"ativa\", a.id === id); }\r\n  if (!PRONTAS.has(id)) {\r\n    PRONTAS.add(id);\r\n    try { ABAS.find((a) => a.id === id).init(SECOES[id]); }\r\n    catch (e) { SECOES[id].append(el(\"div\", { class: \"caixa aviso\" }, \"Erro ao montar esta aba: \" + e.message)); console.error(e); }\r\n  }\r\n  BOTOES[id].scrollIntoView({ block: \"nearest\", inline: \"nearest\" });\r\n  window.scrollTo({ top: 0 });\r\n}\r\n\r\nfunction aplicaTema(t) {\r\n  if (t === \"auto\") document.documentElement.removeAttribute(\"data-theme\");\r\n  else document.documentElement.setAttribute(\"data-theme\", t);\r\n}\r\n\r\n(function inicia() {\r\n  const faixa = document.querySelector(\"nav.abas .faixa\");\r\n  const main = document.querySelector(\"main\");\r\n  for (const a of ABAS) {\r\n    BOTOES[a.id] = el(\"button\", { onclick: () => mostraAba(a.id) }, a.nome);\r\n    faixa.append(BOTOES[a.id]);\r\n    SECOES[a.id] = el(\"section\", { class: \"aba\", id: \"aba-\" + a.id });\r\n    main.append(SECOES[a.id]);\r\n  }\r\n  const temas = [\"auto\", \"light\", \"dark\"], nomes = { auto: \"tema: automático\", light: \"tema: claro\", dark: \"tema: escuro\" };\r\n  let tema = temas.includes(MEM.tema) ? MEM.tema : \"auto\";\r\n  const bt = document.querySelector(\"button.tema\");\r\n  const pinta = () => { aplicaTema(tema); bt.textContent = nomes[tema]; };\r\n  bt.onclick = () => { tema = temas[(temas.indexOf(tema) + 1) % temas.length]; lembra(\"tema\", tema); pinta(); };\r\n  pinta();\r\n  mostraAba(MEM.aba || \"mapa\");\r\n})();\r\n\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script type="application/json" id="html-metricas">"<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Métricas por dentro<\/title>\n<style>\n:root {\n  --bg: #f6f5f1; --bg2: #ffffff; --bg3: #efede6; --fg: #1d1f24; --muted: #646a73; --line: #dcd9cf;\n  --accent: #2f5bd3; --accent-fg: #ffffff;\n  --ok: #1d8a4e; --ok-bg: #d8f1e2; --bad: #c0392b; --bad-bg: #fbe0dc;\n  --cand: #2f5bd3; --cand-bg: #dde6fb; --reg-bg: #ece3fb; --reg: #7b4bd1;\n  --cur-bg: #fff3c4; --cur: #c99a00; --hit-bg: #ffe08a;\n  --code-bg: #fbfaf7; --kw: #8a3ab9; --str: #1f7a3d; --com: #8a8f98; --num: #b5531a; --key: #2f5bd3;\n  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);\n  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;\n    --accent: #7ea2ff; --accent-fg: #0f1115;\n    --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;\n    --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;\n    --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;\n    --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;\n    --shadow: none; color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;\n  --accent: #7ea2ff; --accent-fg: #0f1115;\n  --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;\n  --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;\n  --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;\n  --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;\n  --shadow: none; color-scheme: dark;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody { background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; }\ncode, .mono { font-family: \"Cascadia Code\", \"JetBrains Mono\", Consolas, ui-monospace, monospace; font-size: .9em; }\np code, li code, td code, .txt code { background: var(--bg3); padding: .05em .3em; border-radius: 4px; }\na { color: var(--accent); }\nheader.topo { padding: 18px 16px 6px; max-width: 1500px; margin: 0 auto; }\nheader.topo h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -.01em; }\nheader.topo p { margin: 0; color: var(--muted); font-size: 14px; }\nnav.abas { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }\nnav.abas .faixa { display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; max-width: 1500px; margin: 0 auto; scrollbar-width: thin; }\nnav.abas button { flex: none; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }\nnav.abas button:hover { border-color: var(--accent); }\nnav.abas button.ativa { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }\nmain { max-width: 1500px; margin: 0 auto; padding: 14px 16px 60px; }\nsection.aba { display: none; }\nsection.aba.ativa { display: block; }\nh2 { font-size: 19px; margin: 6px 0 8px; }\nh3 { font-size: 15.5px; margin: 14px 0 6px; }\n.lead { color: var(--muted); margin: 0 0 12px; max-width: 900px; }\n.painel { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }\n.grade2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; align-items: start; }\n.grade-lab { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; align-items: start; }\n@media (max-width: 1000px) { .grade2, .grade-lab { grid-template-columns: minmax(0, 1fr); } }\n.pilha > * + * { margin-top: 12px; }\n.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.rotulo .dir { margin-left: auto; text-transform: none; letter-spacing: 0; }\n\n/* controles do passo a passo */\n.controles { position: sticky; top: 49px; z-index: 10; display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 12px; box-shadow: var(--shadow); }\n.controles button { border: 1px solid var(--line); background: var(--bg3); color: var(--fg); border-radius: 8px; min-width: 36px; height: 34px; font: inherit; cursor: pointer; }\n.controles button:hover:not(:disabled) { border-color: var(--accent); }\n.controles button:disabled { opacity: .4; cursor: default; }\n.controles button.prox { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); padding: 0 14px; font-weight: 600; }\n.controles .info { flex: 1; min-width: 0; }\n.controles .info .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.controles .info .n { font-size: 12px; color: var(--muted); }\n.controles .barra { height: 3px; background: var(--bg3); border-radius: 2px; margin-top: 4px; overflow: hidden; }\n.controles .barra i { display: block; height: 100%; background: var(--accent); transition: width .2s; }\n.controles .dica { font-size: 12px; color: var(--muted); white-space: nowrap; }\n@media (max-width: 700px) { .controles .dica { display: none; } }\n\n/* codigo */\n.codigo { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font-family: \"Cascadia Code\", \"JetBrains Mono\", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.55; overflow: auto; max-height: 62vh; }\n.codigo.baixo { max-height: 40vh; }\n.codigo .cab { position: sticky; top: 0; z-index: 2; background: var(--bg3); border-bottom: 1px solid var(--line); padding: 4px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }\n.codigo .cab b { color: var(--fg); font-weight: 600; }\n.codigo .corpo { min-width: max-content; padding: 4px 0; }\n.ln { display: flex; position: relative; padding-right: 12px; }\n.ln .num { flex: none; width: 3.4em; text-align: right; padding-right: .9em; color: var(--muted); user-select: none; opacity: .7; }\n.ln .src { white-space: pre; flex: none; }\n.ln .nota { flex: none; margin-left: 14px; font-family: system-ui, sans-serif; font-size: 11.5px; padding: 0 7px; border-radius: 999px; align-self: center; white-space: nowrap; }\n.ln .nota.ok { background: var(--ok-bg); color: var(--ok); }\n.ln .nota.fora { background: var(--bad-bg); color: var(--bad); }\n.ln .nota.cand { background: var(--cand-bg); color: var(--cand); }\n.ln .nota.reg { background: var(--reg-bg); color: var(--reg); }\n.ln.atual { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }\n.ln.regiao { background: var(--reg-bg); box-shadow: inset 3px 0 0 var(--reg); }\n.ln.erro { background: var(--bad-bg); box-shadow: inset 3px 0 0 var(--bad); }\n.ln.apagada .src { opacity: .45; }\n.ln.feita .num { color: var(--ok); opacity: 1; }\n.s-kw { color: var(--kw); } .s-str { color: var(--str); } .s-com { color: var(--com); font-style: italic; } .s-num { color: var(--num); } .s-key { color: var(--key); }\n.m-cand { background: var(--cand-bg); outline: 1px solid var(--cand); border-radius: 2px; }\n.m-ok { background: var(--ok-bg); outline: 1px solid var(--ok); border-radius: 2px; }\n.m-fora { background: var(--bad-bg); text-decoration: line-through; text-decoration-color: var(--bad); border-radius: 2px; }\n.m-hit { background: var(--hit-bg); border-radius: 2px; }\n.m-hitsel { background: var(--hit-bg); outline: 2px solid var(--cur); border-radius: 2px; }\n.m-erro { text-decoration: underline wavy var(--bad); }\n\n/* explicacao */\n.passo-t { font-size: 17px; f
