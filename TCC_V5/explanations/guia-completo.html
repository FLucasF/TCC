inteiro = k === \\\"prazoEntregaDias\\\" || k === \\\"parcelas\\\";\\n        const bate = typeof v === \\\"boolean\\\" ? got === v : inteiro ? got === v : num(got, v);\\n        if (!bate) falhas.push(`${nome} ${k}: esperado ${inteiro || typeof v === \\\"boolean\\\" ? v : (v / 100).toFixed(2)}, veio ${JSON.stringify(got)}`);\\n      }\\n    }\\n  } catch (err) { falhas.push(`${nome}: excecao no teste: ${err.message}`); }\\n  if (falhas.length === antes) passaram++;\\n  placar[tipo].casos++;\\n  placar[tipo].pontos += falhas.length === antes ? 1 : parcial;\\n}\\nconsole.log(`RESULTADO: ${passaram} de ${casos.length} casos passaram`);\\nconsole.log(`CONTAS: ${placar.conta.pontos} de ${placar.conta.casos}`);\\nconsole.log(`RECUSAS: ${placar.recusa.pontos} de ${placar.recusa.casos}`);\\nconsole.log(`PONTOS: ${placar.conta.pontos + placar.recusa.pontos} de ${casos.length}`);\\nfor (const f of falhas) console.log(\\\"  FALHA \\\" + f);\\nprocess.exit(falhas.length ? 1 : 0);\\n\",\"executor\":\"#!/usr/bin/env bash\\n# Roda DENTRO do container: sobe o servico de um workspace e aplica um teste.\\n# Uso: executor.sh <arquivo-de-teste.mjs>\\n# /ws = workspace (somente leitura), /aceitacao = esta pasta.\\n#\\n# COMO LER. Quem chama e o infra/scripts/acceptance.sh, um container por execucao.\\n#   1. copia o workspace para /tmp (o original fica so para leitura) e acha o pom mais raso;\\n#   2. usa o .jar que o build do run-one.sh ja gerou; se nao houver, compila (sem testes);\\n#   3. liga o servico na porta 18080 e espera ele responder (ate 90 s);\\n#   4. roda a suite (strategy.mjs), que manda os 21 pedidos e imprime o RESULTADO.\\n# O codigo de saida diz o que houve: 0 passou tudo, 1 errou casos, 3 sem pom,\\n# 4 build falhou, 5 o servico morreu ao subir. Se ele passar dos 90 s vivo e sem\\n# responder, a suite roda assim mesmo e os casos falham (nos testes, subiu em segundos).\\nset -uo pipefail\\ncp -r /ws /tmp/ws\\nPOM=\\\"$(find /tmp/ws -name pom.xml -not -path '*/target/*' -printf '%d %p\\\\n' | sort -n | head -1 | cut -d' ' -f2-)\\\"\\n[ -n \\\"$POM\\\" ] || { echo \\\"RESULTADO: sem pom\\\"; exit 3; }\\ncd \\\"$(dirname \\\"$POM\\\")\\\"\\nJAR=\\\"$(ls target/*.jar 2>/dev/null | grep -v -E 'plain|original|sources' | head -1)\\\"\\nif [ -z \\\"$JAR\\\" ]; then\\n  mvn -q -B -DskipTests package >/tmp/build.log 2>&1 || { echo \\\"RESULTADO: build falhou\\\"; tail -5 /tmp/build.log; exit 4; }\\n  JAR=\\\"$(ls target/*.jar | grep -v -E 'plain|original|sources' | head -1)\\\"\\nfi\\njava -jar \\\"$JAR\\\" --server.port=18080 >/tmp/app.log 2>&1 &\\nPID=$!\\nfor i in $(seq 1 90); do\\n  curl -s -o /dev/null http://localhost:18080/ 2>/dev/null && break\\n  kill -0 $PID 2>/dev/null || { echo \\\"RESULTADO: app nao subiu\\\"; tail -15 /tmp/app.log; exit 5; }\\n  sleep 1\\ndone\\nBASE=http://localhost:18080 node \\\"/aceitacao/$1\\\"\\nRC=$?\\nkill $PID 2>/dev/null\\nexit $RC\\n\",\"hipoteses\":\"// As tabelas e o veredito de cada hipotese do OBJETIVO (secao 4), pelas regras de\\n// leitura do secao 4.1, escritas aqui ANTES dos dados (09/10). Com o script congelado,\\n// a analise do V4 e so rodar: nenhuma escolha (qual par conta, o que e \\\"melhor\\\", quem\\n// esta no teto) fica para depois de ver os resultados.\\n//\\n// Uso (da raiz do TCC):\\n//   node evaluation/tools/hipoteses.mjs <desenho.json> --semgrep S.csv [--mapa M.csv]\\n//        --aceitacao A.csv --metricas X.csv --resultados R.csv\\n//        [--conferencia C.md] [--exploratorio] [--json saida.json] [--raiz DIR]\\n//   (o relatorio em markdown sai no stdout)\\n//\\n// COMO LER. Quatro partes:\\n//   1. junta, por execucao, o que cada instrumento mediu: o Semgrep (pelo codigo cego e\\n//      o mapa), a suite, as metricas, o custo e o meta.json (se usou a skill, o revisor);\\n//   2. MEDIDAS: transforma isso nos numeros que as hipoteses comparam (o P4 certo ou\\n//      nao, os pontos da suite, a complexidade cognitiva, os tokens...);\\n//   3. HIPOTESES: a lista, cada uma com a medida, os dois niveis comparados (N1 x N0,\\n//      N2 x N1 ou N3 x N2), o tipo de regra e o que e \\\"melhor\\\";\\n//   4. as REGRAS do secao 4.1, uma funcao por tipo, e o relatorio.\\n//\\n// Um PAR e o mesmo modelo e a mesma replica em dois niveis vizinhos (55 por comparacao no V5: 11 modelos x 5 replicas).\\n// Tres escolhas que o OBJETIVO nao fazia, decididas aqui antes dos dados (DECISOES.md):\\n//   - um par com \\\"indeterminado\\\" (ou sem medida) sai da conta como \\\"sem dado\\\", e e contado;\\n//   - o saldo maximo da nao-inferioridade e 13% dos pares, arredondado (7 em 55, 3 em 25, 2 em 15,\\n//     a mesma proporcao que o OBJETIVO usa para justificar o 3);\\n//   - na hipotese do modelo, se dois modelos empatam como o mais fraco, ela e apoiada se\\n//     o maior saldo, sem empate, for de um deles.\\n// Com --conferencia (a saida do compare.mjs), as hipoteses que dependem de uma pergunta\\n// reprovada (abaixo de 90%: 40 de 44 no V5) viram \\\"descritiva\\\". Com --exploratorio, nenhuma\\n// hipotese tem veredito: o lote so descreve.\\n\\nimport { readFileSync, writeFileSync, existsSync } from \\\"node:fs\\\";\\nimport { join, resolve } from \\\"node:path\\\";\\n\\n// ------------------------------------------------------------------ argumentos e leitura\\nconst args = process.argv.slice(2);\\nconst COM_VALOR = [\\\"--semgrep\\\", \\\"--mapa\\\", \\\"--aceitacao\\\", \\\"--metricas\\\", \\\"--resultados\\\", \\\"--conferencia\\\", \\\"--json\\\", \\\"--raiz\\\"];\\nconst opt = (n) => { const i = args.indexOf(`--${n}`); return i >= 0 ? args[i + 1] : null; };\\nconst [arqDesenho] = args.filter((a, i, l) => !a.startsWith(\\\"--\\\") && !COM_VALOR.includes(l[i - 1]));\\nconst morrer = (m) => { console.error(`ERRO: ${m}`); process.exit(2); };\\nif (!arqDesenho) morrer(\\\"uso: hipoteses.mjs <desenho.json> --semgrep S.csv [--mapa M.csv] --aceitacao A.csv --metricas X.csv --resultados R.csv\\\");\\nfor (const o of [\\\"semgrep\\\", \\\"aceitacao\\\", \\\"metricas\\\", \\\"resultados\\\"]) if (!opt(o)) morrer(`falta --${o}`);\\nconst RAIZ = resolve(opt(\\\"raiz\\\") ?? \\\".\\\");\\nconst EXPLORATORIO = args.includes(\\\"--exploratorio\\\");\\n\\n// CSV com aspas (nunca split(\\\",\\\")).\\nfunction lerCsv(arq) {\\n  const t = readFileSync(arq, \\\"utf8\\\").replace(/^﻿/, \\\"\\\");\\n  const linhas = []; let campo = \\\"\\\", linha = [], aspas = false;\\n  for (let i = 0; i < t.length; i++) {\\n    const c = t[i];\\n    if (aspas) { if (c === '\\\"' && t[i + 1] === '\\\"') { campo += '\\\"'; i++; } else if (c === '\\\"') aspas = false; else campo += c; }\\n    else if (c === '\\\"') aspas = true;\\n    else if (c === \\\",\\\") { linha.push(campo); campo = \\\"\\\"; }\\n    else if (c === \\\"\\\\n\\\" || c === \\\"\\\\r\\\") { if (c === \\\"\\\\r\\\" && t[i + 1] === \\\"\\\\n\\\") i++; linha.push(campo); campo = \\\"\\\"; if (linha.some((v) => v !== \\\"\\\")) linhas.push(linha); linha = []; }\\n    else campo += c;\\n  }\\n  linha.push(campo); if (linha.some((v) => v !== \\\"\\\")) linhas.push(linha);\\n  const uteis = linhas.filter((l) => !l[0].startsWith(\\\"#\\\"));\\n  const [cab, ...corpo] = uteis;\\n  return corpo.map((l) => Object.fromEntries(cab.map((n, i) => [n, (l[i] ?? \\\"\\\").trim()])));\\n}\\nconst porChave = (linhas, chave) => new Map(linhas.map((l) => [l[chave], l]));\\n\\nconst D = JSON.parse(readFileSync(resolve(RAIZ, arqDesenho), \\\"utf8\\\"));\\nif (!D.modelos) morrer(\\\"o desenho nao tem modelos\\\");\\nconst NIVEIS = Object.keys(D.niveis);\\nconst MODELOS = Object.keys(D.modelos);\\nconst rep = (r) => String(r).padStart(2, \\\"0\\\");\\nconst runId = (r, m, n) => `${D.prefixo}-${rep(r)}-${m}-${n}`;\\n\\nconst semgrep = lerCsv(resolve(RAIZ, opt(\\\"semgrep\\\")));\\nconst mapa = opt(\\\"mapa\\\") ? porChave(lerCsv(resolve(RAIZ, opt(\\\"mapa\\\"))), \\\"run_id\\\") : new Map();\\nconst semPorPacote = porChave(semgrep, \\\"pacote\\\");\\nconst aceitacao = porChave(lerCsv(resolve(RAIZ, opt(\\\"aceitacao\\\"))), \\\"run_id\\\");\\nconst metricas = porChave(lerCsv(resolve(RAIZ, opt(\\\"metricas\\\"))), \\\"run_id\\\");\\nconst resultados = porChave(lerCsv(resolve(RAIZ, opt(\\\"resultados\\\"))), \\\"run_id\\\");\\n\\n// As perguntas que a conferencia reprovou (linhas \\\"| P4_localizacao | 16 de 20 | vira **descritiva** |\\\").\\nconst reprovadas = new Set();\\nif (opt(\\\"conferencia\\\")) for (const l of readFileSync(resolve(RAIZ, opt(\\\"conferencia\\\")), \\\"utf8\\\").split(/\\\\r?\\\\n/)) {\\n  const m = l.match(/^\\\\|\\\\s*(P\\\\d_\\\\w+)\\\\s*\\\\|.*descritiva/); if (m) reprovadas.add(m[1]);\\n}\\n\\n// ------------------------------------------------------------------ 2. medidas\\n// Os 9 casos de borda da suite (secao 4.4): fronteiras, precedencia entre erros e a colisao.\\nconst BORDA = [\\n  \\\"OURO + FRETEGRATIS + cartao 10x\\\",\\n  \\\"precedencia: nivel antes de regiao\\\", \\\"precedencia: regiao antes de modalidade\\\",\\n  \\\"precedencia: cupom antes de pagamento\\\", \\\"precedencia: pedido invalido primeiro\\\",\\n  \\\"fronteira: motoboy com 5 kg exatos\\\", \\\"fronteira: OURO com produtos em 500,00 exatos\\\",\\n  \\\"fronteira: MENOS50 com produtos em 300,00 exatos\\\", \\\"fronteira: boleto com 1000,00 exatos\\\",\\n];\\nconst TRAVA = new Set([\\\"no_pom\\\", \\\"build_failed\\\", \\\"app_did_not_start\\\"]);\\nconst num = (v) => (v === undefined || v === null || v === \\\"\\\" || isNaN(Number(v)) ? null : Number(v));\\nconst acerto = (s, p) => {\\n  const loc = s?.[`${p}_localizacao`], sel = s?.[`${p}_selecao`];\\n  if (!loc || !sel || loc === \\\"indeterminado\\\" || sel === \\\"indeterminado\\\") return null;\\n  return loc === \\\"isolado\\\" && (sel === \\\"consulta\\\" || sel === \\\"condicional-unica\\\") ? 1 : 0;\\n};\\n\\nconst execucoes = new Map(); // run_id -> { modelo, replica, nivel, m: {medidas} }\\nconst faltas = [];\\nfor (let r = 1; r <= D.replicas; r++) for (const mo of MODELOS) for (const n of NIVEIS) {\\n  const id = runId(r, mo, n);\\n  const s = semPorPacote.get(mapa.get(id)?.blind_code ?? id);\\n  const a = aceitacao.get(id), x = metricas.get(id), q = resultados.get(id);\\n  if (!s || !a || !x || !q) faltas.push(`${id}: ${[!s && \\\"Semgrep\\\", !a && \\\"suite\\\", !x && \\\"metricas\\\", !q && \\\"resultados\\\"].filter(Boolean).join(\\\", \\\")}`);\\n  const travado = TRAVA.has(a?.status);\\n  const pontos = (k) => (a ? (travado ? 0 : num(a[k])) : null);\\n  let borda = null;\\n  const accTxt = join(RAIZ, \\\"runs\\\", id, \\\"acceptance.txt\\\");\\n  if (a && travado) borda = 0;\\n  else if (existsSync(accTxt)) {\\n    const falhas = readFileSync(accTxt, \\\"utf8\\\").split(/\\\\r?\\\\n/).filter((l) => /^\\\\s*FALHA /.test(l)).map((l) => l.replace(/^\\\\s*FALHA /, \\\"\\\"));\\n    borda = BORDA.filter((c) => !falhas.some((f) => f.startsWith(c + \\\":\\\") || f.startsWith(c + \\\" \\\"))).length;\\n  }\\n  let meta = null;\\n  const arqMeta = join(RAIZ, \\\"runs\\\", id, \\\"meta.json\\\");\\n  if (existsSync(arqMeta)) meta = JSON.parse(readFileSync(arqMeta, \\\"utf8\\\"));\\n  const p13 = [\\\"P1\\\", \\\"P2\\\", \\\"P3\\\"].map((p) => acerto(s, p));\\n  execucoes.set(id, {\\n    modelo: mo, replica: r, nivel: n, perfil: s ? [\\\"P1\\\", \\\"P2\\\", \\\"P3\\\", \\\"P4\\\"].flatMap((p) => [s[`${p}_localizacao`], s[`${p}_selecao`]]).concat(s.P5_proporcao).join(\\\"|\\\") : null,\\n    m: {\\n      p4_acerto: acerto(s, \\\"P4\\\"),\\n      p1p3_acertos: p13.some((v) => v === null) ? null : p13.reduce((x, y) => x + y, 0),\\n      p5_exagero: !s?.P5_proporcao || s.P5_proporcao === \\\"indeterminado\\\" ? null : s.P5_proporcao === \\\"estrutura\\\" ? 1 : 0,\\n      pontos: pontos(\\\"pontos\\\"), contas: pontos(\\\"contas\\\"), recusas: pontos(\\\"recusas\\\"),\\n      build_ok: a ? (travado ? 0 : 1) : null,\\n      borda,\\n      cognitiva: num(x?.sonar_cognitive_complexity), smells: num(x?.sonar_code_smells),\\n      duplicacao: num(x?.sonar_duplicated_lines_density),\\n      classes: num(x?.sonar_classes), cbo: num(x?.ck_cbo_media), lcom: num(x?.ck_lcom_media),\\n      tokens: num(q?.input_total), tempo: num(q?.duration_api_ms), turnos: num(q?.turns),\\n      usou_skill: meta ? ((meta.outcome?.tool_calls_by_name?.Skill ?? 0) > 0 ? 1 : 0) : null,\\n      usou_revisor: meta ? ((meta.outcome?.subagents_spawned ?? 0) > 0 ? 1 : 0) : null,\\n    },\\n  });\\n}\\n\\n// ------------------------------------------------------------------ 3. hipoteses\\n// tipo: direcional | nao-inferioridade | sem-direcao-continua | sem-direcao-binaria\\n// melhor: \\\"mais\\\" ou \\\"menos\\\" (o que conta como melhor no nivel de cima)\\n// teto: o valor que, no nivel de baixo nas 5 replicas, deixa o modelo sem espaco para\\n// melhorar (so nas direcionais de medida limitada; null nas continuas)\\n// depende: as perguntas da conferencia de que o veredito depende\\nconst H = [\\n  { nome: \\\"Desenho: isola cada caso no P4\\\", principal: true, medida: \\\"p4_acerto\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: 1, depende: [\\\"P4_localizacao\\\", \\\"P4_selecao\\\"] },\\n  { nome: \\\"Exagero: aplica onde nao pede\\\", principal: true, medida: \\\"p5_exagero\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"sem-direcao-binaria\\\", depende: [\\\"P5_proporcao\\\"] },\\n  { nome: \\\"Correcao: suite inteira\\\", principal: true, medida: \\\"pontos\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"nao-inferioridade\\\", melhor: \\\"mais\\\" },\\n  { nome: \\\"Qualidade: menos complexidade\\\", principal: true, medida: \\\"cognitiva\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"direcional\\\", melhor: \\\"menos\\\", teto: null },\\n  { nome: \\\"Modelo: efeito maior no mais fraco\\\", principal: true, tipo: \\\"modelo\\\", depende: [\\\"P4_localizacao\\\", \\\"P4_selecao\\\"] },\\n\\n  { nome: \\\"Desenho: isola cada caso no P1 a P3\\\", medida: \\\"p1p3_acertos\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: 3 },\\n  { nome: \\\"Desenho: nao repete o comum\\\", medida: \\\"duplicacao\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"direcional\\\", melhor: \\\"menos\\\", teto: null },\\n  { nome: \\\"Desenho: replicas mais parecidas\\\", tipo: \\\"descritiva-replicas\\\", par: [\\\"N0\\\", \\\"N1\\\"] },\\n  { nome: \\\"Exagero: mais arquivos\\\", medida: \\\"classes\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: null },\\n  { nome: \\\"Exagero: estrutura especulativa (CBO)\\\", medida: \\\"cbo\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"sem-direcao-continua\\\" },\\n  { nome: \\\"Exagero: estrutura especulativa (LCOM)\\\", medida: \\\"lcom\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"sem-direcao-continua\\\" },\\n  { nome: \\\"Correcao: contas\\\", medida: \\\"contas\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"nao-inferioridade\\\", melhor: \\\"mais\\\" },\\n  { nome: \\\"Correcao: recusas\\\", medida: \\\"recusas\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"nao-inferioridade\\\", melhor: \\\"mais\\\" },\\n  { nome: \\\"Correcao: nao quebra o build\\\", medida: \\\"build_ok\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"nao-inferioridade\\\", melhor: \\\"mais\\\" },\\n  { nome: \\\"Correcao: casos de borda\\\", medida: \\\"borda\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"nao-inferioridade\\\", melhor: \\\"mais\\\" },\\n  { nome: \\\"Qualidade: menos code smells\\\", medida: \\\"smells\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"direcional\\\", melhor: \\\"menos\\\", teto: null },\\n  { nome: \\\"Custo: tokens de entrada\\\", medida: \\\"tokens\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"sem-direcao-continua\\\" },\\n  { nome: \\\"Custo: tempo de API\\\", medida: \\\"tempo\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"sem-direcao-continua\\\" },\\n  { nome: \\\"Custo: processo de trabalho (turnos)\\\", medida: \\\"turnos\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"sem-direcao-continua\\\" },\\n  { nome: \\\"Custo: sinal muda por modelo\\\", medida: \\\"tokens\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"descritiva-sinal\\\" },\\n  { nome: \\\"Modelo: no teto, nao piora (desenho)\\\", medida: \\\"p4_acerto\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"nao-inferioridade\\\", melhor: \\\"mais\\\", soNoTeto: { medida: \\\"p4_acerto\\\", teto: 1 }, depende: [\\\"P4_localizacao\\\", \\\"P4_selecao\\\"] },\\n  { nome: \\\"Modelo: no teto, nao piora (correcao)\\\", medida: \\\"pontos\\\", par: [\\\"N0\\\", \\\"N1\\\"], tipo: \\\"nao-inferioridade\\\", melhor: \\\"mais\\\", soNoTeto: { medida: \\\"p4_acerto\\\", teto: 1 } },\\n  { nome: \\\"Skills: mais efeito no desenho\\\", medida: \\\"p4_acerto\\\", par: [\\\"N1\\\", \\\"N2\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: 1, depende: [\\\"P4_localizacao\\\", \\\"P4_selecao\\\"] },\\n  { nome: \\\"Skills: mais custo (tokens)\\\", medida: \\\"tokens\\\", par: [\\\"N1\\\", \\\"N2\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: null },\\n  { nome: \\\"Skills: mudam o exagero\\\", medida: \\\"p5_exagero\\\", par: [\\\"N1\\\", \\\"N2\\\"], tipo: \\\"sem-direcao-binaria\\\", depende: [\\\"P5_proporcao\\\"] },\\n  { nome: \\\"Skills: so valem se carregadas\\\", medida: \\\"usou_skill\\\", nivel: \\\"N2\\\", tipo: \\\"descritiva-uso\\\" },\\n  { nome: \\\"Processo: corrige mais\\\", medida: \\\"pontos\\\", par: [\\\"N2\\\", \\\"N3\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: 21 },\\n  { nome: \\\"Processo: mais efeito no desenho\\\", medida: \\\"p4_acerto\\\", par: [\\\"N2\\\", \\\"N3\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: 1, depende: [\\\"P4_localizacao\\\", \\\"P4_selecao\\\"] },\\n  { nome: \\\"Processo: menos exagero\\\", medida: \\\"p5_exagero\\\", par: [\\\"N2\\\", \\\"N3\\\"], tipo: \\\"direcional\\\", melhor: \\\"menos\\\", teto: 0, depende: [\\\"P5_proporcao\\\"] },\\n  { nome: \\\"Processo: mais custo (tokens)\\\", medida: \\\"tokens\\\", par: [\\\"N2\\\", \\\"N3\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: null },\\n  { nome: \\\"Processo: mais custo (tempo)\\\", medida: \\\"tempo\\\", par: [\\\"N2\\\", \\\"N3\\\"], tipo: \\\"direcional\\\", melhor: \\\"mais\\\", teto: null },\\n  { nome: \\\"Processo: so vale se usado\\\", medida: \\\"usou_revisor\\\", nivel: \\\"N3\\\", tipo: \\\"descritiva-uso\\\" },\\n];\\n\\n// ------------------------------------------------------------------ 4. as regras do secao 4.1\\nconst C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };\\nconst caudaDupla = (n, k) => { let s = 0; for (let i = k; i <= n; i++) s += C(n, i); return Math.min(1, 2 * s / 2 ** n); };\\n// Menor k (do lado maior) com a chance por sorte, nos dois lados, ate o limite.\\nconst minimoSinal = (n, limite) => { for (let k = Math.floor(n / 2) + 1; k <= n; k++) if (caudaDupla(n, k) <= limite) return k; return Infinity; };\\nconst limiteSaldo = (n) => Math.round(0.13 * n);\\n\\nconst valor = (r, mo, n, medida) => execucoes.get(runId(r, mo, n))?.m[medida] ?? null;\\n// Os pares de uma comparacao, por modelo: \\\"melhor\\\", \\\"pior\\\", \\\"igual\\\" ou \\\"sem dado\\\".\\nfunction pares(h, modelos = MODELOS) {\\n  const [baixo, cima] = h.par;\\n  const porModelo = {};\\n  for (const mo of modelos) {\\n    const l = (porModelo[mo] = { melhor: 0, pior: 0, igual: 0, semDado: 0, sobe: 0, desce: 0 });\\n    for (let r = 1; r <= D.replicas; r++) {\\n      const b = valor(r, mo, baixo, h.medida), c = valor(r, mo, cima, h.medida);\\n      if (b === null || c === null) { l.semDado++; continue; }\\n      if (c === b) { l.igual++; continue; }\\n      c > b ? l.sobe++ : l.desce++;\\n      const melhorou = h.melhor === \\\"menos\\\" ? c < b : c > b;\\n      melhorou ? l.melhor++ : l.pior++;\\n    }\\n  }\\n  return porModelo;\\n}\\nconst soma = (pm, k) => Object.values(pm).reduce((s, l) => s + l[k], 0);\\n// No teto: o nivel de baixo ja tem o melhor valor possivel nas 5 replicas.\\nconst noTeto = (mo, nivel, medida, teto) => teto !== null && teto !== undefined &&\\n  Array.from({ length: D.replicas }, (_, i) => valor(i + 1, mo, nivel, medida)).every((v) => v === teto);\\n\\nfunction veredito(h) {\\n  if (h.tipo === \\\"direcional\\\") {\\n    const pm = pares(h);\\n    const fora = MODELOS.filter((mo) => !noTeto(mo, h.par[0], h.medida, h.teto));\\n    let v;\\n    if (!(soma(pm, \\\"melhor\\\") + soma(pm, \\\"pior\\\") + soma(pm, \\\"igual\\\"))) v = \\\"sem dado\\\";\\n    else if (!fora.length) v = \\\"sem espaco para efeito (todos no teto)\\\";\\n    else {\\n      const apoiam = fora.filter((mo) => pm[mo].melhor > pm[mo].pior).length;\\n      const contrariam = fora.filter((mo) => pm[mo].pior > pm[mo].melhor).length;\\n      const algumPiora = MODELOS.some((mo) => pm[mo].pior > pm[mo].melhor);\\n      v = apoiam > fora.length / 2 && !algumPiora ? \\\"apoiada\\\" : contrariam > fora.length / 2 ? \\\"contrariada\\\" : \\\"inconclusiva\\\";\\n    }\\n    return { v, pm, fora, regra: `maioria dos ${fora.length} modelo(s) fora do teto com mais pares melhores que piores, e nenhum modelo com mais piores` };\\n  }\\n  if (h.tipo === \\\"nao-inferioridade\\\") {\\n    const mods = h.soNoTeto ? MODELOS.filter((mo) => noTeto(mo, h.par[0], h.soNoTeto.medida, h.soNoTeto.teto)) : MODELOS;\\n    if (!mods.length) return { v: \\\"sem modelo no teto\\\", pm: {}, regra: \\\"\\\" };\\n    const pm = pares(h, mods);\\n    const n = soma(pm, \\\"melhor\\\") + soma(pm, \\\"pior\\\") + soma(pm, \\\"igual\\\");\\n    if (!n) return { v: \\\"sem dado\\\", pm, regra: \\\"nenhum par com as duas medidas\\\" };\\n    const saldo = soma(pm, \\\"pior\\\") - soma(pm, \\\"melhor\\\");\\n    const lim = limiteSaldo(n);\\n    return { v: saldo <= lim ? \\\"apoiada\\\" : \\\"contrariada\\\", pm, regra: `saldo (piores - melhores) = ${saldo}, limite ${lim} (13% de ${n} pares)` };\\n  }\\n  if (h.tipo === \\\"sem-direcao-continua\\\") {\\n    const pm = pares(h);\\n    const n = soma(pm, \\\"melhor\\\") + soma(pm, \\\"pior\\\") + soma(pm, \\\"igual\\\");\\n    if (!n) return { v: \\\"sem dado\\\", pm, regra: \\\"nenhum par com as duas medidas\\\" };\\n    const maior = Math.max(soma(pm, \\\"sobe\\\"), soma(pm, \\\"desce\\\"));\\n    const k = minimoSinal(n, 0.05);\\n    const v = maior >= k ? \\\"apoiada (altera)\\\" : maior <= Math.floor(0.6 * n) ? \\\"contrariada\\\" : \\\"inconclusiva\\\";\\n    return { v, pm, regra: `lado maior ${maior} de ${n} pares; apoiada com ${k} ou mais, contrariada com ${Math.floor(0.6 * n)} ou menos` };\\n  }\\n  if (h.tipo === \\\"sem-direcao-binaria\\\") {\\n    const pm = pares(h);\\n    if (!(soma(pm, \\\"melhor\\\") + soma(pm, \\\"pior\\\") + soma(pm, \\\"igual\\\"))) return { v: \\\"sem dado\\\", pm, regra: \\\"nenhum par com as duas medidas\\\" };\\n    const sobe = soma(pm, \\\"sobe\\\"), desce = soma(pm, \\\"desce\\\"), d = sobe + desce;\\n    const maior = Math.max(sobe, desce), menor = Math.min(sobe, desce);\\n    const k = minimoSinal(d, 0.063);\\n    const v = d >= 5 && maior >= k ? \\\"apoiada (altera)\\\" : d <= 2 || menor >= d / 3 ? \\\"contrariada\\\" : \\\"inconclusiva\\\";\\n    return { v, pm, regra: `${d} par(es) nao empatado(s) (${sobe} sobem, ${desce} descem); com ${d}, o lado maior precisa de ${isFinite(k) ? k : \\\"-\\\"}` };\\n  }\\n  if (h.tipo === \\\"modelo\\\") {\\n    const base = H[0];\\n    const pm = pares(base);\\n    const mediaN0 = Object.fromEntries(MODELOS.map((mo) => {\\n      const vs = Array.from({ length: D.replicas }, (_, i) => valor(i + 1, mo, \\\"N0\\\", base.medida)).filter((v) => v !== null);\\n      return [mo, vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null];\\n    }));\\n    const menor = Math.min(...Object.values(mediaN0).filter((v) => v !== null));\\n    const fracos = MODELOS.filter((mo) => mediaN0[mo] === menor);\\n    const saldo = Object.fromEntries(MODELOS.map((mo) => [mo, pm[mo].melhor - pm[mo].pior]));\\n    const max = Math.max(...Object.values(saldo));\\n    const noMax = MODELOS.filter((mo) => saldo[mo] === max);\\n    const v = noMax.length > 1 ? \\\"inconclusiva (empate no maior saldo)\\\" : fracos.includes(noMax[0]) ? \\\"apoiada\\\" : \\\"contrariada\\\";\\n    return { v, pm, regra: `mais fraco(s) no N0: ${fracos.join(\\\", \\\")} (acerto medio ${menor.toFixed(2)}); maior saldo: ${noMax.join(\\\", \\\")} (${max})`, extra: { mediaN0, saldo } };\\n  }\\n  return null;\\n}\\n\\n// ------------------------------------------------------------------ o relatorio\\nconst out = [];\\nconst linhaTabela = (mo, l, teto) => `| ${mo}${teto ? \\\" (teto)\\\" : \\\"\\\"} | ${l.melhor} | ${l.igual} | ${l.pior} | ${l.semDado} | ${(l.melhor - l.pior) >= 0 ? \\\"+\\\" : \\\"\\\"}${l.melhor - l.pior} |`;\\nout.push(`# Hipoteses: ${D.prefixo}${EXPLORATORIO ? \\\" (EXPLORATORIO: sem veredito)\\\" : \\\"\\\"}`);\\nout.push(`\\\\nGerado por evaluation/tools/hipoteses.mjs. Regras: OBJETIVO, secao 4.1. ${D.replicas} replicas x ${MODELOS.length} modelos x ${NIVEIS.length} niveis.`);\\nif (faltas.length) out.push(`\\\\n**Execucoes com medida faltando (${faltas.length}):** ${faltas.slice(0, 10).join(\\\"; \\\")}${faltas.length > 10 ? \\\"...\\\" : \\\"\\\"}`);\\nif (reprovadas.size) out.push(`\\\\n**A conferencia reprovou:** ${[...reprovadas].join(\\\", \\\")}. As hipoteses que dependem delas sao descritivas.`);\\n\\nconst resumo = [];\\nfor (const h of H) {\\n  out.push(`\\\\n## ${h.principal ? \\\"★ \\\" : \\\"\\\"}${h.nome}`);\\n  if (h.tipo === \\\"descritiva-replicas\\\") {\\n    out.push(\\\"\\\\nSem regra de pares no OBJETIVO: descritiva. Perfis diferentes do Semgrep (P1 a P5) entre as replicas de cada modelo; menos perfis = mais parecidas.\\\\n\\\");\\n    out.push(`| modelo | ${h.par[0]} | ${h.par[1]} |`); out.push(\\\"|---|---|---|\\\");\\n    for (const mo of MODELOS) {\\n      const perfis = (n) => new Set(Array.from({ length: D.replicas }, (_, i) => execucoes.get(runId(i + 1, mo, n))?.perfil).filter(Boolean)).size;\\n      out.push(`| ${mo} | ${perfis(h.par[0])} | ${perfis(h.par[1])} |`);\\n    }\\n    resumo.push({ nome: h.nome, veredito: \\\"descritiva\\\" }); continue;\\n  }\\n  if (h.tipo === \\\"descritiva-sinal\\\") {\\n    const pm = pares(h);\\n    out.push(\\\"\\\\nSem regra de pares no OBJETIVO: descritiva. A direcao dos tokens (N1 x N0) em cada modelo:\\\\n\\\");\\n    out.push(\\\"| modelo | sobem | descem | iguais |\\\"); out.push(\\\"|---|---|---|---|\\\");\\n    for (const mo of MODELOS) out.push(`| ${mo} | ${pm[mo].sobe} | ${pm[mo].desce} | ${pm[mo].igual} |`);\\n    resumo.push({ nome: h.nome, veredito: \\\"descritiva\\\" }); continue;\\n  }\\n  if (h.tipo === \\\"descritiva-uso\\\") {\\n    out.push(`\\\\nSem regra de pares no OBJETIVO: descritiva. Execucoes do ${h.nivel} que usaram (${h.medida === \\\"usou_skill\\\" ? \\\"chamaram a skill\\\" : \\\"chamaram o revisor\\\"}):\\\\n`);\\n    out.push(\\\"| modelo | usaram | de |\\\"); out.push(\\\"|---|---|---|\\\");\\n    for (const mo of MODELOS) {\\n      const vs = Array.from({ length: D.replicas }, (_, i) => valor(i + 1, mo, h.nivel, h.medida)).filter((v) => v !== null);\\n      out.push(`| ${mo} | ${vs.filter((v) => v === 1).length} | ${vs.length} |`);\\n    }\\n    resumo.push({ nome: h.nome, veredito: \\\"descritiva\\\" }); continue;\\n  }\\n  const r = veredito(h);\\n  const descr = (h.depende ?? []).some((p) => reprovadas.has(p));\\n  const v = EXPLORATORIO ? \\\"exploratorio (sem veredito)\\\" : descr ? `descritiva (a conferencia reprovou ${h.depende.filter((p) => reprovadas.has(p)).join(\\\", \\\")})` : r.v;\\n  out.push(`\\\\n${h.tipo === \\\"modelo\\\" ? \\\"Pares do desenho no P4 (N1 x N0)\\\" : `Medida: ${h.medida}, ${h.par[1]} x ${h.par[0]}`}; regra: ${h.tipo}${h.melhor ? `, melhor = ${h.melhor}` : \\\"\\\"}.\\\\n`);\\n  out.push(\\\"| modelo | melhores | iguais | piores | sem dado | saldo |\\\"); out.push(\\\"|---|---|---|---|---|---|\\\");\\n  for (const [mo, l] of Object.entries(r.pm)) out.push(linhaTabela(mo, l, h.tipo === \\\"direcional\\\" && !r.fora?.includes(mo)));\\n  const tot = { melhor: soma(r.pm, \\\"melhor\\\"), igual: soma(r.pm, \\\"igual\\\"), pior: soma(r.pm, \\\"pior\\\"), semDado: soma(r.pm, \\\"semDado\\\") };\\n  out.push(linhaTabela(\\\"**todos**\\\", tot));\\n  const n = tot.melhor + tot.igual + tot.pior;\\n  out.push(`\\\\n${r.regra}. Tamanho do efeito (saldo / pares): ${n ? ((tot.melhor - tot.pior) / n).toFixed(2) : \\\"-\\\"}.`);\\n  out.push(`\\\\n**Veredito: ${v}.**`);\\n  resumo.push({ nome: h.nome, principal: !!h.principal, veredito: v });\\n}\\n\\n// O teste de Page, so como informacao (secao 4.1): a medida sobe de N0 a N3?\\nfunction page(medida, melhor) {\\n  const blocos = [];\\n  for (let r = 1; r <= D.replicas; r++) for (const mo of MODELOS) {\\n    const vs = NIVEIS.map((n) => valor(r, mo, n, medida));\\n    if (vs.every((v) => v !== null)) blocos.push(vs.map((v) => (melhor === \\\"menos\\\" ? -v : v)));\\n  }\\n  const k = NIVEIS.length, nb = blocos.length;\\n  if (nb < 2) return null;\\n  let L = 0;\\n  for (const b of blocos) {\\n    const ordem = b.map((v, i) => ({ v, i })).sort((x, y) => x.v - y.v);\\n    const rank = new Array(k);\\n    for (let i = 0; i < k;) { let j = i; while (j + 1 < k && ordem[j + 1].v === ordem[i].v) j++; for (let t = i; t <= j; t++) rank[ordem[t].i] = (i + j) / 2 + 1; i = j + 1; }\\n    rank.forEach((rk, j) => { L += (j + 1) * rk; });\\n  }\\n  const mu = nb * k * (k + 1) ** 2 / 4, va = nb * k ** 2 * (k + 1) * (k ** 2 - 1) / 144;\\n  const z = (L - mu) / Math.sqrt(va);\\n  const phi = (x) => 0.5 * (1 + Math.sign(x) * Math.sqrt(1 - Math.exp(-2 * x * x / Math.PI)));\\n  return { nb, L, z, p: 1 - phi(z) };\\n}\\nout.push(\\\"\\\\n## Tendencia de N0 a N3 (teste de Page, so informacao)\\\\n\\\");\\nout.push(\\\"| medida | quartetos | z | p (unilateral) |\\\"); out.push(\\\"|---|---|---|---|\\\");\\nfor (const [medida, melhor] of [[\\\"p4_acerto\\\", \\\"mais\\\"], [\\\"pontos\\\", \\\"mais\\\"], [\\\"cognitiva\\\", \\\"menos\\\"], [\\\"tokens\\\", \\\"mais\\\"]]) {\\n  const p = page(medida, melhor);\\n  out.push(p ? `| ${medida} (${melhor === \\\"menos\\\" ? \\\"cair\\\" : \\\"subir\\\"}) | ${p.nb} | ${p.z.toFixed(2)} | ${p.p.toFixed(3)} |` : `| ${medida} | - | - | - |`);\\n}\\n\\nout.push(\\\"\\\\n## Resumo\\\\n\\\");\\nout.push(\\\"| hipotese | veredito |\\\"); out.push(\\\"|---|---|\\\");\\nfor (const r of resumo) out.push(`| ${r.principal ? \\\"★ \\\" : \\\"\\\"}${r.nome} | ${r.veredito} |`);\\nconsole.log(out.join(\\\"\\\\n\\\"));\\nif (opt(\\\"json\\\")) writeFileSync(resolve(RAIZ, opt(\\\"json\\\")), JSON.stringify({ lote: D.prefixo, faltas, reprovadas: [...reprovadas], resumo }, null, 2));\\n\",\"aggregate\":\"// Junta os meta.json num CSV, uma linha por execucao.\\n//\\n// Uso:\\n//   node infra/scripts/aggregate.mjs                     # todas as runs\\n//   node infra/scripts/aggregate.mjs --prefix BATCH      # so o lote\\n//   node infra/scripts/aggregate.mjs --out analysis/resultados.csv\\n//\\n// So junta o que o meta.json tem. A avaliacao dos pacotes e outra coisa (a suite,\\n// o Semgrep, as metricas e a leitura do Lucas), e e cruzada com isto depois — nao aqui.\\n//\\n// COMO LER. A lista COLUNAS, logo abaixo, e o coracao do script: cada linha e uma\\n// coluna do CSV, com o nome e a funcao que tira o valor do meta.json (ex.: \\\"turns\\\" vem\\n// de meta.outcome.turns). O resto so percorre runs/, filtra pelo prefixo e escreve.\\n// No V4: node infra/scripts/aggregate.mjs --prefix V4-STRATEGY-, e o verify.mjs confere\\n// que o CSV e igual ao que este script gera dos meta.json.\\n\\nimport { readdirSync, existsSync, readFileSync, writeFileSync, mkdirSync } from \\\"node:fs\\\";\\nimport { join, dirname } from \\\"node:path\\\";\\n\\nconst args = process.argv.slice(2);\\nconst opt = (nome, padrao) => {\\n  const i = args.indexOf(`--${nome}`);\\n  return i >= 0 ? args[i + 1] : padrao;\\n};\\nconst prefix = opt(\\\"prefix\\\", null);\\nconst out = opt(\\\"out\\\", join(\\\"analysis\\\", \\\"resultados.csv\\\"));\\n\\n// A ordem aqui e a ordem das colunas. Agrupada por assunto, nao alfabetica:\\n// quem abre o CSV numa planilha quer identidade, depois desfecho, depois custo.\\nconst COLUNAS = [\\n  [\\\"run_id\\\", (m) => m.run_id],\\n  [\\\"replicate\\\", (m) => m.replicate],\\n  [\\\"model\\\", (m) => m.model_requested],\\n  [\\\"condition\\\", (m) => m.condition],\\n  [\\\"valid\\\", (m) => m.valid],\\n\\n  [\\\"termination\\\", (m) => m.outcome?.termination],\\n  [\\\"build_ok\\\", (m) => m.outcome?.build_ok],\\n  [\\\"turns\\\", (m) => m.outcome?.turns],\\n  [\\\"tool_calls\\\", (m) => m.outcome?.tool_calls],\\n\\n  // H2. `input_total` e NAO `input`: quase tudo entra por cache, e o campo\\n  // `input` sozinho fica na casa das centenas — numero sem significado.\\n  [\\\"input_total\\\", (m) => m.tokens?.input_total],\\n  [\\\"input\\\", (m) => m.tokens?.input],\\n  [\\\"cache_read\\\", (m) => m.tokens?.cache_read],\\n  [\\\"cache_write\\\", (m) => m.tokens?.cache_write],\\n  [\\\"output\\\", (m) => m.tokens?.output],\\n  [\\\"thinking\\\", (m) => m.tokens?.thinking],\\n  [\\\"cost_estimated_usd\\\", (m) => m.tokens?.cost_estimated_usd],\\n\\n  // `duration_api_ms` e a medida limpa: `duration_s` e relogio de parede e as\\n  // seis execucoes rodam em paralelo, disputando CPU.\\n  [\\\"duration_api_ms\\\", (m) => m.timing?.duration_api_ms],\\n  [\\\"duration_cli_ms\\\", (m) => m.timing?.duration_cli_ms],\\n  [\\\"duration_s\\\", (m) => m.timing?.duration_s],\\n\\n  // Pedido, nao imposto. A desobediencia e dado, nao motivo de exclusao.\\n  [\\\"versions_obeyed\\\", (m) => m.foundation?.versions_obeyed],\\n  [\\\"spring_boot\\\", (m) => m.foundation?.spring_boot],\\n  [\\\"java\\\", (m) => m.foundation?.java],\\n  [\\\"project_at\\\", (m) => m.foundation?.project_at],\\n  [\\\"root_package\\\", (m) => m.foundation?.root_package],\\n  [\\\"dependencies_added\\\", (m) => (m.foundation?.dependencies?.added ?? []).length],\\n\\n  // Controle do isolamento e da comparabilidade entre bracos.\\n  [\\\"models_observed\\\", (m) => (m.models_observed?.messages ?? []).join(\\\" \\\")],\\n  [\\\"tools_available_n\\\", (m) => (m.isolation_init?.tools_available ?? []).length],\\n  // `spawned`, e nao a existencia do objeto: `subagent_stats` sempre vem, com\\n  // a estrutura zerada, mesmo quando nada foi delegado.\\n  [\\\"subagents_spawned\\\", (m) => m.outcome?.subagents_spawned ?? null],\\n  // Quase sempre 1. Mais de um quer dizer que a sessao foi segmentada por\\n  // tarefa em segundo plano — os numeros de consumo ja vem somados.\\n  [\\\"result_segments\\\", (m) => m.outcome?.result_segments ?? null],\\n  [\\\"permission_denials_n\\\", (m) => (m.outcome?.permission_denials ?? []).length],\\n  [\\\"api_key_source\\\", (m) => m.environment?.api_key_source],\\n  [\\\"effort\\\", (m) => m.parameters?.effort],\\n  [\\\"claude_code_version\\\", (m) => m.environment?.claude_code_version],\\n  [\\\"image_id\\\", (m) => m.environment?.image_id],\\n  [\\\"prompt_hash\\\", (m) => (m.environment?.prompt_hash ?? \\\"\\\").slice(0, 16)],\\n  [\\\"harness_hash\\\", (m) => (m.environment?.harness_hash ?? \\\"\\\").slice(0, 16)],\\n  [\\\"tokens_source\\\", (m) => m.tokens?.source],\\n];\\n\\n// Campo com virgula, aspas ou quebra de linha precisa de aspas duplas, e aspas\\n// internas dobram. Sem isso o CSV quebra silenciosamente.\\n//\\n// E o reverso tambem vale: NAO analise este CSV depois com split(\\\",\\\"). Numa\\n// versao anterior isso produziu numero errado num relatorio.\\nconst csv = (v) => {\\n  if (v === null || v === undefined) return \\\"\\\";\\n  const s = String(v);\\n  return /[\\\",\\\\n\\\\r]/.test(s) ? `\\\"${s.replace(/\\\"/g, '\\\"\\\"')}\\\"` : s;\\n};\\n\\nconst runsDir = \\\"runs\\\";\\nif (!existsSync(runsDir)) {\\n  console.error(\\\"pasta runs/ nao encontrada. Rode a partir da raiz do repositorio.\\\");\\n  process.exitCode = 2;\\n} else {\\n  const linhas = [];\\n  let ignoradas = 0;\\n  for (const r of readdirSync(runsDir).sort()) {\\n    if (r === \\\"logs\\\") continue;\\n    if (prefix && !r.startsWith(prefix)) { ignoradas++; continue; }\\n    const p = join(runsDir, r, \\\"meta.json\\\");\\n    if (!existsSync(p)) { console.log(`  sem meta.json: ${r}`); continue; }\\n    const m = JSON.parse(readFileSync(p, \\\"utf8\\\"));\\n    linhas.push(COLUNAS.map(([, f]) => csv(f(m))).join(\\\",\\\"));\\n  }\\n\\n  mkdirSync(dirname(out), { recursive: true });\\n  writeFileSync(out, COLUNAS.map(([n]) => n).join(\\\",\\\") + \\\"\\\\n\\\" + linhas.join(\\\"\\\\n\\\") + \\\"\\\\n\\\");\\n\\n  console.log(`${linhas.length} execucoes -> ${out}`);\\n  console.log(`${COLUNAS.length} colunas`);\\n  if (ignoradas) console.log(`${ignoradas} fora do prefixo \\\"${prefix}\\\", ignoradas`);\\n\\n  // Aviso, nao erro: run sem `valid` preenchida ainda nao passou pelo julgamento\\n  // humano, e entrar na analise assim seria contar o que nao foi olhado.\\n  const semValid = linhas.filter((l) => l.split(\\\",\\\")[4] === \\\"\\\").length;\\n  if (semValid) {\\n    console.log(`\\\\n${semValid} execucao(oes) com \\\\`valid\\\\` vazia.`);\\n    console.log(\\\"Preencher olhando o meta.json. Nenhum script opina sobre isso.\\\");\\n  }\\n}\\n\",\"dockerfile\":\"# Imagem única do experimento. Build a partir da raiz de experimento-harness/:\\n#   docker build -f infra/docker/Dockerfile -t experimento-harness:v5 .\\n#\\n# Tudo com versão exata. Mudou qualquer linha = nova tag da imagem + registro no diário.\\n\\nFROM node:24.19.0-bookworm-slim AS node\\n\\nFROM maven:3.9.16-eclipse-temurin-21\\n\\n# Node (necessário para instalar o Claude Code via npm)\\nCOPY --from=node /usr/local/bin/node /usr/local/bin/node\\nCOPY --from=node /usr/local/lib/node_modules /usr/local/lib/node_modules\\nRUN ln -s ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm \\\\\\n && ln -s ../lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx\\n\\nRUN apt-get update \\\\\\n && apt-get install -y --no-install-recommends git jq ca-certificates \\\\\\n && rm -rf /var/lib/apt/lists/*\\n\\nRUN npm install -g @anthropic-ai/claude-code@2.1.288\\n\\n# A imagem oficial do Maven define MAVEN_CONFIG=/root/.m2 e um entrypoint que\\n# copia configurações para lá. Nenhum dos dois serve para um usuário não-root.\\nENV MAVEN_CONFIG=\\\"\\\"\\nENTRYPOINT []\\n\\nENV DISABLE_AUTOUPDATER=1 \\\\\\n    CLAUDE_CODE_DISABLE_AUTO_MEMORY=1\\n\\nRUN useradd -m -s /bin/bash experimento\\nUSER experimento\\nWORKDIR /home/experimento\\n\\n# Aquece o ~/.m2 para o tempo de download não entrar na medição: dependências,\\n# plugins do build e o provider JUnit do Surefire, que só é baixado quando\\n# existe teste. O projeto de aquecimento é apagado em seguida.\\n#\\n# O Maven continua ONLINE nas execuções: o agente pode acrescentar dependência\\n# se julgar necessário, e isso é registrado no meta.json em vez de impedido.\\nCOPY --chown=experimento infra/docker/aquecimento/ /tmp/aquecimento/\\nRUN cd /tmp/aquecimento && mvn -B -q verify && rm -rf /tmp/aquecimento\\n\\n\\nWORKDIR /workspace\\n\",\"runlevels\":\"#!/usr/bin/env bash\\n# Roda os quatro niveis da escada (N0 a N3) do mesmo modelo, TODOS ao mesmo\\n# tempo: um quarteto simultaneo, no lugar do par simultaneo do rodada.sh.\\n#\\n# Uso:  infra/scripts/run-levels.sh <prefixo> <replicate> <APELIDO>\\n#       infra/scripts/run-levels.sh V4-STRATEGY-01 1 HAIKU45     (4 execucoes)\\n#\\n# O APELIDO e uma chave de \\\"modelos\\\" do desenho (experiment/desenho-v5.json, ou o\\n# arquivo em DESENHO=...), e o ID completo do modelo e o effort saem de la: uma lista\\n# so, a mesma que o verify.mjs confere. No V5 (10/10), os 11 do desenho: HAIKU45, HAIKU55,\\n# SONNET45, SONNET46, SONNET5, SONNET55, OPUS46, OPUS47, OPUS48, OPUS5 e OPUS55. Um\\n# quarteto por vez, na ordem de experiment/ordem-v5.csv.\\n# Se o prefixo for do lote do desenho, ele tem de ser <prefixo do lote>-<replica com\\n# 2 digitos> (V4-STRATEGY-03 com a replica 3): o verify.mjs so reconhece esse nome.\\n#\\n# Os niveis (ver experiment/harnesses/README.md):\\n#   N0 = braco CONTROL, workspace vazio\\n#   N1, N2, N3 = braco HARNESS, com HARNESS=N1, N2 ou N3\\n# O run_id termina no nivel: <prefixo>-<MODELO>-N0 ... N3. No meta.json, o nivel\\n# tambem se le pelo harness_hash.\\n#\\n# SIMULTANEO DE PROPOSITO, pelo mesmo motivo do rodada.sh: os quatro niveis de um\\n# modelo rodam no mesmo instante, para horario, fila e carga de servidor serem os\\n# mesmos, e a analise compara os niveis em pares (N1 x N0, N2 x N1, N3 x N2).\\n# Os quartetos de modelos diferentes nao precisam ser simultaneos entre si, e um\\n# modelo por vez e o mais seguro para a cota da assinatura. (Ate 09/10 havia a opcao\\n# TODOS, com tres modelos juntos; saiu com o desenho de 5 modelos.)\\n#\\n# Nao muda o run-one.sh: chama ele quatro vezes, como o rodada.sh chama duas.\\n# Confere TUDO antes de lancar QUALQUER execucao: um quarteto com um nivel a\\n# menos nao serve para a comparacao, e e melhor falhar sem gastar cota.\\n#\\n# Chamava-se rodada-niveis.sh ate 07/10; o nome e as variaveis foram para o\\n# ingles, sem mudar a logica.\\n#\\n# COMO LER (para quem le o V4 pela primeira vez). O script tem 4 partes:\\n#   1. confere os 3 argumentos (formato do prefixo e da replica);\\n#   2. le o desenho: troca o apelido (HAIKU45) pelo ID do modelo (claude-haiku-4-5)\\n#      e pega o effort; recusa o que nao bate com o desenho;\\n#   3. \\\"preflight\\\": confere que as pastas dos niveis existem e que nenhuma das 4\\n#      execucoes ja existe em runs/ (uma execucao nunca e refeita por cima);\\n#   4. lanca as 4 execucoes em paralelo (o \\\"&\\\" no fim da linha) e espera todas.\\n# Cada execucao e o run-one.sh, que sobe um container, roda o Claude Code com o\\n# enunciado e grava runs/<id>/ (meta.json, transcricao, workspace, build.txt).\\n\\nset -uo pipefail\\n\\n# ------------------------------------------------------------------ 1. argumentos\\ncase $# in 3) ;; *) { echo \\\"uso: $0 <prefixo> <replicate> <APELIDO do desenho>\\\" >&2; exit 2; } ;; esac\\nPREFIX=\\\"$1\\\"; REPLICATE=\\\"$2\\\"; WHICH=\\\"$3\\\"\\n# So letras, numeros e hifen: o prefixo vira nome de pasta e de container.\\ncase \\\"$PREFIX\\\" in \\\"\\\"|*[!A-Za-z0-9-]*) { echo \\\"prefixo invalido: '$PREFIX'\\\" >&2; exit 2; } ;; esac\\ncase \\\"$REPLICATE\\\" in [1-9]|[1-9][0-9]) ;; *) { echo \\\"replicate deve ser inteiro positivo: '$REPLICATE'\\\" >&2; exit 2; } ;; esac\\n\\n# ------------------------------------------------------------------ 2. o desenho\\nROOT=\\\"$(cd \\\"$(dirname \\\"${BASH_SOURCE[0]}\\\")/../..\\\" && pwd -P)\\\"\\nRUN_ONE=\\\"$ROOT/infra/scripts/run-one.sh\\\"\\nDESENHO=\\\"${DESENHO:-$ROOT/experiment/desenho-v5.json}\\\"\\n[ -f \\\"$DESENHO\\\" ] || { echo \\\"desenho nao encontrado: $DESENHO\\\" >&2; exit 2; }\\n# Absoluto: o arquivo de ordem traz DESENHO=experiment/..., relativo a raiz do TCC_V3.\\nDESENHO=\\\"$(cd \\\"$(dirname \\\"$DESENHO\\\")\\\" && pwd -P)/$(basename \\\"$DESENHO\\\")\\\"\\n# caminho para o node: no Git Bash do Windows precisa virar C:\\\\..., no Linux nao\\nhost_path() { if command -v cygpath >/dev/null 2>&1; then cygpath -w \\\"$1\\\"; else printf '%s' \\\"$1\\\"; fi; }\\n\\n# O ID completo e o effort vem do desenho; o apelido entra no run_id.\\n# O node le o JSON e imprime \\\"<id> <effort>\\\" (ex.: \\\"claude-haiku-4-5 medium\\\"); se o\\n# apelido nao existe, ou o prefixo nao bate com a replica, ele sai com erro e o\\n# script para aqui, antes de lancar qualquer coisa.\\nLIDO=\\\"$(node -e '\\nconst d = JSON.parse(require(\\\"fs\\\").readFileSync(process.argv[1], \\\"utf8\\\")); const [, , apelido, prefixo, replica] = process.argv;\\nconst id = (d.modelos || {})[apelido];\\nif (!id) { console.error(`apelido deve ser um de: ${Object.keys(d.modelos || {}).join(\\\", \\\") || \\\"(o desenho ainda nao tem modelos)\\\"}`); process.exit(1); }\\nif (prefixo.startsWith(d.prefixo + \\\"-\\\") && prefixo !== `${d.prefixo}-${String(replica).padStart(2, \\\"0\\\")}`) {\\n  console.error(`no lote ${d.prefixo}, a replica ${replica} roda com o prefixo ${d.prefixo}-${String(replica).padStart(2, \\\"0\\\")}, nao ${prefixo}`); process.exit(1);\\n}\\nconsole.log(id, d.effort, d.ensaio ? \\\"ensaio\\\" : prefixo.startsWith(d.prefixo + \\\"-\\\") ? \\\"lote\\\" : \\\"fora\\\");\\n' \\\"$(host_path \\\"$DESENHO\\\")\\\" \\\"$WHICH\\\" \\\"$PREFIX\\\" \\\"$REPLICATE\\\")\\\" || exit 2\\nread -r MODEL_ID DESIGN_EFFORT NO_LOTE <<< \\\"$LIDO\\\"\\n# O effort de fora (EFFORT=...) so e aceito se for o do desenho.\\nEFFORT=\\\"${EFFORT:-$DESIGN_EFFORT}\\\"\\n[ \\\"$EFFORT\\\" = \\\"$DESIGN_EFFORT\\\" ] || { echo \\\"EFFORT=$EFFORT, o desenho pede $DESIGN_EFFORT\\\" >&2; exit 2; }\\n# No lote do desenho, nada de enunciado ou imagem trocados por variavel de ambiente\\n# (o run-one.sh aceita PROMPT_FILE e IMAGE para os ensaios da bancada; esquecidos no\\n# terminal, mudariam o V4 sem aviso, e o verify.mjs so acusaria depois de gastar a cota).\\n# Um desenho de ensaio da bancada (com \\\"ensaio\\\": true) pode usar as duas.\\nif [ \\\"$NO_LOTE\\\" = \\\"lote\\\" ]; then\\n    for v in PROMPT_FILE IMAGE; do\\n        [ -n \\\"${!v:-}\\\" ] && { echo \\\"$v esta definido ($v=${!v}); no lote do desenho, rode sem ele\\\" >&2; exit 2; }\\n    done\\nfi\\nMODELS=\\\"$WHICH:$MODEL_ID\\\"\\nLEVELS=\\\"N0 N1 N2 N3\\\"\\n\\n# ------------------------------------------------------------------ 3. preflight\\n# As pastas dos niveis N1 a N3 tem de existir e ter conteudo (o N0 nao tem pasta:\\n# e o workspace vazio).\\nfor level in N1 N2 N3; do\\n    dir=\\\"$ROOT/experiment/harnesses/$level\\\"\\n    [ -d \\\"$dir\\\" ] || { echo \\\"nivel $level nao encontrado: $dir\\\" >&2; exit 2; }\\n    [ -f \\\"$dir/CLAUDE.md\\\" ] || compgen -G \\\"$dir/.claude/skills/*/SKILL.md\\\" >/dev/null \\\\\\n        || { echo \\\"nivel $level vazio: o run-one.sh o recusaria\\\" >&2; exit 2; }\\ndone\\n# Nenhuma das 4 execucoes pode existir ainda: um quarteto e sempre inteiro e novo.\\nfor m in $MODELS; do\\n    for level in $LEVELS; do\\n        id=\\\"$PREFIX-${m%%:*}-$level\\\"\\n        [ -e \\\"$ROOT/runs/$id\\\" ] && { echo \\\"runs/$id ja existe\\\" >&2; exit 2; }\\n    done\\ndone\\nmkdir -p \\\"$ROOT/runs/logs\\\"\\n\\n# ------------------------------------------------------------------ 4. lancar e esperar\\nRUN_COUNT=$(( $(echo $MODELS | wc -w) * 4 ))\\nprintf '\\\\033[36m=== quarteto %s  |  replica %s  |  effort=%s  |  %s execucoes em paralelo ===\\\\033[0m\\\\n' \\\\\\n    \\\"$PREFIX\\\" \\\"$REPLICATE\\\" \\\"$EFFORT\\\" \\\"$RUN_COUNT\\\"\\nSTART=\\\"$(date +%s)\\\"\\nPIDS=\\\"\\\"; IDS=\\\"\\\"\\n\\n# Cada execucao vai para o fundo (\\\"&\\\"), com a saida no runs/logs/<id>.log; o $! e o\\n# numero do processo, guardado para esperar por ele depois.\\nfor m in $MODELS; do\\n    alias=\\\"${m%%:*}\\\"; model=\\\"${m#*:}\\\"\\n    for level in $LEVELS; do\\n        id=\\\"$PREFIX-$alias-$level\\\"\\n        if [ \\\"$level\\\" = \\\"N0\\\" ]; then\\n            EFFORT=\\\"$EFFORT\\\" NETWORK=\\\"${NETWORK:-}\\\" \\\"$RUN_ONE\\\" \\\"$id\\\" \\\"$model\\\" CONTROL \\\"$REPLICATE\\\" \\\\\\n                > \\\"$ROOT/runs/logs/$id.log\\\" 2>&1 &\\n        else\\n            HARNESS=\\\"$level\\\" EFFORT=\\\"$EFFORT\\\" NETWORK=\\\"${NETWORK:-}\\\" \\\"$RUN_ONE\\\" \\\"$id\\\" \\\"$model\\\" HARNESS \\\"$REPLICATE\\\" \\\\\\n                > \\\"$ROOT/runs/logs/$id.log\\\" 2>&1 &\\n        fi\\n        PIDS=\\\"$PIDS $!\\\"; IDS=\\\"$IDS $id\\\"\\n        echo \\\"  lancada: $id\\\"\\n    done\\ndone\\n\\n# Espera as 4, na ordem em que foram lancadas, e conta quantas sairam com erro.\\necho \\\"aguardando...\\\"\\nFAILURES=0\\nset -- $IDS\\nfor p in $PIDS; do\\n    wait \\\"$p\\\"; rc=$?\\n    printf '  %-34s codigo=%s\\\\n' \\\"$1\\\" \\\"$rc\\\"\\n    [ \\\"$rc\\\" -eq 0 ] || FAILURES=$((FAILURES + 1))\\n    shift\\ndone\\n\\n# Resumo: a ultima linha do log de cada execucao (o run-one.sh imprime ali o termino,\\n# os turnos, os tokens e se compilou).\\nprintf '\\\\nquarteto terminou em %ss  |  falhas: %s\\\\n' \\\"$(( $(date +%s) - START ))\\\" \\\"$FAILURES\\\"\\nfor id in $IDS; do\\n    [ -f \\\"$ROOT/runs/$id/meta.json\\\" ] && printf '  %-34s %s\\\\n' \\\"$id\\\" \\\"$(tail -n 1 \\\"$ROOT/runs/logs/$id.log\\\")\\\"\\ndone\\n\",\"runone\":\"#!/usr/bin/env bash\\n# Executa UMA run do experimento dentro de um container descartavel.\\n#\\n# Uso (Git Bash, a partir de qualquer pasta):\\n#   infra/scripts/run-one.sh <run_id> <modelo> <CONTROL|HARNESS> [replicate]\\n#   infra/scripts/run-one.sh SMOKE-01-OPUS-CONTROL claude-opus-5 CONTROL\\n#   infra/scripts/run-one.sh BATCH-01-OPUS-HARNESS claude-opus-5 HARNESS 1\\n#\\n# Variaveis opcionais:\\n#   IMAGE        padrao experimento-harness:v5 (o V4 rodou na v3)\\n#   EFFORT       padrao medium\\n#   PROMPT_FILE  padrao experiment/prompt/prompt.md\\n#   HARNESS      padrao N1. Nome de uma pasta de experiment/harnesses/,\\n#                usada so na condicao HARNESS (ex.: HARNESS=N2)\\n#   NETWORK      rotulo da rede, gravado no meta.json (ex.: casa-wifi)\\n#\\n# NENHUMA restricao de ferramenta. O agente recebe tudo que o Claude Code\\n# oferece, inclusive subagente. Nao acrescente --disallowedTools, --allowedTools\\n# nem --tools: a pergunta do experimento e sobre o Claude Code como ele vem, e\\n# restringir ferramenta mede uma versao de laboratorio dele.\\n#\\n# O workspace nasce VAZIO. As versoes (Java 21, Spring Boot 4.1.1) sao PEDIDAS\\n# no enunciado, nao impostas pelo ambiente — desobedecer nao invalida a\\n# execucao, vira dado em `foundation.versions_obeyed`.\\n#\\n# COMO LER. Uma execucao passa por 5 etapas, cada uma com um titulo \\\"----\\\" abaixo:\\n#   1. preflight: confere tudo antes (condicao, ID do modelo, .env, imagem, harness);\\n#   2. workspace: cria runs/<id>/workspace; no braco HARNESS, copia para la a pasta\\n#      do nivel (CLAUDE.md, skill, revisor) e calcula o hash dela;\\n#   3. execucao: um container descartavel roda o Claude Code com o enunciado, sem\\n#      perguntar nada (-p, sem pedir permissao) e grava a transcricao em JSON;\\n#   4. build: OUTRO container, sem o token, roda \\\"mvn verify\\\" no que o agente deixou;\\n#   5. meta.json: o extract-meta.mjs le a transcricao e grava o resumo da execucao.\\n# O que fica em runs/<id>/: workspace/ (o codigo do agente), claude-output.jsonl (a\\n# transcricao), stderr.txt, build.txt (o mvn verify) e meta.json.\\n\\nset -uo pipefail\\n\\nmorrer() { printf '\\\\033[31mERRO: %s\\\\033[0m\\\\n' \\\"$*\\\" >&2; exit 1; }\\n\\ncase $# in 3|4) ;; *) morrer \\\"uso: $0 <run_id> <modelo> <CONTROL|HARNESS> [replicate]\\\" ;; esac\\nRUN_ID=\\\"$1\\\"; MODEL=\\\"$2\\\"; CONDITION=\\\"$3\\\"\\n# A replica e obrigatoria no lote e vazia na fumaca. Com n=3 por celula, sem ela\\n# nao da para dizer qual das tres e cada run.\\nREPLICATE=\\\"${4:-}\\\"\\ncase \\\"$REPLICATE\\\" in \\\"\\\"|[1-9]|[1-9][0-9]) ;; *) morrer \\\"replicate deve ser inteiro positivo: '$REPLICATE'\\\" ;; esac\\n\\nRAIZ=\\\"$(cd \\\"$(dirname \\\"${BASH_SOURCE[0]}\\\")/../..\\\" && pwd -P)\\\"\\nIMAGE=\\\"${IMAGE:-experimento-harness:v5}\\\"\\nEFFORT=\\\"${EFFORT:-medium}\\\"\\n\\nRUN_DIR=\\\"$RAIZ/runs/$RUN_ID\\\"\\nWS=\\\"$RUN_DIR/workspace\\\"\\nPROMPT=\\\"${PROMPT_FILE:-$RAIZ/experiment/prompt/prompt.md}\\\"\\nHARNESS=\\\"${HARNESS:-N1}\\\"\\nHARNESS_DIR=\\\"$RAIZ/experiment/harnesses/$HARNESS\\\"\\nENV_FILE=\\\"$RAIZ/.env\\\"\\n\\n# ------------------------------------------------------------------ preflight\\ncase \\\"$CONDITION\\\" in CONTROL|HARNESS) ;; *) morrer \\\"condicao deve ser CONTROL ou HARNESS\\\" ;; esac\\n# Alias resolve para um modelo que voce nao escolheu. Exige o ID completo.\\ncase \\\"$MODEL\\\" in claude-*-*) ;; *) morrer \\\"use o ID completo do modelo, nao alias: '$MODEL'\\\" ;; esac\\n[ -e \\\"$RUN_DIR\\\" ] && morrer \\\"$RUN_DIR ja existe. Runs nunca sao reaproveitadas.\\\"\\n[ -f \\\"$PROMPT\\\" ] || morrer \\\"enunciado nao encontrado: $PROMPT\\\"\\n[ -f \\\"$ENV_FILE\\\" ] || morrer \\\"falta $ENV_FILE com CLAUDE_CODE_OAUTH_TOKEN=...\\\"\\ngrep -q '^CLAUDE_CODE_OAUTH_TOKEN=.\\\\+' \\\"$ENV_FILE\\\" || morrer \\\".env sem CLAUDE_CODE_OAUTH_TOKEN\\\"\\n# Qualquer uma destas troca cobranca, provedor ou modelo sem avisar, e o\\n# experimento passaria a medir outra coisa.\\nif grep -Eq '^(ANTHROPIC_API_KEY|ANTHROPIC_AUTH_TOKEN|ANTHROPIC_BASE_URL|ANTHROPIC_MODEL)=' \\\"$ENV_FILE\\\"; then\\n    morrer \\\".env contem variavel que troca cobranca, provedor ou modelo\\\"\\nfi\\ndocker image inspect \\\"$IMAGE\\\" >/dev/null 2>&1 || morrer \\\"imagem $IMAGE nao existe (rode o docker build)\\\"\\nif [ \\\"$CONDITION\\\" = \\\"HARNESS\\\" ]; then\\n    case \\\"$HARNESS\\\" in \\\"\\\"|*[!A-Za-z0-9-]*) morrer \\\"HARNESS deve ser o nome de uma pasta de experiment/harnesses/: '$HARNESS'\\\" ;; esac\\n    [ -d \\\"$HARNESS_DIR\\\" ] || morrer \\\"harness nao encontrado: $HARNESS_DIR\\\"\\n    # Uma pasta de skills sem skill e uma versao ainda nao montada: rodar com ela\\n    # mediria outra coisa com o nome desta.\\n    if [ -d \\\"$HARNESS_DIR/.claude/skills\\\" ] && ! compgen -G \\\"$HARNESS_DIR/.claude/skills/*/SKILL.md\\\" >/dev/null; then\\n        morrer \\\"harness $HARNESS tem .claude/skills/ sem nenhuma skill (<nome>/SKILL.md)\\\"\\n    fi\\n    [ -f \\\"$HARNESS_DIR/CLAUDE.md\\\" ] || compgen -G \\\"$HARNESS_DIR/.claude/skills/*/SKILL.md\\\" >/dev/null \\\\\\n        || morrer \\\"harness $HARNESS vazio: precisa de CLAUDE.md ou de .claude/skills/<nome>/SKILL.md\\\"\\nfi\\n\\n# Hash estavel de uma pasta: caminhos + conteudo de cada arquivo. O .gitkeep so\\n# existe para o git guardar pasta vazia e nao chega ao agente, entao nao entra.\\nhash_arvore() {\\n    ( cd \\\"$1\\\" && find . -type f -not -name .gitkeep | LC_ALL=C sort | while read -r f; do printf '%s  ' \\\"$f\\\"; sha256sum \\\"$f\\\" | cut -d' ' -f1; done ) \\\\\\n        | sha256sum | cut -d' ' -f1\\n}\\n\\n# ------------------------------------------------------------------ workspace\\nmkdir -p \\\"$RUN_DIR\\\" \\\"$WS\\\" \\\"$RAIZ/runs/logs\\\"\\nHARNESS_HASH=\\\"\\\"\\nif [ \\\"$CONDITION\\\" = \\\"HARNESS\\\" ]; then\\n    # Copia INDISCRIMINADA: qualquer arquivo que sobrar na pasta da versao entra\\n    # no workspace do agente e contamina o braco. Skills ficam em\\n    # .claude/skills/<nome>/SKILL.md, onde o Claude Code as acha em /workspace.\\n    cp -r \\\"$HARNESS_DIR/.\\\" \\\"$WS/\\\"\\n    find \\\"$WS\\\" -name .gitkeep -type f -delete\\n    HARNESS_HASH=\\\"$(hash_arvore \\\"$HARNESS_DIR\\\")\\\"\\n    echo \\\"harness: $HARNESS ($HARNESS_HASH)\\\"\\nfi\\nPROMPT_HASH=\\\"$(sha256sum \\\"$PROMPT\\\" | cut -d' ' -f1)\\\"\\nIMAGE_ID=\\\"$(docker image inspect --format '{{.Id}}' \\\"$IMAGE\\\")\\\"\\n\\nWS_WIN=\\\"$(cygpath -w \\\"$WS\\\")\\\"\\nPROMPT_WIN=\\\"$(cygpath -w \\\"$PROMPT\\\")\\\"\\nENV_WIN=\\\"$(cygpath -w \\\"$ENV_FILE\\\")\\\"\\nexport MSYS_NO_PATHCONV=1\\n\\nprintf '\\\\033[36m=== %s  %s  %s ===\\\\033[0m\\\\n' \\\"$RUN_ID\\\" \\\"$MODEL\\\" \\\"$CONDITION\\\"\\n\\n# ------------------------------------------------------------------ execucao\\nSTART=\\\"$(date -Iseconds)\\\"; T0=\\\"$(date +%s)\\\"\\n\\n# O container: --rm apaga ao terminar; o .env entra como variavel de ambiente (o\\n# token da assinatura); o workspace e montado em /workspace (o agente trabalha nele);\\n# o enunciado entra so para leitura. As tres linhas \\\"[pre]\\\" vao para o stderr.txt e\\n# provam o isolamento: a versao do Claude Code, que ~/.claude esta vazio (nenhuma\\n# configuracao do autor) e que nao ha CLAUDE.md fora do workspace. O enunciado entra\\n# pela entrada padrao (< /experimento/prompt.md), e \\\"$0\\\"/\\\"$1\\\" sao o modelo e o effort.\\n\\ndocker run --rm --name \\\"exp-$RUN_ID\\\" \\\\\\n    --env-file \\\"$ENV_WIN\\\" \\\\\\n    --mount \\\"type=bind,source=$WS_WIN,target=/workspace\\\" \\\\\\n    --mount \\\"type=bind,source=$PROMPT_WIN,target=/experimento/prompt.md,readonly\\\" \\\\\\n    \\\"$IMAGE\\\" \\\\\\n    bash -c '\\n        echo \\\"[pre] claude $(claude --version)\\\" >&2\\n        echo \\\"[pre] conteudo de ~/.claude: [$(ls -A \\\"$HOME/.claude\\\" 2>/dev/null | tr \\\"\\\\n\\\" \\\" \\\")]\\\" >&2\\n        echo \\\"[pre] CLAUDE.md fora do workspace: [$(find / -name CLAUDE.md -not -path \\\"/workspace/*\\\" -not -path \\\"/proc/*\\\" 2>/dev/null | tr \\\"\\\\n\\\" \\\" \\\")]\\\" >&2\\n        claude -p \\\\\\n            --model \\\"$0\\\" \\\\\\n            --effort \\\"$1\\\" \\\\\\n            --output-format stream-json --verbose \\\\\\n            --dangerously-skip-permissions \\\\\\n            --no-session-persistence \\\\\\n            < /experimento/prompt.md\\n' \\\"$MODEL\\\" \\\"$EFFORT\\\" \\\\\\n    > \\\"$RUN_DIR/claude-output.jsonl\\\" 2> \\\"$RUN_DIR/stderr.txt\\\"\\nRC=$?\\n\\nEND=\\\"$(date -Iseconds)\\\"; DURATION=$(( $(date +%s) - T0 ))\\necho \\\"execucao terminou: codigo $RC em ${DURATION}s\\\"\\n\\n# ------------------------------------------------------------ build pos-execucao\\n# Container separado, SEM o token: o build e do avaliador, nao do agente. Se\\n# rodasse no mesmo container, o agente poderia ter mexido no ambiente.\\n#\\n# O pom NAO e procurado so na raiz: sem esqueleto o agente escolhe onde poe o\\n# projeto. Usa o pom mais raso, ignorando target/.\\ndocker run --rm \\\\\\n    --mount \\\"type=bind,source=$WS_WIN,target=/workspace\\\" \\\\\\n    \\\"$IMAGE\\\" bash -c '\\n        POM=\\\"$(find /workspace -name pom.xml -not -path \\\"*/target/*\\\" -printf \\\"%d %p\\\\n\\\" 2>/dev/null | sort -n | head -1 | cut -d\\\" \\\" -f2-)\\\"\\n        [ -n \\\"$POM\\\" ] || { echo \\\"SEM POM em /workspace\\\"; exit 66; }\\n        echo \\\"pom encontrado: $POM\\\"\\n        cd \\\"$(dirname \\\"$POM\\\")\\\" && mvn -B verify\\n    ' \\\\\\n    > \\\"$RUN_DIR/build.txt\\\" 2>&1\\nBUILD_RC=$?\\necho \\\"build pos-execucao: codigo $BUILD_RC\\\"\\n\\n# ------------------------------------------------------------------ meta.json\\n# Tudo o que o script sabe (horarios, codigos de saida, hashes da imagem, do enunciado\\n# e do harness) vai como argumento; o resto (modelo que respondeu, tokens, custo,\\n# ferramentas usadas) o extract-meta.mjs tira da transcricao.\\n# node.exe e binario do Windows: recebe caminho do Windows, nao o /j/... do Git Bash.\\nnode \\\"$(cygpath -w \\\"$RAIZ/infra/scripts/extract-meta.mjs\\\")\\\" \\\"$(cygpath -w \\\"$RUN_DIR\\\")\\\" \\\\\\n    --run_id \\\"$RUN_ID\\\" --model \\\"$MODEL\\\" --condition \\\"$CONDITION\\\" \\\\\\n    --replicate \\\"$REPLICATE\\\" \\\\\\n    --start \\\"$START\\\" --end \\\"$END\\\" --duration_s \\\"$DURATION\\\" \\\\\\n    --exit_code \\\"$RC\\\" --build_code \\\"$BUILD_RC\\\" \\\\\\n    --effort \\\"$EFFORT\\\" \\\\\\n    --image \\\"$IMAGE\\\" --image_id \\\"$IMAGE_ID\\\" \\\\\\n    --prompt_hash \\\"$PROMPT_HASH\\\" --harness_hash \\\"$HARNESS_HASH\\\" \\\\\\n    --network \\\"${NETWORK:-}\\\"\\n\",\"extractmeta\":\"// Le a saida stream-json de uma run e escreve runs/<id>/meta.json.\\n//\\n// Uso: node extract-meta.mjs <run_dir> --chave valor ...\\n//\\n// Este script NAO julga nada. Ele transcreve o que aconteceu. O campo `valid`\\n// sai sempre `null`: quem decide se uma execucao vale e humano.\\n//\\n// COMO LER. Quem chama e o run-one.sh, no fim de cada execucao. Quatro partes:\\n//   1. \\\"transcricao\\\": le o claude-output.jsonl (uma linha JSON por evento do Claude\\n//      Code) e separa o \\\"init\\\" (como a sessao comecou: modelo, ferramentas, skills) e\\n//      os \\\"result\\\" (como terminou: tokens, custo, turnos);\\n//   2. \\\"o projeto\\\": olha o workspace e acha o pom.xml, as versoes pedidas (Java 21,\\n//      Spring Boot 4.1.1), as dependencias e o pacote raiz;\\n//   3. \\\"o encerramento\\\": decide o termino (completed, error, interrupted...) pelo\\n//      codigo de saida e pelo result;\\n//   4. \\\"meta.json\\\": monta o arquivo. Cada campo tem um comentario dizendo de onde vem.\\n// O meta.json e a fonte de tudo que o aggregate.mjs e o verify.mjs leem depois.\\n\\nimport { readFileSync, writeFileSync, existsSync, readdirSync } from \\\"node:fs\\\";\\nimport { join } from \\\"node:path\\\";\\nimport { createHash } from \\\"node:crypto\\\";\\nimport { hostname } from \\\"node:os\\\";\\n\\nconst [runDir, ...resto] = process.argv.slice(2);\\nconst arg = {};\\nfor (let i = 0; i < resto.length; i += 2) arg[resto[i].replace(/^--/, \\\"\\\")] = resto[i + 1];\\n\\n// ----------------------------------------------------------------- transcricao\\nconst eventos = [];\\nconst linhasInvalidas = [];\\nconst saida = join(runDir, \\\"claude-output.jsonl\\\");\\nif (existsSync(saida)) {\\n  readFileSync(saida, \\\"utf8\\\").split(/\\\\r?\\\\n/).forEach((linha, n) => {\\n    if (!linha.trim()) return;\\n    try { eventos.push(JSON.parse(linha)); } catch { linhasInvalidas.push(n + 1); }\\n  });\\n}\\n\\n// A transcricao pode ter MAIS DE UM par init/result. Acontece quando o agente\\n// deixa uma tarefa rodando em segundo plano (`mvn spring-boot:run`, por\\n// exemplo) e o CLI segmenta a sessao: cada segmento fecha com o seu `result`,\\n// numerado em `result_index`.\\n//\\n// Medido na SMOKE-01-HAIKU-HARNESS: dois segmentos, o primeiro com 52 turnos e\\n// 2.150.552 de entrada, o segundo com 1 turno e 67.525. Ler apenas o ULTIMO\\n// reportava 67 mil onde foram 2,2 milhoes — erro de 32x, e a H2 e justamente\\n// sobre consumo.\\n//\\n// O `init` continua sendo o PRIMEIRO: e o estado com que o agente comecou.\\nconst init = eventos.find((e) => e.type === \\\"system\\\" && e.subtype === \\\"init\\\") ?? null;\\nconst resultados = eventos.filter((e) => e.type === \\\"result\\\");\\nconst result = resultados.length ? resultados[resultados.length - 1] : null;\\n\\n// As semanticas sao MISTURADAS, e isso foi conferido campo a campo:\\n//\\n//   POR SEGMENTO, somar: num_turns, duration_ms, usage.* (entrada, saida,\\n//                        cache, thinking)\\n//   CUMULATIVOS, pegar o ultimo: duration_api_ms, total_cost_usd, modelUsage\\n//   ESTADO FINAL, pegar o ultimo: subtype, is_error, stop_reason,\\n//                        terminal_reason, result\\n//\\n// `modelUsage` e cumulativo e isso foi verificado: out=26988 no primeiro\\n// segmento vira 27161 no segundo, que e 26988 + 173.\\nconst somaSegmentos = (f) => resultados.reduce((s, e) => s + (typeof f(e) === \\\"number\\\" ? f(e) : 0), 0);\\n\\n// Chamadas de ferramenta e modelos, a partir das mensagens do assistente.\\nconst ferramentas = {};\\nconst modelosNasMensagens = new Set();\\nfor (const e of eventos) {\\n  if (e.type !== \\\"assistant\\\" || !e.message) continue;\\n  if (e.message.model) modelosNasMensagens.add(e.message.model);\\n  for (const bloco of e.message.content ?? []) {\\n    if (bloco.type !== \\\"tool_use\\\") continue;\\n    ferramentas[bloco.name] = (ferramentas[bloco.name] ?? 0) + 1;\\n  }\\n}\\n\\nconst num = (v) => (typeof v === \\\"number\\\" ? v : 0);\\n\\n// Run interrompida nao tem evento `result`, que e onde vem os tokens. Reconstroi\\n// o que der a partir das mensagens do assistente.\\n//\\n// Cada mensagem aparece varias vezes no stream (parciais do streaming), sempre\\n// com o mesmo `message.id`: a ULTIMA ocorrencia de cada id traz o usage fechado.\\n// Entrada e cache batem exatamente com o `result`; `output_tokens` NAO bate — as\\n// parciais trazem a contagem do instante em que foram emitidas. Por isso a saida\\n// fica nula em vez de receber um numero errado.\\nfunction reconstruirUsage() {\\n  const ultimaPorId = new Map();\\n  for (const e of eventos) if (e.type === \\\"assistant\\\" && e.message?.id) ultimaPorId.set(e.message.id, e);\\n  const soma = { input_tokens: 0, cache_creation_input_tokens: 0, cache_read_input_tokens: 0 };\\n  for (const e of ultimaPorId.values())\\n    for (const k of Object.keys(soma)) soma[k] += num(e.message.usage?.[k]);\\n  return { ...soma, output_tokens: null };\\n}\\n\\n// Soma o `usage` de TODOS os segmentos. Com um segmento so — que e o caso\\n// normal — isto da exatamente o mesmo que ler o unico result.\\nfunction somarUsage() {\\n  const soma = {\\n    input_tokens: 0, cache_creation_input_tokens: 0, cache_read_input_tokens: 0,\\n    output_tokens: 0, thinking_tokens: 0,\\n  };\\n  for (const e of resultados) {\\n    const u = e.usage ?? {};\\n    soma.input_tokens += num(u.input_tokens);\\n    soma.cache_creation_input_tokens += num(u.cache_creation_input_tokens);\\n    soma.cache_read_input_tokens += num(u.cache_read_input_tokens);\\n    soma.output_tokens += num(u.output_tokens);\\n    soma.thinking_tokens += num(u.output_tokens_details?.thinking_tokens);\\n  }\\n  return soma;\\n}\\n\\nconst usage = resultados.length ? somarUsage() : reconstruirUsage();\\nconst fonteTokens = resultados.length ? \\\"result\\\" : \\\"reconstructed\\\";\\nconst input = num(usage.input_tokens);\\nconst cacheWrite = num(usage.cache_creation_input_tokens);\\nconst cacheRead = num(usage.cache_read_input_tokens);\\n\\n// ------------------------------------------------------------------- o projeto\\nfunction varrer(dir, fora = new Set([\\\"target\\\", \\\"node_modules\\\", \\\".git\\\"])) {\\n  const achados = [];\\n  const andar = (d, prof) => {\\n    let itens;\\n    try { itens = readdirSync(d, { withFileTypes: true }); } catch { return; }\\n    for (const i of itens) {\\n      if (i.isDirectory()) { if (!fora.has(i.name)) andar(join(d, i.name), prof + 1); }\\n      else achados.push({ caminho: join(d, i.name), nome: i.name, prof });\\n    }\\n  };\\n  andar(dir, 0);\\n  return achados;\\n}\\n\\nfunction dependenciasDoPom(texto) {\\n  const bloco = texto.match(/<dependencies>([\\\\s\\\\S]*?)<\\\\/dependencies>/);\\n  if (!bloco) return [];\\n  return [...bloco[1].matchAll(/<groupId>\\\\s*([^<]+?)\\\\s*<\\\\/groupId>\\\\s*<artifactId>\\\\s*([^<]+?)\\\\s*<\\\\/artifactId>/g)]\\n    .map((m) => `${m[1]}:${m[2]}`)\\n    .sort();\\n}\\n\\nconst raizWs = join(runDir, \\\"workspace\\\");\\nconst arquivos = existsSync(raizWs) ? varrer(raizWs) : [];\\nconst rel = (p) => p.slice(raizWs.length + 1).split(\\\"\\\\\\\\\\\").join(\\\"/\\\");\\n\\n// O projeto nao esta necessariamente na raiz: sem esqueleto o agente escolhe\\n// onde poe. Usa o pom mais raso, ignorando target/.\\nconst caminhoPom = arquivos.filter((a) => a.nome === \\\"pom.xml\\\").sort((a, b) => a.prof - b.prof)[0]?.caminho ?? null;\\nconst gradle = arquivos.find((a) => a.nome === \\\"build.gradle\\\" || a.nome === \\\"build.gradle.kts\\\");\\n\\nconst foundation = {\\n  build_tool: caminhoPom ? \\\"maven\\\" : gradle ? \\\"gradle\\\" : null,\\n  project_at: caminhoPom ? rel(caminhoPom) : gradle ? rel(gradle.caminho) : null,\\n  at_root: caminhoPom ? rel(caminhoPom) === \\\"pom.xml\\\" : null,\\n  spring_boot: null,\\n  java: null,\\n  root_package: null,\\n  starters: [],\\n  dependencies: { added: [] },\\n};\\n\\nif (caminhoPom) {\\n  const texto = readFileSync(caminhoPom, \\\"utf8\\\");\\n  foundation.spring_boot = texto.match(/<parent>[\\\\s\\\\S]*?<version>\\\\s*([^<]+?)\\\\s*<\\\\/version>[\\\\s\\\\S]*?<\\\\/parent>/)?.[1] ?? null;\\n  foundation.java = texto.match(/<java\\\\.version>\\\\s*([^<]+?)\\\\s*<\\\\/java\\\\.version>/)?.[1]\\n    ?? texto.match(/<maven\\\\.compiler\\\\.release>\\\\s*([^<]+?)\\\\s*<\\\\/maven\\\\.compiler\\\\.release>/)?.[1]\\n    ?? texto.match(/<maven\\\\.compiler\\\\.source>\\\\s*([^<]+?)\\\\s*<\\\\/maven\\\\.compiler\\\\.source>/)?.[1] ?? null;\\n  const deps = dependenciasDoPom(texto);\\n  foundation.starters = deps.map((d) => d.split(\\\":\\\")[1]);\\n  // Sem pom de partida, tudo que esta declarado foi o agente que acrescentou.\\n  foundation.dependencies.added = deps;\\n}\\n\\n// Pacote raiz: maior prefixo comum dos .java de producao.\\n// Cuidado com o projeto na raiz: ali o caminho relativo comeca em `src/`, sem\\n// barra na frente, e um separador que exija a barra inicial nunca casa.\\nconst pacotes = arquivos\\n  .filter((a) => a.nome.endsWith(\\\".java\\\"))\\n  .map((a) => rel(a.caminho).split(/(?:^|\\\\/)src\\\\/main\\\\/java\\\\//)[1]?.split(\\\"/\\\").slice(0, -1) ?? [])\\n  .filter((p) => p.length);\\nif (pacotes.length) {\\n  const comum = pacotes.reduce((a, b) => a.filter((seg, i) => b[i] === seg));\\n  foundation.root_package = comum.join(\\\".\\\") || null;\\n}\\n\\n// P7: as versoes sao PEDIDAS no enunciado, nao impostas. Desobedecer NAO\\n// invalida a run; vira taxa reportada por modelo e condicao.\\nfoundation.versions_obeyed =\\n  foundation.spring_boot == null && foundation.java == null\\n    ? null\\n    : foundation.spring_boot === \\\"4.1.1\\\" && foundation.java === \\\"21\\\";\\n\\n// --------------------------------------------------------------- o encerramento\\nconst stderr = existsSync(join(runDir, \\\"stderr.txt\\\")) ? readFileSync(join(runDir, \\\"stderr.txt\\\"), \\\"utf8\\\") : \\\"\\\";\\nconst pre = stderr.split(/\\\\r?\\\\n/).filter((l) => l.startsWith(\\\"[pre]\\\"));\\n\\nconst exitCode = Number(arg.exit_code);\\nlet termination = \\\"completed\\\";\\nif ([130, 137, 143].includes(exitCode)) termination = \\\"interrupted\\\";\\nelse if (!result) termination = \\\"no_result\\\";\\nelse if (result.is_error) termination = result.subtype === \\\"error_max_turns\\\" ? \\\"turn_limit\\\" : \\\"error\\\";\\n\\n// ------------------------------------------------------------------- meta.json\\nconst meta = {\\n  run_id: arg.run_id,\\n\\n  // Decisao HUMANA, pela tabela de excecoes do plano. Comeca nula de proposito:\\n  // preencher exige olhar. Nenhum script opina sobre isto.\\n  valid: null,\\n  invalid_reason: null,\\n\\n  model_requested: arg.model,\\n  model_init: init?.model ?? null,\\n  // CONTROLE: todo modelo que apareceu nas mensagens. Se vier mais de um, parte\\n  // do codigo pode ter sido escrita por outro modelo.\\n  models_observed: {\\n    messages: [...modelosNasMensagens],\\n    usage_by_model: result?.modelUsage ? Object.keys(result.modelUsage) : [],\\n  },\\n  condition: arg.condition,\\n  // `null` na fumaca, que nao tem replica. OBRIGATORIO no lote: com n=3 por\\n  // celula, sem ele nao da para dizer qual run e qual.\\n  replicate: arg.replicate ? Number(arg.replicate) : null,\\n\\n  environment: {\\n    image: arg.image,\\n    image_id: arg.image_id,\\n    claude_code_version: init?.claude_code_version ?? null,\\n    prompt_hash: arg.prompt_hash,\\n    harness_hash: arg.harness_hash || null,\\n    preflight: pre,\\n    machine: hostname(),\\n    network: arg.network || null,\\n    // \\\"none\\\" prova que rodou pela ASSINATURA e nao por chave de API. E a\\n    // verificacao do .env vista do lado de dentro do container.\\n    api_key_source: init?.apiKeySource ?? null,\\n  },\\n\\n  parameters: {\\n    // O que foi PEDIDO. A transcricao nao reporta o effort aplicado de volta —\\n    // nem o init nem o result trazem esse campo —, entao nao ha como confirmar\\n    // pelo dado o que foi aplicado.\\n    effort: arg.effort ?? \\\"medium\\\",\\n    permission_mode_init: init?.permissionMode ?? null,\\n    fast_mode_state: init?.fast_mode_state ?? null,\\n  },\\n\\n  timing: {\\n    start: arg.start,\\n    end: arg.end,\\n    // Relogio de parede: CONTAMINADO pelo paralelismo das seis execucoes.\\n    duration_s: Number(arg.duration_s),\\n    // `duration_ms` e POR SEGMENTO: soma.\\n    duration_cli_ms: resultados.length ? somaSegmentos((e) => e.duration_ms) : null,\\n    // `duration_api_ms` e CUMULATIVO: pega o ultimo. A medida limpa para a H2.\\n    duration_api_ms: result?.duration_api_ms ?? null,\\n  },\\n\\n  outcome: {\\n    exit_code: exitCode,\\n    termination,\\n    result_subtype: result?.subtype ?? null,\\n    // Numero de segmentos. Quase sempre 1; ver a nota no topo.\\n    result_segments: resultados.length,\\n    // SOMA dos segmentos, nao o ultimo.\\n    turns: resultados.length ? somaSegmentos((e) => e.num_turns) : null,\\n    tool_calls: Object.values(ferramentas).reduce((a, b) => a + b, 0),\\n    tool_calls_by_name: ferramentas,\\n    final_message: typeof result?.result === \\\"string\\\" ? result.result.slice(0, 500) : null,\\n    build_ok: Number(arg.build_code) === 0,\\n    stop_reason: result?.stop_reason ?? null,\\n    terminal_reason: result?.terminal_reason ?? null,\\n    // Tem que ficar VAZIO. Se nao ficar, o agente esbarrou em permissao e nao\\n    // trabalhou livre — a comparacao entre bracos fica suja.\\n    // O MAIOR entre os segmentos: correto tanto se o campo for cumulativo\\n    // quanto se for por segmento. Nas sete execucoes conferidas ficou vazio nas\\n    // duas leituras, entao a duvida nao pode ser fechada pelo dado ainda.\\n    permission_denials: resultados.length\\n      ? resultados.map((e) => e.permission_denials ?? []).sort((x, y) => y.length - x.length)[0]\\n      : null,\\n    // ATENCAO: este objeto SEMPRE vem, com a estrutura inteira zerada. Nao\\n    // teste a existencia dele nem conte as chaves — o campo que diz se houve\\n    // delegacao e `spawned`. Conferido contra 3 transcricoes reais em que\\n    // Agent/Task estavam bloqueados: todas trazem o objeto com spawned=0.\\n    //\\n    // Se `spawned` > 0, o modelo delegou parte do trabalho a outro modelo, e o\\n    // pacote avaliado nao foi escrito so por ele.\\n    subagent_stats: result?.subagent_stats ?? null,\\n    // Idem: o MAIOR `spawned` entre os segmentos. E este o campo que responde\\n    // \\\"o modelo delegou?\\\", nao a existencia do objeto acima.\\n    subagents_spawned: resultados.length\\n      ? Math.max(...resultados.map((e) => num(e.subagent_stats?.spawned)))\\n      : null,\\n  },\\n\\n  tokens: {\\n    source: fonteTokens,\\n    input,\\n    output: typeof usage.output_tokens === \\\"number\\\" ? usage.output_tokens : null,\\n    cache_read: cacheRead,\\n    cache_write: cacheWrite,\\n    // REPORTE ESTE. O campo `input` sozinho fica na casa das centenas em\\n    // execucoes que consumiram milhoes — quase tudo entra por cache.\\n    input_total: input + cacheWrite + cacheRead,\\n    thinking: resultados.length ? num(usage.thinking_tokens) : null,\\n    cost_estimated_usd: result?.total_cost_usd ?? null,\\n    usage_by_model: result?.modelUsage ?? null,\\n  },\\n\\n  foundation,\\n\\n  // CONTROLE: o que o agente realmente recebeu. O conjunto de ferramentas NAO e\\n  // igual entre modelos, e como o modelo e o fator de bloco isso entra na H3.\\n  isolation_init: init\\n    ? {\\n        cwd: init.cwd ?? null,\\n        tools_available: init.tools ?? null,\\n        mcp_servers: init.mcp_servers ?? null,\\n        slash_commands: init.slash_commands ?? null,\\n        agents: init.agents ?? null,\\n        skills: init.skills ?? null,\\n        plugins: init.plugins ?? null,\\n      }\\n    : null,\\n\\n  invalid_jsonl_lines: linhasInvalidas,\\n};\\n\\nwriteFileSync(join(runDir, \\\"meta.json\\\"), JSON.stringify(meta, null, 2) + \\\"\\\\n\\\");\\n\\nconst spawned = num(meta.outcome.subagent_stats?.spawned);\\nconsole.log(\\n  `meta.json: ${termination}, turns=${meta.outcome.turns}, ` +\\n  `tools=${meta.outcome.tool_calls}, input_total=${meta.tokens.input_total}, ` +\\n  `output=${meta.tokens.output}, build_ok=${meta.outcome.build_ok}` +\\n  (spawned > 0 ? `  ** ${spawned} SUBAGENTE(S) **` : \\\"\\\")\\n);\\n\",\"rodada\":\"#!/usr/bin/env bash\\n# Roda uma rodada inteira: os tres modelos, nas duas condicoes, TODOS ao mesmo\\n# tempo. Seis execucoes em paralelo, seis containers.\\n#\\n# Uso:  infra/scripts/rodada.sh <prefixo> [replicate]\\n#       infra/scripts/rodada.sh SMOKE-01\\n#       infra/scripts/rodada.sh BATCH-01 1\\n#\\n# SIMULTANEO DE PROPOSITO, e este e o ponto mais importante do desenho.\\n#\\n# A analise compara PARES: cada execucao CONTROL contra a HARNESS que rodou no\\n# mesmo instante, no mesmo modelo. Isso cancela horario, fila e carga de\\n# servidor — que sao a maior fonte de variacao nao controlada. Rodar um agora e\\n# outro daqui a meia hora joga fora exatamente o que este script compra.\\n#\\n# Efeito colateral aceito: a duracao de RELOGIO fica contaminada pela disputa de\\n# CPU entre os seis containers. Por isso a medida limpa e `duration_api_ms`, e\\n# nao `duration_s`.\\n#\\n# O lote sao TRES rodadas:\\n#   rodada.sh BATCH-01 1\\n#   rodada.sh BATCH-02 2\\n#   rodada.sh BATCH-03 3\\n\\nset -uo pipefail\\n\\ncase $# in 1|2) ;; *) { echo \\\"uso: $0 <prefixo> [replicate]\\\" >&2; exit 2; } ;; esac\\nPREFIXO=\\\"$1\\\"; REPLICATE=\\\"${2:-}\\\"\\nRAIZ=\\\"$(cd \\\"$(dirname \\\"${BASH_SOURCE[0]}\\\")/../..\\\" && pwd -P)\\\"\\nEXEC=\\\"$RAIZ/infra/scripts/run-one.sh\\\"\\nEFFORT=\\\"${EFFORT:-medium}\\\"\\n\\n# Os tres modelos do bloco, sempre por ID COMPLETO. O apelido a esquerda e o que\\n# entra no run_id.\\n#\\n# ATENCAO: pede-se `claude-haiku-4-5` e as mensagens voltam com\\n# `claude-haiku-4-5-20251001`. Alias e snapshot datado sao o MESMO modelo — ver\\n# a normalizacao em extract-meta.mjs.\\nMODELOS=\\\"OPUS:claude-opus-5 SONNET:claude-sonnet-5 HAIKU:claude-haiku-4-5\\\"\\n\\nmkdir -p \\\"$RAIZ/runs/logs\\\"\\n\\n# Confere TODOS antes de lancar QUALQUER um: melhor falhar sem gastar cota do\\n# que descobrir na quarta execucao que a quinta ja existia.\\nfor m in $MODELOS; do\\n    for c in CONTROL HARNESS; do\\n        id=\\\"$PREFIXO-${m%%:*}-$c\\\"\\n        [ -e \\\"$RAIZ/runs/$id\\\" ] && { echo \\\"runs/$id ja existe\\\" >&2; exit 2; }\\n    done\\ndone\\n\\nprintf '\\\\033[36m=== rodada %s  |  effort=%s  |  6 execucoes em paralelo ===\\\\033[0m\\\\n' \\\"$PREFIXO\\\" \\\"$EFFORT\\\"\\nT0=\\\"$(date +%s)\\\"\\nPIDS=\\\"\\\"; IDS=\\\"\\\"\\n\\nfor m in $MODELOS; do\\n    apelido=\\\"${m%%:*}\\\"; modelo=\\\"${m#*:}\\\"\\n    for c in CONTROL HARNESS; do\\n        id=\\\"$PREFIXO-$apelido-$c\\\"\\n        EFFORT=\\\"$EFFORT\\\" NETWORK=\\\"${NETWORK:-}\\\" \\\"$EXEC\\\" \\\"$id\\\" \\\"$modelo\\\" \\\"$c\\\" ${REPLICATE:+\\\"$REPLICATE\\\"} \\\\\\n            > \\\"$RAIZ/runs/logs/$id.log\\\" 2>&1 &\\n        PIDS=\\\"$PIDS $!\\\"; IDS=\\\"$IDS $id\\\"\\n        echo \\\"  lancada: $id\\\"\\n    done\\ndone\\n\\necho \\\"aguardando as seis...\\\"\\nFALHAS=0\\nset -- $IDS\\nfor p in $PIDS; do\\n    wait \\\"$p\\\"; rc=$?\\n    printf '  %-32s codigo=%s\\\\n' \\\"$1\\\" \\\"$rc\\\"\\n    [ \\\"$rc\\\" -eq 0 ] || FALHAS=$((FALHAS + 1))\\n    shift\\ndone\\n\\nprintf '\\\\nrodada terminou em %ss  |  falhas: %s\\\\n' \\\"$(( $(date +%s) - T0 ))\\\" \\\"$FALHAS\\\"\\nfor id in $IDS; do\\n    [ -f \\\"$RAIZ/runs/$id/meta.json\\\" ] && printf '  %-32s %s\\\\n' \\\"$id\\\" \\\"$(tail -n 1 \\\"$RAIZ/runs/logs/$id.log\\\")\\\"\\ndone\\nexit \\\"$FALHAS\\\"\\n\",\"acceptance\":\"#!/usr/bin/env bash\\n# Roda a suite de aceitacao do Strategy em todas as execucoes de um lote, uma por\\n# vez, e grava o resultado de cada uma ao lado do build.txt dela.\\n#\\n# Uso:  infra/scripts/acceptance.sh <prefixo>\\n#       infra/scripts/acceptance.sh V4-STRATEGY-01\\n#\\n# Para cada runs/<prefixo>-*/: sobe o servico que o agente escreveu num container\\n# da imagem da bancada, SEM token e sem variavel de ambiente nenhuma (o\\n# evaluation/acceptance-prototype/executor.sh), roda os casos do strategy.mjs e\\n# grava runs/<id>/acceptance.txt. No fim, refaz analysis/acceptance-<prefixo>.csv\\n# a partir dos acceptance.txt do lote: uma linha por execucao.\\n#\\n# Tres garantias:\\n# - NUNCA mede duas vezes: execucao que ja tem acceptance.txt e pulada. Medir de\\n#   novo ate dar o resultado esperado e o que isso impede.\\n# - Cada resultado grava o hash da suite e o do enunciado da execucao, e a\\n#   execucao so e medida se o enunciado dela for o atual (o da suite). Uma\\n#   execucao de outro enunciado (a bancada, com imposto) e recusada; para ensaio,\\n#   ALLOW_PROMPT_MISMATCH=1 mede assim mesmo e registra a diferenca.\\n# - \\\"Nao compilou\\\", \\\"nao subiu\\\" e \\\"nao seguiu o
