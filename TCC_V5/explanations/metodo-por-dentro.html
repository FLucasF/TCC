<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O método por dentro</title>
<style>
:root {
  --bg: #f6f5f1; --bg2: #ffffff; --bg3: #efede6; --fg: #1d1f24; --muted: #646a73; --line: #dcd9cf;
  --accent: #2f5bd3; --accent-fg: #ffffff;
  --ok: #1d8a4e; --ok-bg: #d8f1e2; --bad: #c0392b; --bad-bg: #fbe0dc;
  --cand: #2f5bd3; --cand-bg: #dde6fb; --reg-bg: #ece3fb; --reg: #7b4bd1;
  --cur-bg: #fff3c4; --cur: #c99a00; --hit-bg: #ffe08a;
  --code-bg: #fbfaf7; --kw: #8a3ab9; --str: #1f7a3d; --com: #8a8f98; --num: #b5531a; --key: #2f5bd3;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;
    --accent: #7ea2ff; --accent-fg: #0f1115;
    --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;
    --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;
    --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;
    --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;
  --accent: #7ea2ff; --accent-fg: #0f1115;
  --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;
  --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;
  --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;
  --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; font-size: .9em; }
p code, li code, td code, .txt code { background: var(--bg3); padding: .05em .3em; border-radius: 4px; }
a { color: var(--accent); }
header.topo { padding: 18px 16px 6px; max-width: 1500px; margin: 0 auto; }
header.topo h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -.01em; }
header.topo p { margin: 0; color: var(--muted); font-size: 14px; }
nav.abas { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.abas .faixa { display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; max-width: 1500px; margin: 0 auto; scrollbar-width: thin; }
nav.abas button { flex: none; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
nav.abas button:hover { border-color: var(--accent); }
nav.abas button.ativa { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
main { max-width: 1500px; margin: 0 auto; padding: 14px 16px 60px; }
section.aba { display: none; }
section.aba.ativa { display: block; }
h2 { font-size: 19px; margin: 6px 0 8px; }
h3 { font-size: 15.5px; margin: 14px 0 6px; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 900px; }
.painel { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.grade2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.grade-lab { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1000px) { .grade2, .grade-lab { grid-template-columns: minmax(0, 1fr); } }
.pilha > * + * { margin-top: 12px; }
.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rotulo .dir { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* controles do passo a passo */
.controles { position: sticky; top: 49px; z-index: 10; display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 12px; box-shadow: var(--shadow); }
.controles button { border: 1px solid var(--line); background: var(--bg3); color: var(--fg); border-radius: 8px; min-width: 36px; height: 34px; font: inherit; cursor: pointer; }
.controles button:hover:not(:disabled) { border-color: var(--accent); }
.controles button:disabled { opacity: .4; cursor: default; }
.controles button.prox { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); padding: 0 14px; font-weight: 600; }
.controles .info { flex: 1; min-width: 0; }
.controles .info .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controles .info .n { font-size: 12px; color: var(--muted); }
.controles .barra { height: 3px; background: var(--bg3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.controles .barra i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.controles .dica { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 700px) { .controles .dica { display: none; } }

/* codigo */
.codigo { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.55; overflow: auto; max-height: 62vh; }
.codigo.baixo { max-height: 40vh; }
.codigo .cab { position: sticky; top: 0; z-index: 2; background: var(--bg3); border-bottom: 1px solid var(--line); padding: 4px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.codigo .cab b { color: var(--fg); font-weight: 600; }
.codigo .corpo { min-width: max-content; padding: 4px 0; }
.ln { display: flex; position: relative; padding-right: 12px; }
.ln .num { flex: none; width: 3.4em; text-align: right; padding-right: .9em; color: var(--muted); user-select: none; opacity: .7; }
.ln .src { white-space: pre; flex: none; }
.ln .nota { flex: none; margin-left: 14px; font-family: system-ui, sans-serif; font-size: 11.5px; padding: 0 7px; border-radius: 999px; align-self: center; white-space: nowrap; }
.ln .nota.ok { background: var(--ok-bg); color: var(--ok); }
.ln .nota.fora { background: var(--bad-bg); color: var(--bad); }
.ln .nota.cand { background: var(--cand-bg); color: var(--cand); }
.ln .nota.reg { background: var(--reg-bg); color: var(--reg); }
.ln.atual { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }
.ln.regiao { background: var(--reg-bg); box-shadow: inset 3px 0 0 var(--reg); }
.ln.erro { background: var(--bad-bg); box-shadow: inset 3px 0 0 var(--bad); }
.ln.apagada .src { opacity: .45; }
.ln.feita .num { color: var(--ok); opacity: 1; }
.s-kw { color: var(--kw); } .s-str { color: var(--str); } .s-com { color: var(--com); font-style: italic; } .s-num { color: var(--num); } .s-key { color: var(--key); }
.m-cand { background: var(--cand-bg); outline: 1px solid var(--cand); border-radius: 2px; }
.m-ok { background: var(--ok-bg); outline: 1px solid var(--ok); border-radius: 2px; }
.m-fora { background: var(--bad-bg); text-decoration: line-through; text-decoration-color: var(--bad); border-radius: 2px; }
.m-hit { background: var(--hit-bg); border-radius: 2px; }
.m-hitsel { background: var(--hit-bg); outline: 2px solid var(--cur); border-radius: 2px; }
.m-erro { text-decoration: underline wavy var(--bad); }

/* explicacao */
.passo-t { font-size: 17px; font-weight: 650; margin: 0 0 6px; }
.txt p { margin: 0 0 9px; }
.txt ul, .txt ol { margin: 0 0 9px; padding-left: 20px; }
.txt li { margin: 2px 0; }
.caixa { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); margin-top: 10px; }
.caixa.aconteceu { border-left: 4px solid var(--cur); }
.caixa.aconteceu .rotulo { color: var(--cur); }
.caixa.aviso { border-left: 4px solid var(--bad); }
.caixa.certo { border-left: 4px solid var(--ok); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.t td.mono, table.t td code { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12px; word-break: break-all; }
.sim { color: var(--ok); font-weight: 700; } .nao { color: var(--bad); font-weight: 700; }
.tabela-rolagem { max-height: 340px; overflow: auto; }
.estado td:first-child { white-space: nowrap; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--bg3); color: var(--muted); border: 1px solid var(--line); }
.pill.java { color: var(--kw); } .pill.texto { color: var(--str); }
input[type=text], textarea, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
textarea { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.5; min-height: 180px; resize: vertical; }
button.b { border: 1px solid var(--line); background: var(--bg3); color: var(--fg); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
button.b:hover { border-color: var(--accent); }
button.b.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.quiz { border: 1px dashed var(--accent); border-radius: 10px; padding: 9px 11px; margin-top: 10px; background: var(--bg); }
.quiz .q { font-weight: 600; margin-bottom: 6px; }
.quiz .r { margin-top: 8px; display: none; }
.quiz.respondida .r { display: block; }
.quiz button.certa { background: var(--ok-bg); border-color: var(--ok); }
.quiz button.errada { background: var(--bad-bg); border-color: var(--bad); }
.lista-regras { display: flex; flex-direction: column; gap: 3px; max-height: 75vh; overflow: auto; }
.lista-regras .grupo { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 2px; }
.lista-regras button { text-align: left; border: 1px solid transparent; background: none; color: var(--fg); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.lista-regras button:hover { background: var(--bg3); }
.lista-regras button.ativa { background: var(--cand-bg); border-color: var(--cand); }
@media (max-width: 1000px) { .lista-regras { flex-direction: row; flex-wrap: wrap; max-height: none; } .lista-regras .grupo { width: 100%; } }
.arvore { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; }
.arvore div { white-space: pre; padding: 0 6px; border-radius: 4px; }
.arvore .foco { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }
.arvore .ign { color: var(--muted); text-decoration: line-through; }
.arvore .cop { color: var(--ok); font-weight: 600; }
.arvore .fora { color: var(--bad); }
.arvore .proj { background: var(--ok-bg); }
.tag { display: inline-block; font-family: system-ui, sans-serif; font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 6px; background: var(--bg3); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.fora { background: var(--bad-bg); color: var(--bad); } .tag.cand { background: var(--cand-bg); color: var(--cand); } .tag.reg { background: var(--reg-bg); color: var(--reg); }
.fita { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 300px; overflow: auto; }
.fita .codigo-k { color: var(--fg); } .fita .texto-k { color: var(--str); background: rgba(31,122,61,.08); }
.fita .com-k { color: var(--bad); text-decoration: line-through; background: var(--bad-bg); }
.fita .atual-k { outline: 2px solid var(--cur); border-radius: 3px; }
.fita .depois { opacity: .45; }
.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.no { border: 1px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: var(--fg); box-shadow: var(--shadow); }
.no:hover { border-color: var(--accent); }
.no b { display: block; font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }
.no span { font-size: 13px; color: var(--muted); }
.no.etapa1 { border-top: 4px solid var(--cand); } .no.etapa2 { border-top: 4px solid var(--reg); } .no.prep { border-top: 4px solid var(--cur); }
.seta { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }
.trilha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.trilha .x { background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
.ped { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; word-break: break-all; }
tr.cab-ramo td { color: var(--muted); font-style: italic; font-size: 12px; background: var(--bg3); }
tr.nao-part td { opacity: .5; }
.cadeado { font-size: 42px; line-height: 1; }
details.r { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg2); margin: 8px 0; }
details.r summary { cursor: pointer; font-weight: 600; }
details.r[open] summary { margin-bottom: 6px; }
.verif { font-size: 13px; }
.verif li { margin: 3px 0; }
.mini { font-size: 12.5px; color: var(--muted); }
kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg2); }
.tema { position: absolute; top: 16px; right: 16px; }
header.topo { position: relative; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.form-grid label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
table.t input[type=text], table.t input[type=number] { padding: 3px 5px; font-size: 12.5px; }
input[type=number] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
input[type=range] { width: 100%; }
.big { font-size: 26px; font-weight: 700; }
.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lane { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--bg); font-size: 12.5px; }
.lane b { display: block; }
.lane .barra2 { height: 8px; border-radius: 4px; background: var(--bg3); margin-top: 6px; overflow: hidden; }
.lane .barra2 i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.chip { display: inline-block; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--line); margin: 2px; }
.chip.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.chip.off { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.tl { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; cursor: pointer; }
.tl-item .bola { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--bg3); border: 2px solid var(--line); margin: 6px auto 0; }
.tl-item.feito .bola { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.tl-item.pendente .bola { background: var(--cur-bg); border-color: var(--cur); color: var(--cur); }
.tl-item .fio { grid-column: 1; width: 2px; background: var(--line); margin: 0 auto; min-height: 12px; }
.tl-item .cx { padding: 6px 10px; border-radius: 10px; border: 1px solid transparent; }
.tl-item:hover .cx { background: var(--bg3); }
.tl-item.sel .cx { background: var(--cand-bg); border-color: var(--cand); }
.tl-item .cx b { display: block; }
.tl-item .cx span { font-size: 13px; color: var(--muted); }
.filtros { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.hcard { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg2); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.hcard .nm { font-weight: 650; }
.hcard .meta { display: flex; flex-wrap: wrap; gap: 4px; }
.v-apoiada { color: var(--ok); font-weight: 700; } .v-contrariada { color: var(--bad); font-weight: 700; } .v-inconclusiva { color: var(--cur); font-weight: 700; } .v-descritiva { color: var(--muted); font-weight: 700; }
.histo { display: flex; align-items: flex-end; gap: 1px; height: 160px; border-bottom: 1px solid var(--line); }
.histo i { flex: 1; background: var(--cand); opacity: .55; min-height: 1px; }
.histo i.fora { background: var(--bad); opacity: .85; }
.tl-item.naofeito .bola { background: var(--bg3); border-color: var(--muted); color: var(--muted); text-decoration: line-through; }

</style>
</head>
<body>
<header class="topo">
  <h1>O método por dentro</h1>
  <p>A parte da pesquisa: a pergunta, a sequência de verificação, as hipóteses e as regras que decidem cada uma.</p>
  <button class="b tema" type="button">tema</button>
</header>
<nav class="abas" aria-label="abas"><div class="faixa"></div></nav>
<main></main>
<script>
window.DADOS = {"hipotesesSrc":"// As tabelas e o veredito de cada hipotese do OBJETIVO (secao 4), pelas regras de\n// leitura do secao 4.1, escritas aqui ANTES dos dados (09/10). Com o script congelado,\n// a analise do V4 e so rodar: nenhuma escolha (qual par conta, o que e \"melhor\", quem\n// esta no teto) fica para depois de ver os resultados.\n//\n// Uso (da raiz do TCC):\n//   node evaluation/tools/hipoteses.mjs <desenho.json> --semgrep S.csv [--mapa M.csv]\n//        --aceitacao A.csv --metricas X.csv --resultados R.csv\n//        [--conferencia C.md] [--exploratorio] [--json saida.json] [--raiz DIR]\n//   (o relatorio em markdown sai no stdout)\n//\n// COMO LER. Quatro partes:\n//   1. junta, por execucao, o que cada instrumento mediu: o Semgrep (pelo codigo cego e\n//      o mapa), a suite, as metricas, o custo e o meta.json (se usou a skill, o revisor);\n//   2. MEDIDAS: transforma isso nos numeros que as hipoteses comparam (o P4 certo ou\n//      nao, os pontos da suite, a complexidade cognitiva, os tokens...);\n//   3. HIPOTESES: a lista, cada uma com a medida, os dois niveis comparados (N1 x N0,\n//      N2 x N1 ou N3 x N2), o tipo de regra e o que e \"melhor\";\n//   4. as REGRAS do secao 4.1, uma funcao por tipo, e o relatorio.\n//\n// Um PAR e o mesmo modelo e a mesma replica em dois niveis vizinhos (55 por comparacao no V5: 11 modelos x 5 replicas).\n// Tres escolhas que o OBJETIVO nao fazia, decididas aqui antes dos dados (DECISOES.md):\n//   - um par com \"indeterminado\" (ou sem medida) sai da conta como \"sem dado\", e e contado;\n//   - o saldo maximo da nao-inferioridade e 13% dos pares, arredondado (7 em 55, 3 em 25, 2 em 15,\n//     a mesma proporcao que o OBJETIVO usa para justificar o 3);\n//   - na hipotese do modelo, se dois modelos empatam como o mais fraco, ela e apoiada se\n//     o maior saldo, sem empate, for de um deles.\n// Com --conferencia (a saida do compare.mjs), as hipoteses que dependem de uma pergunta\n// reprovada (abaixo de 90%: 40 de 44 no V5) viram \"descritiva\". Com --exploratorio, nenhuma\n// hipotese tem veredito: o lote so descreve.\n\nimport { readFileSync, writeFileSync, existsSync } from \"node:fs\";\nimport { join, resolve } from \"node:path\";\n\n// ------------------------------------------------------------------ argumentos e leitura\nconst args = process.argv.slice(2);\nconst COM_VALOR = [\"--semgrep\", \"--mapa\", \"--aceitacao\", \"--metricas\", \"--resultados\", \"--conferencia\", \"--json\", \"--raiz\"];\nconst opt = (n) => { const i = args.indexOf(`--${n}`); return i >= 0 ? args[i + 1] : null; };\nconst [arqDesenho] = args.filter((a, i, l) => !a.startsWith(\"--\") && !COM_VALOR.includes(l[i - 1]));\nconst morrer = (m) => { console.error(`ERRO: ${m}`); process.exit(2); };\nif (!arqDesenho) morrer(\"uso: hipoteses.mjs <desenho.json> --semgrep S.csv [--mapa M.csv] --aceitacao A.csv --metricas X.csv --resultados R.csv\");\nfor (const o of [\"semgrep\", \"aceitacao\", \"metricas\", \"resultados\"]) if (!opt(o)) morrer(`falta --${o}`);\nconst RAIZ = resolve(opt(\"raiz\") ?? \".\");\nconst EXPLORATORIO = args.includes(\"--exploratorio\");\n\n// CSV com aspas (nunca split(\",\")).\nfunction lerCsv(arq) {\n  const t = readFileSync(arq, \"utf8\").replace(/^﻿/, \"\");\n  const linhas = []; let campo = \"\", linha = [], aspas = false;\n  for (let i = 0; i < t.length; i++) {\n    const c = t[i];\n    if (aspas) { if (c === '\"' && t[i + 1] === '\"') { campo += '\"'; i++; } else if (c === '\"') aspas = false; else campo += c; }\n    else if (c === '\"') aspas = true;\n    else if (c === \",\") { linha.push(campo); campo = \"\"; }\n    else if (c === \"\\n\" || c === \"\\r\") { if (c === \"\\r\" && t[i + 1] === \"\\n\") i++; linha.push(campo); campo = \"\"; if (linha.some((v) => v !== \"\")) linhas.push(linha); linha = []; }\n    else campo += c;\n  }\n  linha.push(campo); if (linha.some((v) => v !== \"\")) linhas.push(linha);\n  const uteis = linhas.filter((l) => !l[0].startsWith(\"#\"));\n  const [cab, ...corpo] = uteis;\n  return corpo.map((l) => Object.fromEntries(cab.map((n, i) => [n, (l[i] ?? \"\").trim()])));\n}\nconst porChave = (linhas, chave) => new Map(linhas.map((l) => [l[chave], l]));\n\nconst D = JSON.parse(readFileSync(resolve(RAIZ, arqDesenho), \"utf8\"));\nif (!D.modelos) morrer(\"o desenho nao tem modelos\");\nconst NIVEIS = Object.keys(D.niveis);\nconst MODELOS = Object.keys(D.modelos);\nconst rep = (r) => String(r).padStart(2, \"0\");\nconst runId = (r, m, n) => `${D.prefixo}-${rep(r)}-${m}-${n}`;\n\nconst semgrep = lerCsv(resolve(RAIZ, opt(\"semgrep\")));\nconst mapa = opt(\"mapa\") ? porChave(lerCsv(resolve(RAIZ, opt(\"mapa\"))), \"run_id\") : new Map();\nconst semPorPacote = porChave(semgrep, \"pacote\");\nconst aceitacao = porChave(lerCsv(resolve(RAIZ, opt(\"aceitacao\"))), \"run_id\");\nconst metricas = porChave(lerCsv(resolve(RAIZ, opt(\"metricas\"))), \"run_id\");\nconst resultados = porChave(lerCsv(resolve(RAIZ, opt(\"resultados\"))), \"run_id\");\n\n// As perguntas que a conferencia reprovou (linhas \"| P4_localizacao | 16 de 20 | vira **descritiva** |\").\nconst reprovadas = new Set();\nif (opt(\"conferencia\")) for (const l of readFileSync(resolve(RAIZ, opt(\"conferencia\")), \"utf8\").split(/\\r?\\n/)) {\n  const m = l.match(/^\\|\\s*(P\\d_\\w+)\\s*\\|.*descritiva/); if (m) reprovadas.add(m[1]);\n}\n\n// ------------------------------------------------------------------ 2. medidas\n// Os 9 casos de borda da suite (secao 4.4): fronteiras, precedencia entre erros e a colisao.\nconst BORDA = [\n  \"OURO + FRETEGRATIS + cartao 10x\",\n  \"precedencia: nivel antes de regiao\", \"precedencia: regiao antes de modalidade\",\n  \"precedencia: cupom antes de pagamento\", \"precedencia: pedido invalido primeiro\",\n  \"fronteira: motoboy com 5 kg exatos\", \"fronteira: OURO com produtos em 500,00 exatos\",\n  \"fronteira: MENOS50 com produtos em 300,00 exatos\", \"fronteira: boleto com 1000,00 exatos\",\n];\nconst TRAVA = new Set([\"no_pom\", \"build_failed\", \"app_did_not_start\"]);\nconst num = (v) => (v === undefined || v === null || v === \"\" || isNaN(Number(v)) ? null : Number(v));\nconst acerto = (s, p) => {\n  const loc = s?.[`${p}_localizacao`], sel = s?.[`${p}_selecao`];\n  if (!loc || !sel || loc === \"indeterminado\" || sel === \"indeterminado\") return null;\n  return loc === \"isolado\" && (sel === \"consulta\" || sel === \"condicional-unica\") ? 1 : 0;\n};\n\nconst execucoes = new Map(); // run_id -> { modelo, replica, nivel, m: {medidas} }\nconst faltas = [];\nfor (let r = 1; r <= D.replicas; r++) for (const mo of MODELOS) for (const n of NIVEIS) {\n  const id = runId(r, mo, n);\n  const s = semPorPacote.get(mapa.get(id)?.blind_code ?? id);\n  const a = aceitacao.get(id), x = metricas.get(id), q = resultados.get(id);\n  if (!s || !a || !x || !q) faltas.push(`${id}: ${[!s && \"Semgrep\", !a && \"suite\", !x && \"metricas\", !q && \"resultados\"].filter(Boolean).join(\", \")}`);\n  const travado = TRAVA.has(a?.status);\n  const pontos = (k) => (a ? (travado ? 0 : num(a[k])) : null);\n  let borda = null;\n  const accTxt = join(RAIZ, \"runs\", id, \"acceptance.txt\");\n  if (a && travado) borda = 0;\n  else if (existsSync(accTxt)) {\n    const falhas = readFileSync(accTxt, \"utf8\").split(/\\r?\\n/).filter((l) => /^\\s*FALHA /.test(l)).map((l) => l.replace(/^\\s*FALHA /, \"\"));\n    borda = BORDA.filter((c) => !falhas.some((f) => f.startsWith(c + \":\") || f.startsWith(c + \" \"))).length;\n  }\n  let meta = null;\n  const arqMeta = join(RAIZ, \"runs\", id, \"meta.json\");\n  if (existsSync(arqMeta)) meta = JSON.parse(readFileSync(arqMeta, \"utf8\"));\n  const p13 = [\"P1\", \"P2\", \"P3\"].map((p) => acerto(s, p));\n  execucoes.set(id, {\n    modelo: mo, replica: r, nivel: n, perfil: s ? [\"P1\", \"P2\", \"P3\", \"P4\"].flatMap((p) => [s[`${p}_localizacao`], s[`${p}_selecao`]]).concat(s.P5_proporcao).join(\"|\") : null,\n    m: {\n      p4_acerto: acerto(s, \"P4\"),\n      p1p3_acertos: p13.some((v) => v === null) ? null : p13.reduce((x, y) => x + y, 0),\n      p5_exagero: !s?.P5_proporcao || s.P5_proporcao === \"indeterminado\" ? null : s.P5_proporcao === \"estrutura\" ? 1 : 0,\n      pontos: pontos(\"pontos\"), contas: pontos(\"contas\"), recusas: pontos(\"recusas\"),\n      build_ok: a ? (travado ? 0 : 1) : null,\n      borda,\n      cognitiva: num(x?.sonar_cognitive_complexity), smells: num(x?.sonar_code_smells),\n      duplicacao: num(x?.sonar_duplicated_lines_density),\n      classes: num(x?.sonar_classes), cbo: num(x?.ck_cbo_media), lcom: num(x?.ck_lcom_media),\n      tokens: num(q?.input_total), tempo: num(q?.duration_api_ms), turnos: num(q?.turns),\n      usou_skill: meta ? ((meta.outcome?.tool_calls_by_name?.Skill ?? 0) > 0 ? 1 : 0) : null,\n      usou_revisor: meta ? ((meta.outcome?.subagents_spawned ?? 0) > 0 ? 1 : 0) : null,\n    },\n  });\n}\n\n// ------------------------------------------------------------------ 3. hipoteses\n// tipo: direcional | nao-inferioridade | sem-direcao-continua | sem-direcao-binaria\n// melhor: \"mais\" ou \"menos\" (o que conta como melhor no nivel de cima)\n// teto: o valor que, no nivel de baixo nas 5 replicas, deixa o modelo sem espaco para\n// melhorar (so nas direcionais de medida limitada; null nas continuas)\n// depende: as perguntas da conferencia de que o veredito depende\nconst H = [\n  { nome: \"Desenho: isola cada caso no P4\", principal: true, medida: \"p4_acerto\", par: [\"N0\", \"N1\"], tipo: \"direcional\", melhor: \"mais\", teto: 1, depende: [\"P4_localizacao\", \"P4_selecao\"] },\n  { nome: \"Exagero: aplica onde nao pede\", principal: true, medida: \"p5_exagero\", par: [\"N0\", \"N1\"], tipo: \"sem-direcao-binaria\", depende: [\"P5_proporcao\"] },\n  { nome: \"Correcao: suite inteira\", principal: true, medida: \"pontos\", par: [\"N0\", \"N1\"], tipo: \"nao-inferioridade\", melhor: \"mais\" },\n  { nome: \"Qualidade: menos complexidade\", principal: true, medida: \"cognitiva\", par: [\"N0\", \"N1\"], tipo: \"direcional\", melhor: \"menos\", teto: null },\n  { nome: \"Modelo: efeito maior no mais fraco\", principal: true, tipo: \"modelo\", depende: [\"P4_localizacao\", \"P4_selecao\"] },\n\n  { nome: \"Desenho: isola cada caso no P1 a P3\", medida: \"p1p3_acertos\", par: [\"N0\", \"N1\"], tipo: \"direcional\", melhor: \"mais\", teto: 3 },\n  { nome: \"Desenho: nao repete o comum\", medida: \"duplicacao\", par: [\"N0\", \"N1\"], tipo: \"direcional\", melhor: \"menos\", teto: null },\n  { nome: \"Desenho: replicas mais parecidas\", tipo: \"descritiva-replicas\", par: [\"N0\", \"N1\"] },\n  { nome: \"Exagero: mais arquivos\", medida: \"classes\", par: [\"N0\", \"N1\"], tipo: \"direcional\", melhor: \"mais\", teto: null },\n  { nome: \"Exagero: estrutura especulativa (CBO)\", medida: \"cbo\", par: [\"N0\", \"N1\"], tipo: \"sem-direcao-continua\" },\n  { nome: \"Exagero: estrutura especulativa (LCOM)\", medida: \"lcom\", par: [\"N0\", \"N1\"], tipo: \"sem-direcao-continua\" },\n  { nome: \"Correcao: contas\", medida: \"contas\", par: [\"N0\", \"N1\"], tipo: \"nao-inferioridade\", melhor: \"mais\" },\n  { nome: \"Correcao: recusas\", medida: \"recusas\", par: [\"N0\", \"N1\"], tipo: \"nao-inferioridade\", melhor: \"mais\" },\n  { nome: \"Correcao: nao quebra o build\", medida: \"build_ok\", par: [\"N0\", \"N1\"], tipo: \"nao-inferioridade\", melhor: \"mais\" },\n  { nome: \"Correcao: casos de borda\", medida: \"borda\", par: [\"N0\", \"N1\"], tipo: \"nao-inferioridade\", melhor: \"mais\" },\n  { nome: \"Qualidade: menos code smells\", medida: \"smells\", par: [\"N0\", \"N1\"], tipo: \"direcional\", melhor: \"menos\", teto: null },\n  { nome: \"Custo: tokens de entrada\", medida: \"tokens\", par: [\"N0\", \"N1\"], tipo: \"sem-direcao-continua\" },\n  { nome: \"Custo: tempo de API\", medida: \"tempo\", par: [\"N0\", \"N1\"], tipo: \"sem-direcao-continua\" },\n  { nome: \"Custo: processo de trabalho (turnos)\", medida: \"turnos\", par: [\"N0\", \"N1\"], tipo: \"sem-direcao-continua\" },\n  { nome: \"Custo: sinal muda por modelo\", medida: \"tokens\", par: [\"N0\", \"N1\"], tipo: \"descritiva-sinal\" },\n  { nome: \"Modelo: no teto, nao piora (desenho)\", medida: \"p4_acerto\", par: [\"N0\", \"N1\"], tipo: \"nao-inferioridade\", melhor: \"mais\", soNoTeto: { medida: \"p4_acerto\", teto: 1 }, depende: [\"P4_localizacao\", \"P4_selecao\"] },\n  { nome: \"Modelo: no teto, nao piora (correcao)\", medida: \"pontos\", par: [\"N0\", \"N1\"], tipo: \"nao-inferioridade\", melhor: \"mais\", soNoTeto: { medida: \"p4_acerto\", teto: 1 } },\n  { nome: \"Skills: mais efeito no desenho\", medida: \"p4_acerto\", par: [\"N1\", \"N2\"], tipo: \"direcional\", melhor: \"mais\", teto: 1, depende: [\"P4_localizacao\", \"P4_selecao\"] },\n  { nome: \"Skills: mais custo (tokens)\", medida: \"tokens\", par: [\"N1\", \"N2\"], tipo: \"direcional\", melhor: \"mais\", teto: null },\n  { nome: \"Skills: mudam o exagero\", medida: \"p5_exagero\", par: [\"N1\", \"N2\"], tipo: \"sem-direcao-binaria\", depende: [\"P5_proporcao\"] },\n  { nome: \"Skills: so valem se carregadas\", medida: \"usou_skill\", nivel: \"N2\", tipo: \"descritiva-uso\" },\n  { nome: \"Processo: corrige mais\", medida: \"pontos\", par: [\"N2\", \"N3\"], tipo: \"direcional\", melhor: \"mais\", teto: 21 },\n  { nome: \"Processo: mais efeito no desenho\", medida: \"p4_acerto\", par: [\"N2\", \"N3\"], tipo: \"direcional\", melhor: \"mais\", teto: 1, depende: [\"P4_localizacao\", \"P4_selecao\"] },\n  { nome: \"Processo: menos exagero\", medida: \"p5_exagero\", par: [\"N2\", \"N3\"], tipo: \"direcional\", melhor: \"menos\", teto: 0, depende: [\"P5_proporcao\"] },\n  { nome: \"Processo: mais custo (tokens)\", medida: \"tokens\", par: [\"N2\", \"N3\"], tipo: \"direcional\", melhor: \"mais\", teto: null },\n  { nome: \"Processo: mais custo (tempo)\", medida: \"tempo\", par: [\"N2\", \"N3\"], tipo: \"direcional\", melhor: \"mais\", teto: null },\n  { nome: \"Processo: so vale se usado\", medida: \"usou_revisor\", nivel: \"N3\", tipo: \"descritiva-uso\" },\n];\n\n// ------------------------------------------------------------------ 4. as regras do secao 4.1\nconst C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };\nconst caudaDupla = (n, k) => { let s = 0; for (let i = k; i <= n; i++) s += C(n, i); return Math.min(1, 2 * s / 2 ** n); };\n// Menor k (do lado maior) com a chance por sorte, nos dois lados, ate o limite.\nconst minimoSinal = (n, limite) => { for (let k = Math.floor(n / 2) + 1; k <= n; k++) if (caudaDupla(n, k) <= limite) return k; return Infinity; };\nconst limiteSaldo = (n) => Math.round(0.13 * n);\n\nconst valor = (r, mo, n, medida) => execucoes.get(runId(r, mo, n))?.m[medida] ?? null;\n// Os pares de uma comparacao, por modelo: \"melhor\", \"pior\", \"igual\" ou \"sem dado\".\nfunction pares(h, modelos = MODELOS) {\n  const [baixo, cima] = h.par;\n  const porModelo = {};\n  for (const mo of modelos) {\n    const l = (porModelo[mo] = { melhor: 0, pior: 0, igual: 0, semDado: 0, sobe: 0, desce: 0 });\n    for (let r = 1; r <= D.replicas; r++) {\n      const b = valor(r, mo, baixo, h.medida), c = valor(r, mo, cima, h.medida);\n      if (b === null || c === null) { l.semDado++; continue; }\n      if (c === b) { l.igual++; continue; }\n      c > b ? l.sobe++ : l.desce++;\n      const melhorou = h.melhor === \"menos\" ? c < b : c > b;\n      melhorou ? l.melhor++ : l.pior++;\n    }\n  }\n  return porModelo;\n}\nconst soma = (pm, k) => Object.values(pm).reduce((s, l) => s + l[k], 0);\n// No teto: o nivel de baixo ja tem o melhor valor possivel nas 5 replicas.\nconst noTeto = (mo, nivel, medida, teto) => teto !== null && teto !== undefined &&\n  Array.from({ length: D.replicas }, (_, i) => valor(i + 1, mo, nivel, medida)).every((v) => v === teto);\n\nfunction veredito(h) {\n  if (h.tipo === \"direcional\") {\n    const pm = pares(h);\n    const fora = MODELOS.filter((mo) => !noTeto(mo, h.par[0], h.medida, h.teto));\n    let v;\n    if (!(soma(pm, \"melhor\") + soma(pm, \"pior\") + soma(pm, \"igual\"))) v = \"sem dado\";\n    else if (!fora.length) v = \"sem espaco para efeito (todos no teto)\";\n    else {\n      const apoiam = fora.filter((mo) => pm[mo].melhor > pm[mo].pior).length;\n      const contrariam = fora.filter((mo) => pm[mo].pior > pm[mo].melhor).length;\n      const algumPiora = MODELOS.some((mo) => pm[mo].pior > pm[mo].melhor);\n      v = apoiam > fora.length / 2 && !algumPiora ? \"apoiada\" : contrariam > fora.length / 2 ? \"contrariada\" : \"inconclusiva\";\n    }\n    return { v, pm, fora, regra: `maioria dos ${fora.length} modelo(s) fora do teto com mais pares melhores que piores, e nenhum modelo com mais piores` };\n  }\n  if (h.tipo === \"nao-inferioridade\") {\n    const mods = h.soNoTeto ? MODELOS.filter((mo) => noTeto(mo, h.par[0], h.soNoTeto.medida, h.soNoTeto.teto)) : MODELOS;\n    if (!mods.length) return { v: \"sem modelo no teto\", pm: {}, regra: \"\" };\n    const pm = pares(h, mods);\n    const n = soma(pm, \"melhor\") + soma(pm, \"pior\") + soma(pm, \"igual\");\n    if (!n) return { v: \"sem dado\", pm, regra: \"nenhum par com as duas medidas\" };\n    const saldo = soma(pm, \"pior\") - soma(pm, \"melhor\");\n    const lim = limiteSaldo(n);\n    return { v: saldo <= lim ? \"apoiada\" : \"contrariada\", pm, regra: `saldo (piores - melhores) = ${saldo}, limite ${lim} (13% de ${n} pares)` };\n  }\n  if (h.tipo === \"sem-direcao-continua\") {\n    const pm = pares(h);\n    const n = soma(pm, \"melhor\") + soma(pm, \"pior\") + soma(pm, \"igual\");\n    if (!n) return { v: \"sem dado\", pm, regra: \"nenhum par com as duas medidas\" };\n    const maior = Math.max(soma(pm, \"sobe\"), soma(pm, \"desce\"));\n    const k = minimoSinal(n, 0.05);\n    const v = maior >= k ? \"apoiada (altera)\" : maior <= Math.floor(0.6 * n) ? \"contrariada\" : \"inconclusiva\";\n    return { v, pm, regra: `lado maior ${maior} de ${n} pares; apoiada com ${k} ou mais, contrariada com ${Math.floor(0.6 * n)} ou menos` };\n  }\n  if (h.tipo === \"sem-direcao-binaria\") {\n    const pm = pares(h);\n    if (!(soma(pm, \"melhor\") + soma(pm, \"pior\") + soma(pm, \"igual\"))) return { v: \"sem dado\", pm, regra: \"nenhum par com as duas medidas\" };\n    const sobe = soma(pm, \"sobe\"), desce = soma(pm, \"desce\"), d = sobe + desce;\n    const maior = Math.max(sobe, desce), menor = Math.min(sobe, desce);\n    const k = minimoSinal(d, 0.063);\n    const v = d >= 5 && maior >= k ? \"apoiada (altera)\" : d <= 2 || menor >= d / 3 ? \"contrariada\" : \"inconclusiva\";\n    return { v, pm, regra: `${d} par(es) nao empatado(s) (${sobe} sobem, ${desce} descem); com ${d}, o lado maior precisa de ${isFinite(k) ? k : \"-\"}` };\n  }\n  if (h.tipo === \"modelo\") {\n    const base = H[0];\n    const pm = pares(base);\n    const mediaN0 = Object.fromEntries(MODELOS.map((mo) => {\n      const vs = Array.from({ length: D.replicas }, (_, i) => valor(i + 1, mo, \"N0\", base.medida)).filter((v) => v !== null);\n      return [mo, vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null];\n    }));\n    const menor = Math.min(...Object.values(mediaN0).filter((v) => v !== null));\n    const fracos = MODELOS.filter((mo) => mediaN0[mo] === menor);\n    const saldo = Object.fromEntries(MODELOS.map((mo) => [mo, pm[mo].melhor - pm[mo].pior]));\n    const max = Math.max(...Object.values(saldo));\n    const noMax = MODELOS.filter((mo) => saldo[mo] === max);\n    const v = noMax.length > 1 ? \"inconclusiva (empate no maior saldo)\" : fracos.includes(noMax[0]) ? \"apoiada\" : \"contrariada\";\n    return { v, pm, regra: `mais fraco(s) no N0: ${fracos.join(\", \")} (acerto medio ${menor.toFixed(2)}); maior saldo: ${noMax.join(\", \")} (${max})`, extra: { mediaN0, saldo } };\n  }\n  return null;\n}\n\n// ------------------------------------------------------------------ o relatorio\nconst out = [];\nconst linhaTabela = (mo, l, teto) =>       if (c === "$") { const m = linha.slice(i).match(/^\$(\{[^}]*\}|\w+|#|@|\?)/); if (m) { push(i, i + m[0].length, "s-key"); i += m[0].length; continue; } }
      if (/[A-Za-z_]/.test(c)) { let j = i; while (j < n && /[\w-]/.test(linha[j])) j++; if (KW.bash.has(linha.slice(i, j))) push(i, j, "s-kw"); i = j; continue; }
      i++;
    }
    return t;
  }
  const kw = KW[lang] || KW.java;
  while (i < n) {
    if (st.bloco) { const f = linha.indexOf("*/", i); const ate = f < 0 ? n : f + 2; push(i, ate, "s-com"); if (f >= 0) st.bloco = false; i = ate; continue; }
    if (st.texto) { const f = linha.indexOf('"""', i); const ate = f < 0 ? n : f + 3; push(i, ate, "s-str"); if (f >= 0) st.texto = false; i = ate; continue; }
    const c = linha[i], d = linha[i + 1];
    if (c === "/" && d === "/") { push(i, n, "s-com"); break; }
    if (c === "/" && d === "*") { st.bloco = true; continue; }
    if (c === '"' && linha.startsWith('"""', i)) { st.texto = true; push(i, i + 3, "s-str"); i += 3; continue; }
    if (c === '"' || c === "'" || (c === "`" && lang === "js")) { let j = i + 1; while (j < n && linha[j] !== c) j += linha[j] === "\\" ? 2 : 1; push(i, Math.min(j + 1, n), "s-str"); i = j + 1; continue; }
    if (/[A-Za-z_$]/.test(c)) { let j = i; while (j < n && /[\w$]/.test(linha[j])) j++; if (kw.has(linha.slice(i, j))) push(i, j, "s-kw"); i = j; continue; }
    if (/\d/.test(c)) { let j = i; while (j < n && /[\d._]/.test(linha[j])) j++; push(i, j, "s-num"); i = j; continue; }
    i++;
  }
  return t;
}

// ---------- o visor de codigo ----------
// atual: [[a,b], ...] faixas de linhas (1 = primeira); marcas: [{l1,c1,l2,c2,cls}] (colunas do Semgrep: 1 = primeira, c2 exclusiva)
// linhas: {n: "regiao erro ..."}; notas: {n: {txt, cls}}
function codigo(o) {
  const texto = o.texto.replace(/\n$/, "");
  const ls = texto.split("\n");
  const ini = o.inicio || 1;
  const caixa = el("div", { class: "codigo" + (o.baixo ? " baixo" : "") });
  if (o.titulo) caixa.append(el("div", { class: "cab", html: o.titulo }));
  const corpo = el("div", { class: "corpo" });
  const st = {};
  const atual = new Set();
  for (const [a, b] of o.atual || []) for (let k = a; k <= b; k++) atual.add(k);
  let foco = null;
  ls.forEach((linha, idx) => {
    const n = idx + ini;
    const syn = new Array(linha.length).fill(""), mk = new Array(linha.length).fill("");
    for (const [a, b, c] of tokens(o.lang || "java", linha, st)) for (let k = a; k < b; k++) syn[k] = c;
    for (const m of o.marcas || []) {
      if (n < m.l1 || n > m.l2) continue;
      const a = n === m.l1 ? m.c1 - 1 : 0, b = n === m.l2 ? m.c2 - 1 : linha.length;
      for (let k = Math.max(0, a); k < Math.min(linha.length, b); k++) mk[k] = m.cls;
    }
    const src = el("span", { class: "src" });
    if (!linha.length) src.append("​");
    let k = 0;
    while (k < linha.length) {
      let j = k + 1;
      while (j < linha.length && syn[j] === syn[k] && mk[j] === mk[k]) j++;
      const cls = [syn[k], mk[k]].filter(Boolean).join(" ");
      src.append(cls ? el("span", { class: cls }, linha.slice(k, j)) : linha.slice(k, j));
      k = j;
    }
    const classes = ["ln"];
    if (atual.has(n)) classes.push("atual");
    if (o.linhas && o.linhas[n]) classes.push(o.linhas[n]);
    const div = el("div", { class: classes.join(" "), "data-n": n }, el("span", { class: "num" }, n), src);
    const nota = o.notas && o.notas[n];
    if (nota) div.append(el("span", { class: "nota " + (nota.cls || ""), html: nota.txt }));
    if (foco === null && (atual.has(n) || (o.foco && o.foco === n))) foco = div;
    corpo.append(div);
  });
  if (foco === null && (o.marcas || []).length) {
    const prim = Math.min(...o.marcas.map((m) => m.l1));
    foco = corpo.querySelector(`[data-n="${prim}"]`);
  }
  caixa.append(corpo);
  // depois que a caixa entra na pagina: rola ate a linha atual (a 1/3 da altura)
  if (foco) setTimeout(() => {
    const alvo = foco.offsetTop - caixa.clientHeight / 3;
    caixa.scrollTop = Math.max(0, alvo);
  }, 0);
  return caixa;
}

const STEPPERS = {};
let ABA_ATUAL = null;
function stepper(host, { chave, aba, passos, desenha }) {
  host.replaceChildren();
  const bAnt = el("button", { title: "passo anterior (←)", "aria-label": "anterior" }, "◀");
  const bIni = el("button", { title: "primeiro passo", "aria-label": "primeiro" }, "⏮");
  const bFim = el("button", { title: "último passo", "aria-label": "último" }, "⏭");
  const bProx = el("button", { class: "prox", title: "próximo passo (→)" }, "próximo ▶");
  const t = el("div", { class: "t" }), n = el("div", { class: "n" }), barra = el("i");
  const ctrl = el("div", { class: "controles" }, bIni, bAnt,
    el("div", { class: "info" }, t, n, el("div", { class: "barra" }, barra)),
    el("span", { class: "dica" }, el("kbd", null, "←"), " ", el("kbd", null, "→")), bProx, bFim);
  const corpo = el("div");
  host.append(ctrl, corpo);
  let i = Math.min(Math.max(0, MEM[chave] ?? 0), passos.length - 1);
  const api = {
    ir(k) {
      i = Math.max(0, Math.min(passos.length - 1, k));
      lembra(chave, i);
      t.textContent = passos[i].t || "";
      n.textContent = `passo ${i + 1} de ${passos.length}`;
      barra.style.width = ((i + 1) / passos.length * 100) + "%";
      bAnt.disabled = bIni.disabled = i === 0;
      bProx.disabled = bFim.disabled = i === passos.length - 1;
      corpo.replaceChildren();
      desenha(passos[i], i, corpo);
    },
    prox() { if (i < passos.length - 1) this.ir(i + 1); },
    ant() { if (i > 0) this.ir(i - 1); },
    get i() { return i; },
  };
  bAnt.onclick = () => api.ant(); bProx.onclick = () => api.prox();
  bIni.onclick = () => api.ir(0); bFim.onclick = () => api.ir(passos.length - 1);
  STEPPERS[aba] = api;
  api.ir(i);
  return api;
}
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  const s = STEPPERS[ABA_ATUAL];
  if (!s) return;
  if (e.key === "ArrowRight") { s.prox(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { s.ant(); e.preventDefault(); }
});

function abaRegras(sec) {
  sec.append(el("h2", null, "As regras de leitura, e por quê"),
    el("p", { class: "lead", html: "OBJETIVO §4.1. As regras foram escritas <b>antes</b> dos dados, e o <code>hipoteses.mjs</code> as aplica. Aqui, o porquê de cada número, com as funções de limite tiradas do próprio script." }));
  sec.append(el("div", { class: "painel pilha", style: "margin-bottom:12px" }, H_(`<h3 style="margin-top:0">Por que pares, e não um teste estatístico por modelo</h3>
    <p>Com 5 réplicas, cada modelo tem 5 pares por comparação. Mesmo com os 5 na mesma direção, a chance disso por pura sorte é de <b>${pct(R.caudaDupla(5, 5))}</b>: nunca passaria dos 5% convencionais. E somar os 55 pares num teste só misturaria modelos que se comportam diferente. Por isso a leitura é <b>por pares, descritiva, e decidida antes</b>.</p>`)));

  // a moeda
  const nIn = el("input", { type: "number", value: 55, min: 5, max: 200, style: "max-width:100px" });
  const out = el("div", { class: "pilha" });
  const joga = () => {
    const n = Math.max(5, Math.min(200, Number(nIn.value) || 55));
    const k = R.minimoSinal(n, 0.05), baixo = Math.floor(0.6 * n);
    const vezes = 4000, cont = new Array(n + 1).fill(0);
    let acima = 0;
    for (let v = 0; v < vezes; v++) { let c = 0; for (let i = 0; i < n; i++) if (Math.random() < 0.5) c++; const maior = Math.max(c, n - c); cont[maior]++; if (maior >= k) acima++; }
    const ini = Math.ceil(n / 2), max = Math.max(...cont);
    out.replaceChildren(
      el("div", { class: "histo" }, cont.slice(ini).map((x, j) => el("i", { class: ini + j >= k ? "fora" : null, style: `height:${(x / max) * 100}%`, title: `lado maior = ${ini + j}: ${x} vezes` }))),
      H_(`<p class="mini">Cada barra: em quantas das ${vezes} jogadas o lado maior teve aquele número de pares (de ${ini} a ${n}). Em vermelho, a partir de <b>${k}</b>.</p>
        <p>Com ${n} pares, se o harness não fizesse nada, o lado maior chegou a ${k} ou mais em <b>${pct(acima / vezes)}</b> das jogadas. A conta exata (a função <code>caudaDupla</code> do script): <b>${pct(R.caudaDupla(n, k))}</b>. Por isso: <b>apoiada com ${k} ou mais</b>; <b>contrariada com ${baixo} ou menos</b> (até 60% de um lado: os pares se dividem); entre os dois, inconclusiva.</p>
        ${n === 55 ? '<p class="mini">É a tabela do OBJETIVO: 36 ou mais, 3,0%; 35 ou mais, 5,8%. (No V4, com 25 pares, o limite era 18.)</p>' : ""}`));
  };
  nIn.oninput = joga;
  sec.append(el("div", { class: "painel pilha", style: "margin-bottom:12px" }, el("h3", { style: "margin-top:0" }, "A moeda: de onde vem o 36 de 55"),
    H_("<p>Se o harness não mudasse nada, cada par subiria ou desceria por sorte, como cara ou coroa. A página joga 55 moedas 4000 vezes e conta quantas vezes um dos lados chega ao limite.</p>"),
    el("div", { class: "linha-botoes" }, el("label", { class: "mini" }, "pares: ", nIn), el("button", { class: "b on", onclick: joga }, "jogar de novo")), out));
  joga();

  sec.append(el("div", { class: "grade2" },
    el("div", { class: "painel" }, H_(`<h3 style="margin-top:0">O saldo de 13% (não-inferioridade)</h3><p>Mesmo sem efeito nenhum, o modelo não acerta sempre igual, e alguns pares saem diferentes por acaso, para os dois lados. O <b>saldo</b> (piores − melhores) desconta os melhores. A mesma proporção que justificava 2 em 15 pares dá <b>${R.limiteSaldo(55)} em 55</b>. Acima disso, o harness atrapalha mais do que ajuda.</p>`)),
    el("div", { class: "painel" }, H_(`<h3 style="margin-top:0">O teto</h3><p>Um modelo que já acerta tudo sem harness, nas 5 réplicas, <b>não tem como melhorar</b>: só empatar ou piorar. Contá-lo tornaria impossível apoiar uma hipótese direcional sempre que vários modelos estivessem no teto. Por isso ele <b>sai da contagem</b> e é lido por \"no teto, não piora\". Se todos estiverem no teto: \"sem espaço para efeito\".</p>`)),
    el("div", { class: "painel" }, H_(`<h3 style="margin-top:0">Direcional: voto por modelo</h3><p>Apoiada quando a <b>maioria dos modelos fora do teto</b> tem mais pares melhores que piores, <b>e nenhum modelo</b> (nem os do teto) tem mais piores. Contrariada quando a maioria fora do teto tem mais piores.</p>`)),
    el("div", { class: "painel" }, H_(`<h3 style="margin-top:0">Sim/não (o exagero)</h3><p>Quando a medida é \"exagerou ou não\", quase todo par empata (nenhum dos dois exagerou). Contam só os pares em que os níveis diferem, com a mesma conta da moeda e limite de 6,3% (o exagero é raro). Com 1 ou 2 pares diferentes: contrariada.</p>`))),
    el("div", { class: "painel", style: "margin-top:12px" }, H_(`<h3 style="margin-top:0">E dois números só como informação</h3><ul><li><b>O tamanho do efeito</b> (saldo ÷ pares), publicado ao lado de cada hipótese.</li><li><b>O teste de Page</b>: a medida sobe de N0 a N3? Cada quarteto é um bloco. Publicado com o p, <b>não decide nenhuma hipótese</b>.</li></ul>`)),
    quiz({ p: "A conferência deu <b>39 de 44</b> na <code>P4_localizacao</code>. O que acontece com a hipótese do desenho?", op: ["nada, 39 é quase 40", "vira descritiva, lida só nos 44 conferidos", "o Semgrep é corrigido e a conta refeita"], certa: 1, exp: "Abaixo de 40, a pergunta vira descritiva: as hipóteses que dependem dela são lidas só nos 44 pacotes conferidos, e a discordância entra nas limitações. Corrigir a regra para refazer a conta oficial não é permitido; uma regra corrigida só pode aparecer como análise extra, marcada." }));
}

    const e = EXERCICIOS[k];
    corpo.replaceChildren(el("div", { class: "grade2" },
      codigo({ texto: e.cod, lang: "java", titulo: `<b>${k + 1}. ${e.t}</b> · código inventado` }),
      el("div", { class: "pilha" }, e.perguntas.map(([p, certo, porque]) => {
        const q = el("div", { class: "quiz" }, el("div", { class: "q" }, el("code", null, p)));
        const lb = el("div", { class: "linha-botoes" }), r = el("div", { class: "r txt", html: `<p><b>${certo}</b>. ${porque}</p>` });
        VALORES[p].forEach((v) => lb.append(el("button", { class: "b", onclick: () => { q.classList.add("respondida"); [...lb.children].forEach((b) => { b.classList.remove("certa", "errada"); if (b.textContent === certo) b.classList.add("certa"); else if (b.textContent === v) b.classList.add("errada"); }); } }, v)));
        q.append(lb, r);
        return q;
      }))));
  };
  box.append(el("h3", { style: "margin-top:0" }, "Classifique você"), H_("<p>Trechos inventados, cada um mostrando uma regra da régua. Escolha o valor; a resposta cita a seção da régua que decide.</p>"), nav, corpo);
  sec.append(box);
  desenha();
}

// main.js: as abas e o tema.
"use strict";

const ABAS = [
  { id: "pergunta", nome: "0 · A pergunta e o desenho", init: abaPergunta },
  { id: "sequencia", nome: "1 · A sequência de verificação", init: abaSequencia },
  { id: "acerto", nome: "2 · O que conta como acerto", init: abaAcerto },
  { id: "hipoteses", nome: "3 · As hipóteses", init: abaHipoteses },
  { id: "regras", nome: "4 · As regras de leitura", init: abaRegras },
  { id: "ameacas", nome: "5 · Ameaças e defesas", init: abaAmeacas },
  { id: "conclui", nome: "6 · O que se conclui", init: abaConclui },
  { id: "pendencias", nome: "7 · O que falta", init: abaPendencias },
  { id: "auto", nome: "8 · Autoavaliação", init: abaAuto },
];
const SECOES = {}, BOTOES = {}, PRONTAS = new Set();

function mostraAba(id) {
  if (!SECOES[id]) id = "pergunta";
  ABA_ATUAL = id;
  lembra("aba", id);
  for (const a of ABAS) { SECOES[a.id].classList.toggle("ativa", a.id === id); BOTOES[a.id].classList.toggle("ativa", a.id === id); }
  if (!PRONTAS.has(id)) {
    PRONTAS.add(id);
    try { ABAS.find((a) => a.id === id).init(SECOES[id]); }
    catch (e) { SECOES[id].append(el("div", { class: "caixa aviso" }, "Erro ao montar esta aba: " + e.message)); console.error(e); }
  }
  BOTOES[id].scrollIntoView({ block: "nearest", inline: "nearest" });
  window.scrollTo({ top: 0 });
}

(function inicia() {
  const faixa = document.querySelector("nav.abas .faixa");
  const main = document.querySelector("main");
  for (const a of ABAS) {
    BOTOES[a.id] = el("button", { onclick: () => mostraAba(a.id) }, a.nome);
    faixa.append(BOTOES[a.id]);
    SECOES[a.id] = el("section", { class: "aba", id: "aba-" + a.id });
    main.append(SECOES[a.id]);
  }
  const temas = ["auto", "light", "dark"], nomes = { auto: "tema: automático", light: "tema: claro", dark: "tema: escuro" };
  let tema = temas.includes(MEM.tema) ? MEM.tema : "auto";
  const bt = document.querySelector("button.tema");
  const pinta = () => { if (tema === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", tema); bt.textContent = nomes[tema]; };
  bt.onclick = () => { tema = temas[(temas.indexOf(tema) + 1) % temas.length]; lembra("tema", tema); pinta(); };
  pinta();
  mostraAba(MEM.aba || "pergunta");
})();

</script>
