<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métricas por dentro</title>
<style>
:root {
  --bg: #f6f5f1; --bg2: #ffffff; --bg3: #efede6; --fg: #1d1f24; --muted: #646a73; --line: #dcd9cf;
  --accent: #2f5bd3; --accent-fg: #ffffff;
  --ok: #1d8a4e; --ok-bg: #d8f1e2; --bad: #c0392b; --bad-bg: #fbe0dc;
  --cand: #2f5bd3; --cand-bg: #dde6fb; --reg-bg: #ece3fb; --reg: #7b4bd1;
  --cur-bg: #fff3c4; --cur: #c99a00; --hit-bg: #ffe08a;
  --code-bg: #fbfaf7; --kw: #8a3ab9; --str: #1f7a3d; --com: #8a8f98; --num: #b5531a; --key: #2f5bd3;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;
    --accent: #7ea2ff; --accent-fg: #0f1115;
    --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;
    --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;
    --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;
    --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --bg2: #1d2026; --bg3: #262a31; --fg: #e6e8eb; --muted: #9aa1ab; --line: #343943;
  --accent: #7ea2ff; --accent-fg: #0f1115;
  --ok: #5fd08f; --ok-bg: #173a27; --bad: #ff8a7a; --bad-bg: #44211d;
  --cand: #8fb0ff; --cand-bg: #1f2c4d; --reg-bg: #2e2445; --reg: #b597ff;
  --cur-bg: #3a3215; --cur: #f0c94a; --hit-bg: #6b5410;
  --code-bg: #181b20; --kw: #d19bf5; --str: #7fd49a; --com: #7d848f; --num: #f2a26b; --key: #8fb0ff;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; font-size: .9em; }
p code, li code, td code, .txt code { background: var(--bg3); padding: .05em .3em; border-radius: 4px; }
a { color: var(--accent); }
header.topo { padding: 18px 16px 6px; max-width: 1500px; margin: 0 auto; }
header.topo h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -.01em; }
header.topo p { margin: 0; color: var(--muted); font-size: 14px; }
nav.abas { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.abas .faixa { display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; max-width: 1500px; margin: 0 auto; scrollbar-width: thin; }
nav.abas button { flex: none; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
nav.abas button:hover { border-color: var(--accent); }
nav.abas button.ativa { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
main { max-width: 1500px; margin: 0 auto; padding: 14px 16px 60px; }
section.aba { display: none; }
section.aba.ativa { display: block; }
h2 { font-size: 19px; margin: 6px 0 8px; }
h3 { font-size: 15.5px; margin: 14px 0 6px; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 900px; }
.painel { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.grade2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.grade-lab { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1000px) { .grade2, .grade-lab { grid-template-columns: minmax(0, 1fr); } }
.pilha > * + * { margin-top: 12px; }
.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rotulo .dir { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* controles do passo a passo */
.controles { position: sticky; top: 49px; z-index: 10; display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 12px; box-shadow: var(--shadow); }
.controles button { border: 1px solid var(--line); background: var(--bg3); color: var(--fg); border-radius: 8px; min-width: 36px; height: 34px; font: inherit; cursor: pointer; }
.controles button:hover:not(:disabled) { border-color: var(--accent); }
.controles button:disabled { opacity: .4; cursor: default; }
.controles button.prox { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); padding: 0 14px; font-weight: 600; }
.controles .info { flex: 1; min-width: 0; }
.controles .info .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controles .info .n { font-size: 12px; color: var(--muted); }
.controles .barra { height: 3px; background: var(--bg3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.controles .barra i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.controles .dica { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 700px) { .controles .dica { display: none; } }

/* codigo */
.codigo { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.55; overflow: auto; max-height: 62vh; }
.codigo.baixo { max-height: 40vh; }
.codigo .cab { position: sticky; top: 0; z-index: 2; background: var(--bg3); border-bottom: 1px solid var(--line); padding: 4px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.codigo .cab b { color: var(--fg); font-weight: 600; }
.codigo .corpo { min-width: max-content; padding: 4px 0; }
.ln { display: flex; position: relative; padding-right: 12px; }
.ln .num { flex: none; width: 3.4em; text-align: right; padding-right: .9em; color: var(--muted); user-select: none; opacity: .7; }
.ln .src { white-space: pre; flex: none; }
.ln .nota { flex: none; margin-left: 14px; font-family: system-ui, sans-serif; font-size: 11.5px; padding: 0 7px; border-radius: 999px; align-self: center; white-space: nowrap; }
.ln .nota.ok { background: var(--ok-bg); color: var(--ok); }
.ln .nota.fora { background: var(--bad-bg); color: var(--bad); }
.ln .nota.cand { background: var(--cand-bg); color: var(--cand); }
.ln .nota.reg { background: var(--reg-bg); color: var(--reg); }
.ln.atual { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }
.ln.regiao { background: var(--reg-bg); box-shadow: inset 3px 0 0 var(--reg); }
.ln.erro { background: var(--bad-bg); box-shadow: inset 3px 0 0 var(--bad); }
.ln.apagada .src { opacity: .45; }
.ln.feita .num { color: var(--ok); opacity: 1; }
.s-kw { color: var(--kw); } .s-str { color: var(--str); } .s-com { color: var(--com); font-style: italic; } .s-num { color: var(--num); } .s-key { color: var(--key); }
.m-cand { background: var(--cand-bg); outline: 1px solid var(--cand); border-radius: 2px; }
.m-ok { background: var(--ok-bg); outline: 1px solid var(--ok); border-radius: 2px; }
.m-fora { background: var(--bad-bg); text-decoration: line-through; text-decoration-color: var(--bad); border-radius: 2px; }
.m-hit { background: var(--hit-bg); border-radius: 2px; }
.m-hitsel { background: var(--hit-bg); outline: 2px solid var(--cur); border-radius: 2px; }
.m-erro { text-decoration: underline wavy var(--bad); }

/* explicacao */
.passo-t { font-size: 17px; font-weight: 650; margin: 0 0 6px; }
.txt p { margin: 0 0 9px; }
.txt ul, .txt ol { margin: 0 0 9px; padding-left: 20px; }
.txt li { margin: 2px 0; }
.caixa { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); margin-top: 10px; }
.caixa.aconteceu { border-left: 4px solid var(--cur); }
.caixa.aconteceu .rotulo { color: var(--cur); }
.caixa.aviso { border-left: 4px solid var(--bad); }
.caixa.certo { border-left: 4px solid var(--ok); }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.t td.mono, table.t td code { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12px; word-break: break-all; }
.sim { color: var(--ok); font-weight: 700; } .nao { color: var(--bad); font-weight: 700; }
.tabela-rolagem { max-height: 340px; overflow: auto; }
.estado td:first-child { white-space: nowrap; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--bg3); color: var(--muted); border: 1px solid var(--line); }
.pill.java { color: var(--kw); } .pill.texto { color: var(--str); }
input[type=text], textarea, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
textarea { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.5; min-height: 180px; resize: vertical; }
button.b { border: 1px solid var(--line); background: var(--bg3); color: var(--fg); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
button.b:hover { border-color: var(--accent); }
button.b.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.quiz { border: 1px dashed var(--accent); border-radius: 10px; padding: 9px 11px; margin-top: 10px; background: var(--bg); }
.quiz .q { font-weight: 600; margin-bottom: 6px; }
.quiz .r { margin-top: 8px; display: none; }
.quiz.respondida .r { display: block; }
.quiz button.certa { background: var(--ok-bg); border-color: var(--ok); }
.quiz button.errada { background: var(--bad-bg); border-color: var(--bad); }
.lista-regras { display: flex; flex-direction: column; gap: 3px; max-height: 75vh; overflow: auto; }
.lista-regras .grupo { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 2px; }
.lista-regras button { text-align: left; border: 1px solid transparent; background: none; color: var(--fg); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.lista-regras button:hover { background: var(--bg3); }
.lista-regras button.ativa { background: var(--cand-bg); border-color: var(--cand); }
@media (max-width: 1000px) { .lista-regras { flex-direction: row; flex-wrap: wrap; max-height: none; } .lista-regras .grupo { width: 100%; } }
.arvore { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; }
.arvore div { white-space: pre; padding: 0 6px; border-radius: 4px; }
.arvore .foco { background: var(--cur-bg); box-shadow: inset 3px 0 0 var(--cur); }
.arvore .ign { color: var(--muted); text-decoration: line-through; }
.arvore .cop { color: var(--ok); font-weight: 600; }
.arvore .fora { color: var(--bad); }
.arvore .proj { background: var(--ok-bg); }
.tag { display: inline-block; font-family: system-ui, sans-serif; font-size: 11px; padding: 0 6px; border-radius: 999px; margin-left: 6px; background: var(--bg3); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.fora { background: var(--bad-bg); color: var(--bad); } .tag.cand { background: var(--cand-bg); color: var(--cand); } .tag.reg { background: var(--reg-bg); color: var(--reg); }
.fita { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 300px; overflow: auto; }
.fita .codigo-k { color: var(--fg); } .fita .texto-k { color: var(--str); background: rgba(31,122,61,.08); }
.fita .com-k { color: var(--bad); text-decoration: line-through; background: var(--bad-bg); }
.fita .atual-k { outline: 2px solid var(--cur); border-radius: 3px; }
.fita .depois { opacity: .45; }
.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.no { border: 1px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; color: var(--fg); box-shadow: var(--shadow); }
.no:hover { border-color: var(--accent); }
.no b { display: block; font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }
.no span { font-size: 13px; color: var(--muted); }
.no.etapa1 { border-top: 4px solid var(--cand); } .no.etapa2 { border-top: 4px solid var(--reg); } .no.prep { border-top: 4px solid var(--cur); }
.seta { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0; }
.trilha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.trilha .x { background: var(--bg3); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
.ped { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; word-break: break-all; }
tr.cab-ramo td { color: var(--muted); font-style: italic; font-size: 12px; background: var(--bg3); }
tr.nao-part td { opacity: .5; }
.cadeado { font-size: 42px; line-height: 1; }
details.r { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg2); margin: 8px 0; }
details.r summary { cursor: pointer; font-weight: 600; }
details.r[open] summary { margin-bottom: 6px; }
.verif { font-size: 13px; }
.verif li { margin: 3px 0; }
.mini { font-size: 12.5px; color: var(--muted); }
kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg2); }
.tema { position: absolute; top: 16px; right: 16px; }
header.topo { position: relative; }

</style>
</head>
<body>
<header class="topo">
  <h1>Métricas por dentro</h1>
  <p>SonarQube e CK no experimento: o que cada número mede, conferido em exemplos inventados.</p>
  <button class="b tema" type="button">tema</button>
</header>
<nav class="abas" aria-label="abas"><div class="faixa"></div></nav>
<main></main>
<script>
window.DADOS = {"fontes":{"metrics":"#!/usr/bin/env bash\n# Metricas automaticas do codigo de cada execucao de um lote: CK e SonarQube.\n#\n# Uso (Git Bash):\n#   evaluation/tools/metrics.sh <prefixo>        (ex.: TESTE-STRATEGY-01)\n#\n# Mede o codigo de producao (src/main/java), ja compilado pelo build da bancada\n# (target/classes, que o SonarQube precisa para analisar Java). Nao julga nada:\n# so extrai numeros, e por isso roda direto em runs/, sem pacote anonimizado.\n# Uma ferramenta nao sabe qual e o braco; a cegueira protege o julgamento humano.\n#\n# Pre-requisitos:\n#   - Docker aberto, com o servidor tcc-sonarqube no ar (ver evaluation/tools/README.md)\n#   - .env.sonar na raiz, com SONAR_TOKEN=... (fora do git; nunca e impresso)\n#\n# Saida: evaluation/metrics/<prefixo>/<run_id>/ (ck/ e sonar/) e, no fim,\n# evaluation/metrics/<prefixo>/metricas.csv, uma linha por execucao.\n# Recusa rodar se a pasta de saida ja existe, ou se alguma execucao ja foi\n# analisada no SonarQube: uma analise nunca e refeita por cima de outra.\n#\n# COMO LER. Duas ferramentas, as duas so contam, sem julgar:\n#   - o CK (um .jar) le o codigo-fonte e mede cada classe: acoplamento (CBO),\n#     complexidade somada dos metodos (WMC), coesao (LCOM), heranca (DIT)...\n#   - o SonarQube (um servidor no Docker) recebe o codigo e as classes compiladas por\n#     um \"scanner\" e devolve linhas de codigo, complexidade ciclomatica e COGNITIVA (a\n#     hipotese da qualidade), duplicacao e code smells.\n# Tres partes: (1) preflight: confere que as versoes sao as travadas (o hash do .jar\n# do CK, a imagem do SonarQube e do scanner) e que nenhuma execucao foi analisada\n# antes; (2) por execucao: acha o projeto, roda o CK, roda o scanner e espera o\n# servidor devolver as medidas; (3) no fim, o aggregate-metrics.mjs junta tudo no CSV.\n# O SonarQube fica DESLIGADO durante as execucoes do V4 e ligado so para esta etapa.\n\nset -uo pipefail\nmorrer() { printf '\\033[31mERRO: %s\\033[0m\\n' \"$*\" >&2; exit 1; }\n\n[ $# -eq 1 ] || morrer \"uso: $0 <prefixo>\"\nPREFIXO=\"$1\"\ncase \"$PREFIXO\" in \"\"|*[!A-Za-z0-9-]*) morrer \"prefixo invalido: '$PREFIXO'\" ;; esac\n\nRAIZ=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/../..\" && pwd -P)\"\nOUT=\"$RAIZ/evaluation/metrics/$PREFIXO\"\nENV_SONAR=\"$RAIZ/.env.sonar\"\n\n# As versoes travadas. Mudar qualquer uma destas e um instrumento novo.\nCK_JAR=\"$RAIZ/evaluation/tools/ck/ck-0.7.1-8a1ef916-jar-with-dependencies.jar\"\nCK_SHA256=\"f3c0e5bc159189ebd213badf693ab792a31cbea749eb9f97b9185938c54a7baf\"\nSONAR_IMAGE_ID=\"sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1\"\nSCANNER=\"sonarsource/sonar-scanner-cli@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57\"\nSONAR_URL=\"http://localhost:9000\"\nREDE=\"tcc-sonar-net\"\nMETRICAS=\"ncloc,classes,functions,complexity,cognitive_complexity,duplicated_lines_density,duplicated_blocks,code_smells,sqale_index\"\n\n# ------------------------------------------------------------------ preflight\n[ -f \"$CK_JAR\" ] || morrer \"falta o CK em $CK_JAR\"\n[ \"$(sha256sum \"$CK_JAR\" | cut -d' ' -f1)\" = \"$CK_SHA256\" ] || morrer \"o .jar do CK nao e o travado (sha256 diferente)\"\n[ -f \"$ENV_SONAR\" ] && grep -q '^SONAR_TOKEN=.\\+' \"$ENV_SONAR\" || morrer \"falta $ENV_SONAR com SONAR_TOKEN=...\"\n[ \"$(docker inspect --format '{{.Image}}' tcc-sonarqube 2>/dev/null)\" = \"$SONAR_IMAGE_ID\" ] \\\n    || morrer \"o container tcc-sonarqube nao existe ou nao usa a imagem travada\"\n[ \"$(docker inspect --format '{{.State.Running}}' tcc-sonarqube)\" = \"true\" ] || morrer \"tcc-sonarqube esta parado (docker start tcc-sonarqube)\"\ncurl -s \"$SONAR_URL/api/system/status\" | grep -q '\"status\":\"UP\"' || morrer \"o SonarQube nao esta pronto em $SONAR_URL\"\ndocker image inspect \"$SCANNER\" >/dev/null 2>&1 || morrer \"falta a imagem travada do scanner\"\ndocker network inspect \"$REDE\" >/dev/null 2>&1 || docker network create \"$REDE\" >/dev/null\ndocker network inspect \"$REDE\" --format '{{range .Containers}}{{.Name}} {{end}}' | grep -qw tcc-sonarqube \\\n    || docker network connect \"$REDE\" tcc-sonarqube\n\nRUNS=\"$(cd \"$RAIZ/runs\" && ls -d \"$PREFIXO\"-* 2>/dev/null | LC_ALL=C sort)\"\n[ -n \"$RUNS\" ] || morrer \"nenhuma execucao runs/$PREFIXO-*\"\n[ -e \"$OUT\" ] && morrer \"$OUT ja existe: apague a pasta para refazer\"\n\n# O token so vive nesta variavel; nunca e impresso.\nTOKEN=\"$(sed -n 's/^SONAR_TOKEN=//p' \"$ENV_SONAR\" | tr -d '\\r\\n ')\"\nfor run in $RUNS; do\n    code=\"$(curl -s -o /dev/null -w '%{http_code}' -u \"$TOKEN:\" \"$SONAR_URL/api/components/show?component=$run\")\"\n    [ \"$code\" = \"404\" ] || morrer \"$run ja foi analisada no SonarQube (HTTP $code): nao se refaz por cima\"\ndone\n\nmkdir -p \"$OUT\"\nexport MSYS_NO_PATHCONV=1\nprintf '\\033[36m=== metricas %s: %s execucoes ===\\033[0m\\n' \"$PREFIXO\" \"$(echo \"$RUNS\" | wc -l)\"\n\n# ------------------------------------------------------------------ por execucao\nfor run in $RUNS; do\n    dir=\"$OUT/$run\"; mkdir -p \"$dir/ck\" \"$dir/sonar\"\n    # O pom mais raso, como no build da bancada: o agente escolhe onde poe o projeto.\n    pom=\"$(find \"$RAIZ/runs/$run/workspace\" -name pom.xml -not -path '*/target/*' -printf '%d %p\\n' 2>/dev/null | sort -n | head -1 | cut -d' ' -f2-)\"\n    if [ -z \"$pom\" ]; then echo \"sem_pom\" > \"$dir/status\"; echo \"  $run: sem pom\"; continue; fi\n    proj=\"$(dirname \"$pom\")\"\n    if [ ! -d \"$proj/src/main/java\" ]; then echo \"sem_src_main_java\" > \"$dir/status\"; echo \"  $run: sem src/main/java\"; continue; fi\n\n    java -jar \"$(cygpath -w \"$CK_JAR\")\" \"$(cygpath -w \"$proj/src/main/java\")\" false 0 false \"$(cygpath -w \"$dir/ck\")/\" \\\n        > \"$dir/ck/ck.log\" 2>&1 || { echo \"ck_falhou\" > \"$dir/status\"; echo \"  $run: CK falhou\"; continue; }\n\n    if [ ! -d \"$proj/target/classes\" ]; then echo \"sem_classes\" > \"$dir/status\"; echo \"  $run: CK ok, sem classes compiladas para o SonarQube\"; continue; fi\n    docker run --rm --network \"$REDE\" --env-file \"$(cygpath -w \"$ENV_SONAR\")\" -e SONAR_HOST_URL=http://tcc-sonarqube:9000 \\\n        --mount \"type=bind,source=$(cygpath -w \"$proj\"),target=/usr/src,readonly\" \\\n        -v tcc-sonar-scannercache:/opt/sonar-scanner/.sonar/cache \\\n        \"$SCANNER\" \\\n        -Dsonar.projectKey=\"$run\" -Dsonar.sources=src/main/java -Dsonar.java.binaries=target/classes \\\n        -Dsonar.java.source=21 -Dsonar.scm.disabled=true -Dsonar.working.directory=/tmp/scannerwork \\\n        > \"$dir/sonar/scanner.log\" 2>&1 || { echo \"sonar_falhou\" > \"$dir/status\"; echo \"  $run: SonarQube falhou\"; continue; }\n\n    # O servidor processa o relatorio depois do scanner sair: espera as medidas.\n    ok=\"\"\n    for i in $(seq 1 40); do\n        curl -s -u \"$TOKEN:\" \"$SONAR_URL/api/measures/component?component=$run&metricKeys=$METRICAS\" > \"$dir/sonar/measures.json\"\n        grep -q '\"measures\":\\[{' \"$dir/sonar/measures.json\" && { ok=1; break; }\n        sleep 3\n    done\n    [ -n \"$ok\" ] || { echo \"sonar_sem_medidas\" > \"$dir/status\"; echo \"  $run: SonarQube nao devolveu medidas\"; continue; }\n    echo \"ok\" > \"$dir/status\"; echo \"  $run: ok\"\ndone\n\nnode \"$(cygpath -w \"$RAIZ/evaluation/tools/aggregate-metrics.mjs\")\" \"$PREFIXO\"\n","aggregate":"// Junta as metricas de um lote (CK e SonarQube) num CSV, uma linha por execucao.\n//\n// Uso:\n//   node evaluation/tools/aggregate-metrics.mjs <prefixo>\n//\n// Le evaluation/metrics/<prefixo>/<run_id>/ (o que o metrics.sh gravou) e o\n// meta.json de cada execucao, so para identificar modelo, braco e replica.\n// Grava evaluation/metrics/<prefixo>/metricas.csv. So junta numeros: nenhuma\n// leitura nem nota sai daqui.\n//\n// COMO LER. Para cada execucao: as colunas sonar_* vem do measures.json (o que o\n// servidor do SonarQube devolveu); as colunas ck_* vem do class.csv do CK (uma linha\n// por classe), resumidas em contagens, medias e maximos. A coluna \"condition\" diz\n// CONTROL ou HARNESS, e a \"nivel\" diz N0 a N3 (tirada do fim do run_id).\n\nimport { readdirSync, readFileSync, existsSync, writeFileSync } from \"node:fs\";\nimport { join, dirname } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\n\nconst RAIZ = join(dirname(fileURLToPath(import.meta.url)), \"..\", \"..\");\nconst prefixo = process.argv[2];\nif (!prefixo) { console.error(\"uso: node evaluation/tools/aggregate-metrics.mjs <prefixo>\"); process.exit(1); }\nconst OUT = join(RAIZ, \"evaluation\", \"metrics\", prefixo);\nif (!existsSync(OUT)) { console.error(`nao existe ${OUT}: rode antes o metrics.sh`); process.exit(1); }\n\n// CSV do CK: os campos nao trazem virgula, mas o caminho do arquivo pode trazer\n// aspas no Windows; este leitor respeita aspas.\nfunction lerCsv(texto) {\n  const linhas = texto.replace(/\\r/g, \"\").split(\"\\n\").filter(Boolean);\n  const campos = (l) => { const r = []; let c = \"\", q = false;\n    for (const ch of l) { if (ch === '\"') q = !q; else if (ch === \",\" && !q) { r.push(c); c = \"\"; } else c += ch; }\n    r.push(c); return r; };\n  const cab = campos(linhas[0]);\n  return linhas.slice(1).map((l) => Object.fromEntries(campos(l).map((v, i) => [cab[i], v])));\n}\nconst num = (v) => (v === undefined || v === \"\" || isNaN(Number(v)) ? null : Number(v));\nconst media = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);\nconst fmt = (v) => (v === null || v === undefined ? \"\" : Number.isInteger(v) ? String(v) : v.toFixed(3));\n\nconst SONAR = [\"ncloc\", \"classes\", \"functions\", \"complexity\", \"cognitive_complexity\",\n  \"duplicated_lines_density\", \"duplicated_blocks\", \"code_smells\", \"sqale_index\"];\nconst TIPOS = [\"class\", \"interface\", \"enum\", \"record\"];\n\nconst linhas = [];\nfor (const run of readdirSync(OUT, { withFileTypes: true }).filter((d) => d.isDirectory()).map((d) => d.name).sort()) {\n  const dir = join(OUT, run);\n  const meta = JSON.parse(readFileSync(join(RAIZ, \"runs\", run, \"meta.json\"), \"utf8\"));\n  const status = existsSync(join(dir, \"status\")) ? readFileSync(join(dir, \"status\"), \"utf8\").trim() : \"incompleto\";\n  // O nivel (N0 a N3) e o fim do run_id do V4 (V4-STRATEGY-01-HAIKU45-N2); vazio nos\n  // lotes da bancada, que tinham so CONTROL e HARNESS (coluna nivel desde 09/10).\n  const nivel = run.match(/-(N\\d)$/)?.[1] ?? \"\";\n  const l = { run_id: run, model: meta.model_requested, condition: meta.condition, nivel, replicate: meta.replicate ?? \"\", status };\n\n  const sonarArq = join(dir, \"sonar\", \"measures.json\");\n  const medidas = existsSync(sonarArq) ? JSON.parse(readFileSync(sonarArq, \"utf8\")).component?.measures ?? [] : [];\n  for (const k of SONAR) l[`sonar_${k}`] = num(medidas.find((m) => m.metric === k)?.value);\n\n  // O CK conta como \"anonymous\" o corpo de cada constante de enum com\n  // comportamento proprio (e as classes anonimas). Contagens e medias usam so os\n  // tipos com nome, o mesmo criterio do sonar_classes; as anonimas vao numa\n  // coluna propria, porque medem um desenho (o enum com corpo por constante).\n  // A soma de WMC usa tudo: a logica dentro das constantes tambem e codigo.\n  const ckArq = join(dir, \"ck\", \"class.csv\");\n  const todos = existsSync(ckArq) ? lerCsv(readFileSync(ckArq, \"utf8\")) : [];\n  const cls = todos.filter((c) => TIPOS.includes(c.type));\n  l.ck_tipos = todos.length ? cls.length : null;\n  for (const t of TIPOS) l[`ck_${t}`] = todos.length ? cls.filter((c) => c.type === t).length : null;\n  l.ck_anonymous = todos.length ? todos.filter((c) => c.type === \"anonymous\").length : null;\n  const col = (k, lista = cls) => lista.map((c) => num(c[k])).filter((v) => v !== null);\n  l.ck_cbo_media = media(col(\"cbo\")); l.ck_cbo_max = col(\"cbo\").length ? Math.max(...col(\"cbo\")) : null;\n  l.ck_wmc_soma = col(\"wmc\", todos).length ? col(\"wmc\", todos).reduce((s, x) => s + x, 0) : null;\n  l.ck_wmc_max = col(\"wmc\").length ? Math.max(...col(\"wmc\")) : null;\n  l.ck_lcom_media = media(col(\"lcom\")); l.ck_rfc_media = media(col(\"rfc\"));\n  l.ck_dit_max = col(\"dit\").length ? Math.max(...col(\"dit\")) : null;\n  linhas.push(l);\n}\n\nconst colunas = Object.keys(linhas[0] ?? {});\nconst celula = (v) => (v === null || v === undefined ? \"\" : typeof v === \"number\" ? fmt(v) : String(v));\nconst csv = [colunas.join(\",\"), ...linhas.map((l) => colunas.map((c) => celula(l[c])).join(\",\"))].join(\"\\n\") + \"\\n\";\nwriteFileSync(join(OUT, \"metricas.csv\"), csv);\nconsole.log(`${linhas.length} execucoes -> evaluation/metrics/${prefixo}/metricas.csv (${colunas.length} colunas)`);\nfor (const l of linhas) console.log(`  ${l.run_id.padEnd(34)} ${l.status}`);\n"},"ex":{"A-remendo":{"arquivos":{"FreteService.java":"package com.loja.frete;\n\nimport java.math.BigDecimal;\n\npublic class FreteService {\n\n    public BigDecimal frete(String nivel, BigDecimal pesoKg, String regiao) {\n        BigDecimal base = new BigDecimal(\"12\").add(pesoKg.multiply(new BigDecimal(\"2\")));\n        if (nivel.equals(\"OURO\")) {\n            return BigDecimal.ZERO;\n        } else if (nivel.equals(\"PRATA\")) {\n            if (regiao.equals(\"NORTE\") || regiao.equals(\"NORDESTE\")) {\n                return base.multiply(new BigDecimal(\"0.8\"));\n            }\n            return base.multiply(new BigDecimal(\"0.5\"));\n        } else {\n            return base;\n        }\n    }\n\n    public int prazo(String nivel, int distanciaKm) {\n        int dias = 0;\n        for (int km = 0; km < distanciaKm; km += 500) {\n            if (nivel.equals(\"BRONZE\")) {\n                dias += 2;\n            } else {\n                dias += 1;\n            }\n        }\n        return nivel.equals(\"OURO\") ? Math.max(1, dias - 1) : dias;\n    }\n}\n","ResumoService.java":"package com.loja.frete;\n\npublic class ResumoService {\n\n    private final FreteService frete = new FreteService();\n\n    public String resumo(String nivel, String cliente, int distanciaKm) {\n        StringBuilder sb = new StringBuilder();\n        sb.append(\"Cliente: \").append(cliente).append('\\n');\n        if (nivel.equals(\"OURO\")) {\n            sb.append(\"Frete: gratis\").append('\\n');\n        } else {\n            sb.append(\"Frete: calculado\").append('\\n');\n        }\n        sb.append(\"Prazo: \").append(frete.prazo(nivel, distanciaKm)).append(\" dias\").append('\\n');\n        sb.append(\"Atendimento: \").append(nivel.equals(\"OURO\") ? \"prioritario\" : \"comum\");\n        return sb.toString();\n    }\n}\n"},"sonar":{"projeto":{"complexity":12,"code_smells":0,"duplicated_lines_density":0,"duplicated_lines":0,"functions":3,"cognitive_complexity":14,"duplicated_blocks":0,"classes":2,"ncloc":44,"sqale_index":0},"porArquivo":{"FreteService.java":{"complexity":9,"code_smells":0,"duplicated_lines":0,"functions":2,"cognitive_complexity":11,"duplicated_blocks":0,"ncloc":28,"sqale_index":0},"ResumoService.java":{"complexity":3,"code_smells":0,"duplicated_lines":0,"functions":1,"cognitive_complexity":3,"duplicated_blocks":0,"ncloc":16,"sqale_index":0}},"issues":[]},"ck":[{"classe":"ResumoService","tipo":"class","cbo":1,"cboModified":1,"fanin":0,"fanout":1,"wmc":3,"dit":1,"noc":0,"rfc":6,"lcom":0,"lcomN":"0.0","metodos":1,"campos":1,"loc":16},{"classe":"FreteService","tipo":"class","cbo":0,"cboModified":1,"fanin":1,"fanout":0,"wmc":9,"dit":1,"noc":0,"rfc":4,"lcom":1,"lcomN":"0.0","metodos":2,"campos":0,"loc":29}],"metodos":[{"classe":"ResumoService","metodo":"resumo","linha":7,"wmc":3,"rfc":6,"cbo":1},{"classe":"FreteService","metodo":"prazo","linha":21,"wmc":4,"rfc":2,"cbo":0},{"classe":"FreteService","metodo":"frete","linha":7,"wmc":5,"rfc":3,"cbo":0}]},"B-strategy":{"arquivos":{"Bronze.java":"package com.loja.frete;\n\nimport java.math.BigDecimal;\n\npublic class Bronze implements Nivel {\n\n    @Override\n    public const STEPPERS = {};
let ABA_ATUAL = null;
function stepper(host, { chave, aba, passos, desenha }) {
  host.replaceChildren();
  const bAnt = el("button", { title: "passo anterior (←)", "aria-label": "anterior" }, "◀");
  const bIni = el("button", { title: "primeiro passo", "aria-label": "primeiro" }, "⏮");
  const bFim = el("button", { title: "último passo", "aria-label": "último" }, "⏭");
  const bProx = el("button", { class: "prox", title: "próximo passo (→)" }, "próximo ▶");
  const t = el("div", { class: "t" }), n = el("div", { class: "n" }), barra = el("i");
  const ctrl = el("div", { class: "controles" }, bIni, bAnt,
    el("div", { class: "info" }, t, n, el("div", { class: "barra" }, barra)),
    el("span", { class: "dica" }, el("kbd", null, "←"), " ", el("kbd", null, "→")), bProx, bFim);
  const corpo = el("div");
  host.append(ctrl, corpo);
  let i = Math.min(Math.max(0, MEM[chave] ?? 0), passos.length - 1);
  const api = {
    ir(k) {
      i = Math.max(0, Math.min(passos.length - 1, k));
      lembra(chave, i);
      t.textContent = passos[i].t || "";
      n.textContent = `passo ${i + 1} de ${passos.length}`;
      barra.style.width = ((i + 1) / passos.length * 100) + "%";
      bAnt.disabled = bIni.disabled = i === 0;
      bProx.disabled = bFim.disabled = i === passos.length - 1;
      corpo.replaceChildren();
      desenha(passos[i], i, corpo);
    },
    prox() { if (i < passos.length - 1) this.ir(i + 1); },
    ant() { if (i > 0) this.ir(i - 1); },
    get i() { return i; },
  };
  bAnt.onclick = () => api.ant(); bProx.onclick = () => api.prox();
  bIni.onclick = () => api.ir(0); bFim.onclick = () => api.ir(passos.length - 1);
  STEPPERS[aba] = api;
  api.ir(i);
  return api;
}
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  const s = STEPPERS[ABA_ATUAL];
  if (!s) return;
  if (e.key === "ArrowRight") { s.prox(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { s.ant(); e.preventDefault(); }
});

// a linha (1 = primeira) de um arquivo que contem um texto, a partir de uma linha
function ln(texto, sub, desde = 1) {
  const ls = texto.split("\n");
  for (let k = desde - 1; k < ls.length; k++) if (ls[k].includes(sub)) return k + 1;
  throw new Error("nao achei: " + sub);
}
// marca um pedaco (token) de uma linha
function tok(texto, linha, pedaco, cls, ocorrencia = 1) {
  const l = texto.split("\n")[linha - 1];
  let i = -1;
  for (let k = 0; k < ocorrencia; k++) i = l.indexOf(pedaco, i + 1);
  if (i < 0) throw new Error(`"${pedaco}" nao esta na linha ${linha}`);
  return { l1: linha, c1: i + 1, l2: linha, c2: i + 1 + pedaco.length, cls };
}

function iguais(a, b) {
  // as linhas de a que aparecem iguais (sem espaco) em b, na ordem: comparacao desta pagina, nao do Sonar
  const nb = new Set(b.split("\n").map((l) => l.trim()).filter((l) => l.length > 2));
  return a.split("\n").map((l, i) => (nb.has(l.trim()) && l.trim().length > 2 ? i + 1 : null)).filter(Boolean);
}
function abaDuplicacao(sec) {
  sec.append(el("h2", null, "Duplicação"),
    el("p", { class: "lead", html: "O SonarQube procura <b>trechos de código que se repetem</b> e mede a porcentagem de linhas que estão em algum trecho repetido (<code>duplicated_lines_density</code>). É a hipótese \"não repete o comum\" do TCC." }));
  const host = el("div"); sec.append(host);
  const C = EX["C-copia"], B = EX["B-strategy"];
  const par = (P, f1, f2, titulo) => {
    const a = arq(P, f1), b = arq(P, f2);
    const la = Object.fromEntries(iguais(a, b).map((l) => [l, "regiao"])), lb = Object.fromEntries(iguais(b, a).map((l) => [l, "regiao"]));
    return el("div", { class: "grade2" },
      codigo({ texto: a, lang: "java", titulo: `<b>${f1}</b> · ${titulo}`, linhas: la, baixo: true }),
      codigo({ texto: b, lang: "java", titulo: `<b>${f2}</b> · ${titulo}`, linhas: lb, baixo: true }));
  };
  const passos = [
    { t: "Copiar e colar (projeto C)", vista: () => par("C-copia", "Etiqueta.java", "Recibo.java", "projeto C"),
      txt: `<p>Duas classes montando quase o mesmo texto. Em roxo, as linhas que aparecem iguais nos dois arquivos (essa marcação é uma comparação <b>desta página</b>, linha a linha).</p><p>O que o SonarQube real mediu:</p>`,
      extra: () => tabela(["arquivo", "linhas duplicadas", "blocos"], Object.entries(C.sonar.porArquivo).map(([f, m]) => [f, m.duplicated_lines, m.duplicated_blocks]).concat([["<b>projeto</b>", `<b>${C.sonar.projeto.duplicated_lines}</b>`, `<b>${C.sonar.projeto.duplicated_blocks}</b>`], ["<b>densidade</b>", `<b>${fmt(C.sonar.projeto.duplicated_lines_density)}%</b>`, ""]]), { rolagem: false }) },
    { t: "Como o número sai", vista: () => par("C-copia", "Etiqueta.java", "Recibo.java", "projeto C"),
      txt: `<p><b>Densidade = linhas que estão em algum bloco repetido ÷ linhas do projeto.</b> No C, ${C.sonar.projeto.duplicated_lines} linhas duplicadas: ${fmt(C.sonar.projeto.duplicated_lines_density)}%.</p><p>O SonarQube não compara linha por linha como a marcação roxa: ele quebra o código em pedaços (palavras, símbolos) e procura <b>sequências longas</b> que se repetem. Por isso os blocos dele não batem exatamente com as linhas roxas: uma assinatura de método diferente ou uma linha a mais no fim podem mudar onde o bloco começa e acaba. Trecho repetido curto não conta: tem de ser uma sequência comprida.</p>` },
    { t: "O Strategy também \"repete\" (projeto B)", vista: () => par("B-strategy", "Bronze.java", "Prata.java", "projeto B"),
      txt: `<p>Agora a surpresa. No projeto B, ninguém copiou nada de propósito, mas o SonarQube mediu <b>${fmt(B.sonar.projeto.duplicated_lines_density)}%</b> de duplicação: ${B.sonar.porArquivo["Bronze.java"].duplicated_lines} linhas na <code>Bronze</code> e ${B.sonar.porArquivo["Prata.java"].duplicated_lines} na <code>Prata</code>, a <code>Ouro</code> com ${B.sonar.porArquivo["Ouro.java"].duplicated_lines}.</p><p>As classes de uma Strategy têm <b>a mesma forma</b>: os mesmos métodos, na mesma ordem, quase com o mesmo corpo. A <code>Bronze</code> e a <code>Prata</code> diferem só no <code>frete</code> e no número de dias. Repare: o bloco de 18 linhas só cabe se incluir a linha <code>return 2;</code> / <code>return 1;</code> (as linhas iguais em texto, depois dela, são só 17). A comparação do SonarQube olha a <b>forma</b>: um número diferente não quebra a repetição.</p>`,
      quiz: { p: "Isso quer dizer que o Strategy do B está mal escrito?", op: ["sim, é cópia", "não necessariamente"], certa: 1, exp: "Não necessariamente. É <b>repetição estrutural</b> (classes parecidas, cada uma com o seu comportamento), não cópia de lógica. A métrica não separa uma da outra. É a lição que ficou no DECISOES para a próxima versão: uma medida de duplicação que distinga as duas." } },
    { t: "No V5", vista: () => par("B-strategy", "Bronze.java", "Prata.java", "projeto B"),
      txt: `<p>A duplicação média foi de <b>${fmt(V5.duplicacao[0])}%</b> (N0) para <b>${fmt(V5.duplicacao[1])}%</b> (N1). A hipótese \"não repete o comum\" esperava <b>menos</b> duplicação com o harness, e foi <b>contrariada</b>: subiu.</p><p>Os exemplos mostram uma explicação possível, que é só hipótese até alguém olhar os blocos dos pacotes reais: mais classes de nível parecidas (as classes subiram de ${fmt(V5.classes[0])} para ${fmt(V5.classes[1])} em média) dão mais \"repetição\" para o SonarQube.</p>` },
  ];

}

function abaSmells(sec) {
  const D = EX["D-smells"], F = arq("D-smells", "CupomService.java");
  sec.append(el("h2", null, "Code smells e dívida técnica"),
    el("p", { class: "lead", html: "Um <b>code smell</b> é um trecho que funciona, mas sugere problema de manutenção. O SonarQube aponta cada um por uma <b>regra</b> do perfil \"Sonar way\" (599 regras para Java, no padrão), com uma severidade e um <b>esforço</b> estimado para corrigir. A soma dos esforços é a <b>dívida técnica</b> (<code>sqale_index</code>, em minutos)." }));
  const host = el("div"); sec.append(host);
  const SEV = { INFO: "informativa", MINOR: "menor", MAJOR: "maior", CRITICAL: "crítica", BLOCKER: "bloqueadora" };
  const PQ = {
    "java:S1128": "o <code>import java.util.List</code> não é usado: ruído.",
    "java:S1068": "o campo <code>contador</code> nunca é lido nem escrito: código morto.",
    "java:S1135": "um <code>TODO</code> é trabalho pendente esquecido no código. Severidade só informativa, esforço 0.",
    "java:S106": "<code>System.out.println</code> no lugar de um log: em produção, some ou polui a saída, e não tem nível (erro, aviso...).",
    "java:S1192": "o texto <code>\"FRETEGRATIS\"</code> aparece 3 vezes. Se mudar, é preciso lembrar de mudar em todos: melhor uma constante.",
  };
  const passos = D.sonar.issues.map((x) => ({ t: `${x.regra}: ${x.nome}`, x }));
  passos.unshift({ t: "O que o SonarQube achou", todos: true });
  passos.push({ t: "A conta da dívida, e o que ele não viu", fim: true });
  const notasTodas = Object.fromEntries(D.sonar.issues.map((x) => [x.linha, { txt: x.regra.replace("java:", ""), cls: "fora" }]));
  stepper(host, {
    chave: "smells", aba: "smells", passos,
    desenha: (p, i, corpo) => {
      const linhas = {};
      if (p.x) linhas[p.x.linha] = "erro";
      const rep = ln(F, 'if (cupom.equals("FRETEGRATIS"))', ln(F, "public String descricao("));
      const rep2 = ln(F, 'if (cupom.equals("FRETEGRATIS"))', rep + 1);
      if (p.fim) { linhas[rep2] = "regiao"; }
      const extra = [];
      if (p.todos) extra.push(tabela(["linha", "regra", "severidade", "esforço"], D.sonar.issues.map((x) => [x.linha, `<code>${x.regra}</code> ${esc(x.nome)}`, SEV[x.severidade] || x.severidade, x.esforco])));
      if (p.x) extra.push(el("div", { class: "caixa aconteceu" }, el("div", { class: "rotulo" }, "▶ a mensagem do SonarQube"), H(`<p><code>${esc(p.x.msg)}</code></p><p>linha ${p.x.linha} · severidade <b>${SEV[p.x.severidade]}</b> · esforço <b>${p.x.esforco}</b></p>`)), H(`<p><b>Por quê:</b> ${PQ[p.x.regra] || ""}</p>`));
      if (p.fim) {
        const soma = D.sonar.issues.reduce((s, x) => s + parseInt(x.esforco, 10), 0);
        extra.push(el("div", { class: "caixa certo", html: `<p>Soma dos esforços: ${D.sonar.issues.map((x) => x.esforco).join(" + ")} = <b>${soma} min</b>. O <code>sqale_index</code> do projeto: <b>${D.sonar.projeto.sqale_index} min</b> ${sim(soma === D.sonar.projeto.sqale_index)}</p>` }),
          H(`<p><b>O que ele não viu.</b> O <code>descricao</code> testa <code>"FRETEGRATIS"</code> duas vezes (linhas ${rep} e ${rep2}, em roxo): o segundo <code>if</code> nunca é verdadeiro. Nenhuma regra do perfil padrão acusou. (A regra de condição repetida do SonarQube olha cadeias <code>if / else if</code>; aqui são dois <code>if</code> separados.) O SonarQube aponta o que as regras dele descrevem, e só isso.</p>
          <p><b>E os outros projetos?</b> A, B e C: <b>0</b> smells. Código pequeno e limpo quase não dispara regra. No V5, a hipótese \"menos code smells\" deu <b>inconclusiva</b>.</p>`));
      }
      duasColunas(corpo, codigo({ texto: F, lang: "java", titulo: "<b>CupomService.java</b> · projeto D", atual: p.x ? [[p.x.linha, p.x.linha]] : [], linhas, notas: notasTodas }), explicacao({ t: p.t, txt: p.todos ? `<p>${D.sonar.issues.length} code smells. Use <kbd>→</kbd> para ver um por um.</p>` : null }, extra));
    },
  });
}

      ["DIT · profundidade de herança", c.dit, `<p>Quantos níveis de <code>extends</code> até <code>Object</code>. Toda classe que não estende nada vale 1. <b>Implementar uma interface não conta</b>: a <code>Prata implements Nivel</code> continua com DIT 1.</p>`],
      ["RFC · resposta da classe", c.rfc, `<p>Quantos <b>métodos diferentes</b> a classe chama. Achados pelo nome, no código: <code>${chamadas.join(", ") || "nenhum"}</code> = ${chamadas.length}. ${chamadas.length === c.rfc ? sim(true) : `<span class="mini">O CK deu ${c.rfc}: ele conta cada <b>versão</b> de um método separado. Aqui, o <code>append</code> é chamado com texto, com caractere (<code>'\\n'</code>) e com número: são três <code>append</code> diferentes para o Java.</span>`}</p><p class="mini">Construtores (<code>new BigDecimal(...)</code>) não entraram na conta do CK nos exemplos.</p>`],

function resumoCK(lista) {
  // as mesmas contas do aggregate-metrics.mjs (tipos com nome; media, maximo, soma)
  const TIPOS = ["class", "interface", "enum", "record"];
  const cls = lista.filter((c) => TIPOS.includes(c.tipo));
  const media = (k) => cls.reduce((s, c) => s + c[k], 0) / cls.length;
  const max = (k) => Math.max(...cls.map((c) => c[k]));
  return { tipos: cls.length, cbo_media: media("cbo"), cbo_max: max("cbo"), wmc_soma: lista.reduce((s, c) => s + c.wmc, 0), wmc_max: max("wmc"), lcom_media: media("lcom"), rfc_media: media("rfc"), dit_max: max("dit") };
}

  const seta = (a, b, melhor) => a === b ? "=" : (b < a) === (melhor === "menos") ? '<span class="sim">' + (b < a ? "▼" : "▲") + "</span>" : '<span class="nao">' + (b < a ? "▼" : "▲") + "</span>";
  const linhas = [
    ["linhas de código", "sonar", A.sonar.projeto.ncloc, B.sonar.projeto.ncloc, "menos"],
    ["classes", "sonar", A.sonar.projeto.classes, B.sonar.projeto.classes, null],
    ["complexidade ciclomática", "sonar", A.sonar.projeto.complexity, B.sonar.projeto.complexity, "menos"],
    ["★ complexidade cognitiva", "sonar", A.sonar.projeto.cognitive_complexity, B.sonar.projeto.cognitive_complexity, "menos"],
    ["duplicação (%)", "sonar", A.sonar.projeto.duplicated_lines_density, B.sonar.projeto.duplicated_lines_density, "menos"],
    ["code smells", "sonar", A.sonar.projeto.code_smells, B.sonar.projeto.code_smells, "menos"],
    ["CBO médio", "CK", ra.cbo_media, rb.cbo_media, "menos"],
    ["CBO máximo", "CK", ra.cbo_max, rb.cbo_max, "menos"],
    ["WMC somado", "CK", ra.wmc_soma, rb.wmc_soma, "menos"],

  sec.append(el("h2", null, "A × B: o mesmo frete, dois desenhos"),

      el("div", { class: "painel" }, H(`<h3 style="margin-top:0">A troca</h3>
        <p>O Strategy <b>concentra</b> a complexidade: a <b>cognitiva</b> cai (${A.sonar.projeto.cognitive_complexity} → ${B.sonar.projeto.cognitive_complexity}) e a classe mais complexa fica mais simples (WMC máximo ${ra.wmc_max} → ${rb.wmc_max}). Em troca, há <b>mais código</b> (${A.sonar.projeto.ncloc} → ${B.sonar.projeto.ncloc} linhas), <b>mais classes</b> (${A.sonar.projeto.classes} → ${B.sonar.projeto.classes}), <b>mais acoplamento</b> médio (a interface e o mapa ligam todo mundo), a <b>duplicação estrutural</b> das classes parecidas e o <b>LCOM</b> alto das classes sem estado.</p>
        <p>Nenhuma métrica sozinha diz "melhor desenho". Cada uma mede uma coisa, e o Strategy troca umas pelas outras.</p>
        <h3>E no V5?</h3>`),
        tabela(["média por execução", "N0", "N1", "N2", "N3"], [
          ["★ complexidade cognitiva", ...V5.cognitiva.map(fmt)],

}

function abaAuto(sec) {
  const Q = [
    ["O SonarQube e o CK precisaram de validação como o Semgrep? Por quê?", "Não da mesma forma. As regras e as métricas são as <b>padrão</b> das ferramentas (o perfil \"Sonar way\", as métricas de Chidamber e Kemerer), usadas na indústria e na pesquisa; qualquer um reproduz com as mesmas versões. O que o TCC garante é que as versões são as travadas (hash) e que os scripts só rodam e juntam. O Semgrep é diferente porque as regras são <b>nossas</b>."],
    ["Qual a diferença entre a complexidade ciclomática e a cognitiva?", "A ciclomática conta <b>caminhos</b>: +1 por método e por decisão, sem ligar para aninhamento. A cognitiva tenta medir <b>esforço de leitura</b>: método não conta, o <code>else</code> conta, e cada nível de aninhamento encarece. Num desenho com muitos métodos pequenos (Strategy), a ciclomática sobe e a cognitiva cai."],
    ["Por que a hipótese principal de qualidade usa a cognitiva?", "Porque ela mede o que o padrão promete melhorar: tirar a decisão \"qual nível?\" do meio do código e evitar <code>if</code> em escada. A ciclomática puniria o Strategy só por ter mais métodos (no exemplo, dobrou)."],
    ["O B (Strategy) teve 20% de duplicação. Isso prova que ele é pior?", "Não. É <b>repetição estrutural</b>: classes com a mesma forma, cada uma com o seu comportamento. A medida de duplicação do SonarQube não separa isso de cópia de lógica. Por isso a hipótese \"não repete o comum\" contrariada no V5 pede cuidado na interpretação."],
    ["Por que o LCOM de uma classe de nível (Bronze) é 10, e o que isso diz?", "Ela tem 5 métodos e nenhum campo: os 10 pares de métodos não compartilham campo, e todos contam. O LCOM clássico pune classe sem estado, mesmo coesa por desenho. Não quer dizer que a classe é ruim."],
    ["O que o CBO conta, e o que fica de fora?", "Os outros tipos do <b>projeto</b> que a classe usa. Nos exemplos, os tipos do Java (<code>String</code>, <code>BigDecimal</code>, <code>Map</code>) não entraram. Um Strategy aumenta o CBO médio: a interface e o mapa ligam várias classes."],
    ["O que é a dívida técnica do SonarQube?", "A soma dos esforços estimados para corrigir cada code smell, em minutos (<code>sqale_index</code>). No exemplo D: 1 + 5 + 0 + 10 + 8 = 24 min. É uma estimativa do fabricante, não uma medida de tempo real."],
    ["O que o TCC escolheu, nas métricas?", "Quais medidas pedir (9 do SonarQube, as do CK), as versões travadas, e o <b>resumo</b> por execução no <code>aggregate-metrics.mjs</code>: média ou máximo ou soma, só sobre as classes com nome. E quais colunas entram em quais hipóteses (<code>hipoteses.mjs</code>)."],
  ];
  sec.append(el("h2", null, "Cuidados de leitura e autoavaliação"),
    el("div", { class: "painel", style: "max-width:900px;margin-bottom:12px" }, H(`<h3 style="margin-top:0">O que as métricas não dizem</h3><ul>
      <li><b>Nenhuma diz "bom desenho".</b> Cada uma mede uma coisa; um padrão troca umas pelas outras (aba A × B).</li>
      <li><b>Média esconde forma.</b> O TCC compara médias por execução; uma execução com uma classe enorme e várias pequenas pode ter a mesma média de outra bem distribuída. O WMC máximo ajuda a ver isso.</li>
      <li><b>Pequeno quase não pontua.</b> Code smells e duplicação dependem de tamanho: código curto e limpo tende a zero.</li>
      <li><b>As ferramentas não sabem o enunciado.</b> Uma classe que ninguém usa é medida igual a uma usada.</li>
    </ul>`)),
    el("p", { class: "lead" }, "Responda de cabeça antes de abrir."),
    el("div", { style: "max-width:900px" }, Q.map(([q, r], k) => el("details", { class: "r" }, el("summary", { html: `${k + 1}. ${q}` }), H(`<p>${r}</p>`)))));
}

const SECOES = {}, BOTOES = {}, PRONTAS = new Set();

function mostraAba(id) {
  if (!SECOES[id]) id = "mapa";
  ABA_ATUAL = id;
  lembra("aba", id);
  for (const a of ABAS) { SECOES[a.id].classList.toggle("ativa", a.id === id); BOTOES[a.id].classList.toggle("ativa", a.id === id); }
  if (!PRONTAS.has(id)) {

  }
  BOTOES[id].scrollIntoView({ block: "nearest", inline: "nearest" });
  window.scrollTo({ top: 0 });
}

(function inicia() {

  const main = document.querySelector("main");
  for (const a of ABAS) {

    main.append(SECOES[a.id]);
  }
  const temas = ["auto", "light", "dark"], nomes = { auto: "tema: automático", light: "tema: claro", dark: "tema: escuro" };

  const bt = document.querySelector("button.tema");
  const pinta = () => { if (tema === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", tema); bt.textContent = nomes[tema]; };
  bt.onclick = () => { tema = temas[(temas.indexOf(tema) + 1) % temas.length]; lembra("tema", tema); pinta(); };
  pinta();
  mostraAba(MEM.aba || "mapa");
})();
