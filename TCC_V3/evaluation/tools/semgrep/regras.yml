  - id: p5-nome
    languages: [regex]
    severity: INFO
    message: o nome de uma regiao aparece no codigo (alarme)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\b|\b\w*(?:Sudeste|Sul|CentroOeste|Norte|Nordeste)\w*\b'
  - id: p5-enum-corpo
    languages: [regex]
    severity: INFO
    message: constante de regiao com corpo proprio
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?m)^\s*(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\s*(?:\((?:[^()]|\([^()]*\))*\))?\s*\{'
  - id: p5-enum-dados
    languages: [regex]
    severity: INFO
    message: constante de regiao que so carrega valores
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?m)^\s*(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\s*\((?:[^()]|\([^()]*\))*\)\s*[,;]'
  - id: p5-classe-regiao
    languages: [regex]
    severity: INFO
    message: classe por regiao
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bclass\s+\w*(?:Sudeste|Sul|CentroOeste|Norte|Nordeste)\w*[^{]*\b(?:implements|extends)\b'
  - id: p5-mapa
    languages: [regex]
    severity: INFO
    message: mapa de regiao para valor
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?:Map\.(?:of|entry)\s*\(\s*|put\s*\(\s*)"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*,\s*(?!new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String)\b)[A-Z]\w*\s*\()'
  - id: p5-mapa-objeto
    languages: [regex]
    severity: INFO
    message: mapa de regiao para objeto (estrategia)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '(?:Map\.(?:of|entry)\s*\(\s*|put\s*\(\s*)"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*,\s*new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String)\b)[A-Z]\w*\s*\('
  - id: p5-switch-label
    languages: [regex]
    severity: INFO
    message: rotulo de switch ou condicao que nomeia uma regiao
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*(?:,|->|:)|"(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"\s*\.equals|[=!]=\s*(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)\b'
  - id: p5-switch-fabrica
    languages: [regex]
    severity: INFO
    message: switch de regiao que devolve objeto
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:SUDESTE|SUL|CENTRO_OESTE|NORTE|NORDESTE)"?\s*(?:->|:)\s*(?:return\s+)?new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String)\b)[A-Z]\w*\s*\('
