# GERADO por gerar-regras.mjs. Nao edite a mao: mude o gerador e gere de novo.
rules:
  - id: p1-cond-calc
    languages: [java]
    severity: INFO
    message: condicao que nomeia um caso e faz conta
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern-either:
          - pattern: $X == $C
          - pattern: $X != $C
          - pattern: $C.equals($X)
          - pattern: $X.equals($C)
          - pattern: $X.equalsIgnoreCase($C)
          - pattern: $C.equalsIgnoreCase($X)
      - metavariable-regex:
          metavariable: $C
          regex: ^"?([A-Za-z_]\w*\.)*(ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY)"?$
      # validacao: um if cujo corpo recusa o pedido, mesmo um nivel abaixo
      - pattern-not-inside: if (...) throw $E;
      - pattern-not-inside: if (...) { ... throw $E; ... }
  - id: p1-cond-validacao
    languages: [java]
    severity: INFO
    message: condicao que nomeia um caso so para recusar
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern-either:
          - pattern-inside: if (...) throw $E;
          - pattern-inside: if (...) { ... throw $E; ... }
      - pattern-either:
          - pattern: $X == $C
          - pattern: $X != $C
          - pattern: $C.equals($X)
          - pattern: $X.equals($C)
          - pattern: $X.equalsIgnoreCase($C)
          - pattern: $C.equalsIgnoreCase($X)
      - metavariable-regex:
          metavariable: $C
          regex: ^"?([A-Za-z_]\w*\.)*(ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY)"?$
  - id: p1-instanceof
    languages: [java]
    severity: INFO
    message: instanceof de uma classe de caso
    paths: { include: ["**/src/main/**/*.java"] }
    patterns:
      - pattern: $X instanceof $K
      - metavariable-regex: { metavariable: $K, regex: "(Economica|Expressa|Retirada|Motoboy)" }
  - id: p1-switch-label
    languages: [regex]
    severity: INFO
    message: rotulo de switch que nomeia um caso
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY)"?\s*(?:,|->|:)'
  - id: p1-switch-fabrica
    languages: [regex]
    severity: INFO
    message: rotulo de switch que so devolve um objeto (fabrica ou registro)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\bcase\s+"?(?:\w+\.)?(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY)"?\s*(?:->|:)\s*(?:return\s+)?(?:new\s+(?!(?:BigDecimal|BigInteger|Double|Integer|Long|Float|String)\b)[A-Z]\w*\s*\(|[A-Z]\w*\.(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY)\b)'
  - id: p1-nome
    languages: [regex]
    severity: INFO
    message: o nome de um caso aparece no codigo (alarme - sem nenhum, o agente usou outros nomes)
    paths: { include: ["**/src/main/**/*.java"] }
    pattern-regex: '\b(?:ECONOMICA|EXPRESSA|RETIRADA_LOJA|MOTOBOY)\b|\b\w*(?:Economica|Expressa|Retirada|Motoboy)\w*\b'

