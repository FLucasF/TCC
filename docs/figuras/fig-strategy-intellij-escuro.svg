<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"><rect width="640" height="300" fill="#FFFFFF"/><rect x="2.75" y="4.75" width="312.5" height="240.5" rx="8" fill="#2B2B2B" stroke="#5F6C7C" stroke-width="1.5"/><path d="M2 34V12Q2 4 10 4H308Q316 4 316 12V34Z" fill="#5F6C7C"/><text x="159" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Sem <tspan font-style="italic">pattern</tspan>: condicional</text><text x="14" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#CC7832">double</tspan><tspan fill="#D4DCE4"> </tspan><tspan fill="#FFC66D">preco</tspan><tspan fill="#D4DCE4">(String plano,</tspan></text><text x="14" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">             </tspan><tspan fill="#CC7832">double</tspan><tspan fill="#D4DCE4"> diaria, </tspan><tspan fill="#CC7832">int</tspan><tspan fill="#D4DCE4"> noites) {</tspan></text><text x="14" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">if</tspan><tspan fill="#D4DCE4"> (plano.equals(</tspan><tspan fill="#8FB573">"normal"</tspan><tspan fill="#D4DCE4">))</tspan></text><text x="14" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    </tspan><tspan fill="#CC7832">return</tspan><tspan fill="#D4DCE4"> diaria * noites;</tspan></text><text x="14" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">if</tspan><tspan fill="#D4DCE4"> (plano.equals(</tspan><tspan fill="#8FB573">"fimDeSemana"</tspan><tspan fill="#D4DCE4">))</tspan></text><text x="14" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    </tspan><tspan fill="#CC7832">return</tspan><tspan fill="#D4DCE4"> diaria * noites + </tspan><tspan fill="#6897BB">30</tspan><tspan fill="#D4DCE4">;</tspan></text><text x="14" y="166" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">if</tspan><tspan fill="#D4DCE4"> (plano.equals(</tspan><tspan fill="#8FB573">"pacote"</tspan><tspan fill="#D4DCE4">))</tspan></text><text x="14" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    </tspan><tspan fill="#CC7832">return</tspan><tspan fill="#D4DCE4"> diaria * (noites - </tspan><tspan fill="#6897BB">1</tspan><tspan fill="#D4DCE4">);</tspan></text><text x="14" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">throw</tspan><tspan fill="#D4DCE4"> </tspan><tspan fill="#CC7832">new</tspan><tspan fill="#D4DCE4"> IllegalArgumentException();</tspan></text><text x="14" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">}</tspan></text><text x="159" y="267" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada plano novo obriga a alterar este método.</text><rect x="324.75" y="4.75" width="312.5" height="240.5" rx="8" fill="#2B2B2B" stroke="#1F5FAE" stroke-width="1.5"/><path d="M324 34V12Q324 4 332 4H630Q638 4 638 12V34Z" fill="#1F5FAE"/><text x="481" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Com o <tspan font-style="italic">pattern</tspan> Strategy</text><text x="336" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#CC7832">interface</tspan><tspan fill="#D4DCE4"> PlanoTarifa {</tspan></text><text x="336" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill=