<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340"><rect width="640" height="340" fill="#FFFFFF"/><rect x="2.75" y="4.75" width="312.5" height="286.5" rx="8" fill="#FFFFFF" stroke="#5F6C7C" stroke-width="1.5"/><path d="M2 34V12Q2 4 10 4H308Q316 4 316 12V34Z" fill="#5F6C7C"/><text x="159" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Sem <tspan font-style="italic">pattern</tspan>: sequência repetida</text><text x="14" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">String </tspan><tspan fill="#00627A">ocupacao</tspan><tspan fill="#080808">(String mes) {</tspan></text><text x="14" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">return</tspan><tspan fill="#080808"> titulo(</tspan><tspan fill="#067D17">"occupancy"</tspan><tspan fill="#080808">)</tspan></text><text x="14" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    + cabecalhoOcupacao()</tspan></text><text x="14" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    + linhasOcupacao(mes)</tspan></text><text x="14" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    + totalOcupacao(mes);</tspan></text><text x="14" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="14" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">String </tspan><tspan fill="#00627A">financeiro</tspan><tspan fill="#080808">(String mes) {</tspan></text><text x="14" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">return</tspan><tspan fill="#080808"> titulo(</tspan><tspan fill="#067D17">"revenue"</tspan><tspan fill="#080808">)</tspan></text><text x="14" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    + cabecalhoFinanceiro()</tspan></text><text x="14" y="238" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    + linhasFinanceiro(mes)</tspan></text><text x="14" y="256" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    + totalFinanceiro(mes);</tspan></text><text x="14" y="274" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="159" y="313" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada relatório novo repete a sequência.</text><rect x="324.75" y="4.75" width="312.5" height="286.5" rx="8" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="1.5"/><path d="M324 34V12Q324 4 332 4H630Q638 4 638 12V34Z" fill="#1F5FAE"/><text x="481" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Com o <tspan font-style="italic">pattern</tspan> Template Method</text><text x="336" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#0033B3">abstract</tspan><tspan fill="#080808"> </tspan><tspan fill="#0033B3">class</tspan><tspan fill="#080808"> Relatorio {</tspan></text><text x="336" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">final</tspan><tspan fill="#080808"> String </tspan><tspan fill="#00627A">gerar</tspan><tspan fill="#080808">(String mes) {</tspan></text><text x="336" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    </tspan><tspan fill="#0033B3">return</tspan><tspan fill="#080808"> titulo() + cabecalho()</tspan></text><text x="336" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">      + linhas(mes) + total(mes);</tspan></text><text x="336" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  }</tspan></text><text x="336" y="166" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">abstract</tspan><tspan fill="#080808"> String </tspan><tspan fill="#00627A">cabecalho</tspan><tspan fill="#080808">();</tspan></text><text x="336" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">abstract</tspan><tspan fill="#080808"> String </tspan><tspan fill="#00627A">linhas</tspan><tspan fill="#080808">(String mes);</tspan></text><text x="336" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">abstract</tspan><tspan fill="#080808"> String </tspan><tspan fill="#00627A">total</tspan><tspan fill="#080808">(String mes);</tspan></text><text x="336" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="336" y="238" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#666666" font-style="italic">// Ocupacao e Financeiro: uma subclasse</tspan></text><text x="336" y="256" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#666666" font-style="italic">// cada; titulo() fica em Relatorio</tspan></text><text x="481" y="313" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada relatório novo é uma subclasse,</text><text x="481" y="330" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">e a sequência fica em um lugar só.</text></svg>