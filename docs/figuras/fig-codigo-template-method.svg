<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340"><rect width="640" height="340" fill="#FFFFFF"/><rect x="2.75" y="4.75" width="312.5" height="286.5" rx="8" fill="#2B2B2B" stroke="#5F6C7C" stroke-width="1.5"/><path d="M2 34V12Q2 4 10 4H308Q316 4 316 12V34Z" fill="#5F6C7C"/><text x="159" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Sem <tspan font-style="italic">pattern</tspan>: sequência repetida</text><text x="14" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">String </tspan><tspan fill="#FFC66D">ocupacao</tspan><tspan fill="#D4DCE4">(String mes) {</tspan></text><text x="14" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">return</tspan><tspan fill="#D4DCE4"> titulo(</tspan><tspan fill="#8FB573">"occupancy"</tspan><tspan fill="#D4DCE4">)</tspan></text><text x="14" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    + cabecalhoOcupacao()</tspan></text><text x="14" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    + linhasOcupacao(mes)</tspan></text><text x="14" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    + totalOcupacao(mes);</tspan></text><text x="14" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">}</tspan></text><text x="14" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">String </tspan><tspan fill="#FFC66D">financeiro</tspan><tspan fill="#D4DCE4">(String mes) {</tspan></text><text x="14" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">return</tspan><tspan fill="#D4DCE4"> titulo(</tspan><tspan fill="#8FB573">"revenue"</tspan><tspan fill="#D4DCE4">)</tspan></text><text x="14" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    + cabecalhoFinanceiro()</tspan></text><text x="14" y="238" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    + linhasFinanceiro(mes)</tspan></text><text x="14" y="256" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    + totalFinanceiro(mes);</tspan></text><text x="14" y="274" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">}</tspan></text><text x="159" y="313" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada relatório novo repete a sequência.</text><rect x="324.75" y="4.75" width="312.5" height="286.5" rx="8" fill="#2B2B2B" stroke="#1F5FAE" stroke-width="1.5"/><path d="M324 34V12Q324 4 332 4H630Q638 4 638 12V34Z" fill="#1F5FAE"/><text x="481" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Com o <tspan font-style="italic">pattern</tspan> Template Method</text><text x="336" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#CC7832">abstract</tspan><tspan fill="#D4DCE4"> </tspan><tspan fill="#CC7832">class</tspan><tspan fill="#D4DCE4"> Relatorio {</tspan></text><text x="336" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">final</tspan><tspan fill="#D4DCE4"> String </tspan><tspan fill="#FFC66D">gerar</tspan><tspan fill="#D4DCE4">(String mes) {</tspan></text><text x="336" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">    </tspan><tspan fill="#CC7832">return</tspan><tspan fill="#D4DCE4"> titulo() + cabecalho()</tspan></text><text x="336" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">      + linhas(mes) + total(mes);</tspan></text><text x="336" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  }</tspan></text><text x="336" y="166" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">abstract</tspan><tspan fill="#D4DCE4"> String </tspan><tspan fill="#FFC66D">cabecalho</tspan><tspan fill="#D4DCE4">();</tspan></text><text x="336" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">abstract</tspan><tspan fill="#D4DCE4"> String </tspan><tspan fill="#FFC66D">linhas</tspan><tspan fill="#D4DCE4">(String mes);</tspan></text><text x="336" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">  </tspan><tspan fill="#CC7832">abstract</tspan><tspan fill="#D4DCE4"> String </tspan><tspan fill="#FFC66D">total</tspan><tspan fill="#D4DCE4">(String mes);</tspan></text><text x="336" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#D4DCE4">}</tspan></text><text x="336" y="238" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#9A9A9A" font-style="italic">// Ocupacao e Financeiro: uma subclasse</tspan></text><text x="336" y="256" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#9A9A9A" font-style="italic">// cada; titulo() fica em Relatorio</tspan></text><text x="481" y="313" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada relatório novo é uma subclasse,</text><text x="481" y="330" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">e a sequência fica em um lugar só.</text></svg>