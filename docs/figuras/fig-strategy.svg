<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" height="282"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#566373"/></marker></defs><rect width="640" height="282" fill="#FFFFFF"/>
<rect x="6" y="8" width="310" height="226" rx="8" fill="#F4F7FB" stroke="#C4D1E0" stroke-width="1"/>
<path d="M6,38 V16 Q6,8 14,8 H308 Q316,8 316,16 V38 Z" fill="#7A8797"/>
<text x="161" y="28" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#FFFFFF" xml:space="preserve">Sem pattern: condicional</text>
<rect x="324" y="8" width="310" height="226" rx="8" fill="#E1ECF9" stroke="#1F5FAF" stroke-width="1.2"/>
<path d="M324,38 V16 Q324,8 332,8 H626 Q634,8 634,16 V38 Z" fill="#1F5FAF"/>
<text x="479" y="28" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#FFFFFF" xml:space="preserve">Com o pattern Strategy</text>
<text x="18" y="60" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">double preco(String plano,</text>
<text x="18" y="77" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">             double diaria, int noites) {</text>
<text x="18" y="94" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">  if (plano.equals(&quot;normal&quot;))</text>
<text x="18" y="111" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">    return diaria * noites;</text>
<text x="18" y="128" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">  if (plano.equals(&quot;fimDeSemana&quot;))</text>
<text x="18" y="145" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">    return diaria * noites + 30;</text>
<text x="18" y="162" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">  if (plano.equals(&quot;pacote&quot;))</text>
<text x="18" y="179" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">    return diaria * (noites - 1);</text>
<text x="18" y="196" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">  throw new IllegalArgumentException();</text>
<text x="18" y="213" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">}</text>
<text x="336" y="60" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">interface PlanoTarifa {</text>
<text x="336" y="77" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">  double preco(double diaria, int noites);</text>
<text x="336" y="94" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">}</text>
<text x="336" y="111" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve"></text>
<text x="336" y="128" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">class Normal implements PlanoTarifa {</text>
<text x="336" y="145" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">  public double preco(double d, int n) {</text>
<text x="336" y="162" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">    return d * n;</text>
<text x="336" y="179" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">  }</text>
<text x="336" y="196" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">}</text>
<text x="336" y="213" font-family="Courier New" font-size="11" text-anchor="start" font-weight="normal" fill="#1C2733" xml:space="preserve">// FimDeSemana e Pacote: uma classe cada</text>
<text x="161" y="256" font-family="Arial" font-size="12" text-anchor="middle" font-weight="normal" fill="#1C2733" xml:space="preserve">Cada plano novo obriga a alterar</text>
<text x="161" y="272" font-family="Arial" font-size="12" text-anchor="middle" font-weight="normal" fill="#1C2733" xml:space="preserve">este método.</text>
<text x="479" y="256" font-family="Arial" font-size="12" text-anchor="middle" font-weight="normal" fill="#1C2733" xml:space="preserve">Cada plano novo é uma classe nova, e o</text>
<text x="479" y="272" font-family="Arial" font-size="12" text-anchor="middle" font-weight="normal" fill="#1C2733" xml:space="preserve">código existente não muda.</text>
</svg>
