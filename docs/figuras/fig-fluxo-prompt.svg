<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 672" width="640" height="672"><rect width="640" height="672" fill="#FFFFFF"/><rect x="200" y="8" width="266" height="36" rx="7" fill="#1F5FAF" stroke="none" stroke-width="1"/><text x="333" y="31" font-family="Arial" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. O usuário envia o pedido (prompt)</text><line x1="333" y1="44" x2="333" y2="61" stroke="#566373" stroke-width="1.5"/><polygon points="333,61 329.4,54.0 336.6,54.0" fill="#566373"/><rect x="166" y="62" width="334" height="392" rx="9" fill="#F4F7FB" stroke="#C4D1E0" stroke-width="1"/><path d="M166 90V71Q166 62 175 62H491Q500 62 500 71V90Z" fill="#3B4A5C"/><text x="333" y="81" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Harness (Claude Code)</text><line x1="333" y1="90" x2="333" y2="109" stroke="#566373" stroke-width="1.5"/><polygon points="333,109 329.4,102.0 336.6,102.0" fill="#566373"/><rect x="200" y="110" width="266" height="54" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="333.0" y="127.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">2. Monta a entrada do modelo</text><text x="333.0" y="141.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">pedido + CLAUDE.md + descrições das</text><text x="333.0" y="154.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">skills + lista de ferramentas</text><line x1="333" y1="164" x2="333" y2="181" stroke="#566373" stroke-width="1.5"/><polygon points="333,181 329.4,174.0 336.6,174.0" fill="#566373"/><rect x="200" y="182" width="266" height="50" rx="7" fill="#123F7A" stroke="#123F7A" stroke-width="1"/><text x="333.0" y="204.25" font-family="Arial" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. Modelo (LLM)</text><text x="333.0" y="217.75" font-family="Arial" font-size="10.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">lê a entrada e decide o próximo passo</text><line x1="333" y1="232" x2="333" y2="397" stroke="#566373" stroke-width="1.5"/><polygon points="333,232 336.6,239.0 329.4,239.0" fill="#566373"/><polygon points="333,397 329.4,390.0 336.6,390.0" fill="#566373"/><text x="341" y="248" font-family="Arial" font-size="10" font-weight="normal" fill="#566373" text-anchor="start">o resultado volta ao modelo</text><rect x="176" y="256" width="130" height="54" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="241.0" y="273.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Abre a skill</text><text x="241.0" y="287.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">carrega as instruções</text><text x="241.0" y="300.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">(detalhe abaixo)</text><rect x="176" y="322" width="130" height="54" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="241.0" y="339.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Delega ao subagente</text><text x="241.0" y="353.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">revisão em contexto</text><text x="241.0" y="366.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">próprio</text><rect x="360" y="289" width="130" height="54" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="425.0" y="306.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Usa uma ferramenta</text><text x="425.0" y="320.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">lê e edita arquivos,</text><text x="425.0" y="333.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">executa testes</text><line x1="306" y1="283" x2="333" y2="283" stroke="#566373" stroke-width="1.5"/><polygon points="333,283 326.0,279.4 326.0,286.6" fill="#566373"/><polygon points="306,283 313.0,286.6 313.0,279.4" fill="#566373"/><line x1="306" y1="349" x2="333" y2="349" stroke="#566373" stroke-width="1.5"/><polygon points="333,349 326.0,345.4 326.0,352.6" fill="#566373"/><polygon points="306,349 313.0,352.6 313.0,345.4" fill="#566373"/><line x1="333" y1="316" x2="360" y2="316" stroke="#566373" stroke-width="1.5"/><polygon points="360,316 353.0,312.4 353.0,319.6" fill="#566373"/><polygon points="333,316 340.0,319.6 340.0,312.4" fill="#566373"/><rect x="230" y="398" width="206" height="44" rx="7" fill="#E1ECF9" stroke="#1F5FAF" stroke-width="1"/><text x="333.0" y="417.25" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">4. Tarefa concluída</text><text x="333.0" y="430.75" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">o agente responde ao usuário</text><rect x="8" y="62" width="142" height="392" rx="9" fill="#E1ECF9" stroke="#1F5FAF" stroke-width="1.5"/><path d="M8 102V71Q8 62 17 62H141Q150 62 150 71V102Z" fill="#1F5FAF"/><text x="79" y="79" font-family="Arial" font-size="10.8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Configuração do harness</text><text x="79" y="94" font-family="Arial" font-size="10.5" font-weight="normal" fill="#FFFFFF" text-anchor="middle">a variável estudada</text><rect x="16" y="110" width="126" height="54" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="79.0" y="127.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#123F7A" text-anchor="middle">CLAUDE.md</text><text x="79.0" y="141.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">orientações carregadas</text><text x="79.0" y="154.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">a cada sessão</text><rect x="16" y="256" width="126" height="54" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="79.0" y="273.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#123F7A" text-anchor="middle">Skill</text><text x="79.0" y="287.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">instruções abertas</text><text x="79.0" y="300.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">durante a tarefa</text><rect x="16" y="322" width="126" height="54" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="79.0" y="339.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#123F7A" text-anchor="middle">Processo</text><text x="79.0" y="353.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">plano breve e</text><text x="79.0" y="366.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">subagente revisor</text><text x="79" y="406" font-family="Arial" font-size="10.5" font-weight="normal" fill="#566373" text-anchor="middle">No nível N0, o harness</text><text x="79" y="420" font-family="Arial" font-size="10.5" font-weight="normal" fill="#566373" text-anchor="middle">roda sem configuração.</text><line x1="142" y1="137" x2="199" y2="137" stroke="#566373" stroke-width="1.5"/><polygon points="199,137 192.0,133.4 192.0,140.6" fill="#566373"/><line x1="142" y1="283" x2="175" y2="283" stroke="#566373" stroke-width="1.5"/><polygon points="175,283 168.0,279.4 168.0,286.6" fill="#566373"/><line x1="142" y1="349" x2="175" y2="349" stroke="#566373" stroke-width="1.5"/><polygon points="175,349 168.0,345.4 168.0,352.6" fill="#566373"/><rect x="516" y="262" width="116" height="108" rx="9" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><path d="M516 288V271Q516 262 525 262H623Q632 262 632 271V288Z" fill="#7A8798"/><text x="574" y="280" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ambiente</text><text x="574" y="312" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">arquivos do projeto,</text><text x="574" y="328" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">terminal, testes</text><text x="574" y="344" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">e banco de dados</text><line x1="490" y1="308" x2="515" y2="308" stroke="#566373" stroke-width="1.5"/><polygon points="515,308 508.0,304.4 508.0,311.6" fill="#566373"/><line x1="515" y1="325" x2="490" y2="325" stroke="#566373" stroke-width="1.5"/><polygon points="490,325 497.0,328.6 497.0,321.4" fill="#566373"/><rect x="8" y="466" width="624" height="198" rx="9" fill="#F4F7FB" stroke="#C4D1E0" stroke-width="1"/><path d="M8 492V475Q8 466 17 466H623Q632 466 632 475V492Z" fill="#123F7A"/><text x="320" y="484" font-family="Arial" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Detalhe: como o modelo escolhe a skill</text><rect x="18" y="504" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="83.0" y="524.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Lista de skills</text><text x="83.0" y="538.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">nome e descrição de cada</text><text x="83.0" y="551.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">uma, já na entrada</text><rect x="176" y="504" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="241.0" y="524.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Comparação</text><text x="241.0" y="538.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">pedido × descrições;</text><text x="241.0" y="551.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">a decisão é do modelo</text><rect x="334" y="504" width="130" height="60" rx="7" fill="#E1ECF9" stroke="#1F5FAF" stroke-width="1"/><text x="399.0" y="524.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Alguma se aplica?</text><text x="399.0" y="538.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">ou o CLAUDE.md manda</text><text x="399.0" y="551.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">usar a skill?</text><rect x="492" y="504" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="557.0" y="524.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Segue sem skill</text><text x="557.0" y="538.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">usa uma ferramenta</text><text x="557.0" y="551.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">ou responde</text><rect x="334" y="594" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="399.0" y="614.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Chama a skill</text><text x="399.0" y="628.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">pelo nome (o usuário</text><text x="399.0" y="641.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">também pode usar /nome)</text><rect x="176" y="594" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="241.0" y="614.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Conteúdo entra</text><text x="241.0" y="628.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">o texto do SKILL.md</text><text x="241.0" y="641.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">vai para a conversa</text><rect x="18" y="594" width="130" height="60" rx="7" fill="#FFFFFF" stroke="#C4D1E0" stroke-width="1"/><text x="83.0" y="614.5" font-family="Arial" font-size="11.5" font-weight="bold" fill="#1C2733" text-anchor="middle">Modelo continua</text><text x="83.0" y="628.0" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">segue as instruções</text><text x="83.0" y="641.5" font-family="Arial" font-size="10.5" font-weight="normal" fill="#1C2733" text-anchor="middle">e volta ao passo 3</text><line x1="148" y1="534" x2="175" y2="534" stroke="#566373" stroke-width="1.5"/><polygon points="175,534 168.0,530.4 168.0,537.6" fill="#566373"/><line x1="306" y1="534" x2="333" y2="534" stroke="#566373" stroke-width="1.5"/><polygon points="333,534 326.0,530.4 326.0,537.6" fill="#566373"/><line x1="464" y1="534" x2="491" y2="534" stroke="#566373" stroke-width="1.5"/><polygon points="491,534 484.0,530.4 484.0,537.6" fill="#566373"/><text x="478" y="528" font-family="Arial" font-size="10" font-weight="bold" fill="#566373" text-anchor="middle">não</text><line x1="399" y1="564" x2="399" y2="593" stroke="#566373" stroke-width="1.5"/><polygon points="399,593 395.4,586.0 402.6,586.0" fill="#566373"/><text x="406" y="582" font-family="Arial" font-size="10" font-weight="bold" fill="#566373" text-anchor="start">sim</text><line x1="334" y1="624" x2="307" y2="624" stroke="#566373" stroke-width="1.5"/><polygon points="307,624 314.0,627.6 314.0,620.4" fill="#566373"/><line x1="176" y1="624" x2="149" y2="624" stroke="#566373" stroke-width="1.5"/><polygon points="149,624 156.0,627.6 156.0,620.4" fill="#566373"/></svg>