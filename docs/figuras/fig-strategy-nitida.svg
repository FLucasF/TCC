<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"><rect width="640" height="300" fill="#FFFFFF"/><rect x="2.75" y="4.75" width="312.5" height="240.5" rx="8" fill="#F3F6FB" stroke="#5F6C7C" stroke-width="1.5"/><path d="M2 34V12Q2 4 10 4H308Q316 4 316 12V34Z" fill="#5F6C7C"/><text x="159" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Sem <tspan font-style="italic">pattern</tspan>: condicional</text><text x="14" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">double preco(String plano,</text><text x="14" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">             double diaria, int noites) {</text><text x="14" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">  if (plano.equals("normal"))</text><text x="14" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">    return diaria * noites;</text><text x="14" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">  if (plano.equals("fimDeSemana"))</text><text x="14" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">    return diaria * noites + 30;</text><text x="14" y="166" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">  if (plano.equals("pacote"))</text><text x="14" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">    return diaria * (noites - 1);</text><text x="14" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">  throw new IllegalArgumentException();</text><text x="14" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">}</text><text x="159" y="267" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada plano novo obriga a alterar este método.</text><rect x="324.75" y="4.75" width="312.5" height="240.5" rx="8" fill="#E9F0FA" stroke="#1F5FAE" stroke-width="1.5"/><path d="M324 34V12Q324 4 332 4H630Q638 4 638 12V34Z" fill="#1F5FAE"/><text x="481" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Com o <tspan font-style="italic">pattern</tspan> Strategy</text><text x="336" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">interface PlanoTarifa {</text><text x="336" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">  double preco(double diaria, int noites);</text><text x="336" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">}</text><text x="336" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">class Normal implements PlanoTarifa {</text><text x="336" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">  public double preco(double d, int n) {</text><text x="336" y="166" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">    return d * n;</text><text x="336" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">  }</text><text x="336" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">}</text><text x="336" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" fill="#000000" xml:space="preserve">// FimDeSemana e Pacote: uma classe cada</text><text x="481" y="267" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada plano novo é uma classe nova,</text><text x="481" y="284" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">e o código existente não muda.</text></svg>