<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" width="640" height="286"><rect width="640" height="286" fill="#FFFFFF"/><rect x="2.75" y="4.75" width="312.5" height="232.5" rx="8" fill="#FFFFFF" stroke="#5F6C7C" stroke-width="1.5"/><path d="M2 34V12Q2 4 10 4H308Q316 4 316 12V34Z" fill="#5F6C7C"/><text x="159" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Sem <tspan font-style="italic">pattern</tspan>: chamadas diretas</text><text x="14" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#0033B3">void</tspan><tspan fill="#080808"> </tspan><tspan fill="#00627A">confirmar</tspan><tspan fill="#080808">(Reserva r) {</tspan></text><text x="14" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  r.confirmar();</tspan></text><text x="14" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  emailGovernanca(r);</tspan></text><text x="14" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  emailFinanceiro(r);</tspan></text><text x="14" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#666666" font-style="italic">// restaurante: mais uma linha aqui</tspan></text><text x="14" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="159" y="259" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada setor novo obriga a alterar este método.</text><rect x="324.75" y="4.75" width="312.5" height="232.5" rx="8" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="1.5"/><path d="M324 34V12Q324 4 332 4H630Q638 4 638 12V34Z" fill="#1F5FAE"/><text x="481" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Com o <tspan font-style="italic">pattern</tspan> Observer</text><text x="336" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#0033B3">interface</tspan><tspan fill="#080808"> Interessado {</tspan></text><text x="336" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">void</tspan><tspan fill="#080808"> </tspan><tspan fill="#00627A">aoConfirmar</tspan><tspan fill="#080808">(Reserva r);</tspan></text><text x="336" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="336" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#0033B3">void</tspan><tspan fill="#080808"> </tspan><tspan fill="#00627A">confirmar</tspan><tspan fill="#080808">(Reserva r) {</tspan></text><text x="336" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  r.confirmar();</tspan></text><text x="336" y="166" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">for</tspan><tspan fill="#080808"> (Interessado i : interessados)</tspan></text><text x="336" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    i.aoConfirmar(r);</tspan></text><text x="336" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="336" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#666666" font-style="italic">// Governanca, Financeiro: uma classe cada</tspan></text><text x="481" y="259" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada setor novo é uma classe nova,</text><text x="481" y="276" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">e o método não muda.</text></svg>