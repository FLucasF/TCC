<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340"><rect width="640" height="340" fill="#FFFFFF"/><rect x="2.75" y="4.75" width="312.5" height="286.5" rx="8" fill="#FFFFFF" stroke="#5F6C7C" stroke-width="1.5"/><path d="M2 34V12Q2 4 10 4H308Q316 4 316 12V34Z" fill="#5F6C7C"/><text x="159" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Sem <tspan font-style="italic">pattern</tspan>: condicional</text><text x="14" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#0033B3">void</tspan><tspan fill="#080808"> </tspan><tspan fill="#00627A">enviar</tspan><tspan fill="#080808">(Mensagem m) {</tspan></text><text x="14" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">if</tspan><tspan fill="#080808"> (!m.enderecoValido()) {</tspan></text><text x="14" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    bloquear(m);</tspan></text><text x="14" y="112" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    </tspan><tspan fill="#0033B3">return</tspan><tspan fill="#080808">;</tspan></text><text x="14" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  }</tspan></text><text x="14" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  smtp.enviar(m);</tspan></text><text x="14" y="166" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">if</tspan><tspan fill="#080808"> (arquivar)</tspan></text><text x="14" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    smtp.enviar(copia(m));</tspan></text><text x="14" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="159" y="313" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada regra nova obriga a alterar este método.</text><rect x="324.75" y="4.75" width="312.5" height="286.5" rx="8" fill="#FFFFFF" stroke="#1F5FAE" stroke-width="1.5"/><path d="M324 34V12Q324 4 332 4H630Q638 4 638 12V34Z" fill="#1F5FAE"/><text x="481" y="24.5" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Com o <tspan font-style="italic">pattern</tspan> Decorator</text><text x="336" y="58" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#0033B3">interface</tspan><tspan fill="#080808"> Envio {</tspan></text><text x="336" y="76" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">void</tspan><tspan fill="#080808"> </tspan><tspan fill="#00627A">enviar</tspan><tspan fill="#080808">(Mensagem m);</tspan></text><text x="336" y="94" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="336" y="130" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#0033B3">class</tspan><tspan fill="#080808"> ComCopia </tspan><tspan fill="#0033B3">implements</tspan><tspan fill="#080808"> Envio {</tspan></text><text x="336" y="148" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">private</tspan><tspan fill="#080808"> </tspan><tspan fill="#0033B3">final</tspan><tspan fill="#080808"> Envio proximo;</tspan></text><text x="336" y="184" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  </tspan><tspan fill="#0033B3">public</tspan><tspan fill="#080808"> </tspan><tspan fill="#0033B3">void</tspan><tspan fill="#080808"> </tspan><tspan fill="#00627A">enviar</tspan><tspan fill="#080808">(Mensagem m) {</tspan></text><text x="336" y="202" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    proximo.enviar(m);</tspan></text><text x="336" y="220" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">    proximo.enviar(copia(m));</tspan></text><text x="336" y="238" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">  }</tspan></text><text x="336" y="256" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#080808">}</tspan></text><text x="336" y="274" font-family="Consolas" font-size="12.6" font-weight="bold" xml:space="preserve"><tspan fill="#666666" font-style="italic">// new Bloqueio(new ComCopia(new Smtp()))</tspan></text><text x="481" y="313" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">Cada regra nova é uma classe nova,</text><text x="481" y="330" font-family="Arial" font-size="13" fill="#000000" text-anchor="middle">e as combinações ficam na montagem.</text></svg>