# Publica no GitHub Pages SÓ a apresentação da defesa (pasta apresentacao/).
# O restante do repositório não vai para o site: o job copia para uma pasta limpa apenas
# os arquivos que a apresentação usa, e só essa pasta é publicada.
name: Publicar a apresentação

on:
  push:
    branches: [main]
    paths:
      - "apresentacao/**"
      - ".github/workflows/apresentacao.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copiar só o que a apresentação usa
        run: |
          mkdir site site/media
          cp apresentacao/index.html apresentacao/style.css site/
          cp -r apresentacao/vendor site/vendor
          cp apresentacao/media/agente.webm site/media/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
