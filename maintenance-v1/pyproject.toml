# The checks for every Python tool of maintenance-v1 (stdlib only; mypy and ruff are development tools).
#   python -m mypy        types, strict
#   python -m ruff check  style and pitfalls, including a file opened without encoding="utf-8"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["evaluation"]
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E/F/W: the basics; B: likely bugs; UP: modern syntax; SIM: simpler code; PTH: pathlib;
# PLW1514: open()/read_text()/write_text() without an explicit encoding (cp1252 on Windows)
select = ["E", "F", "W", "B", "UP", "SIM", "PTH", "PLW1514"]
preview = true

[tool.ruff.lint.per-file-ignores]
# the generators carry Java source as strings: its lines follow the Java code, not this limit
"evaluation/solutions/generators/*" = ["E501"]
